<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
[hidden]{display:none!important}
/* ── 工作台：与现有平台（AI 备课工作台）交互一致：首页发起 → 任务过程时间线 → 资源包 ── */
.wb{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;font-family:var(--sans);
  background:radial-gradient(120% 60% at 50% 100%,#efe9ff 0%,#f7f5ff 35%,#fff 70%)}
/* 顶栏（发起后出现） */
.wb-top{height:48px;padding:0 20px;display:flex;align-items:center;gap:10px;flex:0 0 48px;background:#f8fafc;border-bottom:1px solid #f1f2f6}
.wb-top .t{font-size:13px;color:#99a1af;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-top .newc{height:28px;padding:0 12px;border-radius:999px;border:1px solid #e0dffc;background:#fff;color:#6366f1;font-size:12px;cursor:pointer}
.wb-top .newc:hover{background:#f5f3ff}
.wb-top .ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;background:none;border:none}
.wb-top .ic:hover{background:#eef0ff}
.wb-top .ic svg{width:16px;height:16px}
.wb-main{flex:1;min-height:0;display:flex}
.wb-center{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow-y:auto}
/* 欢迎区 */
.wb-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 8px;text-align:center}
.wb-hero img{width:290px;height:auto;max-width:70%}
.wb-hero h1{font-size:36px;font-weight:600;line-height:1.4;margin:14px 0 0;letter-spacing:-.5px;
  background:linear-gradient(223deg,#6366F1 9%,#8B5CF6 88%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wb-hero .sub{font-size:13px;line-height:22px;color:#88859E;max-width:520px;margin-top:12px}
/* 底部输入区 */
.wb-input{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:0 24px 32px}
.wb-try{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#99a1af}
.wb-try button{height:26px;padding:0 10px;border-radius:13px;border:1px solid #e6e4fb;background:#fff;color:#45556c;font-size:12px;cursor:pointer}
.wb-try button:hover{border-color:#a5a1f5;color:#6366f1}
.wb-chips{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.wb-chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;cursor:pointer;user-select:none;
  background:#f6f6fa;color:#62748e;border:1px solid transparent;transition:all .15s}
.wb-chip .dot{width:5px;height:5px;border-radius:50%;background:#6366f1;margin-right:5px;display:none}
.wb-chip.on{background:#ece9fe;color:#5b4fe0;border-color:#ddd8fd}
.wb-chip.on .dot{display:block}
.wb-chip:hover{color:#6366f1}
.wb-prep{width:100%;max-width:780px;background:#fafaff;border:1px solid #e6e4fb;border-radius:14px;padding:12px 16px;margin-bottom:12px}
.wb-prep .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wb-prep .ph .t{font-size:12px;font-weight:600;color:#6366f1}
.wb-prep .ph .x{color:#b0b5bd;cursor:pointer;font-size:15px;background:none;border:none}
.wb-prep .chain{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;font-size:12px;color:#62748e}
.wb-prep .chain b{font-weight:600;color:#364153}.wb-prep .chain em{font-style:normal;color:#99a1af;margin-right:3px}
.wb-prep .chain .cur b{color:#6366f1}.wb-prep .chain .sep{color:#c6c9d1}
.wb-prep .kids{display:flex;flex-wrap:wrap;gap:6px;max-height:92px;overflow-y:auto}
.wb-prep .sum{font-size:12px;color:#62748e;margin-bottom:6px}
.wb-prep .sum b{color:#6366f1;font-weight:600}
.sum-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sum-row .sum{flex:1;margin:0}
.sum-row .tb{font-size:11.5px;color:#6366f1;background:none;border:none;cursor:pointer;padding:0 2px}
/* 横版树状图：上级链路 → 当前节点 → 下级各层，自左向右展开 */
.htree{overflow:auto;max-height:340px;background:#fff;border:1px solid #eeecfb;border-radius:8px;padding:12px 14px}
.ht-node{display:flex;align-items:center}
.ht-box{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;border:1px solid #e6e4fb;background:#fafaff;
  font-size:12px;color:#364153;white-space:nowrap;flex:0 0 auto;max-width:220px}
.ht-box.has{cursor:pointer}
.ht-box.has:hover{border-color:#a5a1f5}
.ht-box .n{overflow:hidden;text-overflow:ellipsis}
.ht-box em{font-style:normal;font-size:10px;border-radius:3px;padding:0 4px;line-height:16px;color:#fff;flex:0 0 auto}
.ht-box .tg{font-size:10.5px;color:#8b87d9;background:#f0eefe;border-radius:8px;padding:0 5px;line-height:16px;flex:0 0 auto}
.ht-box.anc{background:#fff;border-style:dashed;color:#6A7282}
.ht-box.cur{background:#6366f1;border-color:#6366f1;color:#fff;font-weight:600}
.ht-box.cur .tg{background:rgba(255,255,255,.25);color:#fff}
.ht-kids{position:relative;display:flex;flex-direction:column;margin-left:18px}
.ht-kids::before{content:'';position:absolute;left:-18px;top:50%;width:18px;border-top:1px solid #d6d2f8}
.ht-kids>.ht-node{position:relative;padding:3px 0 3px 18px}
.ht-kids>.ht-node::before{content:'';position:absolute;left:0;top:50%;width:18px;border-top:1px solid #d6d2f8}
.ht-kids>.ht-node::after{content:'';position:absolute;left:0;top:0;bottom:0;border-left:1px solid #d6d2f8}
.ht-kids>.ht-node:first-child::after{top:50%}
.ht-kids>.ht-node:last-child::after{bottom:50%}
.ht-kids>.ht-node:only-child::after{display:none}
.wb-prep .kids .k{height:22px;padding:0 9px;border-radius:6px;font-size:11px;background:#fff;border:1px solid #e6e4fb;color:#45556c;display:inline-flex;align-items:center}
.wb-prep .kids .k em{font-style:normal;color:#b0b5bd;margin-right:3px}
/* 选择备课范围（从行业 / 子行业 / 岗位等大范围节点带入时） */
.sc-head{font-size:13px;color:#364153;margin-bottom:8px;line-height:1.6}
.sc-head b{color:#6366f1;font-weight:600}
.sc-tools{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sc-tools input{flex:1;height:30px;border:1px solid #e6e4fb;border-radius:8px;padding:0 10px;font-size:12.5px;outline:none;background:#fff}
.sc-tools input:focus{border-color:#a5a1f5}
.sc-tools .cnt{font-size:12px;color:#62748e;white-space:nowrap}.sc-tools .cnt b{color:#6366f1}
.sc-tree{max-height:320px;overflow:auto;background:#fff;border:1px solid #eeecfb;border-radius:8px;padding:6px 0}
.sc-row{display:flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;font-size:12.5px;color:#364153;cursor:default}
.sc-row:hover{background:#f7f6ff}
.sc-row .car{width:16px;color:#8b87d9;cursor:pointer;flex:0 0 auto;text-align:center;font-size:13px;line-height:1}
.sc-row input{margin:0;flex:0 0 auto;accent-color:#6366f1;cursor:pointer}
.sc-row em{font-style:normal;font-size:10px;border-radius:3px;padding:0 4px;line-height:16px;color:#fff;flex:0 0 auto}
.sc-row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-row .m{font-size:11px;color:#99a1af;flex:0 0 auto}
.sc-row mark{background:#fff3c4;color:inherit;padding:0}
.sc-empty{padding:16px;text-align:center;font-size:12px;color:#99a1af}
.sc-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px}
.sc-foot .tip{flex:1;font-size:11.5px;color:#99a1af}
.sc-ok{height:30px;padding:0 16px;border-radius:8px;border:none;background:#6366f1;color:#fff;font-size:12.5px;cursor:pointer}
.sc-ok:disabled{background:#c7c9f9;cursor:not-allowed}
.wb-box{position:relative;width:100%;max-width:780px;border:1px solid #c9c4f7;background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(99,102,241,.08)}
.wb-files{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 0}
.wb-file{display:flex;align-items:center;gap:6px;background:#f5f3ff;border:1px solid #e0dffc;border-radius:8px;padding:5px 9px}
.ext{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:0 0 20px}
.wb-file .nm{font-size:12px;color:#45556c;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-file .x{color:#b0b5bd;cursor:pointer;font-size:14px;background:none;border:none;padding:0}
.wb-ta{width:100%;border:none;outline:none;resize:none;font:inherit;font-size:14px;color:#0A0A0A;padding:14px 18px 6px;background:transparent;line-height:1.6;min-height:48px;max-height:160px;box-sizing:border-box;display:block}
.wb-ta::placeholder{color:#b0b5bd}
.wb-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px 12px}
.wb-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.wb-plus{width:22px;height:22px;border-radius:50%;background:#6366f1;color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;line-height:1}
.wb-plus:hover{background:#5458e8}
.wb-tool{height:26px;padding:0 10px;border-radius:999px;font-size:11px;display:inline-flex;align-items:center;gap:2px;cursor:pointer;background:#fff;border:1px solid #e5e7eb;color:#62748e}
.wb-tool b{font-weight:500;color:#6366f1}
select.wb-tool{max-width:220px;outline:none;appearance:auto}
.sc-skip{height:30px;padding:0 14px;border-radius:8px;border:1px solid #e6e4fb;background:#fff;color:#6366f1;font-size:12.5px;cursor:pointer}
.sc-skip:hover{border-color:#a5a1f5}
.wb-tool:hover{border-color:#6366f1}
.wb-send-btn{width:32px;height:32px;border-radius:50%;background:#6366f1;color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wb-send-btn:disabled{background:#c7c9f0;cursor:not-allowed}
.wb-send-btn svg{width:15px;height:15px}
.wb-pop{position:absolute;bottom:calc(100% + 8px);left:40px;z-index:50;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:var(--pop-shadow);width:400px;padding:16px;display:none}
.wb-pop.open{display:block}
.wb-pop .pt{font-size:12px;font-weight:500;color:#314158;margin-bottom:8px}
.wb-pop .presets{display:flex;gap:4px;margin-bottom:8px}
.wb-pop .pre{height:24px;padding:0 8px;border-radius:999px;font-size:11px;line-height:22px;cursor:pointer;background:#f1f5f9;color:#62748e;border:1px solid transparent}
.wb-pop .pre.on{background:#f5f3ff;border-color:#6366f1;color:#6366f1}
.wb-pop .grid{background:#f8fafc;border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.wb-pop .chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#45556c}
.wb-pop .chk .box{width:15px;height:15px;border-radius:4px;border:1px solid #cad5e2;background:#fff;display:flex;align-items:center;justify-content:center}
.wb-pop .chk.on .box{background:#6366f1;border-color:#6366f1}
.wb-pop .chk .box svg{width:10px;height:10px;color:#fff;display:none}.wb-pop .chk.on .box svg{display:block}
.wb-pop .field{margin-bottom:12px}.wb-pop .field:last-child{margin-bottom:0}
.wb-pop select{width:100%;height:32px;border:1px solid #e5e7eb;border-radius:8px;padding:0 10px;font-size:13px;color:#314158;background:#fff}
/* 上传弹窗（本地文件 / 参考文件） */
.up-mask{position:fixed;inset:0;background:rgba(15,15,30,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.up-mask[hidden]{display:none}
.up{width:min(728px,calc(100vw - 32px));background:#fff;border-radius:10px;box-shadow:var(--pop-shadow);display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.up-h{display:flex;align-items:center;gap:28px;padding:20px 24px 0}
.up-tab{font-size:12.5px;color:#62748e;background:none;border:none;cursor:pointer;padding:0 0 8px;border-bottom:2px solid transparent;display:flex;gap:5px;align-items:center}
.up-tab.on{color:#4f6ef7;border-bottom-color:#4f6ef7}
.up-h .x{margin-left:auto;background:none;border:none;font-size:20px;color:#62748e;cursor:pointer}
.up-b{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;padding:20px 24px;min-height:330px}
@media(max-width:640px){.up-b{grid-template-columns:1fr}}
.up-drop{border:1px dashed #9ec1f7;background:#f7faff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;text-align:center;cursor:pointer;align-self:center;min-height:156px}
.up-drop:hover{border-color:#4f6ef7}
.up-drop .i{width:40px;height:40px;border-radius:8px;background:#dbe8fd;display:flex;align-items:center;justify-content:center;color:#4f6ef7;margin-bottom:12px}
.up-drop .t1{font-size:13px;color:#314158}.up-drop .t2{font-size:11px;color:#99a1af;margin-top:6px;line-height:1.5}
.up-ref{display:flex;flex-direction:column;gap:10px;min-height:0}
.up-ref .q{display:flex;gap:8px}
.up-ref input,.up-ref select{height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font-size:12px;color:#314158;background:#fff;min-width:0}
.up-ref input{flex:1.3}.up-ref select{flex:1}
.up-ref .list{flex:1;overflow-y:auto;max-height:250px;display:flex;flex-direction:column;gap:6px}
.up-ref .it{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #eef0f4;border-radius:6px;cursor:pointer;font-size:12px;color:#364153}
.up-ref .it:hover{border-color:#c9c4f7}.up-ref .it.on{border-color:#6366f1;background:#f5f3ff}
.up-ref .it .tg{margin-left:auto;font-size:11px;color:#99a1af}
.up-ref .cnt{font-size:12px;color:#62748e}
.up-sel .tt{font-size:13px;color:#314158;margin-bottom:10px}
.up-sel .row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f3f4f6;font-size:12px;color:#364153}
.up-sel .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-sel .row .x{background:none;border:none;color:#b0b5bd;cursor:pointer;font-size:14px}
.up-f{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 20px}
.up-f button{height:34px;padding:0 18px;border-radius:6px;font-size:13px;cursor:pointer}
.up-f .c{background:#fff;border:1px solid #dcdfe6;color:#364153}.up-f .ok{background:#6366f1;border:1px solid #6366f1;color:#fff}
/* 任务过程时间线 */
.flow{width:100%;max-width:640px;margin:0 auto;padding:20px 24px 60px}
.fq{display:flex;justify-content:flex-end;margin-bottom:16px}
.fq span{max-width:72%;background:#6366f1;color:#fff;border-radius:12px 12px 2px 12px;padding:9px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.fs{display:flex;gap:12px;margin-bottom:14px}
.fs .av{width:22px;height:22px;border-radius:50%;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 22px;margin-top:1px}
.fs .av svg{width:12px;height:12px}
.fs .bd{flex:1;min-width:0}
.fs .hd{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#364153;margin-bottom:6px}
.fs .hd .nm{color:#6366f1}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:10.5px}
.tag.done{background:#f0fdf4;color:#2ba954}.tag.run{background:#f4f0ff;color:#615fff}
.tag.wait{background:#fffbeb;color:#d99a06;border:1px solid #fee685}.tag.fail{background:#fee2e2;color:#ef4444}
.fmsg li.err{color:#ef4444}.fmsg li.err::before{background:#ef4444}
.pk-tip{font-size:11.5px;color:#99a1af;padding:0 14px 12px}.tag.idle{background:#f3f4f6;color:#99a1af}
.fbox{background:#fff;border:1px solid #eef0f4;border-radius:10px;box-shadow:0 1px 4px rgba(15,15,40,.03)}
.fmsg{padding:8px 12px}
.fmsg .tog{font-size:12px;color:#6A7282;cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:center;gap:4px}
.fmsg ul{list-style:none;margin:0;padding:0}
.fmsg li{position:relative;font-size:12px;color:#6A7282;line-height:22px;padding-left:12px}
.fmsg li::before{content:'';position:absolute;left:1px;top:9px;width:4px;height:4px;border-radius:50%;background:#d1d5db}
.fmsg li.live::after{content:'';display:inline-block;width:10px;height:10px;margin-left:6px;vertical-align:-1px;border:2px solid #c7c9f0;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fcard-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #f3f4f6;background:#fafafa;border-radius:10px 10px 0 0}
.fcard-h b{font-size:13.5px;color:#0A0A0A}.fcard-h .s{font-size:11.5px;color:#99a1af}
.fcard-f{display:flex;justify-content:flex-end;gap:10px;padding:12px 14px;border-top:1px solid #f3f4f6}
.btn-p{height:30px;padding:0 16px;border-radius:6px;background:#6366f1;border:1px solid #6366f1;color:#fff;font-size:12.5px;cursor:pointer}
.btn-p:hover{background:#5458e8}
.btn-g{height:30px;padding:0 16px;border-radius:6px;background:#fff;border:1px solid #dcdfe6;color:#364153;font-size:12.5px;cursor:pointer}
.btn-g:hover{border-color:#6366f1;color:#6366f1}
/* 知识点确认 */
.kp{padding:14px}
.kp svg{width:100%;height:auto;display:block}
.kp .hint{font-size:11.5px;color:#99a1af;margin-top:6px}
.kp-node{cursor:pointer}
/* 大纲确认 */
.ol{padding:8px 14px 4px;max-height:420px;overflow-y:auto}
.ol-row{display:flex;align-items:center;gap:6px;height:34px;border-radius:6px;padding-right:4px}
.ol-row:hover{background:#f8f8fc}
.ol-row .mv{color:#99a1af;font-size:12px;width:14px;text-align:center;cursor:grab}
.ol-row .ar{width:14px;color:#364153;font-size:9px;cursor:pointer;background:none;border:none;padding:0}
.ol-row .no{width:18px;height:18px;border-radius:50%;background:#ece9fe;color:#6366f1;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center}
.ol-row .tx{flex:1;min-width:0;font-size:12.5px;color:#364153;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-row.l3 .tx{color:#6A7282;font-size:12px}
.ol-row input{flex:1;min-width:0;height:26px;border:1px solid #6366f1;border-radius:4px;padding:0 8px;font-size:12.5px}
.ol-row .op{background:none;border:none;cursor:pointer;width:24px;height:24px;border-radius:4px;color:#6366f1;font-size:14px}
.ol-row .op.del{color:#ef4444}
.ol-row .op:hover{background:#eef0ff}
.ol-add{margin:8px 0 6px;width:100%;height:32px;border:1px dashed #c9c4f7;border-radius:6px;background:#fff;color:#6366f1;font-size:12px;cursor:pointer}
/* 资源包 */
.pk{padding:12px 14px}
.pk-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f5f5f7}
.pk-row:last-child{border-bottom:none}
.pk-row .nm{flex:1;min-width:0;font-size:12.5px;color:#364153;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row .sz{font-size:11.5px;color:#99a1af;width:64px;text-align:right}
.pk-row .a{font-size:12px;color:#6366f1;background:none;border:none;cursor:pointer;padding:0 4px}
.pk-sum{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(90deg,#f5f3ff,#fff);border-radius:10px 10px 0 0;border-bottom:1px solid #f3f4f6}
.pk-sum .ic{width:36px;height:36px;border-radius:8px;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center}
.pk-sum b{font-size:14px;color:#0A0A0A}.pk-sum .s{font-size:12px;color:#6A7282;margin-top:2px}
/* 右侧任务进度 */
.wb-side{width:280px;flex:0 0 280px;padding:16px 20px 16px 0;overflow-y:auto}
.wb-side[hidden]{display:none}
@media(max-width:900px){.wb-side{display:none}}
.pc{background:#fff;border-radius:8px;border:1px solid #f0eefb;padding:16px;box-shadow:0 2px 12px -4px rgba(99,102,241,.12)}
.pc .h{font-size:13.5px;color:#364153;margin-bottom:12px}
.pc .tk{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.pc .tk b{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#364153;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .res{font-size:11.5px;color:#6A7282;margin-bottom:12px}
.ps{display:flex;gap:10px}
.ps .rl{display:flex;flex-direction:column;align-items:center;width:14px;flex:0 0 14px}
.ps .dt{width:8px;height:8px;border-radius:50%;background:#d1d5db;margin-top:8px;box-shadow:0 0 0 4px #f3f4f6}
.ps .dt.done{background:#2ba954;box-shadow:0 0 0 4px #f0fdf4}.ps .dt.run{background:#615fff;box-shadow:0 0 0 4px #f4f0ff}
.ps .dt.wait{background:#f5b40b;box-shadow:0 0 0 4px #fffbeb}
.ps .ln{width:1px;flex:1;background:#e5e7eb;margin-top:6px}
.ps .bd{flex:1;min-width:0;padding-bottom:12px}
.ps .rw{display:flex;align-items:center;justify-content:space-between;min-height:24px;font-size:12.5px;color:#0A0A0A}
.ps .sub{font-size:11.5px;color:#6A7282;line-height:19px}
.ps .sub.f{padding-left:4px}
/* 左侧菜单下半部分：任务列表 */
#lnav .ltasks{flex:1 1 auto;min-height:140px;display:flex;flex-direction:column;border-top:1px solid var(--rule-2);margin-top:10px;padding:10px 10px 6px;overflow:hidden}
#lnav .ltasks .lth{display:flex;align-items:center;gap:6px;padding:0 10px 6px;font-size:12px;font-weight:600;color:var(--muted)}
#lnav .ltasks .lth .n{font-weight:400}
#lnav .ltasks .lth .sp{flex:1}
#lnav .ltasks .lth button{border:0;background:none;color:var(--brand-ink);font:inherit;font-size:12px;cursor:pointer;padding:0}
#lnav .ltl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#lnav .lti{position:relative;display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 26px 8px 10px;cursor:pointer;font:inherit;color:var(--ink-2)}
#lnav .lti:hover{background:var(--rule-2)}
#lnav .lti.on{background:var(--brand-soft);color:var(--brand-ink)}
#lnav .lti .t{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
#lnav .lti .t .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lnav .lti .t input{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--brand);border-radius:6px;padding:2px 6px;outline:none;box-shadow:0 0 0 2px var(--brand-soft)}
#lnav .lti.editing .x{display:none}
#lnav .lti .d{width:6px;height:6px;border-radius:50%;flex:none}
#lnav .lti .x{position:absolute;right:4px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--muted);font-size:14px;line-height:1;cursor:pointer}
#lnav .lti .x:hover{background:var(--card);color:var(--ink)}
#lnav .lti:hover .x,#lnav .lti.menu .x,#lnav .lti.on .x{display:grid}
#lnav .lti .pin{font-size:10px;color:var(--brand-ink);margin-right:3px}
.tpop{position:fixed;z-index:600;background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:4px;min-width:150px}
.tpop button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font:inherit;font-size:12.5px;color:var(--ink-2);padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left}
.tpop button:hover{background:var(--rule-2);color:var(--ink)}
.tpop button.del{color:var(--crit)}
.tpop button:disabled{color:var(--muted);cursor:not-allowed;background:none}
.tpop .sep{height:1px;background:var(--rule-2);margin:4px 2px}
#lnav .lte{font-size:12px;color:var(--muted);padding:6px 10px;line-height:1.6}
@media (max-width:1000px){#lnav .ltasks{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="wb">
    <div class="wb-top" id="wbTop" hidden>
      <div class="t" id="wbTopTitle"></div>
      <button class="newc" id="wbNew" type="button">＋ 新建对话</button>
      <button class="ic" id="wbSideTog" type="button" title="任务进度" aria-label="显示或隐藏任务进度">
        <svg viewBox="0 0 16 16" fill="none" stroke="#6366F1" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="4.7" rx=".7"/><rect x="2" y="9.3" width="6" height="4.7" rx=".7"/><rect x="10.7" y="9.3" width="3.3" height="4.7" rx=".7"/></svg>
      </button>
    </div>
    <div class="wb-main">
      <div class="wb-center" id="wbCenter">
        <!-- 首页：欢迎区 + 输入区 -->
        <div class="wb-hero" id="wbHero">
          <img src="assets/prep-hero.png" alt="">
          <h1>让 AI 助您<br>更快完成一节课的教学准备</h1>
          <p class="sub">围绕课堂备课场景，快速完成课件生成、教案生成、情景互动游戏、讲解视频、图片素材等教学内容创作。从发起生成到查看结果，帮助您更高效地完成教学准备。</p>
        </div>
        <div class="wb-input" id="wbInput">
          <div class="wb-chips" id="wbChips"></div>
          <div class="wb-prep" id="wbPrep" hidden>
            <div class="ph"><span class="t">带入备课</span><button class="x" id="wbPrepClose" type="button" title="移除带入内容">×</button></div>
            <div id="wbScope" hidden></div>
            <div id="wbPrepBody">
            <div class="sum-row"><div class="sum" id="wbPrepSum"></div>
              <button class="tb" data-ht="all" type="button">全部展开</button><button class="tb" data-ht="one" type="button">收起到一级</button></div>
            <div class="htree" id="wbPrepTree"></div>
            <div class="sum" id="wbPrepKs" style="margin:8px 0 0"></div>
            </div>
          </div>
          <div class="wb-box">
            <div class="wb-files" id="wbFiles" hidden></div>
            <textarea class="wb-ta" id="wbTa" rows="2"></textarea>
            <div class="wb-bar">
              <div class="wb-tools">
                <button class="wb-plus" id="wbUpload" type="button" title="添加参考文件" aria-label="添加参考文件">+</button>
                <button class="wb-tool" id="wbLesson" type="button" hidden>教案：<b id="wbLessonVal"></b> ▾</button>
                <button class="wb-tool" id="wbImgCfg" type="button" hidden>图片：<b id="wbImgVal"></b> ▾</button>
                <select class="wb-tool" id="wbSess" title="本次备课的课次，可以先不选"></select>
              </div>
              <button class="wb-send-btn" id="wbSend" type="button" disabled title="发送" aria-label="发送">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2L7 9M14 2l-4.5 12L7 9l-5-2.5L14 2z"/></svg>
              </button>
            </div>
            <div class="wb-pop" id="wbLessonPop">
              <div class="pt">教案结构（已选 <span id="wbLessonCount">0</span> 项）</div>
              <div class="presets" id="wbPresets"></div>
              <div class="grid" id="wbLessonGrid"></div>
            </div>
            <div class="wb-pop" id="wbImgPop">
              <div class="field"><div class="pt">生成数量</div><select id="wbImgCount"></select></div>
              <div class="field"><div class="pt">图片风格</div><select id="wbImgStyle"></select></div>
              <div class="field"><div class="pt">图片比例</div><select id="wbImgRatio"></select></div>
            </div>
          </div>
          <div class="wb-try" id="wbTry" hidden></div>
        </div>
        <!-- 任务过程 -->
        <div class="flow" id="wbFlow" hidden></div>
      </div>
      <aside class="wb-side" id="wbSide" hidden><div class="pc" id="wbProg"></div></aside>
    </div>
  </div>
</div>

<!-- 添加参考文件：本地文件 / 参考文件，最多 3 个 -->
<div class="up-mask" id="upMask" hidden>
  <div class="up" role="dialog" aria-modal="true" aria-label="添加参考文件">
    <div class="up-h">
      <button class="up-tab on" data-tab="local" type="button">📁 本地文件</button>
      <button class="up-tab" data-tab="ref" type="button">🖥 参考文件</button>
      <button class="x" id="upClose" type="button" aria-label="关闭">×</button>

<input type="file" id="wbFileInput" multiple accept=".pdf,.ppt,.pptx,.doc,.docx" hidden>

<script src="js/mock-data.js"></script>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span>' + esc(m) + '</span>'; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }

  /* ── 配置与 mock 数据 ── */
  var TYPES = ['课件生成', '教案生成', '情景互动游戏生成', '图片素材生成', '视频素材生成'];
  var PLACEHOLDER = {
    '课件生成': '输入您的课件需求，如：帮我做个太和殿的课件...',
    '教案生成': '输入您的教案需求，如：帮我写一份太和殿的教案...',
    '情景互动游戏生成': '输入您的情景互动游戏需求，如：做一个太和殿导览的情景游戏...',
    '图片素材生成': '输入您的图片素材需求，如：生成太和殿的建筑插图...',
    '视频素材生成': '输入您的视频素材需求，如：生成一段太和殿的讲解视频...'
  };
  var RES_NAME = { '课件生成': '课件', '教案生成': '教案', '情景互动游戏生成': '情景互动游戏', '图片素材生成': '图片素材', '视频素材生成': '讲解视频' };
  var LESSON_ALL = ['教学目标', '学情分析', '教学重难点', '教学方法', '教学准备', '教学过程', '板书设计', '作业设计', '教学反思'];
  var LESSON_PRESETS = { lite: ['教学目标', '教学重难点', '教学过程'], standard: LESSON_ALL.slice(), full: LESSON_ALL.slice() };
  LESSON_PRESETS.standard = ['教学目标', '学情分析', '教学重难点', '教学方法', '教学准备', '教学过程', '板书设计', '作业设计', '教学反思'];
  LESSON_PRESETS.lite = ['教学目标', '教学重难点', '教学过程', '作业设计'];
  LESSON_PRESETS.full = LESSON_ALL.concat(['课程思政', '拓展资源']);
  var LESSON_FULL_ITEMS = LESSON_PRESETS.full;
  var IMG_STYLES = ['默认风格', '写实', '卡通', '国风', '扁平', '水彩'];
  var IMG_RATIOS = { '16:9': '16:9（横屏）', '4:3': '4:3（标准）', '1:1': '1:1（方形）', '9:16': '9:16（竖屏）' };
  // 平台参考文件（mock）
  var REF_FILES = [
    { name: '导游业务-第三章 导游服务程序.pptx', cat: '课件' }, { name: '模拟导游-景区讲解实训指导书.docx', cat: '文档' },
    { name: '旅游职业礼仪-教案（标准版）.docx', cat: '教案' }, { name: '中国旅游地理-华东地区.pptx', cat: '课件' },
    { name: '旅游政策与法规-案例汇编.pdf', cat: '文档' }, { name: '导游词创作与讲解-教案.docx', cat: '教案' }
  ];

  /* 课件生成接口：从能力图谱带入知识体系时，「课件生成」调用此接口，返回生成的课件链接 */
  var GEN_PPT_API = 'http://192.168.1.223:8081/api/third/generate_ppt';
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }
  // 接口的 knowledge_system：根为当前节点，下级为当前节点的整棵子树（节点用能力图谱 / 知识体系的真实编号）
  function knowledgeSystem(p) {
    if (!p || !p.ks) return null;
    function conv(n) { return { id: String(n.id || uuid()), name: n.name, children: (n.children || []).map(conv) }; }
    var cur = p.current || {};
    return { id: String(cur.id || uuid()), name: cur.name, children: prepTreeOf(p).map(conv) };
  }
  // 接口的 desc：输入框文字 +（多选时）本次选中的节点 + 当前节点往上在知识体系中直到专业的父级节点
  function genDesc(text, p) {
    var ps = (p && p.ks && p.ks.parents) || [], out = text;
    if (p && p.multi && p.selected && p.selected.length)
      out += '\n\n本次备课选中的节点（共 ' + p.selected.length + ' 个）：\n' + p.selected.map(function (x) { return '- ' + x.type + '：' + x.path; }).join('\n');
    if (ps.length) out += '\n\n所属知识体系（' + (p.multi ? '选中节点' : '当前节点') + '往上至专业）：\n' + ps.map(function (x) { return '- ' + x; }).join('\n');
    return out;
  }
  function ksSize(n) { return 1 + (n.children || []).reduce(function (a, k) { return a + ksSize(k); }, 0); }
  function ksCount(n, type) { return (n.type === type ? 1 : 0) + (n.children || []).reduce(function (a, k) { return a + ksCount(k, type); }, 0); }
  function fileNameOf(url, fallback) {
    try { var seg = new URL(url).pathname.split('/').pop(); return decodeURIComponent(seg) || fallback; } catch (e) { return fallback; }
  }
  function expiresMin(url) { var m = /[?&]X-Amz-Expires=(\d+)/.exec(url || ''); return m ? Math.round(+m[1] / 60) : null; }
  // 当前登录用户的名称（作为课件作者）
  function currentUserName() {
    try { var id = UI.currentIdentity(DEMO.getState()); return (id && id.account && id.account.name) || ''; } catch (e) { return ''; }
  }
  var apiCtl = null;
  function callGenPpt() {
    if (apiCtl) apiCtl.abort();
    apiCtl = window.AbortController ? new AbortController() : null;
    var api = run.api = { status: 'pending', url: '', err: '' }, myRun = run;
    fetch(GEN_PPT_API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: apiCtl ? apiCtl.signal : undefined,
      body: JSON.stringify({ author: currentUserName(), knowledge_system: run.ks, theme: run.theme, desc: run.desc })
    }).then(function (r) {
      return r.json().catch(function () { throw new Error('接口返回格式错误（HTTP ' + r.status + '）'); });
    }).then(function (j) {
      if (j && j.code === 200 && j.data) { api.status = 'ok'; api.url = j.data; }
      else throw new Error((j && j.message) || '接口未返回课件链接');
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      api.status = 'error'; api.err = e && e.message === 'Failed to fetch' ? '无法连接课件生成服务' : (e && e.message) || '生成失败';
    }).then(function () {
      if (run === myRun && run.api === api) { var s = cur(); if (s && s.api) advance(); else render(); }
    });
  }

  var state = {
    selected: ['课件生成'], text: '', files: [],
    lessonMode: 'standard', lesson: LESSON_PRESETS.standard.slice(),
    imgCount: 1, imgStyle: '默认风格', imgRatio: '16:9'
  };

  function extStyle(n) {
    var e = (n.split('.').pop() || '').toLowerCase();
    return e.indexOf('ppt') === 0 ? '#D24726' : e.indexOf('doc') === 0 ? '#2B579A' : e === 'pdf' ? '#E74C3C' : e === 'zip' ? '#6366f1' : e === 'mp4' ? '#0ea5e9' : e === 'png' ? '#10b981' : e === 'html' ? '#f59e0b' : '#8A909C';
  }
  function extTag(n) { return '<span class="ext" style="background:' + extStyle(n) + '">' + esc((n.split('.').pop() || '').slice(0, 3).toUpperCase()) + '</span>'; }

  /* ═══ 首页：输入区 ═══ */
  /* ── 本次备课的课次：可以先不选；只列本人负责的课程计划下的课次 ── */
  var chosenSess = null;
  function myName() { return currentUserName(); }
  function renderSess() {
    var sel = $('#wbSess');
    if (!window.TK || (prep && prep.session)) { sel.hidden = true; return; }   // 从课次「去备课」带入时课次已定
    var S = TK.load(), me = myName(), cls = function (id) { return (S.classes.find(function (k) { return k.id === id; }) || {}).name || ''; };
    var plans = S.plans.filter(function (p) { return p.teacher === me; });
    sel.hidden = false;
    sel.innerHTML = '<option value="">课次：暂不关联</option>' + plans.map(function (p) {
      var cs = S.courses.filter(function (c) { return c.planId === p.id; });
      return cs.length ? '<optgroup label="' + esc(p.course + ' · ' + cls(p.classId)) + '">' + cs.map(function (c) {
        return '<option value="' + esc(c.id) + '" data-plan="' + esc(p.course + ' · ' + cls(p.classId)) + '"' + (chosenSess && chosenSess.id === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</optgroup>' : '';
    }).join('') + '<option value="__new">＋ 去新建课次</option>';
  }
  $('#wbSess').addEventListener('change', function () {
    if (this.value === '__new') { location.href = UI.link('teacher-tasks.html'); return; }
    var o = this.options[this.selectedIndex];
    chosenSess = this.value ? { id: this.value, name: o.textContent, plan: o.getAttribute('data-plan') } : null;
    if (prep) renderPrep(prep);
  });
  // 带入内容里的技能（未选课次时，资源包记下这些技能，之后关联课次再用）
  function prepSkillIds() {
    var out = [];
    (function walk(n) { if (!n) return; if (n.type === '技能' && TK.kn().skill[n.id] && out.indexOf(n.id) < 0) out.push(n.id); (n.children || []).forEach(walk); })(prep && prep.ks && prep.ks.tree);
    return out;
  }
  // 输入框下的「试试」：点一下填入需求，演示直接生成和范围过大两种情况
  var TRY = ['帮我做一个规范化导游讲解与服务流程执行的课件', '帮我做一份导游业务课程的课件', '给我讲讲旅游行业的发展趋势，做个课件'];
  function renderTry() {
    $('#wbTry').hidden = !!prep || state.selected.indexOf('课件生成') < 0;
    $('#wbTry').innerHTML = '试试：' + TRY.map(function (s, i) { return '<button type="button" data-try="' + i + '">' + esc(s) + '</button>'; }).join('');
  }
  $('#wbTry').addEventListener('click', function (e) {
    var b = e.target.closest('[data-try]'); if (!b) return;
    var ta = $('#wbTa'); ta.value = TRY[+b.getAttribute('data-try')]; ta.dispatchEvent(new Event('input')); ta.focus();
  });
  function renderChips() {
    renderTry();
    $('#wbChips').innerHTML = TYPES.map(function (t) {
      return '<span class="wb-chip' + (state.selected.indexOf(t) >= 0 ? ' on' : '') + '" data-t="' + esc(t) + '"><span class="dot"></span>' + esc(t) + '</span>';
    }).join('');
    $('#wbTa').placeholder = prep && prep.scope ? '请先在上方选择本次备课范围' : (PLACEHOLDER[state.selected[0]] || PLACEHOLDER['课件生成']);
  }

    var wasScope = prep && (prep.scope || prep.scopeOrig) && !prep.auto;
    if (prep && prep.auto) skipMatch = true;   // 老师移除了匹配结果：本条需求不再匹配，按原样生成
    prep = null; session = null; sc = null; try { localStorage.removeItem(PREP_KEY); } catch (e) {} renderPrep(null);
    if (wasScope) { $('#wbTa').value = ''; state.text = ''; renderChips(); }
    renderSend();
  });

  /* ── 任务列表（左侧菜单下半部分）──
     每次发送需求的生成过程是一个任务，按老师存在本机；点一条回到那次的生成过程和结果，未完成的接着生成。
     另外列出本人已有、但不是在这里生成的备课资源包，点开到任务中心看资源详情 */
  function TKfmt() { var d = new Date(), z = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
  function taskKey() { return 'wbTasks.v1|' + myName(); }
  function loadTasks() { try { return JSON.parse(localStorage.getItem(taskKey()) || '[]'); } catch (e) { return []; } }
  function saveTasks(list) { try { localStorage.setItem(taskKey(), JSON.stringify(list.slice(0, 40))); } catch (e) {} }
  function runStatus(r) { if (r.steps.some(function (x) { return x.status === 'fail'; })) return '失败'; if (r.steps.length && r.steps.every(function (x) { return x.status === 'done'; })) return '已完成'; return r.steps.some(function (x) { return x.status === 'wait'; }) ? '待确认' : '生成中'; }
  function saveTask() {
    if (!run || !run.tid) return;
    var list = loadTasks().filter(function (t) { return t.id !== run.tid; }), snap = JSON.parse(JSON.stringify(run));
    snap.edit = null;
    list.unshift({ id: run.tid, title: run.title, at: run.at, status: runStatus(run), res: (run.linked || run.saved || {}).res || '', session: run.linked ? run.linked.name : '', run: snap });
    saveTasks(list); renderTasks();
  }
  var DOT_ST = { '生成中': 1, '待确认': 1, '失败': 1, '生成失败': 1 };   // 只有进行中和异常的显示状态点
  var ST_COL = { '生成中': '#6366F1', '待确认': '#f59e0b', '已完成': '#10b981', '失败': '#ef4444', '生成失败': '#ef4444', '资源包': '#94a3b8' };
  function renderTasks() {
    var nav = document.getElementById('lnav'); if (!nav) return;
    var box = nav.querySelector('.ltasks');
    if (!box) { box = document.createElement('div'); box.className = 'ltasks'; var u = nav.querySelector('.luser'); nav.insertBefore(box, u || null); }
    if (box.querySelector('.lti.editing')) return;   // 正在重命名时不刷新，避免打断输入
    var list = loadTasks(), used = {};
    list.forEach(function (t) { if (t.res) used[t.res] = 1; });
    var items = list.map(function (t) { return { kind: 'run', id: t.id, title: t.title, at: t.at, st: t.status, res: t.res, sub: t.session ? '课次：' + t.session : '' }; });
    if (window.TK) {
      var me = myName();
      TK.load().resources.filter(function (r) { return (r.owner || '李老师') === me && !used[r.id]; }).forEach(function (r) {
        items.push({ kind: 'res', id: r.id, title: r.name, at: r.createdAt || '', st: r.status === '已完成' ? '资源包' : r.status, res: r.id, sub: '' });
      });
    }
    var pins = loadPins();
    items.forEach(function (it) { it.pin = pins.indexOf(it.id) >= 0; });
    items.sort(function (a, b) { return a.pin !== b.pin ? (a.pin ? -1 : 1) : a.at < b.at ? 1 : a.at > b.at ? -1 : 0; });
    var curId = run && run.tid;
    box.innerHTML = '<div class="lth">任务<span class="n">' + items.length + '</span></div><div class="ltl">' +
      (items.map(function (it) {
        return '<div role="button" tabindex="0" class="lti' + (it.id === curId ? ' on' : '') + '" data-t="' + it.kind + ':' + esc(it.id) + '" title="' + esc(it.title + '（' + it.st + '）') + '"><span class="t">' + (DOT_ST[it.st] ? '<i class="d" style="background:' + ST_COL[it.st] + '"></i>' : '') + (it.pin ? '<span class="pin">📌</span>' : '') + '<span class="tx">' + esc(it.title) + '</span></span>' +
          '<span class="x" data-tmore="' + it.kind + ':' + esc(it.id) + '" title="更多操作" aria-label="更多操作">⋯</span></div>';
      }).join('') || '<div class="lte">还没有任务。在右侧输入需求并发送后，生成任务会出现在这里。</div>') + '</div>';
  }
  function openTask(id) {
    var t = loadTasks().filter(function (x) { return x.id === id; })[0]; if (!t) return;
    if (run && run.tid === id) return;
    clearTimeout(timer); if (apiCtl) { apiCtl.abort(); apiCtl = null; }
    run = t.run;
    $('#wbHero').hidden = true; $('#wbInput').hidden = true;
    $('#wbFlow').hidden = false; $('#wbTop').hidden = false; $('#wbSide').hidden = false;
    $('#wbTopTitle').textContent = run.title;
    render();
    var c = cur(); if (c && c.status === 'run') timer = setTimeout(advance, 400);   // 未完成的接着生成
  }
  /* 任务「⋯」操作：置顶、重命名、在任务中心查看资源包 / 课次、删除（仅工作台生成的任务；资源包是任务中心里的备课资源，不在这里删） */
  function pinKey() { return 'wbPins.v1|' + myName(); }
  function loadPins() { try { return JSON.parse(localStorage.getItem(pinKey()) || '[]'); } catch (e) { return []; } }
  function savePins(p) { try { localStorage.setItem(pinKey(), JSON.stringify(p)); } catch (e) {} }
  function closeTaskMenu() { var p = document.querySelector('.tpop'); if (p) p.remove(); document.querySelectorAll('#lnav .lti.menu').forEach(function (x) { x.classList.remove('menu'); }); }
  function taskInfo(kind, id) {
    var S = window.TK ? TK.load() : null, t = kind === 'run' ? loadTasks().filter(function (x) { return x.id === id; })[0] : null;
    var resId = kind === 'res' ? id : t && t.res, r = S && resId ? S.resources.filter(function (x) { return x.id === resId; })[0] : null;
    var c = S && resId ? S.courses.filter(function (x) { return (x.resIds || []).indexOf(resId) >= 0; })[0] : null;
    return { t: t, r: r, c: c, title: t ? t.title : r ? r.name : '' };
  }
  function taskMenu(btn) {
    var open = btn.closest('.lti').classList.contains('menu'); closeTaskMenu(); if (open) return;
    var k = btn.getAttribute('data-tmore').split(':'), kind = k[0], id = k.slice(1).join(':'), I = taskInfo(kind, id), pinned = loadPins().indexOf(id) >= 0;
    var pop = document.createElement('div'); pop.className = 'tpop';
    pop.innerHTML = '<button data-op="pin">' + (pinned ? '📌 取消置顶' : '📌 置顶') + '</button><button data-op="rename">✎ 重命名</button>' +
      (I.r ? '<button data-op="res">▤ 在任务中心查看资源包</button>' : '') + (I.c ? '<button data-op="course">↗ 查看关联课次「' + esc(I.c.name.length > 8 ? I.c.name.slice(0, 8) + '…' : I.c.name) + '」</button>' : '') +
      '<div class="sep"></div>' + (kind === 'run' ? '<button data-op="del" class="del">🗑 删除</button>' : '<button data-op="del" class="del" disabled title="备课资源包在任务中心管理，这里不能删除">🗑 删除</button>');
    document.body.appendChild(pop); btn.closest('.lti').classList.add('menu');
    var rc = btn.getBoundingClientRect(), top = rc.bottom + 4;
    if (top + pop.offsetHeight > window.innerHeight - 8) top = rc.top - pop.offsetHeight - 4;
    pop.style.left = Math.min(rc.left, window.innerWidth - pop.offsetWidth - 8) + 'px'; pop.style.top = top + 'px';
    pop.addEventListener('click', function (e) {
      var b = e.target.closest('[data-op]'); if (!b || b.disabled) return;
      var op = b.getAttribute('data-op'); closeTaskMenu();
      if (op === 'pin') { var p = loadPins().filter(function (x) { return x !== id; }); if (!pinned) p.unshift(id); savePins(p); renderTasks(); }
      else if (op === 'rename') renameTask(kind, id, I);
      else if (op === 'res') location.href = UI.link('teacher-tasks.html?open=res:' + I.r.id);
      else if (op === 'course') location.href = UI.link('teacher-tasks.html') + '&open=course:' + encodeURIComponent(I.c.id);
      else if (op === 'del') TK.confirm('确定删除任务「' + I.title + '」吗？' + (I.r ? '生成的备课资源包仍保留在任务中心。' : ''), function () {
        saveTasks(loadTasks().filter(function (t) { return t.id !== id; })); savePins(loadPins().filter(function (x) { return x !== id; }));
        if (run && run.tid === id) $('#wbNew').click(); else renderTasks(); toast('已删除');
      });
    });
  }
  // 重命名：任务名称就地变成输入框，回车或点别处保存，Esc 取消
  function renameTask(kind, id, I) {
    var row = document.querySelector('#lnav .lti[data-t="' + kind + ':' + id + '"]'); if (!row) return;
    var tx = row.querySelector('.tx'); row.classList.add('editing');
    var inp = document.createElement('input'); inp.maxLength = 40; inp.value = I.title; inp.setAttribute('aria-label', '任务名称');
    tx.replaceWith(inp); inp.focus(); inp.select();
    var done = false;
    function finish(save) {
      if (done) return; done = true; row.classList.remove('editing');
      var n = inp.value.trim();
      if (!save || !n || n === I.title) { renderTasks(); if (save && !n) toast('任务名称不能为空'); return; }
      if (kind === 'run') {
        var list = loadTasks(); list.forEach(function (t) { if (t.id === id) { t.title = n; if (t.run) t.run.title = n; } }); saveTasks(list);
      } else { var S = TK.load(); S.resources.forEach(function (r) { if (r.id === id) r.name = n; }); TK.save(S); }
      if (run && run.tid === id) { run.title = n; $('#wbTopTitle').textContent = n; if (run.ro) render(); else renderProg(); }
      renderTasks();
    }
    inp.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finish(true); } else if (e.key === 'Escape') finish(false); });
    inp.addEventListener('blur', function () { finish(true); });
    inp.addEventListener('click', function (e) { e.stopPropagation(); });
  }
  document.addEventListener('click', function (e) { if (!e.target.closest('.tpop') && !e.target.closest('[data-tmore]')) closeTaskMenu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeTaskMenu(); });
  document.getElementById('lnav').addEventListener('keydown', function (e) { var r = e.target.closest && e.target.closest('.lti'); if (r && e.target === r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); } });
  document.getElementById('lnav').addEventListener('scroll', closeTaskMenu, true);

  // 不是在工作台生成的备课资源包：按资源包内容还原成一次已完成的生成过程，在本页查看（只读）
  var TYPE_RES = { '课件': '课件生成', '教案': '教案生成', '情景互动游戏': '情景互动游戏生成', '图片': '图片素材生成', '视频': '视频素材生成' };
  function openRes(id) {
    if (!window.TK || (run && run.tid === id)) return;
    var S = TK.load(), r = S.resources.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    var topic = r.name.replace(/^《/, '').replace(/》.*$/, '') || r.name;
    var types = [];
    (r.files || []).forEach(function (f) { var t = TYPE_RES[f.type]; if (t && types.indexOf(t) < 0) types.push(t); });
    if (!types.length) { var m = r.name.match(/》(.+)$/), t0 = m && TYPE_RES[m[1]]; types = [t0 || '课件生成']; }
    clearTimeout(timer); if (apiCtl) { apiCtl.abort(); apiCtl = null; }
    run = { tid: r.id, ro: true, at: r.createdAt || '', topic: topic, title: r.name, text: '帮我生成关于《' + topic + '》的' + (types.length > 1 ? '教学资源包' : RES_NAME[types[0]]), types: types,
      kp: mockKP(topic), outline: mockOutline(topic), steps: [], edit: null, failMsg: '生成失败，请点「新建对话」重新发起' };
    var files = function (t) { return (r.files || []).filter(function (f) { return TYPE_RES[f.type] === t; }).map(function (f) { return f.name; }); };
    var st = [
      step('start', '启动', ['备课工作台已启动']),
      step('need', '需求分析', ['正在智能分析您的教学内容...', '已识别到教学主题「' + topic + '」，准备为您生成 ' + types.join('、') + ' 等备课资源', '备课任务创建完成', '需求分析任务完成']),
      step('kp', '知识体系', [], { confirm: 'kp', doneTag: '已确认' }),
      step('search', '知识检索', ['正在为您检索相关知识点...', '知识检索完成'])
    ];
    types.forEach(function (t) {
      if (t === '课件生成') { st.push(step('outline', '课件大纲生成', ['正在为您生成课件大纲...', '课件大纲生成完成'], { res: t })); st.push(step('olc', '等待人工确认课件大纲', [], { res: t, confirm: 'outline', doneTag: '已确认' })); }
      st.push(step(t, t, ['正在生成' + RES_NAME[t] + '...', t + '完成'], { res: t, out: files(t) }));
    });
    st.push(step('pack', '资源打包', ['正在为您整理备课资源...', '资源包已生成'], { pack: true }));
    st.forEach(function (x) { x.status = 'done'; x.shown = x.msgs.length; x.open = !!x.pack; });
    if (r.status === '生成中' || r.status === '生成失败') {
      // 最后一个有产出的生成步骤之后的还没完成：生成中停在下一步，失败的标为失败
      var gi = st.map(function (x) { return !!x.res && !x.confirm; }), last = -1, next = -1;
      st.forEach(function (x, i) { if (gi[i] && (x.out || []).length) last = i; });
      for (var i = last + 1; i < st.length; i++) if (gi[i] || st[i].pack) { next = i; break; }
      if (next < 0) next = st.length - 1;
      st.forEach(function (x, i) { if (i === next) { x.status = r.status === '生成中' ? 'run' : 'fail'; x.shown = r.status === '生成中' ? 1 : x.msgs.length - 1; if (r.status === '生成失败') x.msgs = x.msgs.slice(0, 1); } else if (i > next) { x.status = 'idle'; x.shown = 0; } });
    }
    var c = S.courses.filter(function (x) { return (x.resIds || []).indexOf(r.id) >= 0; })[0];
    if (c) run.linked = { id: c.id, name: c.name, res: r.id }; else run.saved = { res: r.id };
    run.steps = st;
    $('#wbHero').hidden = true; $('#wbInput').hidden = true;
    $('#wbFlow').hidden = false; $('#wbTop').hidden = false; $('#wbSide').hidden = false;
    $('#wbTopTitle').textContent = run.title;
    render(); renderTasks();
    $('#wbCenter').scrollTop = 0;
  }
  document.getElementById('lnav').addEventListener('click', function (e) {
    if (e.target.closest('.lti.editing')) return;
    var mo = e.target.closest('[data-tmore]');
    if (mo) { e.stopPropagation(); taskMenu(mo); return; }
    var b = e.target.closest('[data-t]'); if (!b) return;
    var k = b.getAttribute('data-t').split(':');
    if (k[0] === 'run') openTask(k.slice(1).join(':'));
    else openRes(k.slice(1).join(':'));
  });

  /* ── 启动 ── */
  UI.boot({ portal: 'teacher', active: 'workbench' });
  renderTasks();
  prep = loadPrep();
  if (prep) { session = prep.session || null; renderPrep(prep); try { localStorage.removeItem(PREP_KEY); } catch (e) {} }
  renderChips(); renderTools(); renderFiles(); renderSess();
  if (prep) setPrepText(prep);
  renderSend();
})();
</script>
</body>
</html>
