<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>能力测评</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
/* 能力测评（专业建设评估）页面布局 */
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:15px}
.sec-h .sub{font-size:12px;color:var(--muted)}
.sec-h .sp{flex:1}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.hint{font-size:12px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--rule);border-radius:9px;padding:9px 12px;line-height:1.6}
.hint.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}

/* 专业卡片 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mcard{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.mcard-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mcard-t{font-size:15px;font-weight:700}
.mcard-code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mcard-meta{font-size:12px;color:var(--ink-2);line-height:1.7}
.mcard-last{border-top:1px solid var(--rule-2);padding-top:10px;font-size:12px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}
.mcard-last b{font-family:var(--mono);font-size:15px;color:var(--ink)}
.mcard-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--card-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tr.off td{color:var(--muted)}
.tbl tfoot td{font-weight:600;background:var(--card-2);border-top:1px solid var(--rule)}
.tbl input[type=number]{width:62px;padding:3px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:12px;text-align:right}
.tbl input[type=text]{width:70px;padding:3px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:12px}
.tbl select{padding:3px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:12px}
.tbl-wrap{overflow-x:auto}

/* 步骤 */
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;border:1px solid var(--rule);font-size:12.5px;color:var(--muted);background:var(--card)}
.step b{font-family:var(--mono);font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--rule-2)}
.step.on{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.step.on b{background:var(--brand);color:#fff}
.step.done{color:var(--ink-2)}
.step.done b{background:var(--good);color:#fff}
.stepacts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.sub-h{font-size:13px;font-weight:700;margin:18px 0 8px}
.sub-h:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipgrp{margin-bottom:10px}
.chipgrp-t{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.radio-list{display:flex;flex-direction:column;gap:8px}
.ropt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;cursor:pointer;background:var(--card)}
.ropt:hover{border-color:var(--brand)}
.ropt.on{border-color:var(--brand);background:var(--brand-soft)}
.ropt.dis{opacity:.55;cursor:not-allowed}
.ropt .rt{font-weight:600;font-size:13.5px}
.ropt .rd{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.good b{color:var(--good)} .kpi.warn b{color:var(--warn-ink)} .kpi.crit b{color:var(--crit)}

/* 报告 */
.rhead{padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rhead .rt{font-size:18px;font-weight:700}
.rhead .rm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7}
.rhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.concl{margin-top:12px;font-size:13.5px;line-height:1.75;padding:12px 16px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 9px 9px 0}
.bar{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--rule-2);vertical-align:middle;overflow:hidden;margin-right:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}
.pos-blk{margin-bottom:12px}
.pos-blk>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pos-blk>summary::-webkit-details-marker{display:none}
.pos-blk>summary .pt{font-weight:700;font-size:14px}
.pos-blk>summary .ps{font-size:12px;color:var(--muted)}
.pos-blk>summary .sp{flex:1}
.pos-blk>summary::before{content:'›';color:var(--muted);transition:transform .15s;display:inline-block}
.pos-blk[open]>summary::before{transform:rotate(90deg)}
.pos-blk .inner{padding:0 16px 14px}
.radar-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:4px 0 10px;border-bottom:1px solid var(--rule-2);margin-bottom:10px}
.radar-wrap svg{width:100%;max-width:520px;height:auto;flex:0 1 520px}
.radar-leg{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--ink-2);min-width:180px}
.radar-leg i{display:inline-block;width:18px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.abl-row{cursor:pointer}
.abl-row:hover td{background:var(--rule-2)}
.abl-det td{background:var(--card-2);font-size:12px;line-height:1.65}
.abl-det .lv{margin-bottom:8px}
.abl-det .lv b{font-family:var(--mono);margin-right:6px}
.maplist{display:flex;flex-direction:column;gap:6px}
.mapi{border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:var(--card)}
.mapi .mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mapi .mb{color:var(--ink-2);margin-top:3px}
.star{color:var(--brand)}
.sug{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.sug:last-child{border-bottom:none}
.sug .pri{flex:0 0 auto}
.sug .st{font-weight:600;font-size:13.5px}
.sug .sd{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.65}
.sug .sb{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.lst{margin:0;padding-left:18px;font-size:12.5px;line-height:1.85}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:1000px){.cols3{grid-template-columns:1fr}}
.cols3 .card h3{font-size:13px;margin-bottom:8px}
.filters{display:flex;gap:6px}
/* 实训资源 */
.labconds{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.labedit>summary{cursor:pointer;font-size:11.5px;color:var(--brand-ink);list-style:none;display:inline}
.labedit>summary::-webkit-details-marker{display:none}
.labedit .grp{margin-top:6px}
.labedit .grp-t{font-size:11px;color:var(--muted);margin-bottom:3px}
.labedit label{display:inline-flex;gap:4px;align-items:center;font-size:12px;margin:0 10px 4px 0}
.tbl input.lname{width:180px}
.chips.provide{gap:4px}
.chips.provide .chip{font-size:11.5px;padding:2px 9px;min-height:0}
.tr-row{cursor:pointer}
.tr-row:hover td{background:var(--rule-2)}
.tr-det td{background:var(--card-2);font-size:12px;line-height:1.65}
/* 报告总览 */
.hero{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:1360px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}}
.hero-l{display:flex;align-items:center;gap:18px;padding:18px 20px}
.gauge{width:132px;height:132px;flex:0 0 132px}
.hero-t{font-size:15px;font-weight:700;line-height:1.5}
.hero-d{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.7}
.hero-n{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted);text-decoration:none}
.hero-n:hover{color:var(--brand-ink)}
.gtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:640px){.gtiles{grid-template-columns:1fr}}
.gtile{display:flex;flex-direction:column;padding:16px 18px;text-decoration:none;color:var(--ink);border-top:3px solid var(--rule);transition:border-color .15s}
.gtile:hover{border-color:var(--brand)}
.gtile b{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1}
.gtile.crit{border-top-color:var(--crit)} .gtile.crit b{color:var(--crit)}
.gtile.warn{border-top-color:var(--warn)} .gtile.warn b{color:var(--warn-ink)}
.gtile.good{border-top-color:var(--good)} .gtile.good b{color:var(--good)}
.gtile .gl{font-size:12.5px;font-weight:500;margin-top:2px}
.gtile .gs{font-size:12px;color:var(--muted);margin-top:6px}
.gtile .gn{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.5}
/* 岗位卡片 */
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;text-align:left;padding:14px 16px;cursor:pointer;font:inherit;color:var(--ink);border:1px solid var(--rule);transition:border-color .15s}
.pcard:hover,.pcard.on{border-color:var(--brand)}
.pcard.on{box-shadow:0 0 0 2px var(--brand-soft)}
.pc-h{display:flex;align-items:baseline;gap:8px}
.pc-t{font-size:14.5px;font-weight:700;flex:1}
.pc-r{font-family:var(--mono);font-size:20px;font-weight:600}
.pc-r.good{color:var(--good)} .pc-r.warn{color:var(--warn-ink)} .pc-r.crit{color:var(--crit)}
.pc-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.pc-radar{display:flex;justify-content:center;margin:6px 0}
.pc-radar svg{width:132px;height:132px}
.pc-g{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.pdet{margin-top:12px;padding:14px 16px}
.pdet-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pdet-h b{font-size:14px}
.pdet-h .sp{flex:1}
/* 建设与提升 */
.act-h{font-size:13px;font-weight:700;margin:6px 0 8px}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:16px}
.acard{padding:14px 16px}
.ac-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ac-h b{font-size:13.5px}
.ac-fx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;padding:6px 0;border-top:1px dashed var(--rule-2)}
.lvstep{font-family:var(--mono);font-size:12px;display:inline-flex;gap:4px;align-items:center}
.lv-a{color:var(--crit)} .lv-b{color:var(--warn-ink);font-weight:600} .lv-b.ok{color:var(--good)}
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ctile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:11px 13px;border-radius:10px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font:inherit;color:var(--ink);border-left-width:4px}
.ctile:hover,.ctile.on{border-color:var(--brand)}
.ctile.miss{border-left-color:var(--crit);background:var(--crit-bg)}
.ctile.low{border-left-color:var(--warn);background:var(--warn-bg)}
.ctile.ok{border-left-color:var(--good)}
.ct-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ct-h b{font-size:13px}
.ct-s{font-size:11.5px;color:var(--ink-2)}
.ct-st{font-weight:600;margin-right:6px}
.ctile.miss .ct-st{color:var(--crit)} .ctile.ok .ct-st{color:var(--good)} .ctile.low .ct-st{color:var(--warn-ink)}
.ct-r{font-size:11.5px;color:var(--muted)}
.cd-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:12.5px;line-height:1.6}
.cd-t{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.more{margin-top:12px}
.more>summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:600;list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:'›';display:inline-block;margin-right:8px;color:var(--muted);transition:transform .15s}
.more[open]>summary::before{transform:rotate(90deg)}
.card.pad.chips{padding:14px 16px}
/* 导出报告预览层 */
#docov{position:fixed;inset:0;z-index:95;background:rgba(20,16,32,.55);display:flex;flex-direction:column}
#docov[hidden]{display:none}
#docov .doc-bar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--rule);color:var(--ink);font-size:13px}
#docov .doc-scroll{flex:1;overflow-y:auto;padding:24px 16px 48px}
#docov .doc{box-shadow:0 12px 40px -12px rgba(0,0,0,.35);border-radius:4px}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop">
      <div class="ptop-r">
        <div class="pt-l">
          <h1 class="pt-t">能力测评</h1>
          <div class="pt-d">对照行业岗位能力要求，评估本校专业的课程支撑与实训资源</div>
        </div>
      </div>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.ASSESS_DATA;
  var G = D.graph;
  var ABL = {}, POS = {}, SUB = {};
  G.abilities.forEach(function (a) { ABL[a.id] = a; });
  G.positions.forEach(function (p) { POS[p.id] = p; });
  G.subs.forEach(function (s) { SUB[s.id] = s; });
  var REQ = {};   // 岗位 → [{abl, level}]
  G.require.forEach(function (r) { (REQ[r.pos] = REQ[r.pos] || []).push({ abl: r.abl, level: r.level }); });
  var LV = { L1: 1, L2: 2, L3: 3 };
  var PERM_VIEW = 'major:assess:view', PERM_RUN = 'major:assess:run';

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pct(n, d) { return d ? Math.round(n * 1000 / d) / 10 : 0; }
  function rateTxt(r) { return r == null ? '—' : r + '%'; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function toast(msg) {
    var t = $('#toast'); t.innerHTML = '<span>' + esc(msg) + '</span>'; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3200);
  }

  /* ── 本页存储：本校方案的修改 + 测评记录（本机浏览器） ── */
  var STORE_KEY = 'assessStore';
  function loadStore() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
    if (!s || s.v !== 3) s = { v: 3, plans: {}, reports: [] };
    return s;
  }
  function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
  var store = loadStore();
  function planOf(mid) {
    var base = clone(D.plans[mid]);
    if (!store.plans[mid]) return base;
    var p = clone(store.plans[mid]);
    if (!p.labs) p.labs = base.labs;
    return p;
  }
  /* 实训条件字典与数量标准（标准为空时，不显示任何数量） */
  var TD = D.training || { dict: [], reqs: {}, standards: [] };
  var COND = {}; TD.dict.forEach(function (d) { COND[d.id] = d; });
  var STD = {}; TD.standards.forEach(function (x) { STD[x.cond] = x; });
  var COND_CATS = ['场地', '场景', '设备耗材', '软件', '校外基地'];
  function needPart(basis) { var i = String(basis || '').indexOf('需要：'); return i >= 0 ? basis.slice(i + 3) : basis; }

  /* ── 身份与权限 ── */
  var ctx, identity;
  function reload() { ctx = DEMO.getState(); identity = UI.currentIdentity(ctx); }
  function can(code) { return UI.hasPerm(ctx, identity, code); }
  function majorVisible(m) { return Perm.check(ctx, identity, PERM_VIEW, m, 'major').allowed; }
  function majorRunnable(m) { return Perm.check(ctx, identity, PERM_RUN, m, 'major').allowed; }
  function visibleMajors() { return ctx.majors.filter(majorVisible); }
  function orgName(id) { var o = ctx.orgs.find(function (x) { return x.id === id; }); return o ? o.name : ''; }
  function majorById(id) { return ctx.majors.find(function (m) { return m.id === id; }); }
  function hasKnowledge(mid) { return !!(D.knowledge[mid] && D.plans[mid]); }

  /* ═══ 计算：本校情况 对比 标准（只用人工确认过的数据），差距就是建设或提升项 ═══
     标准 = 目标岗位的能力要求 + 专业知识体系全部课程 + 已确认映射 + 已确认实训需求
     本校 = 职业面向 + 开设的课程 + 登记的实训资源 */
  var CONFIRMED = D.confirmedStatuses || ['已审核', '已调整'];
  function isConfirmed(x) { return CONFIRMED.indexOf(x.status) >= 0; }
  function confirmCount(list) {
    var n = (list || []).filter(isConfirmed).length;
    return { ok: n, pending: (list || []).filter(function (x) { return x.status === '待审核'; }).length };
  }
  function compute(mid, plan) {
    var K = D.knowledge[mid], maps = D.mappings[mid] || [];
    var courseById = {}; K.courses.forEach(function (c) { courseById[c.id] = c; });
    var skillCourse = {};
    K.courses.forEach(function (c) { c.tasks.forEach(function (t) { t.skills.forEach(function (s) { skillCourse[s.id] = { course: c, skill: s, task: t }; }); }); });
    var opened = {};
    plan.courses.forEach(function (c) { if (c.opened && c.kc) opened[c.kc] = true; });
    function counted(m) { return D.countedTypes.indexOf(m.type) >= 0 && m.level && isConfirmed(m); }
    // 能力 → 标准可达等级（知识体系全部课程）与本校达到等级（只算已开设课程）
    var best = {}, bestAll = {};
    var used = { total: 0 };
    maps.forEach(function (m) {
      if (!counted(m)) return;
      var sc = skillCourse[m.skill]; if (!sc) return;
      var lv = LV[m.level];
      var b2 = bestAll[m.abl] = bestAll[m.abl] || { level: 0, courses: {} };
      b2.level = Math.max(b2.level, lv); b2.courses[sc.course.id] = Math.max(b2.courses[sc.course.id] || 0, lv);
      if (!opened[sc.course.id]) return;
      used.total++;
      var b = best[m.abl] = best[m.abl] || { level: 0, direct: false, maps: [], courses: {} };
      b.level = Math.max(b.level, lv);
      if (m.type === '直接支撑') b.direct = true;
      b.maps.push(m);
      b.courses[sc.course.id] = Math.max(b.courses[sc.course.id] || 0, lv);
    });
    // 结论：nostd = 标准本身达不到要求（不计入本校差距）；ok = 达到；low = 低于要求；none = 本校未覆盖
    function judge(ablId, need) {
      var std = (bestAll[ablId] && bestAll[ablId].level) || 0, b = best[ablId], got = b ? b.level : 0;
      if (std < LV[need]) return { std: std, got: got, status: 'nostd' };
      return { std: std, got: got, status: got >= LV[need] ? 'ok' : got ? 'low' : 'none', partialOnly: b ? !b.direct : false };
    }
    function posEval(pid) {
      var rows = (REQ[pid] || []).map(function (r) {
        var j = judge(r.abl, r.level);
        return { abl: r.abl, need: r.level, std: j.std, got: j.got, status: j.status, partialOnly: j.partialOnly };
      });
      var cmp = rows.filter(function (r) { return r.status !== 'nostd'; }).length;
      var ok = rows.filter(function (r) { return r.status === 'ok'; }).length;
      return { pos: pid, rows: rows, total: rows.length, comparable: cmp, ok: ok, gap: cmp - ok, nostd: rows.length - cmp, rate: cmp ? pct(ok, cmp) : null };
    }
    var targets = plan.positions.map(posEval);

    // 目标岗位要求的能力（取各岗位要求的最高等级）
    var needAbl = {}, needPos = {};
    targets.forEach(function (t) { t.rows.forEach(function (r) {
      needAbl[r.abl] = Math.max(needAbl[r.abl] || 0, LV[r.need]); (needPos[r.abl] = needPos[r.abl] || []).push(t.pos);
    }); });
    var gapAbl = [], nostdAbl = [];
    Object.keys(needAbl).forEach(function (aid) {
      var std = (bestAll[aid] && bestAll[aid].level) || 0, got = (best[aid] && best[aid].level) || 0;
      if (std < needAbl[aid]) nostdAbl.push({ abl: aid, need: needAbl[aid], std: std, pos: needPos[aid] });
      else if (got < needAbl[aid]) gapAbl.push(aid);
    });
    // 课程差距：标准中有、本校未开设的课程，及开设后能补上的目标岗位能力
    var notOpened = plan.courses.filter(function (c) { return !c.opened && c.kc; }).map(function (c) {
      var fills = gapAbl.filter(function (aid) { var lv = bestAll[aid].courses[c.kc]; return lv && lv > ((best[aid] && best[aid].level) || 0); })
        .map(function (aid) { return { abl: aid, lv: bestAll[aid].courses[c.kc], need: needAbl[aid] }; });
      return { name: c.name, category: c.category, kc: c.kc, fills: fills };
    });

    // 建设与提升项：每条写「标准要求 / 本校现状 / 怎么补」
    var sugs = [];
    function posNames(aid) { return needPos[aid].map(function (p) { return POS[p].name; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join('、'); }
    gapAbl.forEach(function (aid) {
      var a = ABL[aid], need = 'L' + needAbl[aid], got = (best[aid] && best[aid].level) || 0;
      var close = notOpened.filter(function (c) { return c.fills.some(function (f) { return f.abl === aid && f.lv >= needAbl[aid]; }); });
      var raise = notOpened.filter(function (c) { return close.indexOf(c) < 0 && c.fills.some(function (f) { return f.abl === aid; }); });
      var how = close.length ? '开设标准课程 ' + close.map(function (c) { return '《' + c.name + '》'; }).join('、') + ' 可达到 ' + need + '。'
        : '开设 ' + raise.map(function (c) { return '《' + c.name + '》'; }).join('、') + ' 可提升该能力。';
      sugs.push({ pri: (!got || a.core) ? '高' : '中', kind: '能力',
        title: (got ? '提升能力：' : '补齐能力：') + a.name,
        desc: '标准要求 ' + need + '（' + posNames(aid) + '），本校' + (got ? '当前 L' + got : '已开设课程未覆盖') + '。' + how,
        basis: '能力 ' + need + ' 要求：' + a.levels[need] });
    });
    // 实训条件差距：已开设课程的已确认实训需求 × 本校登记的实训资源
    var training = null;
    if (TD.reqs[mid]) {
      var skillAbl = {};
      maps.forEach(function (m) { if (counted(m)) (skillAbl[m.skill] = skillAbl[m.skill] || []).push(m); });
      var reqUsed = { total: 0, manual: 0 };
      var conds = {};
      TD.reqs[mid].forEach(function (r) {
        if (!isConfirmed(r)) return;
        var sc = skillCourse[r.skill]; if (!sc || !opened[sc.course.id]) return;
        reqUsed.total++; if (r.source === 'manual') reqUsed.manual++;
        // 课程与能力按级别分开记：「必需」行只列该条件为必需的课程和能力，不混入只是建议的
        var c = conds[r.cond] = conds[r.cond] || { cond: r.cond, level: '建议', items: [], courses: { '必需': {}, '建议': {} }, abl: { '必需': {}, '建议': {} } };
        if (r.level === '必需') c.level = '必需';
        c.courses[r.level][sc.course.id] = sc.course.name;
        c.items.push({ skill: sc.skill.name, course: sc.course.name, level: r.level, why: needPart(r.basis), status: r.status, source: r.source });
        (skillAbl[r.skill] || []).forEach(function (m) { if (needAbl[m.abl]) c.abl[r.level][m.abl] = Math.max(c.abl[r.level][m.abl] || 0, LV[m.level]); });
      });
      var labs = (plan.labs || []).filter(function (l) { return l.status !== '停用'; });
      var list = Object.keys(conds).map(function (cid) {
        var c = conds[cid], d = COND[cid];
        var prov = labs.filter(function (l) { return (l.conds || []).indexOf(cid) >= 0; });
        var cs = c.courses[c.level], ab = c.abl[c.level];
        var items = c.items.slice().sort(function (a, b) { return (a.level === '必需' ? 0 : 1) - (b.level === '必需' ? 0 : 1); });
        var row = { cond: cid, name: d.name, category: d.category, level: c.level, have: prov.map(function (l) { return l.name; }),
          courses: Object.keys(cs).map(function (k) { return cs[k]; }),
          abl: Object.keys(ab).map(function (aid) { return { abl: aid, lv: ab[aid] }; }), items: items };
        row.status = prov.length ? '具备' : '缺';
        // 数量：只有标准原文规定了数量才计算；学校未填工位数或同时上课人数时不计算
        var sd = STD[cid];
        if (sd && prov.length) {
          var sugg = sd.how === 'min_count' ? sd.value : (+plan.classSize > 0 ? Math.ceil(plan.classSize / sd.value) : null);
          var allSeats = prov.every(function (l) { return +l.seats > 0; });
          if (sugg != null && allSeats) {
            row.seats = prov.reduce(function (n, l) { return n + (+l.seats); }, 0); row.suggest = sugg; row.std = sd;
            if (row.seats < sugg) row.status = '工位不足';
          }
        }
        return row;
      });
      var rank = { '缺': 0, '工位不足': 1, '具备': 2 };
      list.sort(function (a, b) { return rank[a.status] - rank[b.status] || b.courses.length - a.courses.length; });
      var required = list.filter(function (x) { return x.level === '必需'; });
      var suggested = list.filter(function (x) { return x.level === '建议'; });
      training = { required: required, suggested: suggested, ok: required.filter(function (x) { return x.status === '具备'; }).length, used: reqUsed };
      required.forEach(function (x) {
        if (x.status === '具备') return;
        var coreHit = x.abl.some(function (a) { return ABL[a.abl].core; });
        var ablTxt = x.abl.map(function (a) { return ABL[a.abl].name + '（L' + a.lv + '）'; });
        var nNeed = x.items.filter(function (i) { return i.level === '必需'; }).length;
        var ex = x.items[0];
        var basis = '按课程内容推导：' + nNeed + ' 个技能必需该条件，如「' + ex.skill + '」—' + ex.why;
        if (x.status === '缺') {
          sugs.push({ pri: (coreHit || x.courses.length >= 2) ? '高' : '中', kind: '实训', title: '建设实训条件：' + x.name,
            desc: '标准要求：' + x.courses.map(function (n) { return '《' + n + '》'; }).join('') + ' 必需该条件' +
              (ablTxt.length ? '（涉及目标岗位能力：' + ablTxt.join('、') + '）' : '') + '；本校登记的实训资源中没有。' +
              (x.category === '校外基地' ? '建议拓展相应的校外合作基地。' : '建议新建、改造现有实训室或与校内外共享。'),
            basis: basis });
        } else {
          sugs.push({ pri: '中', kind: '实训', title: '扩充工位：' + x.name,
            desc: '标准建议 ' + x.suggest + ' 个，本校 ' + x.seats + ' 个。', basis: '数量依据：' + x.std.source + '；' + basis });
        }
      });
    }

    var order = { '高': 0, '中': 1, '低': 2 };
    sugs.sort(function (a, b) { return order[a.pri] - order[b.pri]; });

    return {
      targets: targets, best: best, bestAll: bestAll, used: used,
      gap: gapAbl, nostd: nostdAbl, notOpened: notOpened,
      training: training,
      sugs: sugs
    };
  }

  var draft = null;   // {mid, step, plan}

  var openLab = -1;   // 正在编辑「具备条件」的那一行（重绘后保持展开）
  /* 标准要求的实训条件：本校已开设课程的已确认实训需求，按条件汇总（任一技能必需即必需） */
  function stdConds(mid, plan) {

    plan.courses.forEach(function (c) { if (c.opened && c.kc) opened[c.kc] = true; });
    (TD.reqs[mid] || []).forEach(function (r) {
      if (!isConfirmed(r)) return;

      var x = out[r.cond] = out[r.cond] || { cond: r.cond, level: '建议', by: { '必需': {}, '建议': {} } };
      if (r.level === '必需') x.level = '必需';
      x.by[r.level][c.name] = 1;
    });
    // 与报告一致：必需行只列必需该条件的课程
    return Object.keys(out).map(function (k) { var x = out[k]; x.courses = Object.keys(x.by[x.level]); return x; })
      .sort(function (a, b) { return (a.level === '必需' ? 0 : 1) - (b.level === '必需' ? 0 : 1) || COND_CATS.indexOf(COND[a.cond].category) - COND_CATS.indexOf(COND[b.cond].category); });

        sc.map(function (x) {
          var d = COND[x.cond], has = live.filter(function (o) { return (o.l.conds || []).indexOf(x.cond) >= 0; });
          return '<tr><td><b>' + esc(d.name) + '</b><div class="note">' + esc(d.spec) + '</div></td><td class="note">' + esc(d.category) + '</td>' +

                '<td>' + esc(ABL[f.abl].name) + (f.core ? ' ★' : '') + '</td><td class="n">' + (f.from ? 'L' + f.from : '无') + ' → L' + f.to + (f.to >= f.need ? '' : '<br><span class="muted">要求 L' + f.need + '</span>') + '</td>' +
                '<td>' + esc(f.pos.join('、')) + '</td></tr>';
            }).join('');
          }).join('') + '</tbody></table><p class="muted">★ 为核心能力；各能力的等级要求见附录。</p>';
      }
      if (cmiss.length) {
        h += '<h3>（' + (acs.length ? '二' : '一') + '）建设实训条件</h3><table><thead><tr><th style="width:9%">优先级</th><th style="width:20%">实训条件</th><th style="width:9%">类别</th><th style="width:9%">本校</th><th>需要它的课程</th><th style="width:26%">涉及目标岗位能力</th></tr></thead><tbody>' +
          cmiss.map(function (c) {
            var x = c.x;
            return '<tr><td>' + pri(c.pri) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.category) + '</td>' +
              '<td class="' + (x.status === '缺' ? 'none' : 'low') + '">' + x.status + (x.suggest != null ? '<br><span class="muted">' + x.seats + ' / 建议 ' + x.suggest + '</span>' : '') + '</td>' +
              '<td>' + x.courses.length + ' 门：' + esc(x.courses.map(function (n) { return '《' + n + '》'; }).join('')) + '</td>' +
              '<td>' + (x.abl.length ? esc(x.abl.map(function (a) { return ABL[a.abl].name + (ABL[a.abl].core ? '★' : '') + ' L' + a.lv; }).join('、')) : '—') + '</td></tr>';
          }).join('') + '</tbody></table><p class="muted">' + (cmiss.some(function (c) { return c.x.category === '校外基地'; }) ? '校外基地类建议拓展合作基地；其余' : '') +
          '建议新建、改造现有实训室或与校内外共享。推导依据见附录。</p>';
      }
    }
    // 附录
    var ax = ['一', '二', '三', '四'], ai = 0;
    var gaps = [], seen = {};
    R.targets.forEach(function (t) { t.rows.forEach(function (r) { if ((r.status === 'low' || r.status === 'none') && !seen[r.abl]) { seen[r.abl] = 1; gaps.push(r); } }); });
    if (gaps.length) {
      h += '<h2>附录' + ax[ai++] + '　差距能力的等级要求</h2><table><thead><tr><th style="width:24%">能力</th><th class="n">要求</th><th>该等级的行为要求</th><th>本校当前支撑</th></tr></thead><tbody>' +
        gaps.map(function (r) {
          var a = ABL[r.abl], b = R.best[r.abl];
          var cur = b ? b.maps.slice().sort(function (x, y) { return LV[y.level] - LV[x.level]; }).slice(0, 3).map(function (mp) { var sk = ix.skillById[mp.skill]; return sk.s.name + '（《' + sk.c.name + '》，' + mp.type + ' ' + mp.level + '）'; }).join('；') : '无';
          return '<tr><td>' + esc(a.name) + '</td><td class="n">' + r.need + '</td><td>' + esc(a.levels[r.need]) + '</td><td>' + esc(cur) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    if (cmiss.length) {
      h += '<h2>附录' + ax[ai++] + '　实训条件建设依据</h2><p>按课程内容推导：以下技能离开该条件无法完成或无法考核（每项列出最多 3 个技能）。</p>' +
        '<table><thead><tr><th style="width:20%">实训条件</th><th style="width:28%">必需它的技能</th><th>需要什么</th></tr></thead><tbody>' +
        cmiss.map(function (c) {
          var its = c.x.items.filter(function (i) { return i.level === '必需'; }), top = its.slice(0, 3);
          return top.map(function (i, k) {
            return '<tr>' + (k ? '' : '<td rowspan="' + top.length + '">' + esc(c.x.name) + (its.length > 3 ? '<br><span class="muted">共 ' + its.length + ' 个技能</span>' : '') + '</td>') +
              '<td>' + esc(i.skill) + '<br><span class="muted">《' + esc(i.course) + '》</span></td><td>' + esc(i.why) + '</td></tr>';
          }).join('');
        }).join('') + '</tbody></table>';
    }
    if (R.nostd.length) {
      h += '<h2>附录' + ax[ai++] + '　标准未覆盖项</h2><p>以下能力在当前标准（专业知识体系 + 已确认映射）中达不到岗位要求，不计入本校差距与达标率，需完善专业知识体系或映射。</p>' +
        '<table><thead><tr><th>能力</th><th class="n">要求</th><th class="n">标准可达</th><th>涉及岗位</th></tr></thead><tbody>' +
        R.nostd.map(function (x) {
          return '<tr><td>' + esc(ABL[x.abl].name) + '</td><td class="n">L' + x.need + '</td><td class="n">' + (x.std ? 'L' + x.std : '—') + '</td><td>' +
            esc(x.pos.map(function (p) { return POS[p].name; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join('、')) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    h += '<h2>附录' + ax[ai] + '　数据来源与计算口径</h2><ul>' +
      '<li>测评方法：本校情况对比标准，差距即需要建设或提升的内容。标准只计入人工确认（已审核、已调整）的数据，待确认的数据不计入。</li>' +
      '<li>岗位能力要求：' + esc(G.industry.name + ' ' + G.industry.version) + '，' + G.positions.length + ' 个岗位、' + G.abilities.length + ' 条能力，每条能力含 L1–L3 三级行为要求。</li>' +
      '<li>专业知识体系：' + esc(D.knowledge[rep.majorId].name) + '，专业 → 课程 → 任务 → 技能。</li>' +
      '<li>课程—能力映射：只计已确认的「直接支撑」「部分支撑」映射，本报告计入 ' + R.used.total + ' 条（本校已开设课程）。标准可达等级取知识体系全部课程的最高映射等级，本校达到等级取已开设课程的最高映射等级，均与岗位要求等级比较。只有部分支撑的标注「仅部分支撑」。</li>' +
      '<li>本校数据：职业面向 ' + rep.plan.positions.length + ' 个岗位；开设知识体系中的专业课程 ' + rep.plan.courses.filter(function (c) { return c.opened; }).length + ' 门（共 ' + rep.plan.courses.length + ' 门）' +
        (rep.plan.labs ? '；登记实训资源 ' + rep.plan.labs.length + ' 项' : '') + '。</li>' +
      (T ? '<li>实训需求：按专业知识体系中技能的达成结果与操作步骤推导「需要哪类实训条件」，经人工确认后计入，不是国家标准规定的实训条件；' +
        (TD.standards.length ? '数量建议来自所注明的标准。' : '不含工位数等数量信息。') + '本校实训资源以测评时登记的为准。</li>' : '') + '</ul>' +
      '<div class="foot">' + esc(repName(rep)) + ' · ' + esc(rep.createdAt) + ' · AIGC 智慧课堂教学平台</div>';
    return h + '</div>';
  }
  function docPage(rep) {
    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + esc(repName(rep)) + '</title><style>body{margin:0;background:#fff}' + DOC_CSS + '\n' +
      PRINT_CSS.replace(/body\.print-doc[^\n]*\n/g, '') + '</style></head><body>' + docHTML(rep) + '</body></html>';
  }
  function docFileName(rep) { return repName(rep) + '（' + rep.createdAt.slice(0, 10) + '）'; }
  function openExport(rep) {
    var ov = $('#docov');
    if (!ov) {
      var st = document.createElement('style'); st.textContent = DOC_CSS + '\n' + PRINT_CSS; document.head.appendChild(st);
      ov = document.createElement('div'); ov.id = 'docov';
      ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', '导出报告预览');
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) {
        var b = e.target.closest('[data-doc]'); if (!b) return;
        var cur = store.reports.find(function (x) { return x.id === ov.getAttribute('data-rep'); });
        var act = b.getAttribute('data-doc');
        if (act === 'close') closeExport();
        if (act === 'print') {
          var t0 = document.title; document.title = docFileName(cur);   // 另存为 PDF 时的默认文件名
          document.body.classList.add('print-doc'); window.print();
          setTimeout(function () { document.body.classList.remove('print-doc'); document.title = t0; }, 300);
        }
        if (act === 'html') {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([docPage(cur)], { type: 'text/html' }));
          a.download = docFileName(cur) + '.html';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        }
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) closeExport(); });
    }
    ov.setAttribute('data-rep', rep.id);
    ov.innerHTML = '<div class="doc-bar"><b>导出报告预览</b><span class="note" style="color:inherit;opacity:.7">供学校负责人阅读的正式版本</span><span style="flex:1"></span>' +
      '<button class="btn" data-doc="print" style="height:32px">打印 / 另存为 PDF</button>' +
      '<button class="btn ghost" data-doc="html" style="height:32px">下载 HTML</button>' +
      '<button class="btn ghost" data-doc="close" style="height:32px" aria-label="关闭">关闭</button></div>' +
      '<div class="doc-scroll">' + docHTML(rep) + '</div>';
    ov.hidden = false; document.body.style.overflow = 'hidden';
    ov.querySelector('.doc-scroll').scrollTop = 0;
  }
  function closeExport() { var ov = $('#docov'); if (ov) { ov.hidden = true; document.body.style.overflow = ''; } }

  function ablDetail(a, r, R, ix) {
    var b = R.best[r.abl], b2 = R.bestAll[r.abl];
    var h = '<div class="lv"><b>L1</b>' + esc(a.levels.L1) + '</div><div class="lv"><b>L2</b>' + esc(a.levels.L2) + '</div><div class="lv"><b>L3</b>' + esc(a.levels.L3) + '</div>';
    if (r.status === 'nostd') h += '<div class="note" style="margin-top:6px">当前标准（知识体系 + 已确认映射）中最高只到 ' + (r.std ? 'L' + r.std : '无支撑') + '，达不到要求的 ' + r.need + '，不计入本校差距。</div>';
    if (b) {
      h += '<div class="sub-h" style="margin:10px 0 6px;font-size:12px">本校支撑的技能 · ' + b.maps.length + '</div><div class="maplist">' +
        b.maps.slice().sort(function (x, y) { return (LV[y.level] || 0) - (LV[x.level] || 0); }).map(function (m) {
          var sk = ix.skillById[m.skill];
          return '<div class="mapi"><div class="mh"><b>' + esc(sk.s.name) + '</b><span class="note">《' + esc(sk.c.name) + '》</span>' +
            '<span class="pill ' + (m.type === '直接支撑' ? 'core' : 'k') + '">' + esc(m.type) + ' ' + esc(m.level) + '</span>' +
            '<span class="pill good">' + esc(m.status) + '</span></div>' +
            '<div class="mb">' + esc(m.basis) + '</div></div>';
        }).join('') + '</div>';
    } else if (r.status !== 'nostd') {
      h += '<div class="note" style="margin-top:6px">本校已开设课程中没有支撑该能力的技能。</div>';
    }
    // 标准中有、本校未开设的支撑课程
    var extra = b2 ? Object.keys(b2.courses).filter(function (cid) { return !(b && b.courses[cid]); }) : [];
    if (extra.length && (r.status === 'low' || r.status === 'none')) {
      h += '<div class="note" style="margin-top:8px">标准中能支撑它、本校未开设的课程：' + esc(extra.map(function (cid) { return '《' + ix.courseById[cid].name + '》L' + b2.courses[cid]; }).join('、')) + '</div>';
    }
    return h;
  }

  /* ═══ 路由与渲染 ═══ */
  function route() {
    var hsh = location.hash.replace(/^#/, '');
    var p = hsh.split('/');
    return { name: p[0] || 'list', arg: p[1] || null };
  }
  function render() {
    reload();
    var body = $('#body');
    if (!can(PERM_VIEW)) { body.innerHTML = '<div class="card empty">当前身份没有「能力测评查看」权限。</div>'; return; }
    var r = route();
    if (r.name === 'new') {
      if (!draft || (r.arg && draft.mid !== r.arg && draft.step !== 1)) startDraft(r.arg && hasKnowledge(r.arg) ? r.arg : null);
      body.innerHTML = viewNew();
    } else if (r.name === 'report') {
      var rep = store.reports.find(function (x) { return x.id === r.arg; });
      var m = rep && majorById(rep.majorId);
      body.innerHTML = rep && m && majorVisible(m) ? viewReport(rep) : '<div class="card empty">报告不存在或不在当前身份可见范围内。<a href="#">返回</a></div>';
    } else {
      draft = null;
      body.innerHTML = '<div class="sec-h" style="margin-top:0"><h2>专业</h2><span class="sub">当前身份可见范围内的专业</span><span class="sp"></span>' +
        (can(PERM_RUN) ? '<a class="btn" href="#new" style="height:34px;display:inline-flex;align-items:center;text-decoration:none">新建测评</a>' : '') + '</div>' + viewList();
    }
  }

  function savePlanDraft() { store.plans[draft.mid] = clone(draft.plan); saveStore(); }

  function bind() {
    var body = $('#body');
    body.addEventListener('click', function (e) {
      var t;
      if ((t = e.target.closest('[data-major]')) && t.getAttribute('data-major')) {
        draft.mid = t.getAttribute('data-major'); draft.plan = planOf(draft.mid); render(); return;
      }
      if ((t = e.target.closest('[data-pos]'))) {
        var pid = t.getAttribute('data-pos'), ps = draft.plan.positions, i = ps.indexOf(pid);
        if (i >= 0) ps.splice(i, 1); else ps.push(pid);
        savePlanDraft(); render(); return;
      }
      if ((t = e.target.closest('[data-gap]'))) { gapOnly = t.getAttribute('data-gap') === '1'; render(); return; }
      if ((t = e.target.closest('[data-provide]'))) {
        var pv = t.getAttribute('data-provide').split('|'), lab = draft.plan.labs[+pv[0]];
        lab.conds = (lab.conds || []).filter(function (x) { return x !== pv[1]; });
        if (t.getAttribute('aria-pressed') !== 'true') lab.conds.push(pv[1]);
        savePlanDraft(); render(); return;
      }
      if ((t = e.target.closest('[data-pcard]'))) { var pp = t.getAttribute('data-pcard'); openPos = openPos === pp ? null : pp; render(); return; }
      if ((t = e.target.closest('[data-ctile]'))) { var cc = t.getAttribute('data-ctile'); openCond = openCond === cc ? null : cc; render(); return; }
      if ((t = e.target.closest('.labedit > summary'))) { var li = +t.parentNode.getAttribute('data-li'); openLab = t.parentNode.open ? -1 : li; return; }
      if ((t = e.target.closest('.abl-row'))) {
        var det = body.querySelector('[data-det="' + t.getAttribute('data-abl') + '"]'); if (det) det.hidden = !det.hidden; return;
      }
      if (!(t = e.target.closest('[data-act]'))) return;
      var act = t.getAttribute('data-act');
      if (act === 'export') { var er = store.reports.find(function (x) { return x.id === t.getAttribute('data-rep'); }); if (er) openExport(er); return; }
      if (act === 'to1') { draft.step = 1; render(); }
      else if (act === 'to2') { if (draft.mid) { draft.step = 2; render(); } }
      else if (act === 'to3') {
        if (!draft.plan.positions.length) { toast('请至少选择一个职业面向岗位'); return; }
        if (!draft.plan.courses.some(function (c) { return c.opened; })) { toast('请至少开设一门专业课程'); return; }
        draft.step = 3; render();
      }
      else if (act === 'addLab') { draft.plan.labs = draft.plan.labs || []; draft.plan.labs.push({ name: '', kind: '校内', conds: [], seats: null, status: '在用' }); openLab = draft.plan.labs.length - 1; savePlanDraft(); render(); }
      else if (act === 'delLab') { draft.plan.labs.splice(+t.getAttribute('data-i'), 1); openLab = -1; savePlanDraft(); render(); }
      else if (act === 'resetPlan') { delete store.plans[draft.mid]; saveStore(); draft.plan = planOf(draft.mid); openLab = -1; toast('已恢复为原始数据'); render(); }
      else if (act === 'run') {
        var result = compute(draft.mid, draft.plan);
        var rated = result.targets.filter(function (x) { return x.rate != null; });
        var rate = rated.length ? Math.round(rated.reduce(function (s, x) { return s + x.rate; }, 0) / rated.length * 10) / 10 : null;
        var now = new Date(), pad = function (n) { return n < 10 ? '0' + n : n; };
        var rep = {
          id: 'R' + now.getTime().toString(36), majorId: draft.mid,
          createdAt: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
          by: identity.account.name, plan: clone(draft.plan), result: result,
          summary: { rate: rate, high: result.sugs.filter(function (s) { return s.pri === '高'; }).length }
        };
        store.reports.push(rep); saveStore(); draft = null;
        location.hash = '#report/' + rep.id;
      }
    });
    body.addEventListener('change', function (e) {
      var t = e.target;
      if (t.hasAttribute('data-plan')) { draft.plan[t.getAttribute('data-plan')] = t.value; savePlanDraft(); return; }
      if (t.hasAttribute('data-cond')) {
        var lb = draft.plan.labs[+t.getAttribute('data-l')], cid = t.getAttribute('data-cond');
        lb.conds = (lb.conds || []).filter(function (x) { return x !== cid; }); if (t.checked) lb.conds.push(cid);
        openLab = +t.getAttribute('data-l'); savePlanDraft(); render(); return;
      }
      var f = t.getAttribute('data-f'); if (!f) return;
      if (t.hasAttribute('data-c')) {
        draft.plan.courses[+t.getAttribute('data-c')].opened = t.checked;
      } else if (t.hasAttribute('data-l')) {
        var lab = draft.plan.labs[+t.getAttribute('data-l')];
        if (f === 'seats') lab.seats = t.value === '' ? null : Math.max(0, +t.value || 0);
        else lab[f] = t.value;
      }
      savePlanDraft(); render();
    });
  }

  UI.boot({ portal: 'admin', active: 'assess' });
  UI.onChange(function () { draft = null; closeExport(); render(); });
  window.addEventListener('hashchange', closeExport);
  window.addEventListener('hashchange', function () { openPos = openCond = null; render(); });
  bind();
  render();
})();
</script>
</body>
</html>
