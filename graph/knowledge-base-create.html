<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建知识库｜专业图谱平台</title>
<link rel="stylesheet" href="mapping-review.css" />
<link rel="stylesheet" href="mapping-polish.css" />
<link rel="stylesheet" href="mapping-compact.css" />
<link rel="stylesheet" href="mapping-reference.css" />
<style>
:root{--pri:#5149e9;--pri-d:#4038c0;--pri-l:#eef0ff;--pri-ll:#f7f6ff;--t1:#101828;--t2:#344054;--t3:#475467;--t4:#667085;--bd:#EAECF0;--bd2:#D0D5DD;--bg2:#F9FAFB;
  --c-text:#5149e9;--c-img:#0E9384;--c-av:#DC6803}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
*{box-sizing:border-box}
.kb-wrap{max-width:900px;margin:0 auto;padding:16px 0 48px}
.kb-create-header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.kb-create-header a{color:var(--pri);text-decoration:none;font-size:14px}
.kb-create-header h1{font-size:20px;font-weight:700;color:var(--t2);margin:0}
h2,h3{margin:0}
.h2{font-size:18px;font-weight:700;color:var(--t2)}
.h3{font-size:15px;font-weight:700;color:var(--t2)}
.muted{font-size:13px;color:var(--t4)}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
.wrapflex{flex-wrap:wrap}
.hr{height:1px;background:var(--bd)}
ul{list-style:none;margin:0;padding:0}
/* 面板 */
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:28px}
/* stepper */
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:18px 0 24px}
.step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t4);white-space:nowrap}
.step .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:#fff}
.step.on{color:var(--pri);font-weight:600}.step.on .n{background:var(--pri);border-color:var(--pri);color:#fff}
.step.done{color:var(--t2)}.step.done .n{background:var(--pri-l);border-color:var(--pri-l);color:var(--pri)}
.step-line{width:36px;height:1px;background:var(--bd2)}
/* 字段 */
.field{min-height:44px;border:1px solid var(--bd2);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;color:var(--t1);background:#fff}
.field:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea{font-family:inherit;border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--t1);resize:vertical;width:100%}
.lbl{font-size:14px;font-weight:600;color:var(--t1)}
.req{color:#F04438}
/* 数据源卡片 */
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.src{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:15px;font-weight:600;color:var(--t2);text-align:left;position:relative;min-height:96px}
.src:hover{border-color:var(--bd2);background:#F9FAFB}
.src.on{border:1.5px solid var(--pri);background:var(--pri-ll)}
.src.static,.src.static:hover{cursor:default;background:#fff;border-color:var(--bd)}
.btn.static,.btn.static:hover{cursor:default;background:#fff}
.src .src-title{display:flex;align-items:center;gap:10px}
.src small{font-size:12px;font-weight:400;color:var(--t4);line-height:1.6}
.ico{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:10px;background:#fff}
.ico.sm{width:38px;height:38px}
.tag-rec{position:absolute;top:-9px;right:12px;font-size:11px;font-weight:600;color:#fff;background:var(--pri);border-radius:6px;padding:1px 7px}
/* 类型说明 */
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--bd2);background:#fff;font-size:15px;font-weight:600;color:var(--t2)}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.pri:disabled{background:#d6d2f2;border-color:#d6d2f2}
.mini{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.link{border:0;background:none;padding:0;color:var(--pri);font-size:inherit;font-weight:500}
.pill{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--bd2);background:#fff;font-size:14px;color:var(--t2)}
.pill.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:600}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:10px;border:1px solid var(--bd);background:#fff}
.opt.on{border:1.5px solid var(--pri);background:var(--pri-ll)}
.tg{width:44px;height:26px;border-radius:13px;border:0;background:var(--bd2);position:relative;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:left .15s}
.tg.on{background:var(--pri)}.tg.on::after{left:21px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:#F2F4F7;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.done{background:#ECFDF3;color:#067647}
.chip.act{background:var(--pri-l);color:var(--pri-d);font-weight:600}
.chip.warn{background:#FEF0C7;color:#93370D}
.k-text{background:#eef0ff;color:#5149e9}.k-image{background:#F0FDF9;color:#107569}.k-av{background:#FEF6EE;color:#B93815}
.sp{font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;white-space:nowrap}
.sp1{background:var(--pri-l);color:var(--pri-d)}.sp2{background:#FEF0C7;color:#93370D}.sp3{background:#F4F3FF;color:#5925DC}
/* 上传 */
.drop{border:1px dashed #c9c2ef;border-radius:12px;background:var(--pri-ll);padding:24px;display:flex;flex-direction:column;gap:10px;transition:all .15s}
.drop.drag{border-color:var(--pri);background:var(--pri-l)}
.drop p{margin:0;font-size:13px;color:var(--t4);line-height:1.8}
.drop p b{color:var(--t2);font-weight:600}
.frow{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;border-radius:10px;border:1px solid var(--bd);background:#fff}
.frow.err{border-color:#FDA29B;background:#FEF3F2}
.fname{font-size:14px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:8px}
.x:hover{background:#F2F4F7}
/* step3 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tab{min-height:44px;padding:0 16px;border:0;background:none;font-size:15px;color:var(--t4);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.tab .cnt{font-size:12px;background:#F2F4F7;color:var(--t3);border-radius:10px;padding:0 7px}
.tab.on .cnt{background:var(--pri-l);color:var(--pri-d)}
.card{border:1px solid var(--bd);border-radius:12px}
.set{display:flex;align-items:center;gap:16px;padding:14px 16px}
.set+.set{border-top:1px solid var(--bd)}
.set b{font-size:14px;font-weight:600;color:var(--t1)}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:14px;background:var(--bg2);border:1px solid var(--bd)}
.pv{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:#fff;border:1px solid var(--bd)}
.pv p{margin:0;font-size:14px;line-height:1.75;color:var(--t2);white-space:pre-line}
.pv .lbl{font-size:12px;font-weight:600;color:var(--t4)}
mark.hw{background:#FEF0C7;color:inherit;border-radius:3px;padding:0 2px}
.thumb{border-radius:8px;overflow:hidden;border:1px solid var(--bd);line-height:0}
.thumb svg{width:100%;height:auto;display:block}
.fixed{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bg2);font-size:13px;color:var(--t3);line-height:1.6}
/* step4 处理 */
.proc{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--bd);border-radius:12px}
.track{height:6px;border-radius:3px;background:#F2F4F7;overflow:hidden}
.track>div{height:100%;background:var(--pri);transition:width .25s}
.track>div.ok{background:#17B26A}
.pfile{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--bg2);overflow:hidden;font-size:14px}
.pfile>*:not(.pfile-bar){position:relative}
.pfile-bar{position:absolute;left:0;top:0;bottom:0;background:var(--pri-ll);transition:width .25s}
.pfile-pct{font-size:13px;color:var(--t3);font-variant-numeric:tabular-nums}
.kb-name-row{display:flex;align-items:flex-end;gap:16px}
.kb-name-ico{width:64px;height:64px;border-radius:14px;background:var(--pri-ll);display:flex;align-items:center;justify-content:center;flex:none}
.sum{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;font-size:14px}
.sum span{color:var(--t4)}
.sum b{font-weight:500;color:var(--t2)}
.spin{width:16px;height:16px;border:2px solid #E0DDFB;border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#101828;color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>

const idxStage=()=>S.indexMode==='high'||MODE==='add'?'向量索引':'关键词索引';
function stagesFor(f,pct){
  let names;
  if(f.kind==='text') names=['上传',f.scanned&&S.ocrScan?'OCR 识别':'文本解析','分段',idxStage()];
  else if(f.kind==='image') names=['上传',...(S.imgMode!=='desc'?['文字识别']:[]),...(S.imgMode!=='ocr'?['画面描述']:[]),idxStage()];
  else names=f.media==='video'?['上传','提取音轨','语音转写','智能分段',idxStage()]:['上传','语音转写','智能分段',idxStage()];
  if(extractOn()) names.push('知识点提取');
  const step=100/names.length;
  let cur=Math.floor(pct/step); if(pct>=100) cur=names.length;
  return {names,cur};
}

      <span class="muted">${all?`共 ${v.length} 个文件，生成 ${segTotal} 个分段，已完成${idxStage()}，可开始检索。${kpLine}`:'处理在后台进行，可以先前往文档，完成后在文档列表查看结果。'}</span></div>`;

function render(){
  const y=window.scrollY, act=document.activeElement, keepId=act&&act.id, pos=act&&act.selectionStart;
  $('#app').innerHTML=stepper()+[null,viewStep1,viewStep2,viewStep3][S.step]();
  window.scrollTo(0,y);
  if(keepId){ const el=document.getElementById(keepId); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } }
  bindExtras();
}

function addFiles(list){
  const room=LIMIT.perBatch-S.files.length;
  if(list.length>room) toast(`每批最多 ${LIMIT.perBatch} 个文件，已忽略多出的 ${list.length-Math.max(room,0)} 个`);
  list.slice(0,Math.max(room,0)).forEach(f=>S.files.push(f));
  render();
}
function fromRealFile(file){
  const ext=file.name.split('.').pop().toLowerCase(), kind=kindOf(ext);
  const tpl=MOCK_FILES.find(m=>m.kind===(kind||'text')&&!m.error);
  const r=JSON.parse(JSON.stringify(tpl)); r.svg=tpl.svg;
  Object.assign(r,{id:'u'+(uid++),name:file.name,ext,kind:kind||'text',
    size:file.size>1024**3?(file.size/1024**3).toFixed(1)+' GB':(file.size/1024**2).toFixed(1)+' MB'});
  if(kind==='av') r.media=['mp4','mov','mkv','webm'].includes(ext)?'video':'audio';
  if(!kind) r.error='格式不支持';
  else if(file.size>LIMIT[kind]) r.error={text:'文件超过 100 MB',image:'图片超过 20 MB',av:'文件超过 2 GB'}[kind];
  if(kind==='av' && !r.error) probeDuration(file,r);
  return r;
}
/* 读取真实音视频的时长，超过 1 小时标红拦截 */
function probeDuration(file,r){
  const el=document.createElement(r.media==='video'?'video':'audio'), url=URL.createObjectURL(file);
  el.preload='metadata';
  el.onloadedmetadata=()=>{ URL.revokeObjectURL(url); if(isFinite(el.duration)){ r.sec=Math.round(el.duration); if(r.sec>LIMIT.avSec) r.error='时长超过 1 小时，无法导入'; render(); } };
  el.onerror=()=>URL.revokeObjectURL(url);
  el.src=url;
}
/* 添加模式：把本批文件交给文档详情页（同一会话内），格式与详情页 DOCS 一致 */
function toDoc(f,status){
  const now=new Date(), p=n=>(n<10?'0':'')+n;
  const d={id:f.docId, autoKp:extractOn(), cat:f.kind, name:f.name, ext:f.ext.toUpperCase(), size:f.size, status, source:'local',
    time:now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+' '+p(now.getHours())+':'+p(now.getMinutes()), hits:0};
  if(f.kind==='text') Object.assign(d,{scanned:!!f.scanned, ocrOff:!!f.scanned&&!S.ocrScan, segs:textSegs(f).map(s=>s.t)});
  else if(f.kind==='image') Object.assign(d,{svg:f.svg, imgMode:S.imgMode}, imgParts(f));
  else Object.assign(d,{media:f.media, sec:f.sec, segMode:S.segMode, speakers:f.speakers, segs:f.segs.map(s=>[s[0],s[1],s[2],avText(s)])});
  return d;
}
/* 图谱中心：新建的知识库保存下来（列表可见、进入自己的详情页，创建人为当前登录人） */
let NEW_KB_ID=null;
function saveNewKb(){
  if(MODE!=='create') return;
  if(!NEW_KB_ID) NEW_KB_ID='KBN'+Date.now().toString(36).toUpperCase();
  const now=new Date(), p=n=>(n<10?'0':'')+n, day=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate());
  try{
    const list=JSON.parse(sessionStorage.getItem('gc_kbs_new')||'[]').filter(k=>k.id!==NEW_KB_ID);
    list.unshift({id:NEW_KB_ID,name:S.name||defaultName(),desc:S.desc||'',icon:'doc',creator:GC.me(),sharedTo:[],createdAt:day,editTime:'刚刚',updateTime:day,docs:valid().length,views:0,tags:[],category:'all',kbBody:S.kbBody});
    sessionStorage.setItem('gc_kbs_new',JSON.stringify(list));
    sessionStorage.setItem('gc_kb_owner_'+NEW_KB_ID,GC.me());
  }catch(e){}
}
function handoff(status){
  if(MODE==='create'){ saveNewKb(); }
  else if(MODE!=='add') return;
  try{
    const key='kb-added-'+(MODE==='create'?NEW_KB_ID:KB_ID), batch=valid().map(f=>toDoc(f,status)), ids=batch.map(d=>d.id);
    const prev=JSON.parse(sessionStorage.getItem(key)||'[]').filter(d=>!ids.includes(d.id));
    sessionStorage.setItem(key, JSON.stringify(batch.concat(prev)));
  }catch(e){}
}
function startProcessing(){
  clearInterval(procTimer); S.progress={}; valid().forEach(f=>S.progress[f.id]=0); S.done=false; S.step=3; render();
  const t=Date.now(); valid().forEach(f=>f.docId='add-'+f.id+'-'+t);
  // 知识库名称默认取第一个文件名，可修改
  if(!S.nameEdited) S.name=defaultName();
  handoff('indexing');
  const base={text:9,image:7,av:3.2};
  const speed={}; valid().forEach((f,i)=>speed[f.id]=base[f.kind]*(0.8+((i*37)%10)/25));
  procTimer=setInterval(()=>{let all=true;
    for(const k in S.progress){S.progress[k]=Math.min(100,S.progress[k]+speed[k]); if(S.progress[k]<100) all=false;}
    if(all){S.done=true;clearInterval(procTimer);handoff('available');}
    if(S.step===3) render();},260);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'source': S.source=v; break;
    case 'emptyKb': toast('创建空知识库功能开发中'); return;
    case 'pick': $('#picker').click(); return;
    case 'mock':
      if(S.files.some(f=>MOCK_FILES.some(m=>m.id===f.id))){toast('示例文件已载入');return;}
      addFiles(MOCK_FILES.map(f=>{const c=JSON.parse(JSON.stringify(f));c.svg=f.svg;if(MODE==='add'&&ADD_MOCK_NAMES[f.id])c.name=ADD_MOCK_NAMES[f.id];return c;})); return;
    case 'remove': S.files=S.files.filter(f=>f.id!==v); break;
    case 'go': clearInterval(procTimer); S.step=+v; break;
    case 'tab': S.tab=v; break;
    case 'lang': S.lang=v; break;
    case 'indexMode': if(MODE==='create') S.indexMode=v; break;
    case 'toggle': S[v]=!S[v]; break;
    case 'segMode': S.segMode=v; break;
    case 'imgMode': S.imgMode=v; break;
    case 'process': startProcessing(); return;
    case 'finish': if(MODE==='create'){ saveNewKb(); location.href=GC.url('knowledge-base-detail.html?id='+encodeURIComponent(NEW_KB_ID)); return; } location.href=GC.url(DETAIL_URL); return;
    case 'restart': clearInterval(procTimer); Object.assign(S,{step:1,name:'',nameEdited:false,desc:'',files:[],progress:{},done:false,tab:null,autoKp:false}); break;
  }
  render();
});

function bindExtras(){
  const name=$('#kbName'); if(name){ name.oninput=()=>{ S.name=name.value; S.nameEdited=true; }; name.onblur=()=>{ if(!S.name.trim()){ S.name=defaultName(); S.nameEdited=false; name.value=S.name; toast('名称不能为空，已恢复默认名称'); } }; }
  const desc=$('#kbDesc'); if(desc) desc.oninput=()=>{S.desc=desc.value;};
  const hot=$('#hot'); if(hot) hot.oninput=()=>{S.hotwords=hot.value; const pos=hot.selectionStart; render(); const h=$('#hot'); h.focus(); h.setSelectionRange(pos,pos);};
  const em=$('#embedSel'); if(em) em.onchange=()=>{ S.embed=em.value; };
  const sep=$('#sepSel'); if(sep) sep.onchange=()=>{ S.sep=sep.value; render(); };
  const ml=$('#maxLen'); if(ml) ml.onchange=()=>{ S.maxLen=Math.min(2000,Math.max(50,parseInt(ml.value,10)||500)); render(); };
  const pk=$('#picker'); if(pk) pk.onchange=()=>addFiles([...pk.files].map(fromRealFile));
  const drop=$('#drop');
  if(drop){
    drop.ondragover=e=>{e.preventDefault(); if(!S.drag){S.drag=true; drop.classList.add('drag');}};
    drop.ondragleave=()=>{S.drag=false; drop.classList.remove('drag');};
    drop.ondrop=e=>{e.preventDefault(); S.drag=false; addFiles([...e.dataTransfer.files].map(fromRealFile));};
  }
}

if(MODE==='add'){
  document.title='添加文件｜专业图谱平台';
  $('#pageTitle').textContent='添加文件';
  $('#backLink').textContent='← '+KB_NAME; $('#backLink').href=DETAIL_URL;
}
render();
</script>
</body>
</html>
