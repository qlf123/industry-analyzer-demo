<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师档案</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
.ftabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:6px 10px;margin-bottom:14px}
.ftabs button{font:inherit;font-size:13.5px;padding:7px 12px;border:0;background:none;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent}
.ftabs button[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.ftabs button i{font-style:normal;font-size:11px;background:var(--rule-2);border-radius:9px;padding:0 6px;margin-left:4px}
.ftabs .sp{flex:1}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:linear-gradient(135deg,var(--brand-soft),var(--card));border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:14px}
@media(max-width:1000px){.hero{grid-template-columns:1fr}}
.hero .me{display:flex;align-items:center;gap:14px}
.hero .av{width:56px;height:56px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center;font-size:20px;color:var(--brand-ink);background:var(--card)}
.hero .me b{font-size:17px}
.hero .me div div{font-size:12px;color:var(--muted);margin-top:3px}
.kp{display:flex;gap:8px;flex-wrap:wrap}
.kp>div{background:var(--card);border-radius:10px;padding:8px 14px;text-align:center;min-width:86px}
.kp b{display:block;font-size:20px;color:var(--brand-ink);font-family:var(--mono)}
.kp span{font-size:11px;color:var(--muted)}
.hero .ai{grid-column:1/-1}
.atags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.dim5{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:1000px){.dim5{grid-template-columns:1fr}}
.dcard{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:14px 16px}
.dcard .dh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dcard .dh .nm{background:linear-gradient(90deg,#7f63d8,#a78bfa);color:#fff;font-size:13px;font-weight:600;padding:4px 12px;border-radius:8px}
.dcard .dh .sc{font-size:12px;color:var(--ink-2)}
.dcard .dh .sc b{font-size:22px;font-family:var(--mono);color:var(--ink);margin:0 3px}
.dcard .dh .sp{flex:1}
.ind{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px;margin-bottom:10px}
.ind .t{font-weight:600;margin-bottom:4px}
.ind .t.g{color:var(--good)} .ind .t.w{color:var(--warn-ink)}
.ind ul{margin:0;padding-left:16px;color:var(--ink-2);line-height:1.7}
.dsrc{font-size:11.5px;color:var(--muted);margin-top:8px}
.dsrc a{color:var(--brand-ink);margin-right:8px;text-decoration:none}
.radar5 svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.tstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(max-width:1000px){.tstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tstat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;border-top:3px solid var(--brand)}
.tstat .k{font-size:12px;color:var(--ink-2)}
.tstat .v{font-size:24px;font-weight:700;font-family:var(--mono)}
.tstat .s{font-size:11px;color:var(--muted)}
.plan .row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.plan .row span{color:var(--muted)}
</style>
</head>

      '<div class="kp"><div><b>' + total + '</b><span>总体评分</span></div><div><b style="font-size:16px;padding:3px 0">' + level + '</b><span>等级</span></div><div><b>' + beat + '%</b><span>超过全校教师</span></div><div><b>' + rank + '/' + all.length + '</b><span>全校参考排名</span></div><div><b style="color:' + (expiredCount() ? 'var(--crit)' : 'inherit') + '">' + expiredCount() + '</b><span>已过期材料</span></div></div>' +
      '<div class="ai"><div class="ai-box"><div class="atags">' + tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
      '<b>AI 分析</b>　' + esc(b.name) + ' ' + esc(TK.TERM) + '综合参考分 ' + total + ' 分，参考等级为「' + level + '」，超过全校 ' + beat + '% 的教师。「' + best.k + '」得分 ' + best.score + ' 分，' + (best.score > avg ? '高于全校均值 ' + avg + ' 分，表现相对较好' : '与全校均值 ' + avg + ' 分相比仍有差距') + '。' +
      (zero.length ? '「' + zero.map(function (d) { return d.k; }).join('」「') + '」暂无数据，建议补充对应档案材料。' : '各维度均有数据，建议持续积累。') + '</div></div></div>';
    h += '<div class="blk-t" style="font-size:14px">五维能力综合分析</div><div class="dim5"><div class="dcard"><div class="dh"><span class="nm">我的能力画像</span></div><div class="radar5">' + radar(ds) + '</div></div>' +
      ds.map(function (d) {
        var good = d.items.filter(function (x) { return x[2]; }), weak = d.items.filter(function (x) { return !x[2]; });
        return '<div class="dcard"><div class="dh"><span class="nm">' + d.k + '</span><span class="sc">总体评分<b>' + d.score + '</b>分</span><span class="sp"></span>' + (d.score > avg ? '<span class="tag g">↗ 高于全校均值 ' + Math.round((d.score - avg) * 100) / 100 + ' 分</span>' : '') + '</div>' +
          '<div class="ind"><div><div class="t g">🏆 优势指标</div><ul>' + (good.map(function (x) { return '<li>' + x[0] + '：' + x[1] + '</li>'; }).join('') || '<li>暂无优势指标</li>') + '</ul></div>' +
          '<div><div class="t w">📈 待提升指标</div><ul>' + (weak.map(function (x) { return '<li>' + x[0] + '：' + x[1] + '</li>'; }).join('') || '<li>暂无待提升指标</li>') + '</ul></div></div>' +
          '<div class="ai-box"><b>AI 分析</b>　' + (d.score ? '当前得分 ' + d.score + ' 分，' + (d.score > avg ? '高于全校均值 ' + avg + ' 分。' : '低于全校均值 ' + avg + ' 分。') + (weak.length ? '可优先补充：' + weak.map(function (x) { return x[0]; }).join('、') + '。' : '继续保持。') : '暂无数据，补充' + weak.map(function (x) { return x[0]; }).join('、') + '后生成分析。') + '</div>' +
          '<div class="dsrc">数据来源：' + d.src.map(function (s) { return s[1].charAt(0) === '#' ? '<a href="#" data-goto="' + s[1].slice(1) + '">' + s[0] + '</a>' : '<a href="' + UI.link(s[1].split('#')[0]) + (s[1].indexOf('#') > 0 ? '#' + s[1].split('#')[1] : '') + '">' + s[0] + '</a>'; }).join('') + '</div></div>';
      }).join('') + '</div>';
    return h;
  }

  /* ── 列表 / 特殊页 ── */
  var curSec = 'portrait', curSub = {}, Q = {}, FV = {};
  function viewBase() {
    var b = S.base;
    return '<div class="card pad"><div class="blk-t" style="font-size:15px"><span class="av" style="width:42px;height:42px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-ink)">' + esc(b.name.slice(0, 1)) + '</span>' + esc(b.name) + ' <span class="tag g">在职</span><span class="sp"></span><button class="btn" data-editbase style="height:32px">编辑基本信息</button></div>' +
      '<div class="blk-t">基础信息 <span style="font-size:11.5px;color:var(--muted);font-weight:400">共 ' + (BASE_F.length - 1) + ' 项</span></div><div class="kvg">' +
      BASE_F.filter(function (f) { return f.k !== 'intro'; }).map(function (f) { return '<div><div class="k">' + f.label + '</div><div class="v">' + esc(b[f.k] || '—') + '</div></div>'; }).join('') + '</div>' +
      '<div class="blk-t" style="margin-top:14px">个人简介</div><div class="ai-box" style="background:var(--card-2)">' + esc(b.intro || '暂无个人简介') + '</div></div>';
  }
  function viewPlan() {
    var p = S.plan;
    return '<div class="card pad plan"><div class="blk-t">当前发展阶段：' + esc(p.stage || '—') + '<span class="sp"></span><button class="btn-s" data-editplan>✎ 编辑</button></div>' +
      [['规划周期', p.cycle], ['发展方向', p.direction], ['所需支持 / 资源', p.support], ['更新时间', p.updatedAt]].map(function (x) { return '<div class="row"><span>' + x[0] + '</span><div>' + esc(x[1] || '—') + '</div></div>'; }).join('') + '</div>';
  }
  function viewList(sec, sub) {
    var rows = list(sec.k, sub.k), key = sec.k + '.' + sub.k, q = Q[key] || '', fv = FV[key] || '';
    var fk = sub.filter && sub.filter[0], fopts = sub.filter ? (sub.filter[2] || (opts(sub.fields.find(function (f) { return f.k === fk; })).options || [])) : [];
    var shown = rows.filter(function (x) { return (!q || String(x.name || x.unit || x.school || '').indexOf(q) >= 0) && (!fv || (fk === '@status' ? certStatus(x) : x[fk]) === fv); });
    var h = '<div class="card filters"><input class="inp search" data-q="' + key + '" placeholder="搜索' + esc(sub.cols[0][1]) + '" value="' + esc(q) + '">' +
      (sub.filter ? '<label>' + sub.filter[1] + '<select class="sel" data-fv="' + key + '"><option value="">全部</option>' + fopts.map(function (o) { return '<option' + (o === fv ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>' : '') +
      '<span style="flex:1"></span><button class="btn" data-add style="height:32px">＋ 新增</button></div>';
    h += '<div class="card pad"><div class="blk-t">' + sub.label + '<span style="font-size:11.5px;color:var(--muted);font-weight:400">共 ' + shown.length + ' 条</span></div>' +
      (shown.length ? '<table class="tbl2"><thead><tr>' + sub.cols.map(function (c) { return '<th>' + c[1] + '</th>'; }).join('') + '<th>附件</th><th>操作</th></tr></thead><tbody>' + shown.map(function (x) {
        return '<tr>' + sub.cols.map(function (c, i) { return '<td' + (i ? '' : ' style="font-weight:500"') + '>' + cell(x, c[0]) + '</td>'; }).join('') + '<td>' + ((x.files || []).length || '—') + '</td>' +
          '<td style="white-space:nowrap"><button class="lk" data-view="' + x.id + '">查看</button>　<button class="lk" data-edit="' + x.id + '">编辑</button>　<button class="lk del" data-del="' + x.id + '">删除</button></td></tr>';
      }).join('') + '</tbody></table>' : '<div class="empty2">暂无' + sub.label + '，点「新增」添加</div>') + '</div>';
    return h;
  }
  function teachStats() {
    var fb = []; S.courses.forEach(function (c) { fb = fb.concat(c.feedbacks); });
    var avg = fb.length ? fb.reduce(function (s, f) { return s + (f.scores['讲授内容'] + f.scores['教学方式'] + f.scores['互动体验'] + f.scores['学习收获']) / 4; }, 0) / fb.length : 0;
    var st = function (k, v, s, col, href) { return '<a class="tstat" style="border-top-color:' + col + ';text-decoration:none;color:inherit"' + (href ? ' href="' + href + '"' : '') + '><div class="k">' + k + (href ? ' ›' : '') + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></a>'; };
    return '<div class="tstats">' + st('备课记录', S.resources.length, '来自备课中心', '#3b82f6', UI.link('teacher-tasks.html')) + st('课程发布记录', S.courses.filter(function (c) { return c.publish; }).length, '来自任务中心', '#7f63d8', UI.link('teacher-tasks.html')) +
      st('课程反馈均分', avg.toFixed(2), '来自学生反馈', '#ec4899', UI.link('teacher-growth.html') + '#feedback') + st('课程开发文档', list('teach', 'doc').length, '手动维护', '#f59e0b') + st('教学改革项目', list('teach', 'reform').length, '手动维护', '#10b981') + '</div>';
  }
  function render() {
    var h = '<div class="ftabs"><button data-sec="portrait" aria-selected="' + (curSec === 'portrait') + '">教师画像</button>' +
      SEC.map(function (s) { return '<button data-sec="' + s.k + '" aria-selected="' + (curSec === s.k) + '">' + s.label + '<i>' + secCount(s) + '</i></button>'; }).join('') +
      '<span class="sp"></span><label style="font-size:12.5px;color:var(--ink-2)">学期 <select class="sel">' + S.terms.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></label></div>';
    if (curSec === 'portrait') h += viewPortrait();
    else {
      var sec = SEC.find(function (s) { return s.k === curSec; }), sub = sec.subs.find(function (x) { return x.k === curSub[sec.k]; }) || sec.subs[0];
      curSub[sec.k] = sub.k;
      if (sec.stats) h += teachStats();
      h += '<div class="subtabs">' + sec.subs.map(function (x) { return '<button data-sub="' + x.k + '" aria-pressed="' + (x === sub) + '">' + x.label + '</button>'; }).join('') + '</div>';
      h += sub.special === 'base' ? viewBase() : sub.special === 'plan' ? viewPlan() : viewList(sec, sub);
    }
    document.getElementById('body').innerHTML = h;
  }
  function curPair() { var sec = SEC.find(function (s) { return s.k === curSec; }); return { sec: sec, sub: sec.subs.find(function (x) { return x.k === curSub[sec.k]; }) }; }

  /* ── 表单抽屉 ── */
  function formDrawer(title, fields, v, onSave) {
    var fs = fields.map(opts);
    var d = TK.drawer({ title: title, width: 680, body: TK.formHTML(fs, v || {}), foot: '<button class="btn-s" data-c>取消</button><button class="btn" data-o style="height:32px">保存</button>' });
    TK.bindForm(d.body);
    d.foot.querySelector('[data-c]').onclick = d.close;
    d.foot.querySelector('[data-o]').onclick = function () {
      var r = TK.readForm(d.body, fs);
      if (r.bad.length) { TK.toast('请填写：' + r.bad.join('、')); return; }
      if (r.v.start && r.v.end && r.v.end < r.v.start) { TK.toast('结束时间不能早于开始时间'); return; }
      onSave(r.v); save(); d.close(); render(); TK.toast('已保存');
    };
  }
  function viewDrawer(sub, x) {
    var d = TK.drawer({ title: sub.label + '详情', width: 620, foot: '<button class="btn-s" data-c>关闭</button><button class="btn" data-e style="height:32px">编辑</button>' });
    d.body.innerHTML = '<div class="blk"><div class="kvg" style="grid-template-columns:1fr 1fr">' + sub.fields.filter(function (f) { return f.type !== 'files' && f.type !== 'textarea'; }).map(function (f) { return '<div><div class="k">' + f.label + '</div><div class="v">' + cell(x, f.k) + '</div></div>'; }).join('') + '</div></div>' +
      sub.fields.filter(function (f) { return f.type === 'textarea'; }).map(function (f) { return '<div class="blk"><div class="blk-t">' + f.label + '</div><div style="font-size:12.5px;color:var(--ink-2);white-space:pre-wrap">' + esc(x[f.k] || '—') + '</div></div>'; }).join('') +
      '<div class="blk"><div class="blk-t">附件材料</div>' + ((x.files || []).map(function (f) { return '<div class="fitem"><span class="fi" style="background:#7f63d8">' + esc(f.name.split('.').pop().slice(0, 3).toUpperCase()) + '</span><span class="fn">' + esc(f.name) + '<small>' + esc(f.size) + '</small></span><button class="lk" data-pv>预览</button></div>'; }).join('') || '<div style="font-size:12.5px;color:var(--muted)">未上传</div>') + '</div>';
    d.foot.querySelector('[data-c]').onclick = d.close;
    d.foot.querySelector('[data-e]').onclick = function () { d.close(); editRow(x.id); };
    d.body.addEventListener('click', function (e) { if (e.target.closest('[data-pv]')) TK.toast('预览文件'); });
  }
  function editRow(id) {
    var p = curPair(), rows = list(p.sec.k, p.sub.k), x = rows.find(function (r) { return r.id === id; });
    formDrawer('编辑' + p.sub.label, p.sub.fields, x, function (v) { Object.assign(x, v); });
  }

  /* ── 事件 ── */
  var body = document.getElementById('body');
  body.addEventListener('click', function (e) {
    var t, p;
    if ((t = e.target.closest('[data-sec]'))) { curSec = t.getAttribute('data-sec'); render(); return; }
    if ((t = e.target.closest('[data-sub]'))) { curSub[curSec] = t.getAttribute('data-sub'); render(); return; }
    if ((t = e.target.closest('[data-goto]'))) { e.preventDefault(); curSec = t.getAttribute('data-goto'); render(); return; }
    if (e.target.closest('[data-editbase]')) { formDrawer('编辑基本信息', BASE_F, S.base, function (v) { Object.assign(S.base, v); }); return; }
    if (e.target.closest('[data-editplan]')) { formDrawer('编辑专业发展规划', PLAN_F, S.plan, function (v) { Object.assign(S.plan, v, { updatedAt: TK.fmt(new Date()) }); }); return; }
    if (e.target.closest('[data-add]')) { p = curPair(); formDrawer('新增' + p.sub.label, p.sub.fields, {}, function (v) { list(p.sec.k, p.sub.k).unshift(Object.assign({ id: TK.uid('A') }, v)); }); return; }
    if ((t = e.target.closest('[data-edit]'))) { editRow(t.getAttribute('data-edit')); return; }
    if ((t = e.target.closest('[data-view]'))) { p = curPair(); viewDrawer(p.sub, list(p.sec.k, p.sub.k).find(function (r) { return r.id === t.getAttribute('data-view'); })); return; }
    if ((t = e.target.closest('[data-del]'))) {
      p = curPair(); var rows = list(p.sec.k, p.sub.k), x = rows.find(function (r) { return r.id === t.getAttribute('data-del'); });
      TK.confirm('确定删除「' + (x.name || x.unit || x.school || '') + '」吗？', function () { rows.splice(rows.indexOf(x), 1); save(); render(); TK.toast('已删除'); });
    }
  });
  body.addEventListener('input', function (e) { var k = e.target.getAttribute('data-q'); if (!k) return; Q[k] = e.target.value.trim(); clearTimeout(body._t); body._t = setTimeout(function () { render(); var s = body.querySelector('.search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250); });
  body.addEventListener('change', function (e) { var k = e.target.getAttribute('data-fv'); if (k) { FV[k] = e.target.value; render(); } });

  UI.boot({ portal: 'teacher', active: 'profile' });
  render();
})();
</script>
</body>
</html>
