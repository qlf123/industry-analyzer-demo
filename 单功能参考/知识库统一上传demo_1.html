<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · 统一上传 Demo</title>
<style>
:root{--pri:#155EEF;--pri-d:#004EEB;--pri-l:#EFF4FF;--pri-ll:#F5F8FF;--t1:#101828;--t2:#344054;--t3:#475467;--t4:#667085;--bd:#EAECF0;--bd2:#D0D5DD;--bg2:#F9FAFB;
  --c-text:#444CE7;--c-img:#0E9384;--c-av:#DC6803}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--t1);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 64px}
h2,h3{margin:0}
.h2{font-size:17px;font-weight:700;color:var(--t2)}
.h3{font-size:15px;font-weight:700;color:var(--t2)}
.muted{font-size:13px;color:var(--t4)}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
.wrapflex{flex-wrap:wrap}
.hr{height:1px;background:var(--bd)}
ul{list-style:none;margin:0;padding:0}
/* stepper */
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:36px}
.step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t4);white-space:nowrap}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.step.on{color:var(--pri);font-weight:600}.step.on .n{background:var(--pri);border-color:var(--pri);color:#fff}
.step.done{color:var(--t2)}.step.done .n{background:var(--pri-l);border-color:var(--pri-l);color:var(--pri)}
.step-line{width:40px;height:1px;background:var(--bd2)}
/* source */
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.src{display:flex;align-items:center;gap:12px;min-height:84px;padding:0 18px;border:1px solid var(--bd);border-radius:12px;background:var(--bg2);font-size:16px;font-weight:600;color:var(--t2);text-align:left;position:relative}
.src:hover{border-color:var(--bd2);background:#F2F4F7}
.src.on{border:1.5px solid var(--pri);background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.src small{display:block;font-size:12px;font-weight:400;color:var(--t4);margin-top:2px}
.ico{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:10px;background:#fff}
.ico.sm{width:40px;height:40px}
.new{position:absolute;top:-9px;right:12px;font-size:11px;font-weight:600;color:#fff;background:var(--pri);border-radius:6px;padding:1px 7px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--bd2);background:#fff;font-size:15px;font-weight:600;color:var(--t2)}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.pri:disabled{background:#D1E0FF;border-color:#D1E0FF}
.mini{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.link{border:0;background:none;padding:0;color:var(--pri);font-size:inherit;font-weight:500}
.pill{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--bd2);background:#fff;font-size:14px;color:var(--t2)}
.pill.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:600}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:10px;border:1px solid var(--bd);background:#fff}
.opt.on{border:1.5px solid var(--pri);background:var(--pri-ll)}
.tg{width:44px;height:26px;border-radius:13px;border:0;background:var(--bd2);position:relative;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:left .15s}
.tg.on{background:var(--pri)}.tg.on::after{left:21px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:#F2F4F7;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.done{background:#ECFDF3;color:#067647}
.chip.act{background:var(--pri-l);color:var(--pri-d);font-weight:600}
.chip.warn{background:#FEF0C7;color:#93370D}
.k-text{background:#EEF4FF;color:#3538CD}.k-image{background:#F0FDF9;color:#107569}.k-av{background:#FEF6EE;color:#B93815}
.sp{font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;white-space:nowrap}
.sp1{background:var(--pri-l);color:var(--pri-d)}.sp2{background:#FEF0C7;color:#93370D}.sp3{background:#F4F3FF;color:#5925DC}
/* upload */
.drop{border:1px dashed #B2CCFF;border-radius:12px;background:var(--pri-ll);padding:24px;display:flex;flex-direction:column;gap:10px;transition:all .15s}
.drop.drag{border-color:var(--pri);background:var(--pri-l)}
.drop p{margin:0;font-size:14px;color:var(--t4);line-height:1.8}
.drop p b{color:var(--t2);font-weight:600}
.frow{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;border-radius:10px;border:1px solid var(--bd);background:#fff}
.frow.err{border-color:#FDA29B;background:#FEF3F2}
.fname{font-size:14px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:8px}
.x:hover{background:#F2F4F7}
/* step2 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tab{min-height:44px;padding:0 16px;border:0;background:none;font-size:15px;color:var(--t4);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.tab .cnt{font-size:12px;background:#F2F4F7;color:var(--t3);border-radius:10px;padding:0 7px}
.tab.on .cnt{background:var(--pri-l);color:var(--pri-d)}
.card{border:1px solid var(--bd);border-radius:12px}
.set{display:flex;align-items:center;gap:16px;padding:14px 16px}
.set+.set{border-top:1px solid var(--bd)}
.set b{font-size:14px;font-weight:600;color:var(--t1)}
.field{min-height:40px;border:1px solid var(--bd2);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;color:var(--t1);background:#fff}
textarea{font-family:inherit;border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--t1);resize:vertical;width:100%}
.side{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:14px;background:var(--bg2);border:1px solid var(--bd);position:sticky;top:20px}
.pv{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:#fff;border:1px solid var(--bd)}
.pv p{margin:0;font-size:14px;line-height:1.75;color:var(--t2);white-space:pre-line}
.pv .lbl{font-size:12px;font-weight:600;color:var(--t4)}
mark.hw{background:#FEF0C7;color:inherit;border-radius:3px;padding:0 2px}
.thumb{border-radius:8px;overflow:hidden;border:1px solid var(--bd);line-height:0}
.thumb svg{width:100%;height:auto;display:block}
.fixed{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bg2);font-size:13px;color:var(--t3);line-height:1.6}
/* step3 */
.proc{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--bd);border-radius:12px}
.track{height:6px;border-radius:3px;background:#F2F4F7;overflow:hidden}
.track>div{height:100%;background:var(--pri);transition:width .25s}
.track>div.ok{background:#17B26A}
/* step4 */
.ftab{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:none;color:var(--t2)}
.ftab:hover{background:var(--bg2)}
.ftab.on{background:var(--pri-l);border-color:#D1E0FF}
.navh{font-size:12px;font-weight:600;color:var(--t4);padding:10px 12px 4px}
.player{border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.video{position:relative;aspect-ratio:16/7;background:#101828}
.subtitle{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:86%;padding:6px 12px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1.6;text-align:center}
.wave{height:120px;padding:0 20px;background:var(--bg2);display:flex;align-items:center;gap:3px;overflow:hidden;cursor:pointer}
.bar{width:4px;border-radius:2px;background:var(--bd2);flex:none}
.bar.p{background:var(--pri)}
.ctrl{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.seek{flex:1;height:6px;border-radius:3px;background:var(--bd);overflow:hidden;cursor:pointer}
.seek>div{height:100%;background:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:10px;background:var(--bg2)}
.stat b{font-size:18px;color:var(--t1)}
.hit{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;border:1px solid #D1E0FF;background:var(--pri-ll)}
.hit input{flex:1 1 260px;min-height:44px;border:1px solid var(--bd2);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit}
.hitres{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px;border-radius:10px;background:#fff;border:1px solid var(--bd)}
.hitres .tn{width:96px;flex:none}
.seg{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:14px;line-height:1.7;color:var(--t2)}
.seg.click{cursor:pointer}
.seg.click:hover{border-color:#B2CCFF}
.seg.on{border:1.5px solid var(--pri);background:var(--pri-ll)}
.tx{white-space:pre-line}
.tx[contenteditable="true"]{outline:1px dashed var(--pri);border-radius:4px;padding:2px 4px;background:#fff}
.imgview{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--bg2);line-height:0}
.imgview svg{width:100%;height:auto;max-height:420px;display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#101828;color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   MOCK 数据（全部本地，可直接改）

const IMG_DESK = `<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="酒店前台工作区照片">
  <rect width="480" height="320" fill="#EFE7DC"/><rect y="250" width="480" height="70" fill="#D8CBB8"/>
  <rect x="150" y="34" width="180" height="46" rx="6" fill="#3B2F25"/>

  <text x="240" y="73" text-anchor="middle" font-size="12" fill="#E9D8B4" font-family="sans-serif">前台接待</text>

  <rect x="112" y="194" width="16" height="16" fill="#374151"/><rect x="86" y="206" width="70" height="10" rx="2" fill="#4B5563"/>
  <rect x="300" y="168" width="54" height="40" rx="4" fill="#E5E7EB" stroke="#9CA3AF"/><rect x="310" y="160" width="34" height="10" rx="2" fill="#CBD5E1"/>
  <rect x="372" y="176" width="34" height="34" rx="5" fill="#111827"/><rect x="378" y="182" width="22" height="10" fill="#34D399"/>
  <rect x="30" y="214" width="420" height="16" rx="3" fill="#C9A27C"/><rect x="40" y="230" width="400" height="70" fill="#8B6B4A"/>
  </svg>`;

const MOCK_FILES = [
  /* ---- 文本 ---- */
  { id:'t1', kind:'text', name:'前厅服务规范.docx', size:'1.2 MB', ext:'docx',
    segs:[
      {t:'第一章 总则：前厅部是酒店对客服务的第一窗口，员工须统一着装、佩戴工牌，站立服务，主动问候。'},
      {t:'第二章 入住登记：核验有效证件，确认预订信息与房型、房价、离店日期，收取押金后制作房卡并告知早餐时间。'},
      {t:'第三章 提前入住与延迟退房：提前入住视当日可售房态安排；延迟退房至 14:00 不另收费，14:00–18:00 加收半日房费，18:00 后按全日房费计。'},
      {t:'第四章 交接班：每班结束前核对房态、备用金和未完成事项，填写交接班记录本并双方签字。'}
    ]},
  { id:'t2', kind:'text', name:'夜审操作手册（扫描件）.pdf', size:'8.6 MB', ext:'pdf', scanned:true,
    segs:[
      {t:'夜审时间一般为每日 0:00 至 3:00，夜审员需核对当日所有入住、退房及在住房间的房价与账务。'},
      {t:'完成核对后执行日结，生成营业日报，并将系统营业日期滚动至次日。'}
    ]},
  /* ---- 图片 ---- */
  { id:'i1', kind:'image', name:'房态表板书.jpg', size:'2.4 MB', ext:'jpg', svg:IMG_BOARD,
    ocr:'房态表（8F）\n801 VC 空房已清洁\n802 OC 住客房\n803 VD 空房未清洁\n804 OOO 维修房\n805 VC 空房已清洁\n备注：VD 清洁完 → 客房部通知前台改 VC',
    desc:'白板上手写的 8 楼房态表，按房号列出 5 个房间的房态代码与含义，底部有一条红色交接备注，说明 VD 房清洁完成后的改态流程。' },
  { id:'i2', kind:'image', name:'前台工作区照片.jpg', size:'3.1 MB', ext:'jpg', svg:IMG_DESK,
    ocr:'RECEPTION\n前台接待',
    desc:'酒店前台工作区。台面左侧是电脑显示器和键盘，右侧是房卡制卡机和 POS 机，后方墙上挂着「前台接待」标识，台面整洁，画面中没有客人。' },
  /* ---- 音视频 ---- */
  { id:'a', kind:'av', media:'video', name:'前厅接待实训课录像.mp4', size:'162.4 MB', ext:'mp4', sec:1100,
    speakers:{1:'说话人 1',2:'说话人 2',3:'说话人 3'},
    segs:[
      [0,156,1,'同学们好，今天这节实训课我们练习前厅散客入住登记的完整流程。先回顾上节课讲的五个环节：问候、确认预订、核验证件、收取押金、发放房卡。','嗯，同学们好，那个今天这节实训课我们练习前厅散客入住登记的完整流程。先回顾一下啊上节课讲的五个环节：问候、确认预订、核验证件、收取押金、发放房卡。'],
      [156,370,1,'核验证件这一步要同时核对系统里的预订姓名和证件姓名，不一致时先问清楚是不是代订，再按酒店规定处理。','那个核验证件这一步呢，要同时核对系统里的预订姓名和证件姓名，不一致时先问清楚是不是代订，再按酒店规定处理。'],
      [370,522,2,'老师，如果客人是通过 OTA 平台预订的，押金也要在前台另外收吗？','呃老师，如果客人是通过 OTA 平台预订的，押金也要在前台另外收吗？'],
      [522,725,1,'要看预订类型。预付房型通常只收杂费押金，现付房型收房费加杂费。另外常遇到客人要求提前入住，先查当前可售房态，有已清洁的同类型房就可以安排，没有的话请客人寄存行李，并告知预计可入住时间。'],
      [725,930,3,'我来演示一遍。您好，欢迎光临，请问有预订吗？好的，麻烦出示一下您的身份证，我为您办理入住登记。'],
      [930,1100,1,'刚才的演示流程是对的，有两个细节：递还证件要双手，并且要复述房号和早餐时间。']
    ]},
  { id:'b', kind:'av', media:'audio', name:'导游讲解示范_故宫中轴线.m4a', size:'38.6 MB', ext:'m4a', sec:960,
    speakers:{1:'说话人 1'},
    segs:[
      [0,200,1,'各位游客朋友，大家好。我们现在站在午门前，午门是紫禁城的正门，平面呈凹字形，俗称五凤楼。'],
      [200,465,1,'穿过午门，眼前这条金水河自西向东流过，河上五座汉白玉石桥就是内金水桥，中间一座是皇帝专用的御路桥。'],
      [465,730,1,'接下来看到的是太和殿，也就是俗称的金銮殿，是紫禁城中规格最高的建筑，明清两代的重大典礼都在这里举行。'],
      [730,960,1,'讲解时要注意节奏，每个点位控制在三到五分钟，并提醒游客注意台阶和人流。']
    ]},
  { id:'c', kind:'av', media:'audio', name:'企业师傅访谈-酒店前台.mp3', size:'21.7 MB', ext:'mp3', sec:1125,
    speakers:{1:'说话人 1',2:'说话人 2'},
    segs:[
      [0,110,1,'王经理您好，想请您谈谈新员工到前台岗位后，最常见的问题是什么？'],
      [110,390,2,'最常见的是房态不熟。新人上岗前两周，我们要求每天交接班时手工核对一次房态表，熟了以后系统操作才不容易出错。'],
      [390,615,2,'第二是处理投诉时急于解释。我们教的是先倾听、再致歉、最后给方案，而且方案要给客人选择。'],
      [615,820,1,'那您觉得学校在实训课里应该加强哪方面？'],
      [820,1125,2,'多练夜审和交接班。学校实训一般练入住退房比较多，夜审很少涉及，但上岗后每个人都要轮。']
    ]},
  /* ---- 超限示例 ---- */
  { id:'d', kind:'av', media:'video', name:'研学活动全程记录.mov', size:'1.8 GB', ext:'mov', sec:13330, error:'时长超过 3 小时，无法导入', segs:[], speakers:{} }
];

const KB_NAME = '旅游管理实训素材';
const EXT = {

  image:['jpg','jpeg','png','webp','bmp'],

};
const LIMIT = { perBatch:20, text:100*1024**2, image:20*1024**2, av:2*1024**3, avSec:3*3600 };

let procTimer=null, playTimer=null, uid=100;

/* ======================================================================

   ====================================================================== */
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(s)=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>(n<10?'0':'')+n;return h?h+':'+p(m)+':'+p(x):p(m)+':'+p(x)};
const valid=()=>S.files.filter(f=>!f.error);
const ofKind=(k)=>valid().filter(f=>f.kind===k);
const fileById=(id)=>S.files.find(f=>f.id===id);
const spName=(f,n)=>S.renames[f.id+'-'+n]||f.speakers[n]||('说话人 '+n);
const avText=(s)=>S.clean?s[3]:(s[4]||s[3]);
const toast=(t)=>{const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)};
const kindOf=(ext)=>Object.keys(EXT).find(k=>EXT[k].includes(ext));
const imgParts=(f)=>({ocr:S.imgMode!=='desc'?f.ocr:'', desc:S.imgMode!=='ocr'?f.desc:''});
const segCount=(f)=>f.kind==='image'?1:(f.kind==='text'&&f.scanned&&!S.ocrScan?0:f.segs.length);
const charCount=(f)=>{
  if(f.kind==='image'){const p=imgParts(f);return (p.ocr+p.desc).length;}
  if(f.kind==='text') return segCount(f)?f.segs.reduce((a,s)=>a+s.t.length,0):0;
  return f.segs.reduce((a,s)=>a+s[3].length,0);
};

const I={
  video:(c='#DC6803',w=20)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="13" height="14" rx="2.5"/><path d="M15.5 10l5-3v10l-5-3"/></svg>`,
  audio:(c='#DC6803',w=20)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>`,
  doc:(c='#444CE7',w=20)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><path d="M6 2.5h8l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4A1.5 1.5 0 0 1 6.5 2.5z"/><path d="M14 2.5V8h5M8.5 13h7M8.5 16.5h5"/></svg>`,
  image:(c='#0E9384',w=20)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>`,
  upload:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#155EEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9"/><path d="M12 12v8M9 15l3-3 3 3"/></svg>',
  cloud:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9"/><path d="M12 12v8M9 15l3-3 3 3"/></svg>',

  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  arrow:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  info:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  notion:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4.5l11-1 5 3.5v13l-12 1-4-4z"/><path d="M8 8.5v9M8 8.5l8 9v-9.5"/></svg>',
  web:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#155EEF" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  folder:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#155EEF" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>'
};
const fileIcon=(f,w=20)=>f.kind==='text'?I.doc('#444CE7',w):f.kind==='image'?I.image('#0E9384',w):(f.media==='video'?I.video('#DC6803',w):I.audio('#DC6803',w));
const kindChip=(k)=>`<span class="chip k-${k}">${KIND_LABEL[k]}</span>`;

/* ======================================================================
   STEP 1 选择数据源 + 统一上传
   ====================================================================== */
function stepper(){
  const c=n=>S.step===n?'step on':(S.step>n?'step done':'step');
  return `<nav class="steps" aria-label="导入步骤">
    <div class="${c(1)}"><span class="n">1</span>选择数据源</div><div class="step-line"></div>
    <div class="${c(2)}"><span class="n">2</span>解析与分段</div><div class="step-line"></div>
    <div class="${c(3)}"><span class="n">3</span>处理并完成</div></nav>`;
}

function viewStep1(){
  const src=(k,ico,label,sub,isNew)=>`<button class="src ${S.source===k?'on':''}" data-act="source" data-v="${k}">${isNew?'<span class="new">新</span>':''}<span class="ico">${ico}</span><span>${label}${sub?`<small>${sub}</small>`:''}</span></button>`;
  let body='';
  if(S.source==='local'){
    const counts=['text','image','av'].map(k=>({k,n:S.files.filter(f=>f.kind===k).length})).filter(x=>x.n);
    const rows=S.files.map(f=>`<li class="frow ${f.error?'err':''}">
        <span class="ico sm">${fileIcon(f)}</span>
        <div class="col" style="flex:1;min-width:0;gap:2px"><span class="fname">${esc(f.name)}</span>
          <span class="row g6 wrapflex">${kindChip(f.kind)}<span class="muted">${f.size}${f.kind==='av'?' · 时长 '+fmt(f.sec):''}${f.scanned?' · 扫描件':''}</span></span></div>
        <span style="font-size:13px;white-space:nowrap;${f.error?'font-weight:600;color:#B42318':'color:var(--t3)'}">${f.error||'待处理'}</span>
        <button class="x" data-act="remove" data-v="${f.id}" aria-label="移除文件">${I.x}</button></li>`).join('');
    const errCount=S.files.filter(f=>f.error).length;
    body=`<div class="col g12"><h3 class="h2">上传本地文件</h3>
      <div class="drop ${S.drag?'drag':''}" id="drop">
        <div class="row g10" style="justify-content:center;font-size:16px;color:var(--t2)">${I.cloud}
          <span>拖拽文件或文件夹至此，或者 <button class="link" data-act="pick">选择文件</button></span></div>
        <p><b>文本</b>：${EXT.text.map(x=>x.toUpperCase()).join('、')}，单个不超过 100 MB<br>
           <b>图片</b>：${EXT.image.map(x=>x.toUpperCase()).join('、')}，单张不超过 20 MB<br>
           <b>音视频</b>：${EXT.av.map(x=>x.toUpperCase()).join('、')}，单个不超过 2 GB、时长不超过 3 小时<br>
           每批最多 ${LIMIT.perBatch} 个文件，系统按文件类型自动识别并分别处理。</p>
        <div class="row g8 wrapflex"><span class="muted">没有素材？</span><button class="btn mini" data-act="mock">载入示例文件（文本 2 · 图片 2 · 音视频 3 · 超限 1）</button></div>
      </div>
      ${S.files.length?`<div class="row g8 wrapflex"><span class="muted">已识别：</span>${counts.map(c=>`<span class="chip k-${c.k}">${KIND_LABEL[c.k]} ${c.n}</span>`).join('')}</div><ul class="col g8">${rows}</ul>`:''}
      ${errCount?`<p class="muted" style="margin:0;color:#B42318">有 ${errCount} 个文件不符合要求，移除后才能继续。</p>`:''}
      <input type="file" id="picker" multiple accept="${[...EXT.text,...EXT.image,...EXT.av].map(x=>'.'+x).join(',')}" hidden></div>`;
  } else {
    body=`<div class="card" style="padding:24px;font-size:14px;color:var(--t4)">沿用现有同步流程，本 demo 不展开。</div>`;

    <div><button class="btn">选择知识体</button></div>
    ${body}
    <div class="row" style="justify-content:flex-end"><button class="btn pri" style="min-width:160px" data-act="go" data-v="2" ${canNext?'':'disabled'}>下一步 ${I.arrow}</button></div>
    <div class="hr"></div>
    <div><button class="link row g8" style="font-size:16px;min-height:44px">${I.folder}创建一个空知识库</button></div>
  </section>`;
}

/* ======================================================================
   STEP 2 按类型分组设置
   ====================================================================== */
const pill=(act,k,label,cur)=>`<button class="pill ${String(cur)===String(k)?'on':''}" data-act="${act}" data-v="${k}">${label}</button>`;
const tg=(k,label,desc)=>`<div class="set"><div class="col" style="flex:1;gap:2px"><b>${label}</b><span class="muted">${desc}</span></div>
   <button class="tg ${S[k]?'on':''}" data-act="toggle" data-v="${k}" aria-label="${label}" aria-pressed="${S[k]}"></button></div>`;
function hl(t){
  const words=S.hotwords.split(/[，,、\s]+/).map(w=>w.trim()).filter(Boolean);
  let h=esc(t);
  words.forEach(w=>{const e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');h=h.replace(new RegExp(e,'g'),`<mark class="hw">${esc(w)}</mark>`)});
  return h;
}

function settingsText(){
  const scanned=ofKind('text').some(f=>f.scanned);
  return `<div class="col g12"><h3 class="h3">分段规则</h3>
      <div class="card">
        <div class="set"><div class="col" style="flex:1;gap:2px"><b>分段标识符</b><span class="muted">按该标识切分文本</span></div><input class="field" style="width:120px" value="${esc(S.sep)}" aria-label="分段标识符" readonly></div>
        <div class="set"><div class="col" style="flex:1;gap:2px"><b>分段最大长度</b><span class="muted">单位 tokens</span></div><input class="field" style="width:120px" value="${S.maxLen}" aria-label="分段最大长度" readonly></div>
      </div><p class="muted" style="margin:0">文本的分段、清洗、索引设置沿用现有文本导入，此处只示意。</p></div>
    <div class="col g12"><h3 class="h3">扫描件处理</h3>
      <div class="card">${tg('ocrScan','无文字层页面自动识别文字（OCR）','扫描版 PDF、拍照转成的 PDF 没有可复制的文字，开启后自动识别；关闭则跳过这些页面')}</div>
      ${scanned?`<p class="muted" style="margin:0">本批有 ${ofKind('text').filter(f=>f.scanned).length} 个扫描件。</p>`:''}</div>`;
}
function previewText(){
  const f=ofKind('text').find(x=>x.scanned)||ofKind('text')[0], g=ofKind('text')[0];
  const a=g.segs.slice(0,2).map((s,i)=>pvCard(g.name,i+1,s.t,'')).join('');
  let b='';
  if(f&&f.scanned){
    b=S.ocrScan?pvCard(f.name,1,f.segs[0].t,'<span class="chip act">OCR 识别</span>')
      :`<div class="pv"><span class="lbl">${esc(f.name)}</span><p style="color:#B42318">该文件没有文字层，关闭 OCR 后将被跳过，不生成分段。</p></div>`;
  }
  return a+b;
}
function pvCard(name,no,text,extra){
  return `<div class="pv"><div class="row g8 wrapflex"><span class="lbl">${esc(name)} · #${no}</span>${extra}<span class="muted" style="margin-left:auto;font-size:12px">${text.length} 字</span></div><p>${esc(text)}</p></div>`;
}

function settingsImage(){
  const modes=[['both','识别文字 + 描述画面','图中文字和画面内容都入库，适合大多数教学图片',1],['ocr','仅识别文字','只提取图中文字，适合板书、课件截图、表单'],['desc','仅描述画面','只生成画面描述，适合实训现场、设备、操作照片']];
  return `<div class="col g12"><h3 class="h3">解析方式</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
      ${modes.map(([k,t,d,r])=>`<button class="opt ${S.imgMode===k?'on':''}" data-act="imgMode" data-v="${k}">
        <span class="row g6" style="font-size:14px;font-weight:600;color:var(--t1)">${t}${r?'<span class="chip act">推荐</span>':''}</span>
        <span class="muted" style="line-height:1.6">${d}</span></button>`).join('')}</div></div>
    <div class="col g12"><h3 class="h3">分段方式</h3>
      <div class="fixed">${I.info}<span>每张图片为一个分段，图中文字与画面描述合在同一分段内。检索命中时同时返回原图缩略图和识别内容。</span></div></div>`;
}
function previewImage(){
  return ofKind('image').map(f=>{const p=imgParts(f);return `<div class="pv">
      <div class="row g8"><span class="lbl">${esc(f.name)} · 1 个分段</span><span class="muted" style="margin-left:auto;font-size:12px">${(p.ocr+p.desc).length} 字</span></div>
      <div class="thumb">${f.svg}</div>
      ${p.ocr?`<span class="lbl">图中文字</span><p>${esc(p.ocr)}</p>`:''}
      ${p.desc?`<span class="lbl">画面描述</span><p>${esc(p.desc)}</p>`:''}</div>`}).join('');
}

function settingsAV(){
  const modes=[['semantic','按语义段落','按话题和语义完整性切分，一段讲清一件事',1],['speaker','按说话人切换','换人说话即切一段，适合访谈、问答、对话演练'],['duration','按固定时长','按设定时长等分，适合讲座、长录音']];
  return `<div class="col g12"><h3 class="h3">识别语言</h3><div class="row g8 wrapflex">
        ${pill('lang','zh','中文普通话',S.lang)}${pill('lang','en','英文',S.lang)}${pill('lang','mix','中英混合',S.lang)}${pill('lang','auto','自动识别',S.lang)}</div></div>
    <div class="col g12"><h3 class="h3">识别增强</h3><div class="card">
        ${tg('diarize','区分说话人','自动识别不同说话人，转写稿按「说话人 1 / 2 / 3」标注，处理完成后可改名')}
        ${tg('clean','去除口语冗余','删除「嗯、啊、那个」等语气词与口误重复，不改写原意')}
        <div class="set col" style="align-items:stretch;gap:8px">
          <label for="hot" style="font-size:14px;font-weight:600">专业术语 / 热词</label>
          <span class="muted">填写课程里的专有名词，提升识别准确率；用逗号分隔。预览中会高亮命中的热词</span>
          <textarea id="hot" rows="2">${esc(S.hotwords)}</textarea></div></div></div>
    <div class="col g12"><h3 class="h3">分段方式</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
      ${modes.map(([k,t,d,r])=>`<button class="opt ${S.segMode===k?'on':''}" data-act="segMode" data-v="${k}">
         <span class="row g6" style="font-size:14px;font-weight:600;color:var(--t1)">${t}${r?'<span class="chip act">推荐</span>':''}</span>
         <span class="muted" style="line-height:1.6">${d}</span></button>`).join('')}</div>
      ${S.segMode==='duration'?`<div class="row g8 wrapflex"><span style="font-size:14px;color:var(--t3)">每段时长</span>${[3,5,10].map(n=>pill('dur',n,n+' 分钟',S.dur)).join('')}</div>`:''}
      <div class="card">${tg('keepTs','分段保留时间戳','每个分段记录起止时间，检索命中后可直接跳到原音视频对应位置播放')}</div>
      <p class="muted" style="margin:0">视频文件只提取音轨做语音转写，不解析画面内容。</p></div>`;
}
function previewAV(){
  const f=ofKind('av')[0], A=f.segs, t=avText;
  let pv;
  if(S.segMode==='speaker') pv=[{a:A[0][0],b:A[Math.min(1,A.length-1)][1],sp:'1',text:t(A[0])+(A[1]?t(A[1]):'')},A[2]?{a:A[2][0],b:A[2][1],sp:String(A[2][2]),text:t(A[2])}:null].filter(Boolean);
  else if(S.segMode==='duration'){const d=S.dur*60;pv=[{a:0,b:d,sp:'1',text:t(A[0])+(A[1]?t(A[1]).slice(0,30)+'…':'')},{a:d,b:d*2,sp:'1/2',text:'…'+(A[2]?t(A[2]):'')+(A[3]?t(A[3]).slice(0,26)+'…':'')}];}
  else pv=A.slice(0,2).map(s=>({a:s[0],b:s[1],sp:String(s[2]),text:t(s)}));
  return pv.map((p,i)=>`<div class="pv"><div class="row g8 wrapflex">
      <span class="lbl">${esc(f.name)} · #${i+1}</span>
      ${S.keepTs?`<span class="chip">${fmt(p.a)} – ${fmt(p.b)}</span>`:''}
      ${S.diarize?`<span class="sp sp${p.sp[0]}">说话人 ${p.sp}</span>`:''}
      <span class="muted" style="margin-left:auto;font-size:12px">${p.text.length} 字</span></div>
      <p>${hl(p.text)}</p></div>`).join('');
}

function viewStep2(){
  const kinds=['text','image','av'].filter(k=>ofKind(k).length);
  if(!kinds.includes(S.tab)) S.tab=kinds[0];
  const k=S.tab, list=ofKind(k);
  const summary=k==='av'?`${list.length} 个文件 · 总时长 ${fmt(list.reduce((a,f)=>a+f.sec,0))}`:`${list.length} 个文件`;
  const settings={text:settingsText,image:settingsImage,av:settingsAV}[k]();
  const preview={text:previewText,image:previewImage,av:previewAV}[k]();
  return `<section class="col g24">
    <div class="col g6"><h2 class="h2">按文件类型设置解析与分段</h2>
      <span class="muted">本批共 ${valid().length} 个文件，已按类型自动分组。每组设置只对该组文件生效。</span></div>
    <div class="tabs" role="tablist">${kinds.map(x=>`<button class="tab ${x===k?'on':''}" role="tab" aria-selected="${x===k}" data-act="tab" data-v="${x}">${x==='text'?I.doc('currentColor',16):x==='image'?I.image('currentColor',16):I.video('currentColor',16)}${KIND_LABEL[x]}<span class="cnt">${ofKind(x).length}</span></button>`).join('')}</div>
    <div class="row g24 wrapflex" style="align-items:flex-start;gap:32px">
      <div class="col" style="flex:999 1 520px;min-width:0;gap:28px">${settings}</div>
      <aside class="side">
        <div class="col g6"><h3 class="h3">${KIND_LABEL[k]}文件</h3><span class="muted">${summary}</span>
          <div class="col g6" style="margin-top:4px">${list.map(f=>`<span class="row g8" style="font-size:13px;color:var(--t2)">${fileIcon(f,16)}<span class="fname" style="font-weight:400;font-size:13px">${esc(f.name)}</span></span>`).join('')}</div></div>
        <div class="hr"></div>
        <h3 class="h3">分段预览</h3>
        ${preview}
        <p class="muted" style="margin:0">切换左侧设置，预览实时变化。</p>
      </aside>
    </div>
    <div class="row g12"><button class="btn" data-act="go" data-v="1">上一步</button><button class="btn pri" data-act="process">保存并处理</button></div>
  </section>`;
}

/* ======================================================================
   STEP 3 处理进度
   ====================================================================== */
function stagesFor(f,pct){
  let names;
  if(f.kind==='text') names=['上传',f.scanned&&S.ocrScan?'OCR 识别':'文本解析','分段','向量索引'];
  else if(f.kind==='image') names=['上传',...(S.imgMode!=='desc'?['文字识别']:[]),...(S.imgMode!=='ocr'?['画面描述']:[]),'向量索引'];
  else names=f.media==='video'?['上传','提取音轨','语音转写','智能分段','向量索引']:['上传','语音转写','智能分段','向量索引'];
  const step=100/names.length;
  let cur=Math.floor(pct/step); if(pct>=100) cur=names.length;
  return {names,cur};
}
function viewStep3(){
  const v=valid(); let all=v.length>0, segTotal=0;
  const groups=['text','image','av'].filter(k=>ofKind(k).length).map(k=>{
    const rows=ofKind(k).map(f=>{
      const pct=S.progress[f.id]||0, done=pct>=100; if(!done) all=false; else segTotal+=segCount(f);
      const sg=stagesFor(f,pct);
      const skipped=done&&segCount(f)===0;
      return `<li class="proc"><div class="row g12"><span class="row g8" style="flex:1;min-width:0">${fileIcon(f,18)}<span class="fname">${esc(f.name)}</span></span>
          <span style="font-size:13px;font-weight:600;white-space:nowrap;color:${skipped?'#B54708':done?'#067647':'#004EEB'}">${skipped?'已跳过（无文字层）':done?'已完成':sg.names[sg.cur]+'中 '+Math.floor(pct)+'%'}</span></div>
        <div class="track"><div class="${done?'ok':''}" style="width:${pct}%"></div></div>
        <div class="row g6 wrapflex">${sg.names.map((n,i)=>`<span class="chip ${i<sg.cur?'done':(i===sg.cur?'act':'')}">${n}</span>`).join('')}
          <span class="muted" style="margin-left:auto">${done?segCount(f)+' 个分段 · '+charCount(f)+' 字':(f.kind==='av'?'时长 '+fmt(f.sec):f.size)}</span></div></li>`;
    }).join('');
    return `<div class="col g10"><span class="row g8">${kindChip(k)}<span class="muted">${ofKind(k).length} 个文件</span></span><ul class="col g10">${rows}</ul></div>`;
  }).join('');
  return `<section class="col g24" style="max-width:820px">
    <div class="col g6"><h2 style="font-size:22px">${all?'知识库已创建，全部文件处理完成':'知识库已创建，正在处理文件'}</h2>
      <span class="muted" style="font-size:14px">${all?`共 ${v.length} 个文件，生成 ${segTotal} 个分段，可在文档中逐个核对解析结果。`:'处理在后台进行，可以离开此页面，处理完成后在文档列表查看。'}</span></div>
    <div class="col g6"><span class="muted">知识库名称</span>
      <span style="font-size:15px;font-weight:600;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg2)">${KB_NAME}</span></div>
    ${groups}
    <div class="row g12"><button class="btn pri" data-act="go" data-v="4" ${all?'':'disabled'}>前往文档</button>
      <button class="btn" data-act="restart">重新开始演示</button></div></section>`;
}

/* ======================================================================
   STEP 4 文档详情（按类型展示）+ 跨类型召回测试
   ====================================================================== */
function corpus(){
  const out=[];
  valid().forEach(f=>{
    if(f.kind==='text'){ if(segCount(f)) f.segs.forEach((s,i)=>out.push({f,i,text:s.t})); }
    else if(f.kind==='image'){ const p=imgParts(f); out.push({f,i:0,text:[p.ocr,p.desc].filter(Boolean).join('\n')}); }
    else f.segs.forEach((s,i)=>out.push({f,i,text:s[3],t:s[0]}));
  });
  return out;
}
function doSearch(q){
  q=q.trim(); if(!q) return [];
  const toks=[...new Set(q.replace(/[？?。，,！!\s]/g,'').match(/.{2}/g)||[])];
  return corpus().map(c=>{const hit=toks.filter(t=>c.text.includes(t)).length;return {...c,score:hit?Math.min(0.95,0.55+hit/toks.length*0.45):0}})
    .filter(c=>c.score>0).sort((a,b)=>b.score-a.score).slice(0,4);
}

function segActions(key,i){
  return S.editing===key?`<button class="btn mini pri" data-act="save" data-k="${key}">保存</button><button class="btn mini" data-act="cancel">取消</button>`
    :`<button class="btn mini" data-act="edit" data-k="${key}">编辑</button>`;
}
const editable=(key,text)=>`<span class="tx" ${S.editing===key?'contenteditable="true" id="edtx"':''}>${esc(text)}</span>`;

function docText(f){
  if(!segCount(f)) return `<div class="fixed">${I.info}<span>该文件为扫描件且未开启 OCR，已跳过，未生成分段。</span></div>`;
  return `<div class="stats">
      <div class="stat"><span class="muted" style="font-size:12px">类型</span><b>${f.ext.toUpperCase()}${f.scanned?' · 扫描件':''}</b></div>
      <div class="stat"><span class="muted" style="font-size:12px">分段数</span><b>${segCount(f)}</b></div>
      <div class="stat"><span class="muted" style="font-size:12px">字数</span><b>${charCount(f)}</b></div></div>
    <div class="col g10"><h3 class="h3">分段</h3>
    ${f.segs.map((s,i)=>{const key=f.id+'-'+i;return `<div class="seg ${S.focus===i?'on':''}">
      <span class="row g8 wrapflex"><span style="font-size:12px;font-weight:600;color:var(--t4)">#${i+1}</span>${f.scanned?'<span class="chip act">OCR</span>':''}
        <span class="muted" style="margin-left:auto;font-size:12px">${s.t.length} 字</span>${segActions(key)}</span>
      ${editable(key,s.t)}</div>`}).join('')}</div>`;
}

function docImage(f){
  const p=imgParts(f);
  return `<div class="imgview">${f.svg}</div>
    <div class="stats">
      <div class="stat"><span class="muted" style="font-size:12px">类型</span><b>${f.ext.toUpperCase()} · ${f.size}</b></div>
      <div class="stat"><span class="muted" style="font-size:12px">分段数</span><b>1</b></div>
      <div class="stat"><span class="muted" style="font-size:12px">识别字数</span><b>${charCount(f)}</b></div></div>
    <div class="seg ${S.focus===0?'on':''}">
      <span class="row g8 wrapflex"><span style="font-size:12px;font-weight:600;color:var(--t4)">#1</span><span class="chip k-image">图片分段</span></span>
      ${p.ocr?`<div class="col g6"><span class="row g8"><span style="font-size:13px;font-weight:600;color:var(--t1)">图中文字</span><span style="margin-left:auto" class="row g6">${segActions(f.id+'-ocr')}</span></span>${editable(f.id+'-ocr',f.ocr)}</div>`:''}
      ${p.ocr&&p.desc?'<div class="hr"></div>':''}
      ${p.desc?`<div class="col g6"><span class="row g8"><span style="font-size:13px;font-weight:600;color:var(--t1)">画面描述</span><span style="margin-left:auto" class="row g6">${segActions(f.id+'-desc')}</span></span>${editable(f.id+'-desc',f.desc)}</div>`:''}
    </div>`;
}

function docAV(f){
  let ai=f.segs.findIndex(s=>S.curTime>=s[0]&&S.curTime<s[1]); if(ai<0) ai=f.segs.length-1;
  const ratio=Math.min(1,S.curTime/f.sec), N=90, seed=f.id.charCodeAt(0);
  const bars=Array.from({length:N},(_,i)=>`<span class="bar ${i/N<ratio?'p':''}" style="height:${Math.round(14+Math.abs(Math.sin(i*1.7+seed)*Math.cos(i*.37+seed))*70)}px"></span>`).join('');
  const st=f.segs[ai]?f.segs[ai][3]:'';
  const spk=Object.keys(f.speakers);
  return `<div class="player">
      ${f.media==='video'
        ? `<div class="video"><span style="font-size:13px;color:#98A2B3;position:absolute;top:14px;left:16px">视频画面（mock）</span>${st?`<div class="subtitle">${esc(st.slice(0,40))}${st.length>40?'…':''}</div>`:''}</div>`
        : `<div class="wave" data-act="seek" title="点击跳转">${bars}</div>`}
      <div class="ctrl"><button class="play" data-act="play" aria-label="${S.playing?'暂停':'播放'}">${S.playing?I.pause:I.play}</button>
        <div class="seek" data-act="seek" title="点击跳转"><div style="width:${(ratio*100).toFixed(1)}%"></div></div>
        <span style="font-size:13px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap">${fmt(S.curTime)} / ${fmt(f.sec)}</span></div></div>
    <div class="stats">
      <div class="stat"><span class="muted" style="font-size:12px">时长</span><b>${fmt(f.sec)}</b></div>
      <div class="stat"><span class="muted" style="font-size:12px">分段数</span><b>${f.segs.length}</b></div>
      <div class="stat"><span class="muted" style="font-size:12px">转写字数</span><b>${charCount(f)}</b></div>
      <div class="stat"><span class="muted" style="font-size:12px">说话人</span><b>${spk.length} 人</b></div></div>
    <div class="col g8"><h3 class="h3">说话人</h3><div class="row g8 wrapflex">
      ${spk.map(n=>`<button class="btn mini" data-act="rename" data-v="${n}"><span class="sp sp${n}">${esc(spName(f,n))}</span>改名</button>`).join('')}</div></div>
    <div class="col g10">
      <div class="row" style="justify-content:space-between"><h3 class="h3">转写分段</h3><span class="muted">点击分段跳转播放；可编辑修正转写错误</span></div>
      ${f.segs.map((s,i)=>{const key=f.id+'-'+i;return `<div class="seg click ${i===ai?'on':''}" data-act="segjump" data-t="${s[0]}">
        <span class="row g8 wrapflex"><span style="font-size:12px;font-weight:600;color:var(--t4)">#${i+1}</span>
          <span class="chip">${fmt(s[0])} – ${fmt(s[1])}</span><span class="sp sp${s[2]}">${esc(spName(f,s[2]))}</span>
          <span class="muted" style="margin-left:auto;font-size:12px">${s[3].length} 字</span>${segActions(key)}</span>
        ${editable(key,s[3])}</div>`}).join('')}</div>`;
}

function hitAction(h){
  if(h.f.kind==='av') return `<button class="btn mini" style="border-color:#B2CCFF;color:var(--pri-d)" data-act="openhit" data-f="${h.f.id}" data-i="${h.i}">▶ 从 ${fmt(h.t)} 播放</button>`;
  if(h.f.kind==='image') return `<button class="btn mini" style="border-color:#B2CCFF;color:var(--pri-d)" data-act="openhit" data-f="${h.f.id}" data-i="0">查看原图</button>`;
  return `<button class="btn mini" style="border-color:#B2CCFF;color:var(--pri-d)" data-act="openhit" data-f="${h.f.id}" data-i="${h.i}">定位分段</button>`;
}

function viewStep4(){
  const v=valid(); const cur=fileById(S.activeFile)||v[0];
  const nav=['text','image','av'].filter(k=>ofKind(k).length).map(k=>`<span class="navh">${KIND_LABEL[k]} · ${ofKind(k).length}</span>`+
    ofKind(k).map(f=>`<button class="ftab ${f.id===cur.id?'on':''}" data-act="file" data-v="${f.id}">
      <span style="flex:none;margin-top:2px">${fileIcon(f,18)}</span>
      <span class="col" style="gap:2px;min-width:0"><span style="font-size:14px;font-weight:600;color:var(--t1);word-break:break-all">${esc(f.name)}</span>
      <span class="muted" style="font-size:12px">${f.kind==='av'?fmt(f.sec)+' · ':''}${segCount(f)} 个分段</span></span></button>`).join('')).join('');
  const hits=S.hits||[];
  const hitHtml=S.hits===null?'':(hits.length?hits.map(h=>`<div class="hitres">
      ${h.f.kind==='image'?`<div class="thumb tn">${h.f.svg}</div>`:''}
      <div class="col g6" style="flex:1 1 280px;min-width:0">
        <span class="row g8 wrapflex">${kindChip(h.f.kind)}<span class="chip">${esc(h.f.name)}</span>
          ${h.f.kind==='av'?`<span class="chip">#${h.i+1} · ${fmt(h.t)}</span>`:h.f.kind==='text'?`<span class="chip">#${h.i+1}</span>`:''}
          <span class="chip act">相似度 ${h.score.toFixed(2)}</span></span>
        <span style="font-size:14px;line-height:1.7;color:var(--t2);white-space:pre-line">${esc(h.text.length>110?h.text.slice(0,110)+'…':h.text)}</span></div>
      ${hitAction(h)}</div>`).join(''):'<span class="muted">没有命中的分段，换个说法试试。</span>');
  const main=cur.kind==='text'?docText(cur):cur.kind==='image'?docImage(cur):docAV(cur);
  return `<section class="col g24">
    <div class="row g8 wrapflex" style="font-size:14px;color:var(--t4)">
      <button class="link row g6" style="min-height:44px" data-act="go" data-v="3">${I.back}${KB_NAME}</button><span>/</span>
      <span style="color:var(--t1);font-weight:600">${esc(cur.name)}</span></div>
    <div class="hit">
      <span class="row g8 wrapflex"><span style="font-size:14px;font-weight:700;color:var(--pri-d)">召回测试</span><span class="muted">在整个知识库里检索，文本、图片、音视频分段一起召回</span></span>
      <form class="row g8 wrapflex" id="qform"><input id="q" value="${esc(S.query)}" placeholder="输入问题，例如：VD 房是什么意思" aria-label="召回测试问题"><button class="btn pri" type="submit">测试</button></form>
      ${hitHtml}
    </div>
    <div class="row g24 wrapflex" style="align-items:flex-start">
      <nav class="col" style="flex:1 1 220px;max-width:280px;min-width:0;gap:2px" aria-label="文档">${nav}</nav>
      <div class="col" style="flex:999 1 560px;min-width:0;gap:20px">${main}</div>
    </div></section>`;
}

/* ======================================================================
   渲染 & 交互
   ====================================================================== */
function render(){
  const y=window.scrollY;
  $('#app').innerHTML=(S.step<4?stepper():'')+[null,viewStep1,viewStep2,viewStep3,viewStep4][S.step]();
  window.scrollTo(0,y);
  bindExtras();
}

function addFiles(list){
  const room=LIMIT.perBatch-S.files.length;
  if(list.length>room) toast(`每批最多 ${LIMIT.perBatch} 个文件，已忽略多出的 ${list.length-Math.max(room,0)} 个`);
  list.slice(0,Math.max(room,0)).forEach(f=>S.files.push(f));
  render();
}
function fromRealFile(file){
  // 真实选择的文件：只读文件名、大小做类型识别与校验，解析内容沿用同类型 mock
  const ext=file.name.split('.').pop().toLowerCase(), kind=kindOf(ext);
  const tpl=MOCK_FILES.find(m=>m.kind===(kind||'text')&&!m.error);
  const r=JSON.parse(JSON.stringify(tpl)); r.svg=tpl.svg;
  Object.assign(r,{id:'u'+(uid++),name:file.name,ext,kind:kind||'text',
    size:file.size>1024**3?(file.size/1024**3).toFixed(1)+' GB':(file.size/1024**2).toFixed(1)+' MB'});
  if(kind==='av') r.media=['mp4','mov','mkv','webm'].includes(ext)?'video':'audio';
  if(!kind) r.error='格式不支持';
  else if(file.size>LIMIT[kind]) r.error={text:'文件超过 100 MB',image:'图片超过 20 MB',av:'文件超过 2 GB'}[kind];
  return r;
}
function startProcessing(){
  clearInterval(procTimer); S.progress={}; valid().forEach(f=>S.progress[f.id]=0); S.step=3; render();
  const base={text:9,image:7,av:3.2};
  const speed={}; valid().forEach((f,i)=>speed[f.id]=base[f.kind]*(0.8+((i*37)%10)/25));
  procTimer=setInterval(()=>{let all=true;
    for(const k in S.progress){S.progress[k]=Math.min(100,S.progress[k]+speed[k]); if(S.progress[k]<100) all=false;}
    if(S.step===3) render(); if(all) clearInterval(procTimer);},260);
}
function setPlaying(on){
  clearInterval(playTimer); S.playing=on;
  if(on) playTimer=setInterval(()=>{const f=fileById(S.activeFile); S.curTime+=1;
    if(S.curTime>=f.sec){S.curTime=f.sec;setPlaying(false);return;} render();},250);
  render();
}
function openFile(id){ setPlaying(false); S.activeFile=id; S.curTime=0; S.editing=null; S.focus=null; }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(a==='segjump' && e.target.closest('button,[contenteditable="true"]')) return;
  switch(a){
    case 'source': S.source=v; break;
    case 'pick': $('#picker').click(); return;
    case 'mock':
      if(S.files.some(f=>MOCK_FILES.some(m=>m.id===f.id))){toast('示例文件已载入');return;}
      addFiles(MOCK_FILES.map(f=>{const c=JSON.parse(JSON.stringify(f));c.svg=f.svg;return c;})); return;
    case 'remove': S.files=S.files.filter(f=>f.id!==v); break;
    case 'go':
      if(+v!==4) setPlaying(false);
      S.step=+v;
      if(+v===4){ openFile(valid()[0].id); S.hits=null; }
      break;
    case 'tab': S.tab=v; break;
    case 'lang': S.lang=v; break;
    case 'toggle': S[v]=!S[v]; break;
    case 'segMode': S.segMode=v; break;
    case 'dur': S.dur=+v; break;
    case 'imgMode': S.imgMode=v; break;
    case 'process': startProcessing(); return;
    case 'restart': clearInterval(procTimer); setPlaying(false); Object.assign(S,{step:1,files:[],progress:{},hits:null,tab:null}); break;
    case 'file': openFile(v); break;
    case 'play': setPlaying(!S.playing); return;
    case 'seek': { const r=el.getBoundingClientRect(), f=fileById(S.activeFile); S.curTime=Math.round((e.clientX-r.left)/r.width*f.sec); break; }
    case 'segjump': S.curTime=+el.dataset.t; break;
    case 'openhit': {
      const f=fileById(el.dataset.f), i=+el.dataset.i; openFile(f.id);
      if(f.kind==='av') S.curTime=f.segs[i][0]; else S.focus=i;
      render(); document.querySelector('nav[aria-label="文档"]').scrollIntoView({behavior:'smooth'}); return; }
    case 'edit': S.editing=el.dataset.k; render(); { const t=$('#edtx'); if(t) t.focus(); } return;
    case 'cancel': S.editing=null; break;
    case 'save': {
      const key=el.dataset.k, t=$('#edtx').innerText.trim(), f=fileById(S.activeFile);
      if(t){
        if(key.endsWith('-ocr')) f.ocr=t;
        else if(key.endsWith('-desc')) f.desc=t;
        else { const i=+key.split('-').pop(); if(f.kind==='text') f.segs[i].t=t; else { f.segs[i][3]=t; f.segs[i][4]=undefined; } }
      }
      S.editing=null; S.hits=S.hits?doSearch(S.query):null; toast('已保存，该分段将重新索引'); break; }
    case 'rename': { const f=fileById(S.activeFile); const n=prompt('重命名说话人', spName(f,v)); if(n&&n.trim()) S.renames[f.id+'-'+v]=n.trim(); break; }
  }
  render();
});

function bindExtras(){
  const hot=$('#hot'); if(hot) hot.oninput=()=>{S.hotwords=hot.value; const pos=hot.selectionStart; render(); const h=$('#hot'); h.focus(); h.setSelectionRange(pos,pos);};
  const pk=$('#picker'); if(pk) pk.onchange=()=>addFiles([...pk.files].map(fromRealFile));
  const drop=$('#drop');
  if(drop){
    drop.ondragover=e=>{e.preventDefault(); if(!S.drag){S.drag=true; drop.classList.add('drag');}};
    drop.ondragleave=()=>{S.drag=false; drop.classList.remove('drag');};
    drop.ondrop=e=>{e.preventDefault(); S.drag=false; addFiles([...e.dataTransfer.files].map(fromRealFile));};
  }
  const qf=$('#qform'); if(qf) qf.onsubmit=e=>{e.preventDefault(); S.query=$('#q').value; S.hits=doSearch(S.query); render();};
}

render();
</script>
</body>
</html>
