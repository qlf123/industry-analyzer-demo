<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教学达成分析</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
/* 教学达成分析：教学达成（老师确认的课堂证据汇总）+ 课程改进建议（老师提出 / 专业负责人处理） */
.tq-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.tq-kpi{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.tq-kpi b{display:block;font-size:22px;font-family:var(--mono);color:var(--ink)}
.tq-kpi span{font-size:12px;color:var(--muted)}
.tq-grp{font-size:13px;font-weight:600;color:var(--ink);margin:2px 0 8px;display:flex;align-items:baseline;gap:8px}
.tq-grp .note{font-weight:400}
.ov-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.ov-c{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;min-width:0}
.ov-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ov-l i,.lg i,.stl i{display:inline-block;width:8px;height:8px;border-radius:2px}
.ov-v{font-size:24px;font-family:var(--mono);font-weight:600;color:var(--ink);margin:4px 0 2px}
.ov-v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.ov-s{font-size:11.5px;color:var(--muted);line-height:1.5}
.qmark{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--rule);font-size:10.5px;line-height:1;color:var(--muted);cursor:help;font-weight:400;flex:none;margin-left:5px}
.qmark:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.lg2{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:400;color:var(--ink-2);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit}
.lg2 i{display:inline-block;width:16px;height:0;border-top:2px solid var(--rule)}
.lg2[aria-pressed="false"]{color:var(--muted);opacity:.6}
.dl{display:block;font-size:11.5px;margin-top:4px}.dl.up{color:var(--good)}.dl.down{color:var(--crit)}.dl.flat{color:var(--muted)}
.ov-panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:14px;min-width:0}
.ov-ph{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.ov-ph .sp{flex:1}.lg{font-size:11.5px;font-weight:400;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ov-grid .ov-panel{margin-bottom:14px}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}   /* 学生分布面板内部：技能 / 知识点两维并排 */
.cr{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
.cn{width:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.cb{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.hb{flex:1;height:10px;background:var(--card-2);border-radius:4px;overflow:hidden}.hb i{display:block;height:100%;border-radius:4px}
.hv{width:40px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right}
.stk{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;margin:6px 0 10px}
.stl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--ink-2)}
.stl div{display:flex;align-items:center;gap:6px}.stl b{font-family:var(--mono);color:var(--ink);margin-left:auto}
@media (max-width:1200px){.ov-cards{grid-template-columns:repeat(3,1fr)}.ov-grid{grid-template-columns:1fr}.st-grid{grid-template-columns:1fr;gap:14px}}
.tq-card{background:var(--card);border:1px solid var(--rule);border-radius:13px;overflow:hidden;margin-bottom:14px}
.tq-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule-2)}
.tq-h b{font-size:14px}
.tq-h .sp{flex:1}
.tbl2 td{font-size:12.5px;vertical-align:top}
.tbl2 .mono{font-family:var(--mono);font-size:12px}
.note{font-size:12px;color:var(--muted)}
.empty3{font-size:12.5px;color:var(--muted);padding:36px 0;text-align:center}
.lk{color:var(--brand-ink);background:none;border:0;padding:0;font:inherit;font-size:12.5px;cursor:pointer}
.lk:hover{text-decoration:underline}
.imp{padding:12px 14px;border-bottom:1px solid var(--rule-2);font-size:13px}
.imp:last-child{border-bottom:0}
.imp-f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:12.5px;padding:14px}
.imp-f label{display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.imp-in{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--card);color:var(--ink)}
@media (max-width:1100px){.tq-kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop"><div class="ptop-r"><div class="pt-l"><h1 class="pt-t" id="pt"></h1><div class="pt-d" id="pd"></div></div></div></div>
    <div class="body"><div class="card filters" id="filters"></div><div id="main"></div></div>
  </div>
</div>
<script src="js/mock-data.js?v=4"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/proto-notes.js?v=1"></script>
<script src="js/assess-data.js"></script>
<script src="js/teacher-kit.js"></script>
<script src="js/teach-reach.js"></script>
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search),
    view = 'reach';   // 「课程改进建议」视图本期隐藏（2026-11-19）：导航项已移除、t=improve 直链强制回落教学达成；improve()/impForm 逻辑保留
  qs.get('t');
  var V = {
    reach: { key: 'dash', title: '教学达成分析', desc: '课程计划执行后的课堂结果：技能看老师确认的证据，按能力、按课程看达成；知识点看老师确认的评价，按知识点看掌握。两个维度分开统计，学生自评不计入' },
    improve: { key: 'tq-improve', title: '课程改进建议', desc: '老师在学情里提出的建议由专业负责人在这里处理（采纳 / 暂不处理并说明），也可以针对薄弱能力提出建议交给任课老师；处理结果回到老师的学情页' }
  }[view];
  UI.boot({ portal: 'admin', active: V.key });
  document.title = V.title; document.getElementById('pt').textContent = V.title; document.getElementById('pd').hidden = true;   // 标题下不显示说明
  var esc = TK.esc, $ = function (s) { return document.querySelector(s); };
  var qm = function (t) { return '<span class="qmark" title="' + esc(t) + '">?</span>'; };   // 口径说明统一走名称旁帮助图标（悬停显示），与数据概览第 6 块一致
  var ctx = DEMO.getState(), iden = UI.currentIdentity(ctx);
  if (!UI.hasPerm(ctx, iden, 'teach:quality:view')) { $('.body').innerHTML = '<div class="card"><div class="empty3">当前身份没有「教学达成分析查看与改进处理」权限</div></div>'; return; }
  var S = TK.load(), E = S.edu;

  // 专业负责人（没有教务维护权限）：只看自己负责的专业（含下级），不提供「全部专业」
  var LEAD = (function () {
    if (UI.hasPerm(ctx, iden, 'edu:base:manage')) return null;
    var names = {}; ctx.assignments.filter(function (a) { return a.accountId === iden.account.id && a.roleId === 'R-MAJOR-LEAD'; }).forEach(function (a) {
      ((a.teachingScope || {}).majorIds || []).forEach(function (mid) { var m = ctx.majors.filter(function (x) { return x.id === mid; })[0]; if (m) names[m.name] = 1; });
    });
    return E.majors.filter(function (m) { return names[m.name]; }).map(function (m) { return m.id; });
  })();
  var F = { major: LEAD ? (LEAD[0] || '__none__') : '', term: TK.TERM, course: '', cls: '', st: '', trlg: { aSk: 1, aKp: 1, sSk: 0, sKp: 0, eSk: 0, eKp: 0 } };   // trlg = 按周趋势 6 曲线开关，默认只显整体两条，与数据概览一致
  var impForm = qs.get('new') != null ? { target: qs.get('new') || '', course: qs.get('course') || '' } : null, impReply = null;

  function cls(id) { return S.classes.filter(function (c) { return c.id === id; })[0] || {}; }
  function majorIds() { if (!F.major) return null; var out = []; (LEAD && !F.major ? LEAD : [F.major]).forEach(function (id) { out = out.concat(TK.majorSubIds(E, id)); }); return out; }
  function inMajor(mid) { var ids = majorIds(); return !ids || ids.indexOf(mid) >= 0; }
  function majorName(mid) { return (E.majors.filter(function (m) { return m.id === mid; })[0] || {}).name || ''; }
  function scopePlans(withCourse) {
    return S.plans.filter(function (p) {
      // 多班合班（2026-11-19）：任一班落在专业范围内即纳入；班级筛选按计划包含的班级匹配
      return TK.planMajors(S, p).some(inMajor) && (!F.term || p.term === F.term) && (!withCourse || ((!F.course || p.course === F.course) && (!F.cls || TK.planClassIds(S, p).indexOf(F.cls) >= 0)));
    });
  }
  function uniq(a) { return a.filter(function (v, i) { return v && a.indexOf(v) === i; }); }
  function sel(k, label, opts, all) {
    return '<label>' + label + '<select class="sel" data-f="' + k + '">' + (all != null ? '<option value="">' + all + '</option>' : '') + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (F[k] === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></label>';
  }
  function majorOpts() {
    return TK.majorTree(E).filter(function (x) { return x.m.status === '启用' && (!LEAD || LEAD.some(function (id) { return TK.majorSubIds(E, id).indexOf(x.m.id) >= 0; })); })
      .map(function (x) { return [x.m.id, new Array(x.depth + 1).join('　') + x.m.name]; });
  }
  function filters() {
    var h = sel('major', '专业', majorOpts(), LEAD ? null : '全部专业');
    if (view !== 'improve') {
      var terms = uniq(S.plans.map(function (p) { return p.term; }));
      var ps = scopePlans(false);
      h += sel('term', '学期', terms.map(function (t) { return [t, t]; }), '全部学期') +
        sel('course', '课程', uniq(ps.map(function (p) { return p.course; })).map(function (c) { return [c, c]; }), '全部课程') +
        sel('cls', '班级', uniq([].concat.apply([], ps.map(function (p) { return TK.planClassIds(S, p); }))).map(function (id) { return [id, cls(id).name || id]; }), '全部班级');
    } else {
      h += sel('st', '状态', [['待处理', '待处理'], ['已采纳', '已采纳'], ['暂不处理', '暂不处理'], ['已发出', '已发出（专业负责人提出）']], '全部状态');
    }
    $('#filters').innerHTML = h + '<button class="btn-s" data-reset>重置</button>' + (view === 'improve' ? '<span style="margin-left:auto"><button class="btn" data-imp-new style="height:32px">＋ 提出改进建议</button></span>' : '');
  }

  /* ── 教学达成 ── */
  function reach() {
    var plans = scopePlans(true), R = TR.compute(S, plans), A = kpsAgg();
    return overview(plans, R, A) + coverExtDetail(plans);
  }

  /* ── 知识点掌握（统计展示，两维独立） ──
     口径与教师端学情一致：每个学生取范围内最近一次老师确认的评价（含退回那次），
     看发布时勾选的考查知识点（task.kpIds）是否体现，按知识点平铺统计；只做统计，不计入证据、不汇总到能力达成 */
  /* ── 校领导总览：关键指标（较上周，即 7 天前的累计结果）、学期按周趋势、课程对比、学生分布 ──
     全部由老师确认的证据 / 评价实时计算；技能与知识点两个维度分开显示 */
  var CS = '#4f7cff', CK = '#f59e0b';   // 技能 / 知识点（已过色觉校验；知识点色对比度偏低，图上都有文字标注）
  var CS2 = '#7aa2ff', CK2 = '#fbbf24';   // 课程对比：覆盖条用同色系浅色（达成 = 实色、覆盖 = 浅色，与图例对应；复用趋势线已校验色板）
  function tdate(x) { return new Date(String(x).replace(' ', 'T')); }
  function kpRate(A) { var t = 0, o = 0; A.rows.forEach(function (r) { t += r.c.ok + r.c.miss; o += r.c.ok; }); return { t: t, o: o, r: TR.rate(o, t) }; }
  function termRange() {
    var name = F.term || TK.TERM, t = E.terms.filter(function (x) { return x.year + ' ' + x.term === name; })[0];
    if (!t) return null;
    var a = new Date(t.start + 'T00:00:00'), b = new Date(t.end + 'T23:59:59'), now = new Date();
    return { a: a, b: b < now ? b : now };
  }
  function weeks(rg) {
    var out = [], d = new Date(rg.a), n = 1;
    while (d < rg.b && n < 30) { var e = new Date(d); e.setDate(e.getDate() + 7); out.push({ a: new Date(d), b: e < rg.b ? e : new Date(rg.b.getTime() + 1), l: '第' + n + '周' }); d = e; n++; }
    return out;
  }
  function delta(cur, old, unit) {
    if (cur == null || old == null) return '<span class="dl flat">较上周：无可比数据</span>';
    var d = Math.round((cur - old) * 10) / 10;
    return '<span class="dl ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat') + '">较上周 ' + (d > 0 ? '↑ ' + d : d < 0 ? '↓ ' + (-d) : '持平') + (d ? unit : '') + '</span>';
  }
  function lineSVG(ws, series) {
    var W = 640, H = 200, L = 36, Rr = 84, T = 14, B = 26, n = ws.length, iw = W - L - Rr, ih = H - T - B;
    var x = function (i) { return L + (n <= 1 ? iw / 2 : iw * i / (n - 1)); }, y = function (v) { return T + ih * (1 - v / 100); };
    var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="累计达成率趋势" style="width:100%;height:auto;font-family:var(--sans)">';
    [0, 25, 50, 75, 100].forEach(function (v) { h += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--rule-2)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="var(--muted)">' + v + '%</text>'; });
    var step = Math.max(1, Math.ceil(n / 9));
    ws.forEach(function (w, i) { if (i % step === 0 || i === n - 1) h += '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="var(--muted)">' + w.l + '</text>'; });
    series.forEach(function (sr) {
      var pts = sr.v.map(function (v, i) { return v == null ? null : [x(i), y(v), v, i]; }).filter(Boolean);
      if (pts.length > 1) h += '<polyline points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '" fill="none" stroke="' + sr.c + '" stroke-width="2" stroke-linejoin="round"' + (sr.dash ? ' stroke-dasharray="' + sr.dash + '"' : '') + '/>';
      pts.forEach(function (p) { h += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="' + sr.c + '" stroke="var(--card)" stroke-width="2"><title>' + ws[p[3]].l + ' · ' + sr.n + ' ' + p[2] + '%</title></circle>'; });
      var lp = pts[pts.length - 1]; if (lp) h += '<text x="' + (lp[0] + 8) + '" y="' + (lp[1] + 4) + '" font-size="11" fill="var(--ink-2)">' + sr.short + ' ' + lp[2] + '%</text>';
    });
    return h + '</svg>';
  }
  function overview(plans, R, A) {
    var K = kpRate(A);
    var sr = R.std.rate;   // 教学达成率（技能）：已达成人次 / 已提交且已评价人次（「需改进」= 未达成），标准与拓展都计入
    // 学生：按每人已评价技能的达成比例分档（分母 = 该生已评价的「学生 × 技能」对数）
    var band = { hi: [], mid: [], lo: [] }; Object.keys(R.stdStu).forEach(function (n) { var s = R.stdStu[n]; if (!s.den) return; var r = s.ok / s.den; (r >= 0.8 ? band.hi : r >= 0.6 ? band.mid : band.lo).push(n); });
    // 知识点掌握分布（2026-11-25）：按每人最近一次评价的掌握比例分档，与 kpRate 同口径（kpsAgg().stu）
    var kband = { hi: [], mid: [], lo: [] }, ktot = 0; Object.keys(A.stu || {}).forEach(function (n) { var s = A.stu[n]; if (!s.den) return; ktot++; var r = s.ok / s.den; (r >= 0.8 ? kband.hi : r >= 0.6 ? kband.mid : kband.lo).push(n); });
    var ts = TR.teachScope(S, plans);   // 教学覆盖 / 拓展
    var tqCard = function (lab, sk, kp, tip) { return '<div class="ov-c"><div class="ov-l">' + lab + qm(tip) + '</div><div class="ov-v" style="font-family:var(--sans)"><span style="color:var(--muted);font-size:12px;font-weight:400">技能</span> <b>' + sk + '</b><span style="color:var(--muted);font-weight:400;margin:0 10px">·</span><span style="color:var(--muted);font-size:12px;font-weight:400">知识点</span> <b>' + kp + '</b></div></div>'; };
    var h = '<div class="ov-cards" style="grid-template-columns:repeat(3,1fr)">' +
      tqCard('教学覆盖率', (ts.skCoverRate == null ? '—' : ts.skCoverRate + '%'), (ts.kpCoverRate == null ? '—' : ts.kpCoverRate + '%'), '口径：老师已教内容覆盖课程标准要求的比例 = |已教 ∩ 标准| ÷ |标准|；标准要求 = 课程关联知识体系的技能 / 知识点全集，已教 = 全部发布任务的考查项。当前覆盖：技能 ' + ts.skCovered + ' / ' + ts.stdSk + ' · 知识点 ' + ts.kpCovered + ' / ' + ts.stdKp) +
      tqCard('教学达成率', (sr == null ? '—' : sr + '%'), (K.r == null ? '—' : K.r + '%'), '口径：已达成人次 / 已提交且已评价人次，标准与拓展都计入。技能看最近一次老师确认证据（优秀 / 合格 = 达成，需改进 = 未达成），知识点看最近一次老师确认评价的掌握标注；未提交 / 未评价不计入分母') +
      tqCard('教学拓展情况', ts.extSk + ' 项', ts.extKp + ' 个', '口径：老师在课程标准要求之外多教的内容 = |已教 − 标准|（差集）；拓展内容计入达成率，但不计入覆盖率分母') + '</div>';
    // 趋势：整体 / 标准 / 拓展 × 技能 / 知识点 6 条曲线（与数据概览「达成趋势」同口径，里外一致）
    var rg = termRange();
    if (rg) {
      var ws = weeks(rg);
      var sv = [], kv = [], svStd = [], svExt = [], kvStd = [], kvExt = [];
      ws.forEach(function (w) {
        var x = TR.compute(S, plans, { a: rg.a, b: w.b });
        var ka = kpsAgg(plans, w.b), kr = kpRate(ka), ksp = ka.split;
        sv.push(x.std.den ? x.std.rate : null);
        svStd.push(x.stdSplit.std.den ? x.stdSplit.std.rate : null);
        svExt.push(x.stdSplit.ext.den ? x.stdSplit.ext.rate : null);
        kv.push(kr.t ? kr.r : null);
        kvStd.push(ksp.std.den ? ksp.std.rate : null);
        kvExt.push(ksp.ext.den ? ksp.ext.rate : null);
      });
      var TRLG = [
        { key: 'aSk', n: '整体技能达成率', short: '技能', c: CS, dash: null, v: sv },
        { key: 'aKp', n: '整体知识点掌握率', short: '知识点', c: CK, dash: null, v: kv },
        { key: 'sSk', n: '标准技能达成率', short: '标准技能', c: '#7aa2ff', dash: '7 4', v: svStd },
        { key: 'sKp', n: '标准知识点掌握率', short: '标准知识点', c: '#fbbf24', dash: '7 4', v: kvStd },
        { key: 'eSk', n: '拓展技能达成率', short: '拓展技能', c: '#1d4ed8', dash: '2 4', v: svExt },
        { key: 'eKp', n: '拓展知识点掌握率', short: '拓展知识点', c: '#b45309', dash: '2 4', v: kvExt }
      ];
      var lg2 = function (sr) {
        var on = F.trlg[sr.key], st = sr.dash == null ? 'solid' : sr.dash === '2 4' ? 'dotted' : 'dashed', cc = on ? sr.c : 'var(--rule)';
        var has = sr.v.some(function (v) { return v != null; });
        return '<button type="button" class="lg2" data-trlg="' + sr.key + '" aria-pressed="' + (on ? 'true' : 'false') + '" title="点击显示 / 隐藏该曲线' + (has ? '' : '；当前周期暂无评价证据') + '"><i style="border-top-style:' + st + ';border-top-color:' + cc + '"></i>' + sr.n + '</button>';
      };
      var vis = TRLG.filter(function (s) { return F.trlg[s.key]; });
      h += '<div class="ov-panel"><div class="ov-ph">' + esc(F.term || TK.TERM) + ' · 按周趋势' + qm('累计口径：每个刻度统计截至每周末的达成率 / 掌握率。技能 = 已达成人次 / 已提交且已评价人次，知识点 = 已掌握人次 / 已评价人次，两维口径不同、分开看。整体 = 标准 + 拓展：标准 = 考查项属于课程标准（课程关联知识体系全集，技能含已发布任务快照），拓展 = 标准之外多教的内容（未关联体系课程的考查项计入拓展）。图例可点击开关各条曲线' + (vis.filter(function (s) { return !s.v.some(function (v) { return v != null; }); }).length ? '；当前周期部分已开启曲线暂无评价证据，不绘制折线' : '')) + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:2px 12px;margin:0 0 6px">' + TRLG.map(lg2).join('') + '<span class="note" style="align-self:center">点击开关曲线</span></div>' +
        (sv.some(function (v) { return v != null; }) ? (vis.length ? lineSVG(ws, vis) : '<div class="empty3">曲线已全部隐藏，点击图例开启</div>') : '<div class="empty3">本学期还没有课堂证据</div>') + '</div>';
    }
    // 课程对比 + 学生分布（每门课两行条：达成 = 实色，覆盖 = 浅色；覆盖率 = 该课程计划已教 ∩ 标准 / 标准，未关联知识体系显示 —）
    var crs = plans.filter(function (p) { return R.byPlan[p.id]; }).map(function (p) { var b = R.byPlan[p.id], k = kpRate(kpsAgg([p])), tc = TR.teachScope(S, [p]); return { n: p.course + ' · ' + (TK.planClsTxt(S, p) || ''), s: b.pairs ? TR.rate(b.pairs - b.no, b.pairs) : null, k: k.r, cs: tc.skCoverRate, ck: tc.kpCoverRate }; });
    var bar = function (v, c) { return '<span class="hb"><i style="width:' + (v || 0) + '%;background:' + c + '"></i></span><span class="hv">' + (v == null ? '—' : v + '%') + '</span>'; };
    var covBar = function (v, c) { return '<span class="hb"><i style="width:' + (v || 0) + '%;background:' + c + '"></i></span><span class="hv">' + (v == null ? '—' : v + '%') + '</span>'; };
    var tot = Object.keys(R.stdStu).length || 1;
    var legendH = '<div style="display:flex;flex-wrap:wrap;gap:2px 14px;margin:-2px 0 10px"><span class="lg"><i style="background:' + CS + '"></i>技能达成</span><span class="lg"><i style="background:' + CS2 + '"></i>技能覆盖</span><span class="lg"><i style="background:' + CK + '"></i>知识点达成</span><span class="lg"><i style="background:' + CK2 + '"></i>知识点覆盖</span></div>';
    var courseRows = crs.length ? crs.map(function (c) { return '<div class="cr" style="display:grid;grid-template-columns:220px 1fr 1fr;row-gap:4px;align-items:center"><div class="cn" style="grid-row:1/3" title="' + esc(c.n) + '">' + esc(c.n) + '</div><div class="cb">' + bar(c.s, CS) + '</div><div class="cb">' + bar(c.k, CK) + '</div><div class="cb">' + covBar(c.cs, CS2) + '</div><div class="cb">' + covBar(c.ck, CK2) + '</div></div>'; }).join('') : '<div class="empty3">还没有课堂证据</div>';
    var courseH = '<div class="ov-panel"><div class="ov-ph">各课程达成与覆盖' + qm('每门课两行条：上行 = 达成（技能达成率 = 已达成人次 / 已提交且已评价人次；知识点掌握率 = 已掌握 / 已评价，最近一次评价口径）；下行 = 覆盖（老师已教内容覆盖该课程计划标准要求的比例 = |已教 ∩ 标准| ÷ |标准|，标准 = 课程关联知识体系的技能 / 知识点全集，已教 = 该计划全部发布任务的考查项）。未关联知识体系的课程覆盖显示 —；各课程覆盖与顶部「教学覆盖率」（全校并集口径）数值不同属正常') + '</div>' + legendH + courseRows + '</div>';
    var stuH1 = '<div class="ov-ph">学生技能达成分布' + qm('按每人已评价技能的达成比例（已达成 / 已评价人次）分三档：≥80% / 60%–79% / 低于 60%；分母 = 每人已评价的技能对数，仅统计有评价的学生') + '</div>' +
        (Object.keys(R.stdStu).length ? '<div class="stk">' + [['hi', '≥80%', '#22c55e'], ['mid', '60%–79%', '#94a3b8'], ['lo', '<60%', '#ef4444']].map(function (x) { var c = band[x[0]].length; return c ? '<span style="flex:' + c + ';background:' + x[2] + '" title="' + x[1] + '：' + c + ' 名"></span>' : ''; }).join('') + '</div>' +
          '<div class="stl">' + [['hi', '达成 ≥80%', '#22c55e'], ['mid', '60%–79%', '#94a3b8'], ['lo', '低于 60%', '#ef4444']].map(function (x) { return '<div><i style="background:' + x[2] + '"></i>' + x[1] + '<b>' + band[x[0]].length + ' 名</b><span class="note">' + Math.round(band[x[0]].length * 100 / tot) + '%</span></div>'; }).join('') + '</div>' +
          (band.lo.length ? '<div class="note" style="margin-top:6px">低于 60%：' + band.lo.map(esc).join('、') + '</div>' : '') : '<div class="empty3">还没有课堂证据</div>');
    var stuH2 = '<div class="ov-ph">知识点掌握分布' + qm('按每人最近一次老师确认评价的掌握比例（已掌握 / 已评价知识点）分三档：≥80% / 60%–79% / 低于 60%；分母 = 该生最近一次评价中考查的知识点数，未考查不计入') + '</div>' +
        (ktot ? '<div class="stk">' + [['hi', '≥80%', '#22c55e'], ['mid', '60%–79%', '#94a3b8'], ['lo', '<60%', '#ef4444']].map(function (x) { var c = kband[x[0]].length; return c ? '<span style="flex:' + c + ';background:' + x[2] + '" title="' + x[1] + '：' + c + ' 名"></span>' : ''; }).join('') + '</div>' +
          '<div class="stl">' + [['hi', '掌握 ≥80%', '#22c55e'], ['mid', '60%–79%', '#94a3b8'], ['lo', '低于 60%', '#ef4444']].map(function (x) { return '<div><i style="background:' + x[2] + '"></i>' + x[1] + '<b>' + kband[x[0]].length + ' 名</b><span class="note">' + Math.round(kband[x[0]].length * 100 / ktot) + '%</span></div>'; }).join('') + '</div>' +
          (kband.lo.length ? '<div class="note" style="margin-top:6px">低于 60%：' + kband.lo.map(esc).join('、') + '</div>' : '') : '<div class="empty3">还没有知识点评价</div>');
    h += courseH + '<div class="ov-panel"><div class="st-grid"><div>' + stuH1 + '</div><div>' + stuH2 + '</div></div></div>';
    return h;
  }
  /* ── 教学成果多维明细（2026-11-24，与管理端数据概览同源 TR 口径，里外一致）──
     「数据概览」放汇总 + 趋势，这里放教学拓展明细；「明细」（按能力 / 课程 / 知识点 / 教师 tab）与「达成率最低的能力」已按用户要求移除（2026-11-25），kpsDetail / teacherRows / kpRateOf / kpBarHTML 等随之删除 */
  function inTerm(s) { var rg = termRange(); if (!rg || !s) return true; var d = new Date(String(s).replace(' ', 'T')); return d >= rg.a && d < rg.b; }
  /* 教学拓展明细（2026-11-25）：老师拓展的技能 / 知识点列表；「未覆盖的标准内容」模块已按用户要求移除（2026-11-25） */
  function coverExtDetail(plans) {
    var ts = TR.teachScope(S, plans);
    var nm = function (id, isKp) { var n = isKp ? (TK.kpById(id) || {}).name : TK.skillName(id); return (n && n !== id) ? n : id; };
    var extH = (function () {   // 教学拓展列表：每行 = 一个拓展技能 / 知识点，标注来自哪门课、哪个老师（2026-11-25 重排）
      var uniq = function (ws) { var seen = {}, out = []; (ws || []).forEach(function (w) { var k = w.course + '|' + w.teacher; if (!seen[k]) { seen[k] = 1; out.push(w); } }); return out; };
      var tag = function (t, c) { return '<span style="display:inline-block;padding:1px 8px;border-radius:9px;font-size:11.5px;font-weight:600;color:' + c + ';background:color-mix(in srgb,' + c + ' 12%, transparent)">' + t + '</span>'; };
      var row = function (type, c, id, ws, isKp) {
        var us = uniq(ws);
        return '<tr><td>' + tag(type, c) + '</td><td>' + esc(nm(id, isKp)) + '</td><td>' + (us.map(function (w) { return esc(w.course); }).join('、') || '<span class="note">—</span>') + '</td><td>' + (us.map(function (w) { return esc(w.teacher); }).join('、') || '<span class="note">—</span>') + '</td></tr>';
      };
      var rows = ts.extSkIds.map(function (id) { return row('技能', CS, id, (ts.skWhere || {})[id], false); })
        .concat(ts.extKpIds.map(function (id) { return row('知识点', CK, id, (ts.kpWhere || {})[id], true); }));
      return '<div class="ov-panel"><div class="ov-ph">教学拓展 · 老师超出标准多教的内容' + qm('口径：老师在课程标准要求之外多教的内容 = |已教 − 标准|（差集）；拓展内容计入达成率，但不计入覆盖率分母。归属 = 该内容实际出现在哪门课程计划的发布任务里（老师 = 该课程计划的任课教师）；同一内容在多个班教授时合并展示、去重') + '<span class="sp"></span><span class="note">拓展技能 ' + ts.extSk + ' 项 · 拓展知识点 ' + ts.extKp + ' 个</span></div>' +
        '<table class="tbl2"><thead><tr><th style="width:76px">类型</th><th>内容</th><th>来自课程</th><th>来自老师</th></tr></thead><tbody>' +
        (rows.length ? rows.join('') : '<tr><td colspan="4"><div class="empty3">当前范围暂无教学拓展内容</div></td></tr>') +
        '</tbody></table></div>';
    })();
    return extH;
  }
  function kpsAgg(only, asOf) { return TR.kpsAgg(S, only || scopePlans(true), asOf); }

  /* ── 课程改进建议 ── */
  function scopeNames() { var ids = majorIds(); return ids ? ids.map(majorName) : null; }
  function improve() {
    S = TK.load();
    var names = scopeNames(), all = (S.improves || []).filter(function (x) { return !names || names.indexOf(x.major) >= 0; });
    var list = all.filter(function (x) { return !F.st || x.status === F.st; }), pend = all.filter(function (x) { return x.status === '待处理'; }).length;
    var plans = S.plans.filter(function (p) { return TK.planMajors(S, p).some(inMajor); }), courses = uniq(plans.map(function (p) { return p.course; }));
    var abls = TR.compute(S, plans).abilities.map(function (r) { return r.name; });
    if (impForm && impForm.target && abls.indexOf(impForm.target) < 0) abls.unshift(impForm.target);
    var h = '<div class="tq-card"><div class="tq-h"><b>建议</b><span class="note">' + (pend ? pend + ' 条待处理' : '没有待处理的建议') + '</span></div>';
    if (impForm) {
      h += '<div style="border-bottom:1px solid var(--rule-2)"><div class="imp-f">' +
        '<label>建议类型<select data-imp-k="type" class="imp-in"><option>知识体系调整</option><option>能力图谱调整</option><option>课程安排</option><option>教学资源</option><option>其他</option></select></label>' +
        '<label>涉及课程<select data-imp-k="course" class="imp-in">' + courses.map(function (c) { return '<option' + (impForm.course === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
        '<label>涉及能力<select data-imp-k="target" class="imp-in"><option value="">（不指定）</option>' + abls.map(function (n) { return '<option' + (impForm.target === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></label>' +
        '<label style="grid-column:1/-1">建议内容<textarea data-imp-k="text" class="imp-in" rows="3" placeholder="例如：「旅游资源采购与供应商管理」支撑技能未达成较多，建议在《旅行社经营与管理》增加供应商谈判实训任务"></textarea></label></div>' +
        '<div style="display:flex;gap:10px;justify-content:flex-end;padding:0 14px 14px"><button class="btn-s" data-imp-cancel>取消</button><button class="btn" data-imp-save>提交给任课老师</button></div></div>';
    }
    h += (list.map(function (x) {
      var st = x.status === '待处理' ? 'color:var(--warn-ink)' : x.status === '已采纳' || x.status === '已发出' ? 'color:var(--good)' : 'color:var(--muted)';
      var acts = x.status === '待处理' && x.role !== '专业负责人' ? (impReply && impReply.id === x.id
          ? '<div style="margin-top:8px"><textarea data-imp-reply class="imp-in" rows="2" style="width:100%" placeholder="' + (impReply.act === '已采纳' ? '说明怎么调整，例如：下周在知识体系里拆出「报价构成」任务' : '说明暂不处理的原因') + '"></textarea><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px"><button class="btn-s" data-imp-cancel>取消</button><button class="btn" data-imp-done="' + x.id + '">确认' + impReply.act + '</button></div></div>'
          : '<div style="margin-top:6px;display:flex;gap:12px;align-items:center"><button class="btn-s" data-imp-act="' + x.id + '|已采纳">采纳</button><button class="btn-s" data-imp-act="' + x.id + '|暂不处理">暂不处理</button><a class="lk" href="' + esc(UI.link('graph/knowledge-system.html', 'admin')) + '">去知识体系调整 ›</a><a class="lk" href="' + esc(UI.link('graph/ability-graph.html', 'admin')) + '">去能力图谱调整 ›</a></div>') : '';
      return '<div class="imp"><span style="font-weight:600;' + st + '">' + esc(x.status) + '</span>　<b>' + esc(x.type) + '</b> · 《' + esc(x.course) + '》' + (x.target ? ' · ' + esc(x.target) : '') +
        '<span class="note" style="margin-left:8px">' + esc(x.role + ' ' + x.from + ' · ' + x.major + ' · ' + x.at) + '</span><div style="margin-top:4px">' + esc(x.text) + '</div>' +
        (x.reply ? '<div class="note" style="margin-top:4px">处理：' + esc(x.reply.by + '：' + x.reply.text + ' · ' + x.reply.at) + '</div>' : '') + acts + '</div>';
    }).join('') || '<div class="empty3">' + (all.length ? '没有符合条件的建议' : '还没有课程改进建议。老师在智慧课堂学情里提出的建议会出现在这里；也可以针对教学达成里未达成较多的能力提出建议，交给任课老师。') + '</div>');
    return h + '</div>';
  }
  function audit(action, object, after) { try { var st = DEMO.getState(), id = UI.currentIdentity(st); DEMO.addAudit(st, id.account.id, action, object, null, after, '成功'); DEMO.saveState(st); } catch (e) {} }

  function render() { filters(); $('#main').innerHTML = view === 'reach' ? reach() : improve(); }

  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-f'); if (!k) return;
    F[k] = e.target.value; if (k === 'major' || k === 'term') { F.course = ''; F.cls = ''; } render();
  });
  document.addEventListener('click', function (e) {
    var t;
    if (e.target.closest('[data-reset]')) { F.major = LEAD ? (LEAD[0] || '__none__') : ''; F.term = TK.TERM; F.course = ''; F.cls = ''; F.st = ''; render(); return; }
    if ((t = e.target.closest('[data-trlg]'))) { var k2 = t.getAttribute('data-trlg'); F.trlg[k2] = F.trlg[k2] ? 0 : 1; render(); return; }   // 按周趋势图例：开关曲线（与数据概览一致）
    if (e.target.closest('[data-imp-new]')) { impForm = { target: '', course: '' }; impReply = null; render(); return; }
    if (e.target.closest('[data-imp-cancel]')) { impForm = null; impReply = null; render(); return; }
    if ((t = e.target.closest('[data-imp-act]'))) { var ia = t.getAttribute('data-imp-act').split('|'); impReply = { id: ia[0], act: ia[1] }; impForm = null; render(); return; }
    if (e.target.closest('[data-imp-save]')) {
      var g = function (k) { var el = document.querySelector('[data-imp-k="' + k + '"]'); return el ? el.value.trim() : ''; };
      if (!g('text')) { document.querySelector('[data-imp-k="text"]').focus(); return; }
      if (!g('course')) { TK.toast('当前范围没有课程计划，不能提出建议'); return; }
      var TS = TK.load(), pl = TS.plans.filter(function (p) { return p.course === g('course') && TK.planMajors(TS, p).some(inMajor); })[0], cl = pl && TK.planCls(TS, pl)[0];
      TS.improves = TS.improves || [];
      TS.improves.unshift({ id: TK.uid('IMP'), planId: pl ? pl.id : '', course: g('course'), major: cl ? majorName(cl.majorId) : '', role: '专业负责人', from: iden.account.name, type: g('type'), target: g('target'), text: g('text'), at: TK.fmt(new Date()), status: '已发出', reply: null });
      TK.save(TS); audit('提出课程改进建议', g('course'), { 类型: g('type'), 能力: g('target') }); impForm = null; TK.toast('已发给《' + g('course') + '》的任课老师'); render(); return;
    }
    if ((t = e.target.closest('[data-imp-done]'))) {
      var note = ((document.querySelector('[data-imp-reply]') || {}).value || '').trim();
      if (!note) { document.querySelector('[data-imp-reply]').focus(); return; }
      var TS2 = TK.load(), x = (TS2.improves || []).filter(function (y) { return y.id === t.getAttribute('data-imp-done'); })[0];
      if (x) { x.status = impReply.act; x.reply = { by: iden.account.name, text: note, at: TK.fmt(new Date()) }; TK.save(TS2); audit('处理课程改进建议', x.course, { 结果: x.status, 说明: note }); }
      impReply = null; render(); return;
    }
  });
  render();
})();
</script>
</body>
