/* ═══ 竖树（默认视图）+ 全屏横向树 ═══
   默认：竖着展开/收起的树（行业 → 子行业 → 岗位 → 能力项 → 技能 → 下级节点），点末级/AI 节点同样由 AI 细分；
   点「全屏」切到原来的横向延展树（保存 / 自检 / AI 设置 / 面包屑 / 图例都在里面）。
   两个视图共用 aiStore，各自生成的 AI 节点互相可见。 */
const vExp = new Set([I.id]);      // 竖树里展开的节点 key
let vSel = null;                    // 竖树里选中的节点（ind/sub/pos/abl，供右侧详情高亮）
let vMeta = {};                     // key → {key,type,name,kind,chain,siblings,hasKids}

function vNode(key, type, name, kind, chain, siblings, depth, aiDepth, manual, desc, parent){
  let emg = '', badges = '', kids = [], statusHtml = '', bar = '';
  if(type==='ind'){
    kids = builtSubs.map(sid=>({key:sid,type:'sub',name:sub[sid].name,kind:null,aiDepth:0,
      chain:chain.concat([`子行业：${sub[sid].name}`]),
      siblings:builtSubs.filter(x=>x!==sid).map(x=>sub[x].name)}));
  } else if(type==='sub'){
    const s = sub[key];
    if(s.emerging) emg = '<span class="vt-emg">新兴</span>';
    kids = s.positionIds.map(pid=>({key:pid,type:'pos',name:pos[pid].name,kind:null,aiDepth:0,
      chain:chain.concat([`岗位：${pos[pid].name}`]),
      siblings:s.positionIds.filter(x=>x!==pid).map(x=>pos[x].name)}));
  } else if(type==='pos'){
    const p = pos[key];
    if(p.emerging) emg = '<span class="vt-emg">新兴</span>';
    kids = p.abilities.map(r=>({key:r.ability,type:'abl',name:abl[r.ability].name,kind:null,aiDepth:0,
      chain:chain.concat([`能力项：${abl[r.ability].name}`]),
      siblings:p.abilities.filter(x=>x.ability!==r.ability).map(x=>abl[x.ability].name)}));
  } else if(type==='abl'){
    const a = abl[key];
    if(a.emerging) emg = '<span class="vt-emg">新兴</span>';
    if(a.core) badges += '<span class="vt-core" title="核心能力">★</span>';
    kids = a.skills.map(kid=>({key:kid,type:'skl',name:skl[kid].name,kind:null,aiDepth:0,
      chain:chain.concat([`技能：${skl[kid].name}`]),
      siblings:a.skills.filter(x=>x!==kid).map(x=>skl[x].name)}));
    if(a._genning) statusHtml = `<div class="vt-status">AI 生成技能中…</div>`;
    else if(a._generr) statusHtml = `<div class="vt-status err">生成技能失败：${esc(a._generr)} · 点击重试</div>`;
  } else if(type==='skl'){
    const k = skl[key];
    if(k.emerging) emg = '<span class="vt-emg">新兴</span>';
    kids = k.children.map(nid=>({key:nid,type:'lf',name:snode[nid].name,kind:snode[nid].kind,aiDepth:0,
      chain:chain.concat([`${snode[nid].kind}：${snode[nid].name}`]),
      siblings:k.children.filter(x=>x!==nid).map(x=>snode[x].name)}));
  } else { // lf（末级节点）或 ai（AI 细分节点）
    const lv = aiStore[key];
    if(lv && lv.status==='ok'){
      const d = aiDepth + 1;
      kids = lv.items.map(it=>({key:it.key,type:'ai',name:it.name,kind,aiDepth:d,manual:it.manual,desc:it.desc,
        chain:chain.concat([`${kind}：${it.name}`]),
        siblings:lv.items.filter(x=>x.key!==it.key).map(x=>x.name)}));
    } else if(lv && lv.status==='loading'){
      statusHtml = `<div class="vt-status">AI 生成中…</div>`;
    } else if(lv && lv.status==='error'){
      statusHtml = `<div class="vt-status err" data-v-retry="${esc(key)}">生成失败：${esc(lv.err)} · 点击重试</div>`;
    }
    if(type==='ai') bar = manual
      ? `<span class="vbar" style="background:var(--kgt-${KIND[kind].c})"></span>`
      : `<span class="vbar dash" style="border-color:var(--kgt-${KIND[kind].c})"></span>`;
  }
  const ablPending = type==='abl' && abl[key] && (abl[key]._genning || abl[key]._generr || (!abl[key].skills.length && joinedNodes.some(r=>r.id===key)));
  const hasKids = (type==='lf' || type==='ai') ? true : (kids.length>0 || !!ablPending);
  const level = type==='ai' ? `AI 细分第${aiDepth}层` : `L${depth+1}`;
  vMeta[key] = {key, type, name, kind, chain, siblings, hasKids, level, desc, manual, parent, depth};
  const open = vExp.has(key);
  const sel = vSel && vSel.type===type && vSel.id===key;
  const tog = hasKids ? `<span class="vtog on" data-vtog title="${open?'收起':'展开下级（未生成时由 AI 生成）'}">${open?'▾':'▸'}</span>` : `<span class="vtog"></span>`;
  const kindTag = type==='lf' ? `<span class="vkind" style="color:var(--kgt-${KIND[kind].c})">${KIND[kind].tag}</span>` : '';
  let typeTag = '';
  if(type==='sub') typeTag = '<span class="vl-tag" style="color:var(--vl-sub)">子行业</span>';
  else if(type==='pos') typeTag = '<span class="vl-tag" style="color:var(--vl-pos)">岗位</span>';
  else if(type==='abl') typeTag = '<span class="vl-tag" style="color:var(--vl-abl)">能力</span>';
  else if(type==='skl') typeTag = '<span class="vl-tag" style="color:var(--vl-skl)">技能</span>';
  let ops = '';
  if(type==='ai'){
    ops = `<span class="vops"><button type="button" class="vop" data-vop="regen" aria-label="重新生成"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1"/><path d="M13.5 2.5v3h-3"/></svg></button>` +
      `<button type="button" class="vop" data-vop="edit" aria-label="编辑"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/></svg></button></span>`;
  }
  const row = `<div class="vrow${open?' open':''}${sel?' sel':''}" data-v="${esc(key)}">${tog}${bar}${kindTag}${typeTag}<span class="vname">${emg}${esc(name)}${badges}</span>${ops}</div>`;
  let kidsHtml = '';
  if(open){
    kidsHtml = kids.length
      ? `<div class="vkids">${kids.map(k=>vNode(k.key,k.type,k.name,k.kind,k.chain,k.siblings,depth+1,k.aiDepth,k.manual,k.desc,key)).join('')}</div>`
      : '';
    kidsHtml += statusHtml;
  }
  return row + kidsHtml;
}
function renderVTree(){ vMeta = {}; $('#vTree').innerHTML = vNode(I.id, 'ind', I.name, null, [`行业：${I.name}`], [], 0, 0, null, null); }

function toggleV(key){ if(vExp.has(key)) vExp.delete(key); else vExp.add(key); renderVTree(); }

// 切全屏时，把竖树当前的展开路径同步到横向树（exp / sel / skx / ai），保证两视图一致。
// 取竖树里「整条祖先链都展开」的最深节点，沿 parent 链回溯出横向树的一列链；AI 层复用 aiStore 缓存，无缓存则不展开（避免切全屏触发 AI 调用）。
function syncFsFromVTree(){
  exp = null; sel = null; skx = null; ai = [];
  let best = null, bestPath = null;
  vExp.forEach(key => {
    const m = vMeta[key];
    if(!m) return;
    const path = [];
    let node = m, ok = true;
    while(node){
      path.unshift(node);
      const p = node.parent;
      if(p == null) break;
      const pm = vMeta[p];
      if(!pm || !vExp.has(p)){ ok = false; break; }
      node = pm;
    }
    if(!ok) return;
    if(!best || m.depth > best.depth){ best = m; bestPath = path; }
  });
  if(!best || !bestPath) return;
  for(const m of bestPath){
    if(m.type === 'pos') exp = m.key;
    else if(m.type === 'abl') sel = {type:'abl', id:m.key};
    else if(m.type === 'skl') skx = m.key;
    else if(m.type === 'lf' || m.type === 'ai'){
      const lv = aiStore[m.key];
      if(lv && lv.status === 'ok'){ lv.parentName = m.name; ai.push(lv); }
    }
  }
}

// 竖树里的 AI 细分：与横向树同一套提示词 / 输出结构 / 缓存（aiStore），只是不维护横向列路径状态
async function vExpand(m){
  const key = m.key;
  const existing = aiStore[key];
  if(existing && existing.status==='ok'){ vExp.add(key); renderVTree(); return; }
  const cfg = aiCfg();
  if(!cfg.key){
    aiStore[key] = {parent:key, parentName:m.name, kind:m.kind, status:'error', items:[], err:'尚未填写 API Key', keep:[]};
    vExp.add(key); openAiCfg(); renderVTree(); return;
  }
  aiStore[key] = {parent:key, parentName:m.name, kind:m.kind, status:'loading', items:[], err:'', keep:[]};
  vExp.add(key); renderVTree();
  const chain = m.chain || [], siblings = m.siblings || [];
  const system = '你是职业教育课程设计与行业能力分析专家。用户给出从行业到当前节点的归属链，你把最后一个节点拆分为更细的下级节点，内容要准确、具体、可教学，不编造法规条款编号。拆分必须始终停留在该岗位与能力项的场景内，不得扩展到无关领域。';
  const prompt =
    `归属链：\n${chain.join('\n')}\n\n` +
    (siblings.length ? `与「${m.name}」同层的其它节点（下级节点不要与它们的内容重复）：${siblings.join('、')}\n\n` : '') +
    `请把最后一个节点「${m.name}」${AI_RULE[m.kind]}。\n` +
    `要求：生成 3–6 个下级节点；name 不超过 20 个汉字；desc 一句话说明，不超过 40 个汉字；` +
    `如果该节点已经无法再合理细分，返回空数组。`;
  try {
    const out = await aiCallJSON(cfg, system, prompt, AI_EXPAND_OPT);
    const cur = aiStore[key];
    if(cur && cur.status==='loading'){
      cur.items = (out.children||[]).filter(x=>x && x.name).map(x=>({key:`${key}/${newKeyPart('a')}`, name:x.name.trim(), desc:(x.desc||'').trim()}));
      cur.status = 'ok';
    }
  } catch(err){
    const cur = aiStore[key];
    if(cur && cur.status==='loading'){ cur.status='error'; cur.err = err.message || String(err); }
  }
  renderVTree(); renderSaveBtn();
}

$('#vTree').addEventListener('click', e=>{

function vToggleOrGen(m){
  if(m.type==='abl'){
    const a = abl[m.key];
    if(a && a._generr) genSkillsForAbility(m.key);
    else if(a && !a._genning && !a.skills.length && joinedNodes.some(r=>r.id===m.key)) genSkillsForAbility(m.key);
    else toggleV(m.key);
  } else if(m.type==='lf' || m.type==='ai'){
    const lv = aiStore[m.key];
    if(lv && (lv.status==='ok' || lv.status==='loading')) toggleV(m.key);
    else vExpand(m);
  } else toggleV(m.key);
}

/* ═══ 市场趋势条目「加入主树」：动态插入子行业/岗位/能力项/技能，持久化到 localStorage ═══ */
const JOINED_KEY = 'kmapJoined.v2';
let joinedNodes = [];   // 已加入记录：一条 = 一个新能力项（+ 可选生成的技能）

function loadJoined(){
  let raw = null;
  try { raw = localStorage.getItem(JOINED_KEY); } catch(e){}
  if(raw){ try { joinedNodes = JSON.parse(raw).filter(Boolean); } catch(e){ joinedNodes = []; } }
  joinedNodes.forEach(applyJoin);
  recomputeLayout();
}
function saveJoined(){
  try { localStorage.setItem(JOINED_KEY, JSON.stringify(joinedNodes)); }
  catch(e){ showToast('保存失败：浏览器不允许本地存储'); }
}
function applySkills(rec){
  const a = abl[rec.id]; if(!a) return;
  const skids = [];
  (rec.skills || []).forEach(sk=>{
    if(!sk || !sk.name) return;
    if(!skl[sk.id]) skl[sk.id] = {id:sk.id, name:sk.name, emerging:false, abilityIds:[rec.id], children:[]};
    (sk.children || []).forEach(n=>{
      if(!n || !n.name || !KIND[n.kind]) return;
      if(!snode[n.id]) snode[n.id] = {id:n.id, kind:n.kind, name:n.name};
      if(!skl[sk.id].children.includes(n.id)) skl[sk.id].children.push(n.id);
    });
    skids.push(sk.id);
  });
  a.skills = skids;
}
function applyJoin(rec){
  if(!rec || !rec.id || !rec.pid) return;
  if(rec.kind==='branch'){
    if(!sub[rec.subId]){
      sub[rec.subId] = {id:rec.subId, name:rec.subName, emerging:true, detail:{}, positionIds:[], distinctAbilityCount:0, built:true};
    }
    if(!pos[rec.posId]){
      pos[rec.posId] = {id:rec.posId, name:rec.posName, sub:rec.subId, aliases:[], emerging:true, detail:{}, abilities:[], abilityCount:0, l3Count:0};
    }
    if(!sub[rec.subId].positionIds.includes(rec.posId)) sub[rec.subId].positionIds.push(rec.posId);
    if(!builtSubs.includes(rec.subId)){ builtSubs.push(rec.subId); subSharedSet[rec.subId] = new Set(); }
  }
  if(abl[rec.id]){ applySkills(rec); return; }
  abl[rec.id] = {id:rec.id, name:rec.name, type:'skill', domain:'市场新兴', core:false, emerging:true,
    detail:{describe:rec.desc || ''}, requiredBy:[{position:rec.pid, weight:0, level:'L1'}],
    positionCount:1, maxRequiredLevel:'L1', typeCn:'技能', acrossSubIndustries:[rec.sid], skills:[]};
  if(pos[rec.pid]){
    pos[rec.pid].abilities.push({ability:rec.id, weight:0, level:'L1'});
    pos[rec.pid].abilityCount = pos[rec.pid].abilities.length;
  }
  if(sub[rec.sid]) sub[rec.sid].distinctAbilityCount = (sub[rec.sid].distinctAbilityCount || 0) + 1;
  applySkills(rec);
}
function removeJoin(rec){
  if(!rec) return;
  (rec.skills || []).forEach(sk=>{
    if(!sk) return;
    if(skl[sk.id]){ (skl[sk.id].children || []).forEach(n=>{ delete snode[n]; }); delete skl[sk.id]; }
  });
  if(abl[rec.id]) delete abl[rec.id];
  if(pos[rec.pid]){
    pos[rec.pid].abilities = pos[rec.pid].abilities.filter(r=>r.ability!==rec.id);
    pos[rec.pid].abilityCount = pos[rec.pid].abilities.length;
  }
  if(sub[rec.sid]) sub[rec.sid].distinctAbilityCount = Math.max(0, (sub[rec.sid].distinctAbilityCount || 1) - 1);
  if(rec.kind==='branch'){
    if(sub[rec.subId] && sub[rec.subId].positionIds.length <= 1){ delete sub[rec.subId]; delete subSharedSet[rec.subId]; builtSubs = builtSubs.filter(x=>x!==rec.subId); }
    delete pos[rec.posId];
  }
}
const jid = p => p + newKeyPart('');   // 动态节点 id：J… 前缀 + 随机尾缀
function joinAbility(idx){
  const arr = (marketTrends && marketTrends.abilities) || [];
  const item = arr[idx]; if(!item) return;
  const pid = Object.values(pos).find(p=>p.name===item.position);
  if(!pid){ showToast(`找不到岗位「${item.position}」，请重新获取市场趋势`); return; }
  const rec = {id:jid('JABL-'), name:item.name, desc:[item.desc, item.emergingReason].filter(Boolean).join('；'),
    kind:'abl', pid:pid.id, sid:pos[pid.id].sub, src:'abl:'+item.name, skills:null};
  joinedNodes.push(rec); saveJoined(); applyJoin(rec); recomputeLayout();
  vSel = null; renderVTree(); renderGraph(); renderMarket();
  showToast(`已把「${item.name}」加入能力图谱树`);
}
function joinBranch(idx){
  const arr = (marketTrends && marketTrends.branches) || [];
  const item = arr[idx]; if(!item) return;
  const sid = jid('JSUB-'), pid = jid('JPOS-'), aid = jid('JABL-');
  const rec = {id:aid, name:item.ability, desc:item.desc || '',
    kind:'branch', pid, sid, subId:sid, subName:item.subIndustry, posId:pid, posName:item.position,
    src:'branch:'+item.subIndustry+'>'+item.position+'>'+item.ability, skills:null};
  joinedNodes.push(rec); saveJoined(); applyJoin(rec); recomputeLayout();
  vSel = null; renderVTree(); renderGraph(); renderMarket();
  showToast(`已把「${item.subIndustry} › ${item.position} › ${item.ability}」加入能力图谱树`);
}
function unjoin(src){
  const i = joinedNodes.findIndex(r=>r.src===src);
  if(i<0) return;
  const [rec] = joinedNodes.splice(i, 1);
  removeJoin(rec); saveJoined(); recomputeLayout();
  vSel = null; renderVTree(); renderGraph(); renderMarket();
  showToast('已从能力图谱树移除');
}

// 已加入的能力项：点开时由 AI 生成「技能 → 末级」两层
const SKILLS_SCHEMA = {type:'object', additionalProperties:false, required:['skills'],
  properties:{ skills:{type:'array', items:{type:'object', additionalProperties:false,
    required:['name','nodes'], properties:{ name:{type:'string'},
      nodes:{type:'array', items:{type:'object', additionalProperties:false,
        required:['kind','name'], properties:{ kind:{type:'string', enum:['知识点','操作步骤','标准','案例']}, name:{type:'string'} } } } } } } } };
const SKILLS_OPT = {schema:SKILLS_SCHEMA, effort:'medium', maxTokens:4000,
  formatHint:'{"skills":[{"name":"技能名","nodes":[{"kind":"知识点|操作步骤|标准|案例","name":"末级节点名"}]}]}'};
async function genSkillsForAbility(aid){
  const a = abl[aid]; const rec = joinedNodes.find(r=>r.id===aid);
  if(!a || !rec) return;
  if(a.skills && a.skills.length) return;
  const cfg = aiCfg();
  if(!cfg.key){ openAiCfg(); return; }
  a._genning = true; delete a._generr;
  vExp.add(aid); renderVTree();
  const system = '你是职业教育课程设计与行业能力分析专家。给出一条能力项，把它拆分为 3–6 项可教学的技能，每项技能再给 2–4 个末级节点（知识点 / 操作步骤 / 标准 / 案例）。内容准确、具体、可教学，不编造法规条款编号。';
  const prompt =
    `行业：${I.name}\n` +
    `子行业：${sub[a.acrossSubIndustries[0]].name}\n` +
    `岗位：${pos[a.requiredBy[0].position].name}\n` +
    `能力项：${a.name}\n` +
    (rec.desc ? `说明：${rec.desc}\n\n` : '\n') +
    `请为该能力项生成技能及每项技能下的末级节点。`;
  try {
    const out = await aiCallJSON(cfg, system, prompt, SKILLS_OPT);
    rec.skills = (out.skills || []).filter(s=>s && s.name).map(s=>({
      id: jid('JSKS-'), name: s.name.trim(),
      children: (s.nodes || []).filter(n=>n && n.name && KIND[n.kind]).map(n=>({id: jid('JNOD-'), kind: n.kind, name: n.name.trim()})),
    }));
    saveJoined(); applySkills(rec);
    showToast('已生成技能与末级节点');
  } catch(err){
    a._generr = err.message || String(err);
  }
  delete a._genning;
  renderVTree();
}

// 首次渲染放在最后：用到的状态（自检、已保存的 AI 节点等）都已声明并载入
loadJoined();
renderGraph();
renderVTree();
openNodeDetail('ind', I.id);   // 右侧详情默认显示行业

/* ═══ 市场趋势：AI 获取市场最新能力，独立区块展示（不进主树） ═══ */
const MARKET_KEY = 'kmapMarketTrends.v2';
let marketTrends = null;   // {abilities:[…], branches:[…], checkedAt}

function renderMarket(){
  const el = $('#marketBody');
  const ab = (marketTrends && marketTrends.abilities) || [];
  const br = (marketTrends && marketTrends.branches) || [];
  if(!ab.length && !br.length){
    el.innerHTML = `<div class="trend-empty">点击左上角「获取市场最新能力」<br>获取当前市场前沿能力</div>`;
    return;
  }
  const act = (src, joinAttr, unjoinAttr) =>
    joinedNodes.some(r=>r.src===src)
      ? `<button class="btn-s" type="button" ${unjoinAttr}>已加入 ✓ · 移除</button>`
      : `<button class="btn-s btn-p" type="button" ${joinAttr}>加入能力图谱树</button>`;
  let html = '';
  if(ab.length){
    html += `<div class="trend-sec"><div class="trend-sec-h">新兴能力项</div>` +
      ab.map((a,i)=>{
        const src = 'abl:'+a.name;
        return `<div class="trend-item">
        <div class="trend-item-h"><b>${esc(a.name)}</b><span class="trend-emg">新兴</span>${a.position?`<span class="trend-pos">挂到 · ${esc(a.position)}</span>`:''}</div>
        ${a.desc?`<p>${esc(a.desc)}</p>`:''}${a.emergingReason?`<p class="trend-pos">新兴原因：${esc(a.emergingReason)}</p>`:''}
        <div class="trend-act">${act(src, `data-join="abl" data-mi="${i}"`, `data-unjoin="${esc(src)}"`)}</div>
      </div>`;
      }).join('') + `</div>`;
  }
  if(br.length){
    html += `<div class="trend-sec"><div class="trend-sec-h">新兴子行业 / 岗位 / 能力</div>` +
      br.map((b,i)=>{
        const src = 'branch:'+b.subIndustry+'>'+b.position+'>'+b.ability;
        return `<div class="trend-item">
        <div class="trend-branch"><b>${esc(b.subIndustry)}</b><span class="tsep">›</span>${esc(b.position)}<span class="tsep">›</span>${esc(b.ability)}</div>
        ${b.desc?`<p>${esc(b.desc)}</p>`:''}
        <div class="trend-act">${act(src, `data-join="branch" data-mi="${i}"`, `data-unjoin="${esc(src)}"`)}</div>
      </div>`;
      }).join('') + `</div>`;
  }
  el.innerHTML = html;
}
function loadMarket(){
  let raw = null;
  try { raw = localStorage.getItem(MARKET_KEY); } catch(e){}
  if(raw){ try { marketTrends = JSON.parse(raw); } catch(e){ marketTrends = null; } }
  renderMarket();
}
function saveMarket(){
  try { localStorage.setItem(MARKET_KEY, JSON.stringify(marketTrends)); }
  catch(e){ showToast('保存失败：浏览器不允许本地存储'); }
}
async function fetchMarket(){
  const cfg = aiCfg();
  if(!cfg.key){ openAiCfg(); return; }
  const btn = $('#marketBtn');
  btn.disabled = true; btn.textContent = '获取中…';
  const system = '你是职业教育与行业能力分析专家。基于你对旅游行业市场的最新了解，归纳该行业市场上前沿、新兴的能力与岗位方向，内容要具体、可教学，不编造具体法规条款编号。';
  const prompt =
    `行业：${I.name}\n\n现有子行业：${Object.values(sub).map(s=>s.name).join('、')}\n\n` +
    `现有岗位：${Object.values(pos).map(p=>p.name).join('、')}\n\n` +
    `现有能力项：${Object.values(abl).map(a=>a.name).join('、')}\n\n` +
    `请归纳当前市场上该行业最新、前沿的能力与方向，分两类输出：\n` +
    `1. abilities：3–6 条新兴能力项，每条 position 指明挂到上面哪个现有岗位；\n` +
    `2. branches：1–3 条市场新出现的「子行业 → 岗位 → 能力」分支（不在现有子行业/岗位/能力里）；\n` +
    `要求：名称不超过 20 个汉字，说明不超过 40 个汉字；避免与现有能力项/岗位/子行业重名。`;
  try {
    const out = await aiCallJSON(cfg, system, prompt, MARKET_OPT);
    marketTrends = {
      abilities: (out.abilities||[]).filter(x=>x && x.name),
      branches: (out.branches||[]).filter(x=>x && x.subIndustry && x.position && x.ability),
      checkedAt: new Date().toISOString(),
    };
    saveMarket(); renderMarket();
    showToast('已获取市场最新能力');
  } catch(err){
    showToast(`获取失败：${err.message || err}`);
  } finally {
    btn.disabled = false; btn.textContent = '获取市场最新能力';
  }
}
$('#marketBtn').addEventListener('click', fetchMarket);
$('#clearMarketBtn').addEventListener('click', ()=>{
  marketTrends = null;
  try { localStorage.removeItem(MARKET_KEY); } catch(e){}
  renderMarket();
  showToast('已清除市场趋势');
});
$('#marketBody').addEventListener('click', e=>{
  const un = e.target.closest('[data-unjoin]');
  if(un){ unjoin(un.dataset.unjoin); return; }
  const jn = e.target.closest('[data-join]');
  if(!jn) return;
  const mi = +jn.dataset.mi;
  if(jn.dataset.join==='abl') joinAbility(mi);
  else if(jn.dataset.join==='branch') joinBranch(mi);
});

/* ═══ 竖树 AI 节点：右键「编辑 / 重新生成 / 删除」（与横向全景图共用 aiStore） ═══ */
let vEditing = null;   // {key, lv, j, it}
let vUndo = null;
function vNodeLocate(key){
  const parent = key.slice(0, key.lastIndexOf('/'));
  const lv = aiStore[parent];
  if(!lv) return null;
  const j = lv.items.findIndex(x => x.key === key);
  if(j < 0) return null;
  return {lv, j, it: lv.items[j]};
}
function vOpenEditNode(key){
  const loc = vNodeLocate(key);
  if(!loc) return;
  vEditing = {key, ...loc};
  $('#nodeDlgTitle').textContent = '编辑节点';
  $('#nodeDlgNote').textContent = '名称不超过 20 个字，说明不超过 40 个字。修改后该节点需要重新自检。';
  $('#nodeName').value = loc.it.name;
  $('#nodeDesc').value = loc.it.desc || '';
  $('#nodeDlg').showModal(); $('#nodeName').select();
}
function saveVNodeEdit(){
  const e = vEditing; vEditing = null;
  if(!e) return;
  const name = $('#nodeName').value.trim(), desc = $('#nodeDesc').value.trim();
  if(!name) return;
  e.it.name = name; e.it.desc = desc; e.it.edited = true; e.it.check = null;
  const child = aiStore[e.key];
  if(child) child.parentName = name;   // 已展开的下级列列头跟着改
  renderVTree(); renderSaveBtn();
}
function vEditNode(key){ vOpenEditNode(key); }
async function vRegenNode(key){
  const loc = vNodeLocate(key);
  if(!loc) return;
  const {lv, it} = loc;
  const m = vMeta[key];
  if(!m || it.genning) return;
  const cfg = aiCfg();
  if(!cfg.key){ openAiCfg(); return; }
  const old = {name:it.name, desc:it.desc, check:it.check, edited:!!it.edited, regen:!!it.regen, below: aiStore[key]};
  it.genning = true; renderVTree();
  const chain = m.chain || [];
  const siblings = m.siblings || [];
  const hint = (it.check && it.check.verdict!=='pass')
    ? `\n该节点自检判定为「${SC_MARK[it.check.verdict].label}」${it.check.reason?`：${it.check.reason}`:''}${it.check.suggestion?`；修改建议：${it.check.suggestion}`:''}`
    : '';
  const system = '你是职业教育课程设计与行业能力分析专家。用户给出从行业到当前节点的归属链与同层节点，请你重新生成其中一个节点，内容要准确、具体、可教学，不编造法规条款编号。生成的节点必须仍属于该岗位与能力项的场景内，不得扩展到无关领域。';
  const prompt =
    `归属链：\n${chain.join('\n')}\n\n` +
    `同层节点（重新生成的名称/说明不要与它们重复）：${siblings.join('、') || '（无）'}\n\n` +
    `请重新生成节点「${it.name}」（类型：${m.kind}）。${hint}\n` +
    `要求：name 不超过 20 个汉字；desc 一句话说明，不超过 40 个汉字。`;
  let out;
  try {
    out = await aiCallJSON(cfg, system, prompt, NODE_REG_OPT);
  } catch(err){
    if(aiStore[lv.parent] && aiStore[lv.parent].items.includes(it)){ delete it.genning; renderVTree(); showToast(`重新生成失败：${err.message||err}`); }
    return;
  }
  if(!aiStore[lv.parent] || !aiStore[lv.parent].items.includes(it)) return;
  delete aiStore[key]; vExp.delete(key);   // 收起已展开的下级列
  it.name = ((out.name||'').trim()) || it.name;
  it.desc = (out.desc||'').trim();
  it.check = null; delete it.edited; it.regen = true;
  delete it.genning;
  renderVTree(); renderSaveBtn();
  showToast(`已重新生成「${it.name}」`, '撤销', ()=>{
    if(!aiStore[lv.parent] || !aiStore[lv.parent].items.includes(it)) return;
    it.name = old.name; it.desc = old.desc; it.check = old.check;
    if(old.edited) it.edited = true; else delete it.edited;
    if(old.regen) it.regen = true; else delete it.regen;
    if(old.below) aiStore[key] = old.below;
    renderVTree(); renderSaveBtn();
  });
}
function vDeleteNode(key){
  const loc = vNodeLocate(key);
  if(!loc) return;
  const {lv, j, it} = loc;
  const below = aiStore[key];
  if(below) delete aiStore[key];
  vExp.delete(key);
  lv.items.splice(j, 1);
  vUndo = {lv, j, it, below};
  renderVTree(); renderSaveBtn();
  showToast(`已删除「${it.name}」`, '撤销', ()=>{
    if(!vUndo || aiStore[vUndo.lv.parent] !== vUndo.lv) return;
    vUndo.lv.items.splice(Math.min(vUndo.j, vUndo.lv.items.length), 0, vUndo.it);
    if(vUndo.below) aiStore[key] = vUndo.below;
    vUndo = null; renderVTree(); renderSaveBtn();
  });
}
$('#vTree').addEventListener('contextmenu', e=>{
  const row = e.target.closest('[data-v]');
  if(!row){ hideCtx(); return; }
  const m = vMeta[row.dataset.v];
  if(!m || m.type !== 'ai'){ hideCtx(); return; }
  e.preventDefault();
  vCtxTarget = {key: m.key};
  const menu = $('#ctxMenu');
  $('#ctxTitle').textContent = m.name;
  menu.hidden = false;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(e.clientX, innerWidth - w - 8) + 'px';
  menu.style.top  = Math.min(e.clientY, innerHeight - h - 8) + 'px';
  menu.querySelector('button').focus();
});
$('#vTree').addEventListener('scroll', hideCtx);

loadMarket();
</script>
