<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号与角色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
/* 账号与角色页业务布局 */
.m-hid{color:var(--muted);font-family:var(--mono);font-size:11px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 18px}
.kv2 .kk{color:var(--muted);font-size:11.5px}
.kv2 .vv{font-size:13px;color:var(--ink);word-break:break-all}
.sec-h{font-size:12.5px;font-weight:700;margin:4px 0 8px}
.aidlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.aidlg-h h2{flex:1 1 auto;min-width:0}
.whyq{width:22px;height:22px;border-radius:50%;background:var(--card-2);border:1px solid var(--rule);
  color:var(--ink-2);font-size:12px;font-weight:700;display:inline-grid;place-items:center;
  cursor:help;flex:0 0 22px}
.whyq:hover{border-color:var(--brand);color:var(--brand-ink)}
.dt-row.filt{opacity:.55}
.dt-row.filt .cell-s{color:var(--warn-ink)}

/* 账号管理：筛选栏 + 宽表横向滚动 + 多值单元格 */
.act-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule)}
.act-filter .f-search{flex:1 1 190px;min-width:150px;font:inherit;font-size:12.5px;padding:7px 10px;
  border:1px solid var(--rule);border-radius:8px;background:var(--card-2);color:var(--ink)}
.act-filter .f-search:focus{outline:none;border-color:var(--brand)}
.act-filter select{font:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card-2);color:var(--ink);max-width:150px}
.act-filter .f-count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.act-table{overflow-x:auto}
.act-table .dt-row{min-width:1190px}
.cell-list{font-size:11px;color:var(--ink-2);line-height:1.55;word-break:break-all}
.detail-sec{margin-top:14px}
.detail-sec:first-child{margin-top:0}
/* 所属组织多选：左组织树 + 右已选 */
.otp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.otp-title{font-size:11.5px;font-weight:600;color:var(--ink-2);padding:8px 10px;background:var(--card-2);border-bottom:1px solid var(--rule)}
.otp-scroll{max-height:220px;overflow-y:auto;padding:8px 10px}
.otp-org{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12.5px;color:var(--ink);cursor:pointer;border-radius:6px}
.otp-org:hover{background:var(--card-2)}
.otp-org input{flex:0 0 auto}
.otp-org.dis{opacity:.55;cursor:default}
.otp-org.dis:hover{background:transparent}
.otp-type{flex:0 0 auto;font-size:10.5px;font-family:var(--mono);color:var(--muted)}
.otp-sel{max-height:220px;overflow-y:auto;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.otp-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--brand-soft, #eef2ff);color:var(--brand, #3b5bdb)}
.otp-rm{border:none;background:transparent;color:inherit;font-size:14px;line-height:1;cursor:pointer;padding:0 1px}
.otp-rm:hover{opacity:.7}

/* 所属组织：主组织标签 + 兼职灰色 */
.org-main{font-weight:500}
.org-tag{display:inline-block;font-size:10px;font-family:var(--mono);font-weight:500;padding:0 5px;border-radius:5px;background:var(--brand-soft,#eef2ff);color:var(--brand,#3b5bdb);margin-left:5px;vertical-align:1px}
.org-part{color:var(--ink-2)}
.org-sep{color:var(--muted);margin:0 5px}
.part-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}
.part-tree{max-height:220px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;margin-top:4px}

/* 角色分配卡片 */
.asgcard{border:1px solid var(--rule);border-radius:11px;padding:13px 14px;margin-bottom:12px;background:var(--card-2)}
.asgcard .dr-k{margin-bottom:9px}
.asgcard select{width:100%}
.orgline{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.orgline .ocl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink)}
.gchk{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);margin-right:10px;white-space:nowrap}
.grps{display:inline-flex;flex-wrap:wrap;gap:2px 0;margin-left:4px;align-items:center}
.grps[hidden]{display:none}
.majline{padding:3px 0}
.kl{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 0;color:var(--ink)}
.kl .cell-s{font-size:10.5px;color:var(--muted)}
.idc{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;margin-top:4px;color:var(--ink)}
.stopped-card{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.stopped-card:first-of-type{border-top:0}

/* 组织为主录入：组织行 + 角色多选 + 主组织 */
.orgrow{border:1px solid var(--rule);border-radius:12px;padding:12px 14px 13px;margin-bottom:10px;background:var(--card-2)}
.orgrow.ro{opacity:.62}
.orgrow-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.orgrow-title{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.6;min-width:0}
.ro-note{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:6px;white-space:nowrap}
.orgrow-head-acts{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.orgrow .orgrow-primary{display:inline-flex;flex-direction:row;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.orgrow-primary input{accent-color:var(--brand);margin:0;width:15px;height:15px}
.orgrow-body{display:flex;flex-direction:column;gap:9px}
.orgrow .orgrow-org{display:flex;flex-direction:column;gap:4px}
.orgrow-org .field-label{font-size:11.5px;color:var(--muted)}
.orgrow-org select{width:100%}
.orgrow-ro{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.role-tags{display:flex;flex-wrap:wrap;gap:6px}
.role-tags:empty{display:none}
.rtag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--brand-soft, #eef2ff);color:var(--brand, #3b5bdb)}
.rtag-x{border:none;background:transparent;color:inherit;font-size:14px;line-height:1;cursor:pointer;padding:0 1px;opacity:.7}
.rtag-x:hover{opacity:1}
.orgrow-pick{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.orgrow-pick .field-label{font-size:11.5px;color:var(--muted)}
.orgrow-pick .field-label .req{color:var(--crit)}
.pick-body{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addsel{font:inherit;font-size:12px;color:var(--brand,#3b5bdb);background:transparent;border:1px dashed var(--rule);border-radius:999px;padding:3px 10px;cursor:pointer;max-width:100%}
.addsel:hover{border-color:var(--brand);background:var(--brand-soft,#eef2ff)}
.addsel:focus{outline:none;border-color:var(--brand)}
.addorg{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:12.5px;padding:8px;border:1px dashed var(--rule);border-radius:9px;background:transparent;color:var(--ink-2);cursor:pointer}
.addorg:hover{border-color:var(--brand);color:var(--brand, #3b5bdb);background:var(--brand-soft, #eef2ff)}
.portal-line{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.portal-line b{color:var(--ink-2);font-weight:500}
.primary-line{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.primary-line b{color:var(--ink-2);font-weight:500}
.role-org-cell{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--ink-2)}
.org-role-line{font-size:12.5px;color:var(--ink);padding:2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* 角色管理（左右分栏 + 详情） */
.role-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.role-layout{grid-template-columns:1fr}}
.role-list-panel{background:var(--card);border:1px solid var(--rule);border-radius:13px;overflow:hidden;
  display:flex;flex-direction:column;max-height:calc(100vh - 204px);position:sticky;top:118px}
.role-toolbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--rule);align-items:center}
.role-search{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card-2);color:var(--ink)}
.role-search:focus{outline:none;border-color:var(--brand)}
.role-list{overflow-y:auto;flex:1}
.role-item{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--rule-2);
  cursor:pointer;transition:background .12s}
.role-item:first-child{border-top:0}
.role-item:hover{background:var(--rule-2)}
.role-item.is-active{background:var(--brand-soft)}
.role-item-head{display:flex;align-items:center;gap:8px}
.role-item-title{font-size:13px;font-weight:600;color:var(--ink)}
.role-status{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid transparent}
.role-status.enabled{background:var(--good-bg);color:var(--good)}
.role-status.disabled{background:var(--crit-bg);color:var(--crit)}
.role-item-desc{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.role-item-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.role-detail-panel{background:var(--card);border:1px solid var(--rule);border-radius:13px;overflow:hidden}
.detail-topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.detail-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-badge{font-family:var(--mono);font-size:11px;font-weight:400;padding:2px 9px;border-radius:20px;
  background:var(--card-2);color:var(--ink-2);border:1px solid var(--rule)}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.role-tabs{display:flex;gap:3px;padding:10px 18px;border-bottom:1px solid var(--rule)}
.rtab{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.rtab:hover{background:var(--rule-2);color:var(--ink)}
.rtab.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.role-tab-pane{padding:18px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
@media (max-width:720px){.form-grid{grid-template-columns:1fr}}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-group.field-full{grid-column:1/-1}
.field-label{font-size:11.5px;color:var(--muted)}
.field-value{font-size:13px;color:var(--ink);min-height:20px;display:flex;align-items:center;gap:8px}
.field-value.mono{font-family:var(--mono)}
.switch{position:relative;width:40px;height:22px;border-radius:20px;background:var(--rule);border:1px solid var(--rule);
  cursor:pointer;transition:background .15s;flex:0 0 auto}
.switch.on{background:var(--brand);border-color:var(--brand)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on::after{transform:translateX(18px)}
.switch.locked{opacity:.5;cursor:not-allowed}
.rm{font-weight:600;font-size:12.5px;margin:14px 0 4px;color:var(--ink)}
.rr{font-size:11.5px;color:var(--ink-2);margin:4px 0 2px}
.op{display:inline-block;font-size:11px;padding:1px 9px;border-radius:6px;border:1px solid var(--rule);color:var(--muted);margin:2px 5px 2px 0}
.op.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:500}
/* 配置角色菜单权限树 */
.pgroup{padding:9px 0;border-bottom:1px solid var(--rule-2)}
.pgroup:last-child{border-bottom:0}
.pgroup-h{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;padding:3px 0}
.pitems{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 0 2px 24px}
.pitem{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:2px 0}
.pgroup-h input,.pitem input{accent-color:var(--brand);margin:0}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop">
      <div class="ptop-r">
        <div class="pt-l">
          <h1 class="pt-t">账号与角色</h1>
          <div class="pt-d">账号管理 · 角色管理</div>
        </div>
      </div>
    </div>
    <div class="body" id="body">
      <div class="tabs l2" id="acctTabs" role="tablist"></div>
      <div class="pane" id="paneAccount"></div>
      <div class="pane" id="paneRole" hidden></div>
    </div>
  </div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  'use strict';

  var ctx = null, identity = null, ui = null;
  var activeTab = 'account';

  var TYPE_ORDER = ['内置', '预设', '部门模板', '自定义'];
  var ORG_SCOPED = { orgAdmin: 1, counselor: 1, academic: 1, studentAffairs: 1, supervisor: 1, info: 1, majorLead: 1 };
  var COL_GRID = 'minmax(150px,1.4fr) minmax(106px,1.1fr) minmax(160px,1.7fr) minmax(104px,1.1fr) minmax(82px,0.9fr) minmax(126px,1.3fr) minmax(118px,1.2fr) 62px minmax(102px,1fr) minmax(216px,auto)';

  var TABS = [
    { key: 'account', label: '账号管理', perms: ['org:account:view'] },
    { key: 'role',    label: '角色管理', perms: ['org:role:define'] }
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function byId(col, id) { return (ctx[col] || []).find(function (o) { return o.id === id; }); }
  function orgById(id) { return byId('orgs', id); }
  function majorById(id) { return byId('majors', id); }
  function klassById(id) { return byId('klasses', id); }
  function gradeById(id) { return byId('grades', id); }
  function roleById(id) { return byId('roles', id); }

  function reload() {
    ctx = DEMO.getState();
    ui = UI.ui();
    identity = UI.currentIdentity(ctx);
  }

  function audit(action, object, before, after, result, orgId) {
    var rec = DEMO.addAudit(ctx, identity.account.id, action, object, before, after, result);
    if (orgId != null) rec.orgId = orgId;
    DEMO.saveState(ctx);
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  function genId(prefix) {
    return prefix + '-N' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
  }

  function can(code) { return Perm.check(ctx, identity, code, null, null).allowed; }
  function orgDepth(orgId) {
    var m = {}; ctx.orgs.forEach(function (o) { m[o.id] = o; });
    var d = 0, cur = orgId;
    while (cur && m[cur] && m[cur].parentId) { d++; cur = m[cur].parentId; }
    return d;
  }
  function indent(n) { return new Array(n + 1).join('　'); }
  function kv(k, v) { return '<div><div class="kk">' + esc(k) + '</div><div class="vv">' + esc(v) + '</div></div>'; }

  /* ── 渲染入口 ── */
  function render() {
    reload();
    renderTabs();
    $('#paneAccount').hidden = activeTab !== 'account';
    $('#paneRole').hidden = activeTab !== 'role';
    if (activeTab === 'account') renderAccount();
    else if (activeTab === 'role') renderRole();
  }

  function renderTabs() {
    var el = $('#acctTabs');
    var visible = TABS.filter(function (t) {
      return t.perms.some(function (p) { return Perm.check(ctx, identity, p, null, null).allowed; });
    });
    if (!visible.find(function (t) { return t.key === activeTab; })) activeTab = visible.length ? visible[0].key : null;
    el.innerHTML = visible.map(function (t) {
      return '<button class="tab" data-tab="' + t.key + '" role="tab"'
        + (t.key === activeTab ? ' aria-selected="true"' : '') + '>' + esc(t.label) + '</button>';
    }).join('');
    if (!visible.length) {
      $('#paneAccount').hidden = false;
      $('#paneRole').hidden = true;
      $('#paneAccount').innerHTML = '<div class="empty">当前身份无权访问账号与角色。</div>';
    }
  }

  /* ── Tab1：账号管理（7.4） ── */
  /* 账号分配按「组织」归组：scopeOrgIds 每个节点一条，无组织范围取账号主组织；主组织置首 */
  function accountOrgGroups(a) {
    var byOrg = {}, order = [];
    ctx.assignments.forEach(function (asg) {
      if (asg.accountId !== a.id) return;
      var ids = (asg.scopeOrgIds && asg.scopeOrgIds.length) ? asg.scopeOrgIds : [Perm.accountMainOrgId(a)];
      ids.forEach(function (oid) {
        if (!oid) return;
        if (!byOrg[oid]) { byOrg[oid] = []; order.push(oid); }
        if (byOrg[oid].indexOf(asg.roleId) < 0) byOrg[oid].push(asg.roleId);
      });
    });
    var mainId = Perm.accountMainOrgId(a);
    var primaryId = order.length ? (order.indexOf(mainId) >= 0 ? mainId : order[0]) : mainId;
    var groups = order.map(function (oid) { return { orgId: oid, roleIds: byOrg[oid] }; });
    groups.sort(function (x, y) {
      if (x.orgId === primaryId) return -1;
      if (y.orgId === primaryId) return 1;
      return 0;
    });
    return { groups: groups, primaryId: primaryId };
  }

  /* 账号列表「角色」列：按组织显示，主组织带「主」，过长折叠悬停全显 */
  function accountRoleCell(a) {
    var g = accountOrgGroups(a);
    if (!g.groups.length) return '<span class="m-hid">—</span>';
    var parts = g.groups.map(function (grp) {
      var o = orgById(grp.orgId);
      var names = grp.roleIds.map(function (rid) { var r = roleById(rid); return r ? r.name : rid; });
      return (o ? o.name : grp.orgId) + (grp.orgId === g.primaryId ? '（主）' : '') + '：' + names.join('、');
    });
    var full = parts.join('；');
    return '<div class="role-org-cell" title="' + esc(full) + '">' + esc(full) + '</div>';
  }
  function statusPill(a) {
    if (a.status === '停用') return '<span class="pill crit">停用</span>';
    if (a.kind === '学生' && a.studentId) {
      var s = byId('students', a.studentId);
      if (s && s.status === '已毕业') return '<span class="pill warn">已毕业</span>';
      return '<span class="pill good">在读</span>';
    }
    return '<span class="pill good">正常</span>';
  }

  var acctFilter = { q: '', roleId: '', status: '', major: '', orgId: '' };

  function klassShort(k) {
    var m = majorById(k.majorId);
    var name = k.name;
    if (m && name.indexOf(m.name) === 0) name = name.slice(m.name.length).trim();
    return name;
  }
  function accountIdentity(a) {
    var majors = [], grades = [], klasses = [], courses = [];
    var sm = {}, sg = {}, sk = {}, sc = {};
    function add(arr, map, v) { if (v && !map[v]) { map[v] = 1; arr.push(v); } }
    if (a.studentId) {
      var stu = byId('students', a.studentId);
      if (stu && stu.klassId) {
        var k = klassById(stu.klassId);
        if (k) {
          add(klasses, sk, klassShort(k));
          var mm = majorById(k.majorId); if (mm) add(majors, sm, mm.name);
          var gg = gradeById(k.gradeId); if (gg) add(grades, sg, gg.name);
        }
      }
    }
    ctx.assignments.forEach(function (asg) {
      if (asg.accountId !== a.id) return;
      var r = roleById(asg.roleId);
      var ts = asg.teachingScope || {};
      if (r && (r.key === 'teacher' || r.key === 'enterprise' || r.key === 'student')) {
        (ts.classIds || []).forEach(function (cid) {
          var k2 = klassById(cid); if (!k2) return;
          add(klasses, sk, klassShort(k2));
          var m2 = majorById(k2.majorId); if (m2) add(majors, sm, m2.name);
          var g2 = gradeById(k2.gradeId); if (g2) add(grades, sg, g2.name);
        });
        (ts.majorIds || []).forEach(function (mid) { var m3 = majorById(mid); if (m3) add(majors, sm, m3.name); });
        (ts.courseIds || []).forEach(function (cid) { var c = byId('courses', cid); if (c) add(courses, sc, c.name); });
      } else if (r && r.key === 'headTeacher') {
        (asg.scopeClassIds || []).forEach(function (cid) {
          var k3 = klassById(cid); if (!k3) return;
          add(klasses, sk, klassShort(k3));
          var m4 = majorById(k3.majorId); if (m4) add(majors, sm, m4.name);
          var g4 = gradeById(k3.gradeId); if (g4) add(grades, sg, g4.name);
        });
      }
    });
    return { majors: majors, grades: grades, klasses: klasses, courses: courses };
  }
  function cellList(arr) {
    return arr.length

  function accountRow(a, filtered) {

  function matchAccount(a) {
    if (acctFilter.q) {
      var q = acctFilter.q.trim().toLowerCase();
      if (a.name.toLowerCase().indexOf(q) < 0 && a.id.toLowerCase().indexOf(q) < 0) return false;
    }
    if (acctFilter.roleId) {
      if (!ctx.assignments.some(function (x) { return x.accountId === a.id && x.roleId === acctFilter.roleId; })) return false;
    }
    if (acctFilter.status && a.status !== acctFilter.status) return false;
    if (acctFilter.major && accountIdentity(a).majors.indexOf(acctFilter.major) < 0) return false;
    if (acctFilter.orgId) {
      var tree = Perm.descendants(ctx, acctFilter.orgId);
      if (!Perm.accountOrgIds(ctx, a).some(function (oid) { return tree.has(oid); })) return false;
    }
    return true;
  }

  /* ── 组织为主录入：辅助（端分组 + 组织行渲染 + 角色多选） ── */
  var PORTAL_ORDER = ['admin', 'teacher', 'student'];
  function portalCn(p) { return p === 'admin' ? '管理端' : (p === 'teacher' ? '教师端' : (p === 'student' ? '学生端' : p)); }
  function kindForRole(role) {
    var m = { super: '超管', orgAdmin: '管理员', teacher: '教师', headTeacher: '班主任', counselor: '辅导员', student: '学生',
      academic: '教务', studentAffairs: '学工', supervisor: '督导', info: '信息中心', enterprise: '企业导师', majorLead: '专业负责人' };
    return m[role.key] || role.name;
  }
  function roleNames(row) {
    return (row.roleIds || []).map(function (rid) { var r = roleById(rid); return r ? r.name : rid; });
  }
  function rowSummary(row) {
    var o = orgById(row.orgId);
    var names = roleNames(row);
    return (o ? o.name : '未选择组织') + (names.length ? '：' + names.join('、') : '');
  }
  function draftPortals(rows) {
    var set = {};
    rows.forEach(function (row) {
      (row.roleIds || []).forEach(function (rid) {
        var r = roleById(rid);
        if (r && r.portal) set[r.portal] = 1;
      });
    });
    return PORTAL_ORDER.filter(function (p) { return set[p]; });
  }
  function orgRoleAudit(rows) {

  /* 行内是否含某端角色 */
  function rowHasPortal(row, p) {

  /* 已选 chips（带 × 删除）；kind: role / major / course / class */
  function pickChipsHtml(row, idx, kind) {

    } else if (kind === 'major') {
      ids = row.majorIds || [];
      fn = function (id) { var m = majorById(id); return m ? m.name : id; };
      delKind = 'major';
    } else if (kind === 'course') {
      ids = row.courseIds || [];
      fn = function (id) { var c = byId('courses', id); return c ? c.name : id; };
      delKind = 'course';
    } else {
      ids = row.classIds || [];
      fn = function (id) { var k = klassById(id); return k ? klassShort(k) : id; };

    return ids.map(function (id) {
      return '<span class="rtag">' + esc(fn(id))
        + '<button type="button" class="rtag-x" data-row="' + idx + '" data-del="' + delKind + '" data-id="' + esc(id) + '" aria-label="移除">×</button></span>';
    }).join('');

  /* 下拉添加 select（optgroup 按端/按专业分组，已选置灰）；kind 同上 */
  function addSelectHtml(row, idx, kind) {
    var opts = '', ph;
    if (kind === 'role') {
      ph = '＋ 添加角色';
      PORTAL_ORDER.forEach(function (p) {

        if (!roles.length) return;

  /* 一行 picker：label + chips + 添加下拉 */

  /* 教学范围区块：含教师端角色 → 专业+课程；含学生角色 → 专业+班级（必填） */

      + pickerHtml(row, idx, 'role', '角色', false)

  function readonlyOrgRowsHtml(rows, showExpired) {
    if (!rows.length) return '<div class="note">该账号暂无角色分配。</div>';

  function klassShort(k) {
    var m = majorById(k.majorId);
    return m ? k.name.replace(m.name, '').trim() : k.name;
  }

  /* 账号「所属组织」纯文本（主组织 + 兼职组织，· 分隔；详情用） */
  function accountOrgNames(a) {
    var main = Perm.accountMainOrgId(a);
    var parts = Perm.accountPartOrgIds(a);
    var names = [];
    if (main) { var mo = orgById(main); names.push((mo ? mo.name : main) + '（主）'); }
    parts.forEach(function (oid) { var o = orgById(oid); names.push(o ? o.name : oid); });

  /* 账号「所属组织」单元格 HTML（主组织带「主」标签，兼职灰色，· 分隔） */
  function accountOrgNameCell(a) {
    var main = Perm.accountMainOrgId(a);
    var parts = Perm.accountPartOrgIds(a);
    var html = [];
    if (main) {
      var mo = orgById(main);
      html.push('<span class="org-main">' + esc(mo ? mo.name : main) + '<span class="org-tag">主</span></span>');
    }
    parts.forEach(function (oid) { var o = orgById(oid); html.push('<span class="org-part">' + esc(o ? o.name : oid) + '</span>'); });
    return html.length ? html.join('<span class="org-sep">·</span>') : '<span class="m-hid">—</span>';
  }

  /* 账号详情「角色」：按「组织：角色」分行，主组织第一行带「主」标签 */
  function orgRoleDetailHtml(a) {
    var g = accountOrgGroups(a);
    if (!g.groups.length) return '<div><div class="kk">角色</div><div class="vv">—</div></div>';
    var lines = g.groups.map(function (grp) {
      var o = orgById(grp.orgId);
      var names = grp.roleIds.map(function (rid) { var r = roleById(rid); return r ? r.name : rid; });
      return '<div class="org-role-line">'
        + (grp.orgId === g.primaryId ? '<span class="org-tag">主</span>' : '')
        + esc(o ? o.name : grp.orgId) + '：' + names.map(function (n) { return esc(n); }).join('、')
        + '</div>';

  /* 当前身份能否管理某个组织（作为主组织维护时的范围覆盖判断） */
  function canManageOrg(oid) {
    return Perm.check(ctx, identity, 'org:account:edit', { id: '__org__', orgId: oid }, 'account').allowed;
  }

  /* 所属组织多选：左侧组织树 + 右侧已选（树结构对齐「组织管理」，勾选父节点级联子节点） */
  function orgPickCtx() {
    var nodes = Perm.visibleOrgNodes(ctx, identity, { forAssign: true });
    var byId = {}; nodes.forEach(function (o) { byId[o.id] = o; });
    var children = {};
    nodes.forEach(function (o) {
      if (o.parentId && byId[o.parentId]) (children[o.parentId] = children[o.parentId] || []).push(o.id);
    });
    function sortFn(a, b) { var A = byId[a], B = byId[b]; return (A.sort || 0) - (B.sort || 0) || A.name.localeCompare(B.name); }
    Object.keys(children).forEach(function (pid) { children[pid].sort(sortFn); });
    var roots = nodes.filter(function (o) { return !o.parentId || !byId[o.parentId]; }).sort(sortFn);
    function subtree(oid) {
      var set = new Set();
      Perm.descendants(ctx, oid).forEach(function (d) { if (byId[d]) set.add(d); });
      return Array.from(set);
    }
    return { nodes: nodes, byId: byId, children: children, roots: roots, subtree: subtree };
  }
  function flattenOrgTree(pickCtx) {
    var out = [];
    function walk(oid, depth) { out.push({ id: oid, depth: depth }); (pickCtx.children[oid] || []).forEach(function (c) { walk(c, depth + 1); }); }
    pickCtx.roots.forEach(function (r) { walk(r.id, 0); });
    return out;
  }

  /* 新建 / 编辑账号弹窗：以组织为主的录入方式（组织行 + 多角色 + 主组织） */
  function openAccountForm(account, assignOnly) {
    editAccount = account;
    var isAdd = !account;
    var canAssign = can('org:account:assign');
    var isStopped = account && account.status === '停用';
    var basicReadonly = !!assignOnly;
    var rowsLocked = isStopped || !canAssign;

    /* 从账号现有分配按组织归组成「组织行」；每行带主标识与是否只读 */
    function buildRows(acct) {
      var empty = function () { return { orgId: null, roleIds: [], majorIds: [], courseIds: [], classIds: [], isPrimary: true, readonly: false }; };
      if (!acct) return [empty()];
      var g = accountOrgGroups(acct);
      if (!g.groups.length) return [empty()];
      return g.groups.map(function (grp) {
        var majorIds = [], courseIds = [], classIds = [];
        ctx.assignments.forEach(function (asg) {
          if (asg.accountId !== acct.id) return;
          var ids = (asg.scopeOrgIds && asg.scopeOrgIds.length) ? asg.scopeOrgIds : [Perm.accountMainOrgId(acct)];
          if (ids.indexOf(grp.orgId) < 0) return;
          var ts = asg.teachingScope || {};
          (ts.majorIds || []).forEach(function (v) { if (majorIds.indexOf(v) < 0) majorIds.push(v); });
          (ts.courseIds || []).forEach(function (v) { if (courseIds.indexOf(v) < 0) courseIds.push(v); });
          (ts.classIds || []).forEach(function (v) { if (classIds.indexOf(v) < 0) classIds.push(v); });
        });
        return { orgId: grp.orgId, roleIds: grp.roleIds.slice(), majorIds: majorIds, courseIds: courseIds, classIds: classIds, isPrimary: grp.orgId === g.primaryId, readonly: !canManageOrg(grp.orgId) };
      });
    }

    editDraft = { name: account ? account.name : '', phone: account ? (account.phone || '') : '', rows: buildRows(account) };

    function renderOrgRows() {
      var cont = dlg.querySelector('#orgRows');
      if (cont) cont.innerHTML = editDraft.rows.map(function (row, i) { return orgRowHtml(row, i); }).join('');
    }
    function refreshDynamics() {
      var pv = dlg.querySelector('#portalVal');
      if (pv) {
        var portals = draftPortals(editDraft.rows);
        pv.textContent = portals.length ? portals.map(portalCn).join('、') : '—';
      }
      var prv = dlg.querySelector('#primaryVal');
      if (prv) {
        var pr = null;
        for (var i = 0; i < editDraft.rows.length; i++) if (editDraft.rows[i].isPrimary) { pr = editDraft.rows[i]; break; }
        var po = pr && pr.orgId ? orgById(pr.orgId) : null;
        prv.textContent = po ? po.name : '—';
      }
    }

    var orgRoleSection;
    if (rowsLocked) {
      orgRoleSection = '<div class="sec-h">组织与角色</div>'
        + (isStopped ? '<div class="note" style="color:var(--crit);font-weight:600">账号已停用，分配已失效</div>' : '')
        + readonlyOrgRowsHtml(editDraft.rows, isStopped);
    } else {
      orgRoleSection = '<div class="sec-h">组织与角色</div>'
        + '<div class="primary-line">主组织：<b id="primaryVal"></b></div>'
        + '<div id="orgRows">' + editDraft.rows.map(function (row, i) { return orgRowHtml(row, i); }).join('') + '</div>'
        + '<button type="button" class="addorg" data-addorg="1">+ 添加组织</button>';
    }

    var dlg = openDialog('<form style="max-height:88vh;overflow-y:auto">'
      + '<div class="aidlg-h"><h2>' + (isAdd ? '新增账号' : (assignOnly ? '分配角色' : '编辑账号')) + (account ? ' · ' + esc(account.name) : '') + '</h2>'
      + '<button type="button" class="x" data-x aria-label="关闭">×</button></div>'
      + '<label>姓名<input name="name" value="' + esc(editDraft.name) + '"' + (basicReadonly ? ' disabled' : '') + '></label>'
      + '<label>手机号<input name="phone" value="' + esc(editDraft.phone) + '" placeholder="11 位手机号"' + (basicReadonly ? ' disabled' : '') + '></label>'
      + '<div class="portal-line">可进入的端：<b id="portalVal"></b></div>'
      + orgRoleSection
      + '<div class="note" id="formErr" style="color:var(--crit)"></div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">保存</button></div>'
      + '</form>');
    dlg.style.width = 'min(720px, calc(100vw - 32px))';

    var err = dlg.querySelector('#formErr');
    refreshDynamics();
    Array.prototype.forEach.call(dlg.querySelectorAll('[data-x]'), function (b) { b.addEventListener('click', function () { dlg.close(); }); });

    dlg.addEventListener('change', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute) return;
      var idxAttr = el.getAttribute('data-row');
      if (idxAttr == null) return;
      var idx = parseInt(idxAttr, 10);
      var row = editDraft.rows[idx];
      if (!row || row.readonly) return;
      var f = el.getAttribute('data-f');
      if (f === 'org') {
        row.orgId = el.value || null;
        renderOrgRows();
        refreshDynamics();
      } else if (f === 'primary') {
        editDraft.rows.forEach(function (r, i) { r.isPrimary = (i === idx); });
        refreshDynamics();
      } else if (el.getAttribute('data-addsel')) {
        var kind = el.getAttribute('data-addsel');
        var vid = el.value;
        if (!vid) return;
        if (kind === 'role') { if (row.roleIds.indexOf(vid) < 0) row.roleIds.push(vid); }
        else if (kind === 'major') { if (row.majorIds.indexOf(vid) < 0) row.majorIds.push(vid); }
        else if (kind === 'course') { if (row.courseIds.indexOf(vid) < 0) row.courseIds.push(vid); }
        else { if (row.classIds.indexOf(vid) < 0) row.classIds.push(vid); }
        renderOrgRows();
        refreshDynamics();
      }
    });

    dlg.addEventListener('click', function (e) {
      if (e.target.closest('[data-addorg]')) {
        editDraft.rows.push({ orgId: null, roleIds: [], majorIds: [], courseIds: [], classIds: [], isPrimary: false, readonly: false });
        renderOrgRows();
        refreshDynamics();
        return;
      }
      var del = e.target.closest('[data-rowdel]');
      if (del) {
        var idx = parseInt(del.getAttribute('data-rowdel'), 10);
        if (editDraft.rows[idx].isPrimary) { err.textContent = '请先把主组织设到其他行'; return; }
        editDraft.rows.splice(idx, 1);
        renderOrgRows();
        refreshDynamics();
        return;
      }
      var del = e.target.closest('[data-del]');
      if (del) {
        var di = parseInt(del.getAttribute('data-row'), 10);
        var dkind = del.getAttribute('data-del');
        var did = del.getAttribute('data-id');
        var drow = editDraft.rows[di];
        if (drow && !drow.readonly) {
          if (dkind === 'role') drow.roleIds = drow.roleIds.filter(function (x) { return x !== did; });
          else if (dkind === 'major') drow.majorIds = drow.majorIds.filter(function (x) { return x !== did; });
          else if (dkind === 'course') drow.courseIds = drow.courseIds.filter(function (x) { return x !== did; });
          else drow.classIds = drow.classIds.filter(function (x) { return x !== did; });
          renderOrgRows();
          refreshDynamics();
        }
        return;
      }
    });

    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = basicReadonly ? editDraft.name : dlg.querySelector('[name=name]').value.trim();
      if (!name) { err.textContent = '姓名不能为空'; return; }
      var phone = basicReadonly ? editDraft.phone : dlg.querySelector('[name=phone]').value.trim();

      if (!editDraft.rows.length) { err.textContent = '请至少添加一个组织。'; return; }
      for (var i = 0; i < editDraft.rows.length; i++) {
        var row = editDraft.rows[i];
        if (row.readonly) continue;
        if (!row.orgId) { err.textContent = '请选择组织。'; return; }
        if (!(row.roleIds || []).length) { err.textContent = '请至少选择一个角色。'; return; }
        if (rowHasPortal(row, 'student')) {
          if (!(row.majorIds || []).length) { err.textContent = '学生角色须选择专业。'; return; }
          if (!(row.classIds || []).length) { err.textContent = '学生角色须选择班级。'; return; }
        }
      }
      var primaryRow = null;
      for (var p = 0; p < editDraft.rows.length; p++) if (editDraft.rows[p].isPrimary) { primaryRow = editDraft.rows[p]; break; }
      if (!primaryRow) { err.textContent = '请选择一个主组织。'; return; }

      var granteeId = editAccount ? editAccount.id : genId('ACC');
      if (granteeId === identity.account.id) { err.textContent = '不能给自己分配角色。'; return; }

      var operator = identity.account ? identity.account.name : '系统';
      var now = new Date();
      var stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0')
        + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      var mainOrgId = primaryRow.orgId;
      var firstRole = primaryRow.roleIds && primaryRow.roleIds.length ? roleById(primaryRow.roleIds[0]) : null;
      var kind = firstRole ? kindForRole(firstRole) : '管理员';

      function asgOrgIds(asg) {
        return (asg.scopeOrgIds && asg.scopeOrgIds.length) ? asg.scopeOrgIds : [Perm.accountMainOrgId(editAccount)];
      }
      /* 每角色一条分配：scopeOrgIds=[该组织]，主行各分配 isPrimary=true */
      function buildNewAssignments() {
        var origAssigns = editAccount ? ctx.assignments.filter(function (x) { return x.accountId === editAccount.id; }) : [];
        var out = [];
        editDraft.rows.forEach(function (row) {
          (row.roleIds || []).forEach(function (rid) {
            var orig = origAssigns.find(function (o) { return o.roleId === rid && asgOrgIds(o).indexOf(row.orgId) >= 0; });
            var a = orig ? cloneAssign(orig) : emptyAssign();
            var r = roleById(rid);
            a.roleId = rid;
            a.scopeOrgIds = [row.orgId];
            a.isPrimary = !!row.isPrimary;
            var ts = { majorIds: [], classIds: [], courseIds: [] };
            if (r && r.portal === 'teacher') {
              ts.majorIds = (row.majorIds || []).slice();
              ts.courseIds = (row.courseIds || []).slice();
            } else if (r && r.portal === 'student') {
              ts.majorIds = (row.majorIds || []).slice();
              ts.classIds = (row.classIds || []).slice();
            }
            a.teachingScope = ts;
            out.push(a);
          });
        });
        return out;
      }

      var newAssigns = rowsLocked ? [] : buildNewAssignments();
      if (!rowsLocked) {
        for (var q = 0; q < newAssigns.length; q++) {
          var res = Perm.canDelegate(ctx, identity, granteeId, newAssigns[q]);
          if (!res.ok) { err.textContent = res.reason; return; }
        }
      }

      function applyAssignments() {
        ctx.assignments = ctx.assignments.filter(function (x) { return x.accountId !== editAccount.id; });
        newAssigns.forEach(function (a) { ctx.assignments.push(makeAssign(a.id || genId('A'), editAccount.id, a)); });
      }

      var beforeRows = [];
      if (account) {
        var bg = accountOrgGroups(account);
        beforeRows = bg.groups.map(function (grp) {
          return { orgId: grp.orgId, roleIds: grp.roleIds.slice(), isPrimary: grp.orgId === bg.primaryId };
        });
      }

      if (assignOnly) {
        var before = { orgRoles: orgRoleAudit(beforeRows) };
        if (!rowsLocked) applyAssignments();
        var after = { orgRoles: orgRoleAudit(editDraft.rows) };
        audit('调整角色分配', name, before, after, '成功', editAccount.orgId);
        toast('已保存「' + name + '」的角色分配');
      } else if (isAdd) {
        var newAcc = { id: granteeId, name: name, orgId: mainOrgId, partOrgIds: [], kind: kind, status: '正常', studentId: null,
          phone: phone || null, lastLoginAt: null, createdAt: stamp, createdBy: operator, updatedAt: stamp, updatedBy: operator };
        ctx.accounts.push(newAcc);
        if (!rowsLocked) newAssigns.forEach(function (a) { ctx.assignments.push(makeAssign(genId('A'), granteeId, a)); });
        audit('新增账号', name, null, { id: granteeId, orgId: mainOrgId, kind: kind, phone: phone || null, orgRoles: orgRoleAudit(editDraft.rows) }, '成功', mainOrgId);
        toast('已新增账号「' + name + '」');
      } else {
        var before = { name: editAccount.name, phone: editAccount.phone || null, orgId: editAccount.orgId, kind: editAccount.kind, orgRoles: orgRoleAudit(beforeRows) };
        editAccount.name = name;
        editAccount.phone = phone || null;
        editAccount.orgId = mainOrgId;
        editAccount.partOrgIds = [];
        delete editAccount.orgIds;
        editAccount.kind = kind;
        editAccount.updatedAt = stamp;
        editAccount.updatedBy = operator;
        var after = { name: name, phone: phone || null, orgId: mainOrgId, kind: kind, orgRoles: orgRoleAudit(editDraft.rows) };
        if (!rowsLocked) applyAssignments();
        audit('编辑账号与角色分配', name, before, after, '成功', editAccount.orgId);
        toast('已保存「' + name + '」');
      }
      dlg.close();
      render();
    });

    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  function toggleStatus(a) {
    var before = { status: a.status };
    a.status = a.status === '停用' ? '正常' : '停用';
    audit(a.status === '正常' ? '启用账号' : '停用账号', a.name, before, { status: a.status }, '成功', a.orgId);
    toast((a.status === '正常' ? '已启用' : '已停用') + '「' + a.name + '」');
    render();
  }
  function resetPassword(a) {
    audit('重置密码', a.name, null, { passwordReset: true }, '成功', a.orgId);
    toast('已重置「' + a.name + '」的密码');
  }

  /* 账号详情（只读抽屉） */
  function openAccountDetail(a) {
    var idn = accountIdentity(a);
    function j(arr) { return arr.length ? arr.join('、') : '—'; }
    var stu = a.studentId ? byId('students', a.studentId) : null;
    var dlg = openDialog('<div class="pad" style="max-height:88vh;overflow-y:auto">'
      + '<h2>账号详情 · ' + esc(a.name) + '</h2>'
      + '<div class="sec-h detail-sec">基础信息</div>'
      + '<div class="kv2">'
      + kv('账号编号', a.id)
      + kv('姓名', a.name)
      + kv('登录账号', a.id)
      + kv('手机号', a.phone || '—')
      + kv('账号类型', a.kind)
      + kv('最近登录时间', a.lastLoginAt || '—')
      + '</div>'
      + '<div class="sec-h detail-sec">身份信息</div>'
      + '<div class="kv2">'
      + kv('所属组织', accountOrgNames(a))
      + orgRoleDetailHtml(a)
      + kv('所属专业', j(idn.majors))
      + kv('所属年级', j(idn.grades))
      + kv('所属班级', j(idn.klasses))
      + kv('可授课程', j(idn.courses))
      + kv('状态', a.status)
      + kv('身份绑定', stu ? ('学生 · ' + stu.name) : '—')
      + '</div>'
      + '<div class="sec-h detail-sec">系统信息</div>'
      + '<div class="kv2">'
      + kv('创建人', a.createdBy || '—')
      + kv('创建时间', a.createdAt || '—')
      + kv('最近修改人', a.updatedBy || '—')
      + kv('最近修改时间', a.updatedAt || '—')
      + '</div>'
      + '<div class="acts" style="margin-top:16px"><button type="button" class="btn ghost" data-x>关闭</button></div>'
      + '</div>');
    dlg.style.width = 'min(560px, calc(100vw - 32px))';
    dlg.querySelector('[data-x]').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  /* ── Tab2：角色管理（7.5，左右分栏 + 增删改） ── */
  var roleState = { search: '', selectedId: null, tab: 'basic' };

  function roleScope(r) {
    if (r.portal === 'student') return '学生端';
    if (r.portal === 'teacher') return '教师端';
    return '管理后台';
  }
  function isSystemRole(r) { return r.type === '内置'; }
  function roleCode(r) { return r.code || r.id; }
  function roleStatus(r) { return r.status || '启用'; }

  function permTreeHtml(role) {
    var granted = {};
    (role.permissionIds || []).forEach(function (c) { granted[c] = 1; });
    var byMod = {};
    ctx.permissions.forEach(function (p) {
      (byMod[p.module] = byMod[p.module] || {});
      (byMod[p.module][p.resource] = byMod[p.module][p.resource] || []).push(p);
    });
    return Object.keys(byMod).map(function (mod) {
      var res = byMod[mod];
      return '<div class="rm">' + esc(mod) + '</div>'
        + Object.keys(res).map(function (resName) {
          return '<div class="rr">' + esc(resName) + '　'
            + res[resName].map(function (p) {
              return '<span class="op' + (granted[p.code] ? ' on' : '') + '">' + esc(p.action) + '</span>';
            }).join('')
            + '</div>';
        }).join('');
    }).join('') || '<div class="empty">该角色暂无权限点</div>';
  }

  /* 配置菜单权限：模块 → 权限点 复选框树 */
  function permCheckTree(checkedSet) {
    var byMod = {};
    ctx.permissions.forEach(function (p) { (byMod[p.module] = byMod[p.module] || []).push(p); });
    return Object.keys(byMod).map(function (mod) {
      var perms = byMod[mod];
      var allChecked = perms.every(function (p) { return checkedSet.has(p.code); });
      return '<div class="pgroup">'
        + '<label class="pgroup-h"><input type="checkbox" data-pmod="' + esc(mod) + '"' + (allChecked ? ' checked' : '') + '> ' + esc(mod) + '</label>'
        + '<div class="pitems">' + perms.map(function (p) {
          return '<label class="pitem"><input type="checkbox" data-pcode="' + esc(p.code) + '" data-pmod="' + esc(mod) + '"' + (checkedSet.has(p.code) ? ' checked' : '') + '> ' + esc(p.resource) + ' · ' + esc(p.action) + '</label>';
        }).join('') + '</div>'
        + '</div>';
    }).join('');
  }

  function roleItemHtml(r) {
    var st = roleStatus(r);
    return '<button type="button" class="role-item' + (r.id === roleState.selectedId ? ' is-active' : '') + '" data-rsel="' + esc(r.id) + '">'
      + '<div class="role-item-head"><span class="role-item-title">' + esc(r.name) + '</span>'
      + '<span class="role-status ' + (st === '启用' ? 'enabled' : 'disabled') + '">' + esc(st) + '</span></div>'
      + '<div class="role-item-desc">' + esc(r.description || '—') + '</div>'
      + '<div class="role-item-meta">创建人：' + esc(r.createdBy || '—') + '　' + esc(r.createdAt || '') + '</div>'
      + '</button>';
  }

  function switchHtml(r, st, sys) {
    return '<span class="switch' + (st === '启用' ? ' on' : '') + (sys ? ' locked' : '') + '"'
      + (sys ? '' : ' data-rstatus="' + esc(r.id) + '" role="switch" tabindex="0"')
      + ' aria-checked="' + (st === '启用') + '"></span>';
  }

  function basicInfoHtml(r, st, sys) {
    return '<div class="form-grid">'
      + '<div class="field-group"><div class="field-label">角色名称</div><div class="field-value">' + esc(r.name) + '</div></div>'
      + '<div class="field-group"><div class="field-label">角色编码</div><div class="field-value mono">' + esc(roleCode(r)) + '</div></div>'
      + '<div class="field-group"><div class="field-label">所属端</div><div class="field-value">' + esc(roleScope(r)) + '</div></div>'
      + '<div class="field-group"><div class="field-label">状态</div><div class="field-value">'
      + switchHtml(r, st, sys) + '<span class="m-hid">' + esc(st) + '</span></div></div>'
      + '<div class="field-group field-full"><div class="field-label">角色说明</div><div class="field-value" style="align-items:flex-start">' + esc(r.description || '—') + '</div></div>'
      + '</div>'
      + '<div class="kv2" style="margin-top:16px;border-top:1px solid var(--rule-2);padding-top:14px">'
      + '<div><div class="kk">AI 每日配额</div><div class="vv">' + esc(r.aiQuota) + ' 次</div></div>'
      + '<div><div class="kk">创建人</div><div class="vv">' + esc(r.createdBy || '—') + '</div></div>'
      + '<div><div class="kk">创建时间</div><div class="vv">' + esc(r.createdAt || '—') + '</div></div>'
      + '<div><div class="kk">角色类型</div><div class="vv">' + esc(r.type) + '</div></div></div>';
  }

  function roleDetailHtml(r) {
    if (!r) return '<div class="empty">请选择角色</div>';
    var sys = isSystemRole(r);
    var st = roleStatus(r);
    return '<div class="detail-topbar">'
      + '<div class="detail-name">' + esc(r.name) + '<span class="detail-badge">' + esc(roleScope(r)) + '</span></div>'
      + '<div class="detail-actions">'
      + '<button class="btn-s" data-redit="' + esc(r.id) + '"' + (sys ? ' disabled' : '') + '>编辑</button>'
      + '<button class="btn-s" data-rperm="' + esc(r.id) + '"' + (sys ? ' disabled' : '') + '>配置角色菜单</button>'
      + '<button class="btn-s" data-rdel="' + esc(r.id) + '"' + (sys ? ' disabled' : '') + '>删除</button>'
      + '</div></div>'
      + '<div class="role-tabs">'
      + '<button class="rtab' + (roleState.tab === 'basic' ? ' on' : '') + '" data-rtab="basic">基础信息</button>'
      + '<button class="rtab' + (roleState.tab === 'perm' ? ' on' : '') + '" data-rtab="perm">菜单权限</button>'
      + '</div>'
      + '<div class="role-tab-pane">' + (roleState.tab === 'basic' ? basicInfoHtml(r, st, sys) : permTreeHtml(r)) + '</div>';
  }

  function renderRole() {
    var pane = $('#paneRole');
    if (!can('org:role:define')) {
      pane.innerHTML = '<div class="empty">当前身份无权访问角色管理。</div>';
      return;
    }
    var roles = ctx.roles.slice();
    var q = (roleState.search || '').trim().toLowerCase();
    if (q) roles = roles.filter(function (r) { return r.name.toLowerCase().indexOf(q) >= 0; });
    if (!roles.length) {
      pane.innerHTML = '<div class="scbar"><b>角色管理</b>　维护全校角色、所属端与菜单权限。</div>'
        + '<div class="card"><div class="empty">' + (q ? '未找到匹配「' + esc(roleState.search) + '」的角色' : '暂无角色') + '</div></div>';
      return;
    }
    if (!roleState.selectedId || !roles.some(function (r) { return r.id === roleState.selectedId; })) {
      roleState.selectedId = roles[0].id;
    }
    var cur = byId('roles', roleState.selectedId);
    pane.innerHTML = '<div class="scbar"><b>角色管理</b>　共 ' + ctx.roles.length + ' 个角色；权限点细化到操作级。选中左侧角色查看详情并维护。</div>'
      + '<div class="role-layout">'
      + '<section class="role-list-panel">'
      + '<div class="role-toolbar"><input class="role-search" id="roleSearch" placeholder="搜索角色" value="' + esc(roleState.search) + '"><button class="btn-s" data-radd="1">+ 新增</button></div>'
      + '<div class="role-list">' + roles.map(roleItemHtml).join('') + '</div>'
      + '</section>'
      + '<section class="role-detail-panel">' + roleDetailHtml(cur) + '</section>'
      + '</div>';
  }

  /* ── 角色 CRUD ── */
  function scopeToKey(scope) {
    if (scope === '学生端') return 'student';
    if (scope === '教师端') return 'teacher';
    return 'orgAdmin';
  }
  function scopeToPortal(scope) {
    if (scope === '学生端') return 'student';
    if (scope === '教师端') return 'teacher';
    return 'admin';
  }

  function openRoleForm(role) {
    var isAdd = !role;
    var curScope = role ? roleScope(role) : '管理后台';
    var dlg = openDialog('<form><h2>' + (isAdd ? '新增角色' : '编辑角色' + (role ? ' · ' + esc(role.name) : '')) + '</h2>'
      + '<label>角色名称<input name="rname" value="' + esc(role ? role.name : '') + '" placeholder="请输入角色名称"></label>'
      + '<label>角色编码<input name="rcode" value="' + esc(isAdd ? '' : roleCode(role)) + '" placeholder="字母、数字或符号"' + (isAdd ? '' : ' disabled') + '>'
      + (isAdd ? '' : '<span class="m-hid" style="margin-top:2px">角色编码为系统标识，创建后不可修改</span>') + '</label>'
      + '<label>所属端<select name="rscope"' + (isAdd ? '' : ' disabled') + '>'
      + ['管理后台', '教师端', '学生端'].map(function (s) {
          return '<option value="' + s + '"' + (s === curScope ? ' selected' : '') + '>' + s + '</option>';
        }).join('') + '</select>'
      + (isAdd ? '' : '<span class="m-hid" style="margin-top:2px">所属端关联角色数据范围，创建后不可修改</span>') + '</label>'
      + '<label>角色说明<textarea name="rdesc" rows="3" placeholder="请输入角色说明">' + esc(role ? (role.description || '') : '') + '</textarea></label>'
      + '<div class="note" id="rErr" style="color:var(--crit)"></div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">保存</button></div>'
      + '</form>');
    dlg.style.width = 'min(440px, calc(100vw - 32px))';
    var err = dlg.querySelector('#rErr');
    dlg.querySelector('[data-x]').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = dlg.querySelector('[name=rname]').value.trim();
      var codeVal = (dlg.querySelector('[name=rcode]').value || '').trim();
      var scope = dlg.querySelector('[name=rscope]').value;
      var desc = dlg.querySelector('[name=rdesc]').value.trim();
      if (!name) { err.textContent = '请输入角色名称'; return; }
      if (isAdd) {
        if (!codeVal) { err.textContent = '请输入角色编码'; return; }
        if (!/^[A-Za-z0-9!-/:-@[-`{-~]+$/.test(codeVal)) { err.textContent = '角色编码只能包含字母、数字和符号'; return; }
        if (byId('roles', codeVal)) { err.textContent = '角色编码已存在'; return; }
      }
      if (isAdd) {
        var nRole = { id: codeVal, key: scopeToKey(scope), portal: scopeToPortal(scope), name: name, type: '自定义', status: '启用', aiQuota: 0,
          description: desc, createdBy: identity.account.name, createdAt: new Date().toISOString().slice(0, 10),
          permissionIds: [] };
        ctx.roles.push(nRole);
        audit('新增角色', name, null, { id: codeVal, scope: scope, description: desc }, '成功', null);
        roleState.selectedId = codeVal;
        toast('已新增角色「' + name + '」');
      } else {
        var before = { name: role.name, description: role.description };
        role.name = name;
        role.description = desc;
        audit('编辑角色', name, before, { name: name, description: desc }, '成功', null);
        toast('已保存「' + name + '」');
      }
      dlg.close();
      render();
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  function openRolePermConfig(role) {
    var granted = new Set(role.permissionIds || []);
    var dlg = openDialog('<form><h2>配置角色菜单 · ' + esc(role.name) + '</h2>'
      + '<div style="max-height:52vh;overflow-y:auto;padding-right:4px">' + permCheckTree(granted) + '</div>'
      + '<div class="note" id="pErr" style="color:var(--crit)"></div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">保存</button></div>'
      + '</form>');
    dlg.style.width = 'min(520px, calc(100vw - 32px))';
    dlg.querySelector('[data-x]').addEventListener('click', function () { dlg.close(); });

    function syncMod(mod) {
      var items = Array.from(dlg.querySelectorAll('[data-pcode]')).filter(function (i) { return i.getAttribute('data-pmod') === mod; });
      var modInput = Array.from(dlg.querySelectorAll('[data-pmod]')).filter(function (i) { return !i.hasAttribute('data-pcode') && i.getAttribute('data-pmod') === mod; })[0];
      if (modInput) modInput.checked = items.length > 0 && items.every(function (i) { return i.checked; });
    }
    dlg.addEventListener('change', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute) return;
      var mod = el.getAttribute('data-pmod');
      if (mod == null) return;
      if (el.hasAttribute('data-pcode')) { syncMod(mod); }
      else {
        var on = el.checked;
        dlg.querySelectorAll('[data-pcode]').forEach(function (i) {
          if (i.getAttribute('data-pmod') === mod) i.checked = on;
        });
      }
    });
    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var next = [];
      dlg.querySelectorAll('[data-pcode]:checked').forEach(function (i) { next.push(i.getAttribute('data-pcode')); });
      var before = (role.permissionIds || []).slice().sort().join(',');
      var after = next.slice().sort().join(',');
      role.permissionIds = next;
      audit('配置角色菜单权限', role.name, { permissionIds: before }, { permissionIds: after }, '成功', null);
      toast('已保存「' + role.name + '」的菜单权限');
      dlg.close();
      render();
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  function deleteRole(role) {
    var assigned = ctx.assignments.filter(function (a) { return a.roleId === role.id; }).length;
    var dlg = openDialog('<form><h2>删除角色「' + esc(role.name) + '」</h2>'
      + '<div class="note">' + (assigned
          ? '该角色已被 ' + assigned + ' 个账号分配，删除后这些账号的该角色分配将一并移除，确定删除吗？'
          : '确定删除该角色吗？删除后不可恢复。') + '</div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">删除</button></div>'
      + '</form>');
    dlg.querySelector('[data-x]').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var before = { id: role.id, name: role.name, assigned: assigned };
      ctx.assignments = ctx.assignments.filter(function (a) { return a.roleId !== role.id; });
      ctx.roles = ctx.roles.filter(function (r) { return r.id !== role.id; });
      audit('删除角色', role.name, before, null, '成功', null);
      roleState.selectedId = null;
      toast('已删除角色「' + role.name + '」');
      dlg.close();
      render();
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  function toggleRoleStatus(role) {
    var st = roleStatus(role);
    var next = st === '启用' ? '停用' : '启用';
    role.status = next;
    audit(next === '停用' ? '停用角色' : '启用角色', role.name, { status: st }, { status: next }, '成功', null);
    toast((next === '停用' ? '已停用' : '已启用') + '「' + role.name + '」');
    render();
  }

  /* ── 弹层 ── */
  function openDialog(html) {
    var dlg = document.createElement('dialog');
    dlg.className = 'aidlg';
    dlg.innerHTML = html;
    document.body.appendChild(dlg);
    dlg.showModal();
    return dlg;
  }

  /* ── 「为什么能看到 / 看不到」 ── */
  function ensureTip() {
    if (!window.__tipEl) {
      var t = document.createElement('div');
      t.id = 'tip';
      document.body.appendChild(t);
      window.__tipEl = t;
    }
    return window.__tipEl;
  }
  function roleSummary() {
    return Perm.activeAssignments(ctx, identity).map(function (a) {
      var r = byId('roles', a.roleId);
      var scope = (a.scopeOrgIds || []).map(function (oid) { return orgById(oid) ? orgById(oid).name : oid; }).join('、');
      return r.name + (scope ? ' @' + scope : '');
    }).join('；') || '无';
  }
  function portalNameCn(p) { return p === 'teacher' ? '教师端' : (p === 'student' ? '学生端' : '管理端'); }
  function showTip(anchor, html) {
    var t = ensureTip();
    t.innerHTML = html;
    t.classList.add('on');
    var r = anchor.getBoundingClientRect();
    var tw = t.offsetWidth || 260;
    var left = Math.max(8, Math.min(r.left, window.innerWidth - tw - 12));
    var top = r.bottom + 8;
    if (top + 140 > window.innerHeight) top = r.top - 148;
    t.style.left = left + 'px';
    t.style.top = Math.max(8, top) + 'px';
  }
  function hideTip() { if (window.__tipEl) window.__tipEl.classList.remove('on'); }

  function explainAccount(a) {
    var t = Perm.explain(ctx, identity, 'org:account:view', a, 'account', ui.orgId);
    var lines = ['<b>' + esc(a.name) + ' · 账号查看</b>',
      '<span class="tk">账号：' + esc(identity.account.name) + '（' + esc(identity.account.status) + '）</span>',
      '<span class="tk">当前端：' + portalNameCn(t.currentPortal) + '，只计入' + portalNameCn(t.currentPortal) + '角色的分配</span>',
      '<span class="tk">角色：' + esc(roleSummary()) + '</span>'];
    (t.assignments || []).forEach(function (asg) {
      lines.push('<span class="tk">' + esc(asg.roleName) + '：功能 ' + (asg.hasPerm ? '✓' : '✗')
        + (asg.hasPerm && asg.scopePass != null ? ' · 范围 ' + (asg.scopePass ? '✓' : '✗') : '')
        + (asg.inPortal === false ? ' · ' + portalNameCn(asg.portal) + '分配，本端不参与' : '') + '</span>');
    });
    if (t.orgFiltered) lines.push('<span class="tk">有权限，被当前组织过滤</span>');
    if (!t.allowed && t.hiddenReason) lines.push('<span class="tk">不可见：' + esc(t.hiddenReason) + '</span>');
    return lines.join('');
  }

  /* ── 事件（委托到 #body） ── */
  function bindEvents() {
    $('#body').addEventListener('click', function (e) {
      var tab = e.target.closest('[data-tab]');
      if (tab) { activeTab = tab.getAttribute('data-tab'); render(); return; }
      var aadd = e.target.closest('[data-aadd]');
      if (aadd) {
        if (can('org:account:edit')) openAccountForm(null);
        else { audit('越权尝试·新增账号', '新账号', null, { reason: '无账号维护权限' }, '被拒绝', null); toast('越权尝试已记录：无账号维护权限'); }
        return;
      }
      var adetail = e.target.closest('[data-adetail]');
      if (adetail) { var adt = byId('accounts', adetail.getAttribute('data-adetail')); if (adt) openAccountDetail(adt); return; }
      var aedit = e.target.closest('[data-aedit]');
      if (aedit) {
        var ae = byId('accounts', aedit.getAttribute('data-aedit'));
        if (ae && Perm.check(ctx, identity, 'org:account:edit', ae, 'account').allowed) openAccountForm(ae);
        else if (ae) { audit('越权尝试·编辑账号', ae.name, null, { reason: '范围未覆盖主组织' }, '被拒绝', ae.orgId); toast('越权尝试已记录：范围未覆盖主组织'); }
        return;
      }
      var aassign = e.target.closest('[data-aassign]');
      if (aassign) {
        var ag = byId('accounts', aassign.getAttribute('data-aassign'));
        if (ag && can('org:account:assign')) openAccountForm(ag, true);
        return;
      }
      var adisable = e.target.closest('[data-adisable]');
      if (adisable) { var ad = byId('accounts', adisable.getAttribute('data-adisable')); if (ad && Perm.check(ctx, identity, 'org:account:edit', ad, 'account').allowed) toggleStatus(ad); return; }
      var aenable = e.target.closest('[data-aenable]');
      if (aenable) { var an = byId('accounts', aenable.getAttribute('data-aenable')); if (an && Perm.check(ctx, identity, 'org:account:edit', an, 'account').allowed) toggleStatus(an); return; }
      var apwd = e.target.closest('[data-apwd]');
      if (apwd) { var ap = byId('accounts', apwd.getAttribute('data-apwd')); if (ap && Perm.check(ctx, identity, 'org:account:edit', ap, 'account').allowed) resetPassword(ap); return; }
      var rsel = e.target.closest('[data-rsel]');
      if (rsel) { roleState.selectedId = rsel.getAttribute('data-rsel'); roleState.tab = 'basic'; render(); return; }
      var radd = e.target.closest('[data-radd]');
      if (radd) { openRoleForm(null); return; }
      var redit = e.target.closest('[data-redit]');
      if (redit) { var re = byId('roles', redit.getAttribute('data-redit')); if (re && !isSystemRole(re)) openRoleForm(re); return; }
      var rperm = e.target.closest('[data-rperm]');
      if (rperm) { var rp = byId('roles', rperm.getAttribute('data-rperm')); if (rp && !isSystemRole(rp)) openRolePermConfig(rp); return; }
      var rdel = e.target.closest('[data-rdel]');
      if (rdel) { var rd = byId('roles', rdel.getAttribute('data-rdel')); if (rd && !isSystemRole(rd)) deleteRole(rd); return; }
      var rtab = e.target.closest('[data-rtab]');
      if (rtab) { roleState.tab = rtab.getAttribute('data-rtab'); render(); return; }
      var rstatus = e.target.closest('[data-rstatus]');
      if (rstatus) { var rs = byId('roles', rstatus.getAttribute('data-rstatus')); if (rs && !isSystemRole(rs)) toggleRoleStatus(rs); return; }
    });
    $('#body').addEventListener('input', function (e) {
      if (e.target && e.target.id === 'roleSearch') {
        roleState.search = e.target.value;
        render();
        var el = document.getElementById('roleSearch');
        if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (x) {} }
      }
      if (e.target && e.target.id === 'acctSearch') {
        acctFilter.q = e.target.value;
        render();
        var el2 = document.getElementById('acctSearch');
        if (el2) { el2.focus(); try { el2.setSelectionRange(el2.value.length, el2.value.length); } catch (x) {} }
      }
    });
    $('#body').addEventListener('change', function (e) {
      if (e.target && e.target.id === 'acctRole') { acctFilter.roleId = e.target.value; render(); }
      else if (e.target && e.target.id === 'acctStatus') { acctFilter.status = e.target.value; render(); }
      else if (e.target && e.target.id === 'acctMajor') { acctFilter.major = e.target.value; render(); }
      else if (e.target && e.target.id === 'acctOrg') { acctFilter.orgId = e.target.value; render(); }
    });
    $('#body').addEventListener('mouseover', function (e) {
      var aq = e.target.closest('[data-awhy]');
      if (aq) { var a = byId('accounts', aq.getAttribute('data-awhy')); if (a) showTip(aq, explainAccount(a)); }
    });
    $('#body').addEventListener('mouseout', function (e) {
      if (e.target.closest('[data-awhy]')) hideTip();
    });
  }

  /* ── 启动 ── */
  UI.boot({ portal: 'admin', active: 'account' });
  UI.onChange(function () { render(); });
  bindEvents();
  render();
})();
</script>
</body>
</html>
