<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>院校账号</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="platform.css?v=6">
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop">
      <div class="ptop-r">
        <div class="pt-l">
          <h1 class="pt-t">院校账号</h1>
          <div class="pt-d">平台侧维护院校管理员类账号，一所院校可开通多个；教师、学生账号由院校自行维护</div>
        </div>
      </div>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<script src="../js/mock-data.js?v=4"></script>
<script src="../js/permission.js"></script>
<script src="../js/common.js?v=17"></script>
<script src="../js/platform-kit.js?v=12"></script>
<script>
(function () {
  'use strict';
  UI.boot({ portal: 'platform', active: 'pv-accounts', base: '../' });

  var ctx = DEMO.getState();
  var identity = UI.currentIdentity(ctx);
  var F = { q: '', status: '' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function link(href) { return UI.link(href); }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2400);
  }
  function statusPill(s) {
    return s === '停用' ? '<span class="pf-status off">停用</span>' : '<span class="pf-status on">启用</span>';
  }

  function renderShell() {
    document.getElementById('body').innerHTML =
      '<div class="pf-toolbar">' +
      '<input class="pf-in" id="pfQ" placeholder="搜索院校、姓名、登录账号、手机号" value="' + esc(F.q) + '">' +
      '<select class="pf-sel" id="pfStatus"><option value="">全部状态</option><option value="启用">启用</option><option value="停用">停用</option></select>' +
      '<span class="sp"></span>' +
      '<button class="btn" type="button" data-new>新建院校账号</button>' +
      '</div>' +
      '<div class="pf-card"><div class="pf-card-h">院校账号<span class="sp"></span><span class="pf-mono" id="pfCount"></span></div><div id="list"></div></div>';

    document.getElementById('pfQ').addEventListener('input', function (e) { F.q = e.target.value; renderList(); });
    document.getElementById('pfStatus').addEventListener('change', function (e) { F.status = e.target.value; renderList(); });
    document.querySelector('[data-new]').addEventListener('click', function () { openDialog(null); });
    document.getElementById('list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-edit],[data-toggle],[data-reset]');
      if (!b) return;
      var schoolId = b.getAttribute('data-school');
      var accId = b.getAttribute('data-acc');
      var pair = PF.allAccounts().find(function (x) { return x.school.id === schoolId && x.account.accountId === accId; });
      if (!pair) return;
      if (b.hasAttribute('data-edit')) openDialog(pair);
      else if (b.hasAttribute('data-toggle')) toggleStatus(pair);
      else resetPassword(pair);
    });
    renderList();
  }

  function filtered() {
    var q = F.q.trim().toLowerCase();
    return PF.allAccounts().filter(function (x) {
      var a = x.account, s = x.school;
      if (F.status && a.status !== F.status) return false;
      if (!q) return true;
      return [s.name, s.code, a.name, a.accountId, a.phone].filter(Boolean).join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderList() {
    var rows = filtered();
    document.getElementById('pfCount').textContent = '筛选 ' + rows.length + ' / 共 ' + PF.allAccounts().length + ' 个账号';
    if (!rows.length) {
      document.getElementById('list').innerHTML = '<div class="pf-empty">没有匹配的院校账号。</div>';
      return;
    }
    var h = '<table class="pf-tbl"><thead><tr>' +
      '<th>院校</th><th>姓名</th><th>登录账号</th><th>手机号</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    rows.forEach(function (x) {
      var s = x.school, a = x.account;
      h += '<tr>' +
        '<td><a class="nm" href="' + link('school-detail.html?id=' + encodeURIComponent(s.id)) + '" style="color:inherit;text-decoration:none">' + esc(s.name) + '</a><span class="sub">' + esc(s.code) + '</span></td>' +
        '<td>' + esc(a.name || '—') + '</td>' +
        '<td><span class="pf-mono">' + esc(a.accountId) + '</span></td>' +
        '<td>' + esc(a.phone || '—') + '</td>' +
        '<td>' + statusPill(a.status) + '</td>' +
        '<td><div class="pf-acts">' +
        '<button class="btn-s" type="button" data-edit data-school="' + esc(s.id) + '" data-acc="' + esc(a.accountId) + '">编辑</button>' +
        '<button class="btn-s" type="button" data-toggle data-school="' + esc(s.id) + '" data-acc="' + esc(a.accountId) + '">' + (a.status === '停用' ? '启用' : '停用') + '</button>' +
        '<button class="btn-s" type="button" data-reset data-school="' + esc(s.id) + '" data-acc="' + esc(a.accountId) + '">重置密码</button>' +
        '</div></td></tr>';
    });
    h += '</tbody></table>';
    document.getElementById('list').innerHTML = h;
  }

  function openDialog(pair) {
    var all = PF.list();
    if (!all.length) { toast('请先创建院校'); return; }
    var isNew = !pair;
    var currentSchool = pair ? pair.school : all[0];
    var current = pair ? pair.account : null;
    var dlg = document.createElement('dialog');
    dlg.className = 'aidlg pf-dlg';
    dlg.innerHTML = '<form>' +
      '<h2>' + (isNew ? '新建院校账号' : '编辑院校账号') + '</h2>' +
      '<div class="pf-form">' +
      '<label class="full"><span class="req">所属院校</span><select data-k="schoolId"' + (isNew ? '' : ' disabled') + '>' +
      all.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === currentSchool.id ? ' selected' : '') + '>' + esc(s.name) + '（' + esc(s.code) + '）</option>'; }).join('') +
      '</select></label>' +
      '<label><span class="req">姓名</span><input data-k="name" value="' + esc(current ? current.name : '') + '"></label>' +
      '<label><span>手机号</span><input data-k="phone" value="' + esc(current ? current.phone : '') + '"></label>' +
      '<label class="full"><span>登录账号</span><input data-k="account" value="' + esc(current ? current.accountId : '') + '" placeholder="留空自动生成" ' + (isNew ? '' : ' disabled') + '></label>' +
      '<label class="full"><span>初始密码</span><input data-k="pwd" value="' + esc(current ? (current.initPassword || PF.INITIAL_PASSWORD) : PF.INITIAL_PASSWORD) + '" placeholder="请输入初始密码"></label>' +
      '</div>' +
      '<div class="pf-note">平台侧只维护院校管理员类账号；初始密码可由院校管理员首次登录后修改。</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:2px">' +
      '<button type="button" class="btn ghost" data-cancel>取消</button>' +
      '<button type="button" class="btn" data-submit>保存</button>' +
      '</div></form>';
    document.body.appendChild(dlg);
    dlg.showModal();
    dlg.addEventListener('close', function () { dlg.remove(); });

    var schoolSel = dlg.querySelector('[data-k="schoolId"]');
    var nameEl = dlg.querySelector('[data-k="name"]');
    var phoneEl = dlg.querySelector('[data-k="phone"]');
    var accEl = dlg.querySelector('[data-k="account"]');
    var pwdEl = dlg.querySelector('[data-k="pwd"]');

    dlg.querySelector('[data-cancel]').addEventListener('click', function () { dlg.close(); });
    dlg.querySelector('[data-submit]').addEventListener('click', function () {
      dlg.querySelectorAll('.pf-err').forEach(function (x) { x.classList.remove('pf-err'); });
      if (!nameEl.value.trim()) { nameEl.classList.add('pf-err'); toast('请填写姓名'); return; }
      if (!pwdEl.value.trim()) { pwdEl.classList.add('pf-err'); toast('请填写初始密码'); return; }
      var accInput = accEl.value.trim();
      if (isNew && accInput) {
        var dup = PF.allAccounts().some(function (x) { return String(x.account.accountId).toLowerCase() === accInput.toLowerCase(); });
        if (dup) { accEl.classList.add('pf-err'); toast('登录账号已存在'); return; }
      }
      if (isNew) {
        var acct = PF.addAccount(schoolSel.value, {
          name: nameEl.value, phone: phoneEl.value, accountId: accInput, initPassword: pwdEl.value
        }, identity.account.name);
        if (!acct) { toast('新建失败'); return; }
        toast('已新建院校账号：' + acct.name);
      } else {
        PF.updateAccount(currentSchool.id, current.accountId, {
          name: nameEl.value, phone: phoneEl.value, initPassword: pwdEl.value
        }, identity.account.name);
        toast('已保存');
      }
      dlg.close();
      renderList();
    });
  }

  function toggleStatus(pair) {
    var next = pair.account.status === '停用' ? '启用' : '停用';
    if (!confirm('确定' + next + '「' + pair.account.name + '」的账号吗？')) return;
    PF.setAccountStatus(pair.school.id, pair.account.accountId, next, identity.account.name);
    toast('已' + next);
    renderList();
  }

  function resetPassword(pair) {
    if (!confirm('确定将「' + pair.account.name + '」的密码重置为 ' + PF.INITIAL_PASSWORD + ' 吗？')) return;
    PF.resetAccountPassword(pair.school.id, pair.account.accountId, identity.account.name);
    toast('已重置为初始密码 ' + PF.INITIAL_PASSWORD);
    renderList();
  }

  renderShell();
})();
</script>
</body>
</html>
