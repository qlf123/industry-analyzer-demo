/* 课次：按时间分组，列表 / 卡片 */

/* 资源表单技能 / 知识点选择区：已选 chips 行、chip 内移除按钮 */
.rs-sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px}.rs-sel:empty{display:none}
.rs-xdel{border:0;background:none;cursor:pointer;font-size:13px;line-height:1;color:var(--muted);padding:0 0 0 2px}.rs-xdel:hover{color:var(--danger,#e5484d)}
/* 上传资源：知识体系树（任务 → 技能 → 知识点，勾选即选） */

    }
    if ((t = e.target.closest('[data-ract]'))) {
      var r = res(t.getAttribute('data-id')), ra = t.getAttribute('data-ract');
      if (ra === 'fdel') {
        var fid3 = t.getAttribute('data-fid'), ff3 = r.files.filter(function (x) { return x.id === fid3; })[0];
        if (ff3) resFileDelete(r, ff3);
      }
      else if (ra === 'dl') TK.toast(r.status === '已完成' ? '已开始打包下载' : r.status === '生成中' ? '资源还在生成中' : '资源生成失败，暂无可下载内容');
      else if (ra === 'view') resDetail(r);
      else if (ra === 'del') resDelete(r);
      else if (ra === 'regen') resRegen(r);
    }
  });
  body.addEventListener('input', function (e) {
    var k2 = e.target.getAttribute('data-rf');
    if (e.target.classList.contains('search')) { if (k2) RF[k2] = e.target.value.trim(); clearTimeout(body._t); body._t = setTimeout(function () { render(); var s = body.querySelector('.search[data-rf="' + k2 + '"]'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250); }
  });
  body.addEventListener('change', function (e) {
    var k2 = e.target.getAttribute('data-rf');
    if (e.target.classList.contains('search')) return;
    if (k2) { RF[k2] = e.target.value; render(); }
    if (e.target.hasAttribute('data-statplan')) { statPlan = e.target.value; render(); }
    if (e.target.hasAttribute('data-evplan')) { evPlan = e.target.value; render(); }
    if (e.target.hasAttribute('data-evcls')) { evCls = e.target.value; render(); }
    if (e.target.hasAttribute('data-fbplan')) { fbPlan = e.target.value; render(); }
  });

  UI.boot({ portal: 'teacher', active: VIEW_KEY[VIEW] });
  // 地址里的课程空间要在第一次渲染前读（渲染会按当前状态改写地址）：刷新后停在原课程原页签
  var hm = /^#course\/([^/]+)(?:\/(\w+))?(?:\/([\w-]+))?/.exec(location.hash), hStat = location.hash === '#stat';
  if (hm && plan(hm[1])) { space = hm[1]; ctab = hm[2] || 'lessons'; if (!CTABS.some(function (x) { return x[0] === ctab; })) ctab = 'lessons'; markMenu('cr-courses'); }   // 旧链接 #course/x/res 兜底到课次
  else if (hStat && myPlans().length) { space = myPlans()[0].id; ctab = 'stat'; }
  render();
  // 2026-11-18（I2）：#course/<计划>/lessons/<课次> 直达课次详情的「学生课程反馈」页签（首页反馈卡入口）
  if (hm && hm[3] && course(hm[3])) courseDetail(course(hm[3]), 'fb');
  // 从成长记录「查看」进入：?open=course:ID / res:ID
  var op = new URLSearchParams(location.search).get('open');
  if (op) { var p = op.split(':'); if (p[0] === 'course' && course(p[1])) courseDetail(course(p[1])); if (p[0] === 'res' && res(p[1])) { space = null; tab = 'res'; render(); resDetail(res(p[1])); } }
})();
</script>
</body>
</html>
