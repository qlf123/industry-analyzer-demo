<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智慧课堂</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
.rcard .cb{display:flex;flex-direction:column;gap:8px}
.rcard .rh{display:flex;align-items:center;gap:10px}
.rcard .ri{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:0 0 34px}
.rcard .rn{flex:1;min-width:0}
.rcard .rn b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .rn span{font-size:11.5px;color:var(--muted)}
.rcard .cnt{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.lchips{display:flex;gap:6px;flex-wrap:wrap}
.lchip{font-size:11.5px;padding:3px 10px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink)}
.lchip.none{background:var(--card-2);color:var(--muted);border:1px solid var(--rule)}
.dtabs{display:flex;gap:18px;border-bottom:1px solid var(--rule);margin:-4px 0 14px}
.dtabs button{font:inherit;font-size:13px;padding:8px 0;border:0;background:none;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer}
.dtabs button[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.ftype{border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.ftype-h{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;margin-bottom:6px}
.ftype-h small{font-weight:400;color:var(--muted)}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dims>div{background:var(--card-2);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--ink-2)}
.dims b{display:block;font-size:18px;color:var(--ink);font-family:var(--mono)}
.ev-sec{font-size:12.5px;line-height:1.8}
.ev-sec .t{font-weight:600;color:var(--ink);margin-top:6px}
.gopt{display:flex;gap:8px;flex-wrap:wrap}
.gopt button{font:inherit;flex:1;min-width:120px;padding:10px;border-radius:10px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:13px}
.gopt button small{display:block;font-size:11px;color:var(--muted)}
.gopt button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.gopt button[aria-pressed="true"] small{color:#e6e0ff}
.pickrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--rule-2);font-size:13px}
.pickrow input{width:16px;height:16px;accent-color:var(--brand)}
.pickrow .pn{flex:1;min-width:0}
.pickrow .pn small{display:block;color:var(--muted);font-size:11.5px}
.skc{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:12px;background:var(--good-bg);color:var(--good);margin:2px 4px 2px 0}
.skc.off{background:var(--card-2);color:var(--muted)}
.crit{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.crit th,.crit td{border:1px solid var(--rule-2);padding:6px 8px;vertical-align:top;text-align:left}
.crit th{background:var(--card-2);font-weight:600;white-space:nowrap}
.crit textarea{width:100%;min-height:54px;font:inherit;font-size:12px;border:1px solid var(--rule);border-radius:6px;padding:4px 6px;resize:vertical;background:var(--card);color:var(--ink)}
.crit .sn{font-weight:600;color:var(--ink)}
.gbtn{display:inline-flex;gap:4px}
.gbtn button{font:inherit;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--rule);background:var(--card);cursor:pointer}
.gbtn button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.g-优秀{color:var(--good)} .g-需改进{color:var(--crit)}
.warnline{font-size:12px;color:var(--warn-ink);background:var(--warn-bg);padding:6px 10px;border-radius:7px;margin:6px 0}
/* 课次：按时间分组，列表 / 卡片 */
.lt-row{display:grid;grid-template-columns:96px minmax(220px,1.6fr) minmax(330px,2fr) 170px;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--rule-2);font-size:12.5px}
.lt-row:first-child{border-top:0}.lt-row.today{background:color-mix(in srgb,var(--brand) 5%,transparent);box-shadow:inset 3px 0 0 var(--brand)}
.lt-d{display:flex;flex-direction:column;line-height:1.35}.lt-d b{font-size:16px;font-family:var(--mono)}.lt-d span{font-size:11.5px;color:var(--muted)}
.lt-m{min-width:0}.lt-n{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lt-n b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.lt-sk{font-size:12px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-prog{display:flex;align-items:flex-start}

.lt-st:first-child::before{display:none}
.lt-st i{width:18px;height:18px;border-radius:50%;border:2px solid var(--rule);background:var(--card);z-index:1;font-style:normal;font-size:11px;line-height:14px;color:#fff}
.lt-st b{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px}.lt-st small{font-size:11px;color:var(--muted)}
.lt-st.on i{background:var(--good);border-color:var(--good)}.lt-st.on b{color:var(--ink)}.lt-st.on::before{background:var(--good)}
.lt-st.cur i{border-color:var(--warn)}.lt-st.cur b,.lt-st.cur small{color:var(--warn)}
.lt-st.na{justify-content:center;padding-top:6px}.lt-st.na::before{display:none}.lt-st.na b{font-weight:400}
.lt-a{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.lt-a > div{display:flex;gap:6px}
.lt-more{gap:10px!important}.lt-more .lk{font-size:12px}.lt-more .del{color:var(--crit)}

.rs-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mc-ended{margin-top:16px}.mc-ended>summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);margin:0 2px 8px}
.mc-er{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px}.mc-er>span{color:var(--muted);font-size:12px}
.rs-bar .seg small{color:var(--muted);margin-left:2px}
.rs-g{margin-bottom:16px}
.rs-gh{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:13.5px}.rs-gh .note{font-size:12px;color:var(--muted)}
.rs-list{padding:0;overflow:hidden}
.rs-row{display:grid;grid-template-columns:28px minmax(220px,2.4fr) minmax(130px,1.2fr) minmax(150px,1.4fr) minmax(110px,1fr) 200px;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--rule-2);font-size:12.5px}
.rs-row:first-child{border-top:0}.rs-row:hover{background:var(--card-2)}
.rs-ic{font-size:17px}
.rs-n{min-width:0;display:flex;flex-direction:column}.rs-n b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rs-n span{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.rs-t{display:flex;flex-wrap:wrap;gap:6px}.rs-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2);background:var(--card-2);border-radius:5px;padding:1px 7px}.rs-chip i{width:7px;height:7px;border-radius:2px}
.rs-l{display:flex;flex-wrap:wrap;gap:6px;min-width:0}.rs-lc{font-size:11.5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:5px;padding:1px 7px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.rs-lc-pub{cursor:pointer;color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px dashed var(--warn)}button.rs-lc-pub:hover{background:color-mix(in srgb,var(--warn) 24%,transparent)}button.rs-lc-pub i{font-style:normal;font-weight:600;margin-left:5px}
.rs-a{display:flex;gap:4px 10px;justify-content:flex-end;flex-wrap:wrap}
.rs-head{background:var(--card-2);font-size:12px;color:var(--muted);padding-top:8px;padding-bottom:8px}.rs-head:hover{background:var(--card-2)}
.rs-k{font-size:11.5px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-src{display:inline-block;font-size:10.5px;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;background:var(--card-2);color:var(--muted);font-weight:400}
.rs-src.ai{background:var(--brand-soft);color:var(--brand-ink)}
.rs-u{font-size:12px;color:var(--ink-2)}.rs-u .note{font-size:12px}
.rs-a{align-items:center}
.rs-more{position:relative}
.rs-more>summary{list-style:none;cursor:pointer;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-weight:700;border:1px solid var(--rule);background:var(--card)}

.rs-reuse{display:block;margin-top:5px;border:1px dashed var(--brand);background:none;color:var(--brand-ink);border-radius:5px;font:inherit;font-size:11.5px;padding:1px 7px;cursor:pointer}
.rs-reuse:hover{background:var(--brand-soft)}
.rs-lc:hover{text-decoration:underline}button.rs-lc{border:0;cursor:pointer;font-family:inherit;font-weight:inherit}
.lt-reuse{display:inline-block;margin-left:8px;border:1px dashed var(--brand);background:none;color:var(--brand-ink);border-radius:5px;font:inherit;font-size:11.5px;padding:0 7px;cursor:pointer}
@media(max-width:1100px){.rs-row{grid-template-columns:28px 1fr;}.rs-t,.rs-l,.rs-u,.rs-s,.rs-a{grid-column:2}.rs-a{justify-content:flex-start}.rs-head{display:none}}
.mc{background:var(--card);border:1px solid var(--rule);border-radius:14px;margin-bottom:16px;overflow:hidden}
.mc-top{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.mc-name{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;cursor:pointer}
.mc-name b{font-size:17px;font-weight:650}.mc-name:hover b{color:var(--brand-ink)}.mc-name span{font-size:12.5px;color:var(--muted)}
.mc-tabs{display:flex;gap:14px;font-size:12.5px}
.mc-tabs .lk{font-size:12.5px}
.mc-body{display:grid;grid-template-columns:1.1fr 1fr 1.1fr}

.mc-h{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.mc-big{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--ink)}.mc-big small{font-family:inherit;font-size:12.5px;font-weight:400;color:var(--muted)}
.mc-bar{height:7px;border-radius:4px;background:var(--card-2);overflow:hidden}.mc-bar i{display:block;height:100%;border-radius:4px}
.mc-s{font-size:12px;color:var(--ink-2);line-height:1.6}
.mc-kv{display:flex;align-items:baseline;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-top:2px}.mc-kv b{font-family:var(--mono);font-size:18px;color:var(--ink)}

.mc-todo b{font-family:var(--mono);font-size:15px}.mc-todo b.w{color:var(--warn)}
.hm-hero{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(110deg,var(--brand-soft),var(--card) 70%);border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin-bottom:14px}
.hm-hero .btn,.hm-hero .btn-s{height:34px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}

.hm-ls.live{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 5%,transparent)}
.hm-ls .t{display:flex;flex-direction:column;line-height:1.3}.hm-ls .t b{font-family:var(--mono);font-size:15px}.hm-ls .t span{font-size:11.5px;color:var(--muted);font-family:var(--mono)}.hm-ls .t em{font-style:normal;font-size:11px;color:var(--brand-ink);margin-top:2px}

<div class="app">

<script>
(function () {
  'use strict';
  var esc = TK.esc, S = TK.load();
  var VIEW = (function () { var t = new URLSearchParams(location.search).get('t'); return ['courses', 'tt', 'eval', 'res'].indexOf(t) >= 0 ? t : 'home'; })();
  var VIEW_KEY = { home: 'tasks', courses: 'cr-courses', tt: 'cr-tt', eval: 'cr-eval', res: 'cr-res' };
  var space = null, ctab = 'lessons', evf = '待评价', evPlan = '', evCls = '';   // evPlan：课程名；evCls：班级 id   // space：当前进入的课程空间（课程计划 id）；ctab：课程空间页签
  var period = 'week', tab = 'tt', earlyOpen = false, cview = (function () { try { return localStorage.getItem('tkCourseView') || 'list'; } catch (e) { return 'list'; } })(), ttWeek = mondayOf(new Date());
  function mondayOf(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
  var F = { q: '', st: '', plan: '', from: '', to: '' }, RF = { q: '', st: '', from: '', to: '', course: '', type: '', src: '' };
  function save() { TK.save(S); }
  // 审计：关键状态变化（发布、评价、证据、补训 / 辅导、改进建议）记入平台审计日志（管理端「系统配置 › 操作日志」查看）
  function audit(action, object, before, after) {
    try { var st = DEMO.getState(), id = UI.currentIdentity(st); DEMO.addAudit(st, id.account.id, action, object, before, after, '成功'); DEMO.saveState(st); } catch (e) {}
  }
  /* ═══ 课程改进建议：老师在学情里提出；专业负责人在管理端「教学质量 › 课程改进建议」里处理，也可自己针对薄弱能力提出 ═══ */
  S.improves = S.improves || [];
  function planMajor(p) { var c = S.classes.filter(function (x) { return x.id === p.classId; })[0], m = c && S.edu.majors.filter(function (x) { return x.id === c.majorId; })[0]; return m ? m.name : ''; }
  var IMP_ST = { '待处理': 'w', '已采纳': 'g', '暂不处理': '', '已发出': 'r' };   // 已发出：专业负责人提给任课老师的
  /* ═══ 知识点掌握：取每个学生在该技能上最近一次老师确认的评价（含退回的那次），看技能下各知识点是否体现 ═══
     只统计发布时勾选的考查知识点（task.kpIds；同一技能被多个课次考查取并集）；存量任务没有 kpIds 视为全部。
     只用于学情分析和补训，不进证据、不汇总到能力达成 */
  function kpModel(p, M) {
    var list = S.courses.filter(function (c) { return c.planId === p.id && c.publish && c.publish.task && c.publish.task.on; });
    var kpIdsOf = function (c) { var t = c.publish.task; return t.kpIds && t.kpIds.length ? t.kpIds : null; };
    var allowBySkill = {};
    // 每个技能的考查知识点 = 各次发布时快照的并集
    list.forEach(function (c) { TK.taskKpGroups(c.publish.task).forEach(function (g) { var a = allowBySkill[g.sid] = allowBySkill[g.sid] || [], ids = a.map(function (k) { return k.id; }); g.kps.forEach(function (k) { if (ids.indexOf(k.id) < 0) a.push(k); }); }); });
    var groups = [], stuMiss = {}, stuKp = {};   // stuKp：每个学生 ok/miss/none 与未掌握知识点名单（学生达成卡双维度用）
    M.taught.forEach(function (r) {
      var ks = allowBySkill[r.sid] || [];
      if (!ks.length) return;
      var last = {};
      list.forEach(function (c) { (c.submissions || []).forEach(function (sb) {
        var it = sb.teacher && (sb.teacher.items || []).filter(function (x) { return x.sid === r.sid; })[0];
        if (it && (!last[sb.student] || sb.teacher.at >= last[sb.student].at)) last[sb.student] = { at: sb.teacher.at, marks: TK.itemKps(it, sb.student, kpIdsOf(c), c.publish.task), tid: c.id };
      }); });
      var rows = ks.map(function (k) {
        var cnt = { ok: 0, miss: 0, none: 0 }, miss = [];
        M.stus.forEach(function (st) {
          var l = last[st], s2 = stuKp[st] = stuKp[st] || { ok: 0, miss: 0, none: 0, names: [] };
          if (!l) { cnt.none++; s2.none++; }
          else if (l.marks[k.id] === 'miss') { cnt.miss++; miss.push(st); s2.miss++; s2.names.push(k.name); ((stuMiss[st] = stuMiss[st] || {})[r.sid] = stuMiss[st][r.sid] || []).push(k.name); }
          else if (l.marks[k.id] === 'ok') { cnt.ok++; s2.ok++; }
          else { cnt.none++; s2.none++; }   // 最近一次评价没考查这个知识点（发布时未勾选），记未评价
        });
        return { k: k, cnt: cnt, miss: miss, last: last };
      });
      groups.push({ r: r, rows: rows });
    });
    return { groups: groups, stuMiss: stuMiss, stuKp: stuKp };
  }
  var KPC = { ok: 'var(--good)', miss: 'var(--crit)', none: 'var(--rule)' }, KPN = { ok: '掌握', miss: '未掌握', none: '未评价' };
  function kpCard(KP, nStu) {
    if (!KP.groups.length) return '<div class="empty2">已教的技能还没有配置知识点</div>';
    var all = []; KP.groups.forEach(function (g) { g.rows.forEach(function (x) { all.push({ g: g, x: x }); }); });
    var top = all.filter(function (o) { return o.x.cnt.miss; }).sort(function (a, b) { return b.x.cnt.miss - a.x.cnt.miss; }).slice(0, 5);
    return '<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">按每个学生最近一次老师确认的评价（含退回）判断；按全班 ' + nStu + ' 人统计；只用于学情分析和补训，不计入证据' +
      ['ok', 'miss', 'none'].map(function (k) { return '<i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:' + KPC[k] + ';margin:0 3px 0 10px;vertical-align:-1px"></i>' + KPN[k]; }).join('') + '</div>' +
      (top.length ? '<div style="font-size:12.5px;margin-bottom:8px">未掌握人数最多：' + top.map(function (o) { return '<button class="lk" data-kpweak="' + o.g.r.sid + '|' + o.x.k.id + '">' + esc(o.x.k.name) + '（' + o.x.cnt.miss + ' 人）</button>'; }).join('　') + '</div>' : '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">已评价的学生都掌握了考查的知识点</div>') +
      KP.groups.map(function (g) {
        var ok = 0, ev = 0;
        g.rows.forEach(function (x) { ok += x.cnt.ok; ev += x.cnt.ok + x.cnt.miss; });
        return '<div class="sk-g">' + esc(g.r.name) + '<span style="font-size:11.5px;font-weight:400;color:var(--muted);margin-left:8px">掌握 ' + ok + '/' + ev + '</span></div><div class="kp-chips">' + g.rows.map(function (x) {
          var evx = x.cnt.ok + x.cnt.miss, tip = esc(x.k.name) + (x.k.type ? ' · ' + x.k.type : '') + '：掌握 ' + x.cnt.ok + '/' + evx + (x.cnt.none ? ' · 未评价 ' + x.cnt.none + ' 人' : '') + (x.cnt.miss ? ' · 点击看未掌握名单' : '');
          return x.cnt.miss ? '<button class="kp-chip m" data-kpweak="' + g.r.sid + '|' + x.k.id + '" title="' + esc(tip) + '">' + esc(x.k.name) + ' <b>' + x.cnt.miss + '</b></button>'
            : evx ? '<span class="kp-chip ok" title="' + esc(tip) + '">' + esc(x.k.name) + '</span>'
            : '<span class="kp-chip n" title="' + esc(tip) + '">' + esc(x.k.name) + '</span>';
        }).join('') + '</div>';
      }).join('');
  }
  function kpWeakModal(sid, kid, pid) {
    var p = plan(pid || statPlan) || myPlans()[0], KP = kpModel(p, statModel(p)), g = KP.groups.filter(function (x) { return x.r.sid === sid; })[0], x = g && g.rows.filter(function (y) { return y.k.id === kid; })[0];
    if (!x) return;
    var m = TK.modal({ title: '未掌握「' + x.k.name + '」的学生', width: 620, body: '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">所属技能：' + esc(g.r.name) + (x.k.core ? '<br>核心内容：' + esc(x.k.core) : '') + '</div><table class="tbl2"><thead><tr><th>学生</th><th>评价时间</th><th>操作</th></tr></thead><tbody>' +
      x.miss.map(function (st) { var l = x.last[st]; return '<tr><td><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-pick-stu value="' + esc(st) + '">' + esc(st) + '</label></td><td class="mono" style="font-size:11.5px">' + esc(l.at) + '</td><td><button class="lk" data-sub="' + l.tid + '|' + esc(st) + '">查看提交</button></td></tr>'; }).join('') + '</tbody></table>',
      foot: '<span style="font-size:12px;color:var(--muted);margin-right:auto">补训 / 辅导按所属技能发起</span><button class="btn-s" data-c>关闭</button><button class="btn-s" data-tutor>个别辅导（选中的学生）</button><button class="btn" data-go style="height:32px">对这 ' + x.miss.length + ' 人发起补训</button>' });
    m.foot.querySelector('[data-c]').onclick = m.close;
    m.foot.querySelector('[data-go]').onclick = function () { m.close(); remedyForm(sid, x.miss.slice()); };
    m.foot.querySelector('[data-tutor]').onclick = function () { var pick = [].map.call(m.body.querySelectorAll('[data-pick-stu]:checked'), function (z) { return z.value; }); if (!pick.length) { TK.toast('先勾选要辅导的学生'); return; } m.close(); remedyForm(sid, pick, true); };
    m.body.addEventListener('click', function (e) { var b = e.target.closest('[data-sub]'); if (!b) return; var q = b.getAttribute('data-sub').split('|'), c = course(q[0]), sb = c && c.submissions.find(function (z) { return z.student === q[1]; }); if (sb) evalDrawer(c, sb, function () {}); });
  }

  // 评价标准表：每个评价项对应一个技能，三档描述可修改

  function publishDrawer(c) {

    // 备课资源配置的知识点（rec.kpIds）：按技能汇总，发布时知识点默认勾选按它来；没配置的技能默认全选

    // 已关联知识体系的课程还可「从本课程知识体系补选」（没用平台备课、或资源没记技能时用）；公共基础课不挂技能
    var kind = TK.planKind(S, plan(c.planId) || {}), cand = (c.skillIds || []).filter(function (s) { return TK.kn().skill[s]; });
    if (kind !== 'public') c.resIds.forEach(function (id) { var r = res(id); (r && r.skillIds || []).forEach(function (s) { if (cand.indexOf(s) < 0 && TK.kn().skill[s]) cand.push(s); }); });

    m.body.innerHTML = '<p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">按这门课的进度，这节课轮到任务「' + esc(nt ? nt.name : '') + '」。下面是这门课已有、覆盖这个任务的资源：</p>' + list.map(function (r) {
      var lc = linkedCourses(r);
      return '<label class="pickrow"><input type="checkbox" data-pr="' + r.id + '"><span class="pn">' + esc(r.name) + '<small>' + esc(resSrc(r) + ' · ' + Object.keys(countTypes(r)).join('、') + (lc.length ? ' · 已用于 ' + lc.map(function (x) { return clsShort(x) + ' ' + lessonNo(x); }).join('、') : '')) + '</small></span></label>';
    }).join('');
    m.body.addEventListener('change', function (e) { var id = e.target.getAttribute('data-pr'); if (!id) return; var i = sel.indexOf(id); if (e.target.checked && i < 0) sel.push(id); if (!e.target.checked && i >= 0) sel.splice(i, 1); });
    m.foot.querySelector('[data-c]').onclick = m.close;
    m.foot.querySelector('[data-o]').onclick = function () {
      if (!sel.length) { TK.toast('请选择要关联的资源'); return; }
      sel.forEach(function (id) { if (c.resIds.indexOf(id) < 0) c.resIds.push(id); });
      TK.fillSkillsFromRes(S, c); save(); m.close(); render(); TK.toast('已关联 ' + sel.length + ' 份资源');
    };
  }

  /* ═══ 事件 ═══ */
  // 点页面其他地方收起资源行的「⋯」菜单
  document.addEventListener('click', function (e) { if (!e.target.closest('.rs-more')) [].forEach.call(document.querySelectorAll('.rs-more[open]'), function (x) { x.open = false; }); });
  var body = document.getElementById('body');
  body.addEventListener('click', function (e) {
    var t;
    // 首页数据概览卡跳转：反馈卡直达第一条有未读反馈的课程「课次」页
    if ((t = e.target.closest('[data-nav]'))) {
      e.preventDefault();
      var nv = t.getAttribute('data-nav');
      if (nv === 'fb') {
        var fbp = myPlans().filter(function (p) { return myCourses().some(function (c) { return c.planId === p.id && unread(c); }); })[0];
        if (fbp) { space = fbp.id; ctab = 'lessons'; markMenu('cr-courses'); render(); window.scrollTo(0, 0); return; }
        nv = 'courses';
      }
      space = null; VIEW = nv; evPlan = ''; evCls = '';
      try { var q = new URLSearchParams(location.search); q.set('t', nv); history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch (err) {}
      markMenu(VIEW_KEY[nv]); render(); window.scrollTo(0, 0); return;
    }
    if ((t = e.target.closest('[data-tg]'))) { var tg = t.getAttribute('data-tg'); todoOpen[tg] = !todoOpen[tg]; render(); return; }
    if ((t = e.target.closest('[data-period]'))) { period = t.getAttribute('data-period'); render(); return; }
    if ((t = e.target.closest('[data-tab]'))) { tab = t.getAttribute('data-tab'); render(); return; }
    if ((t = e.target.closest('[data-space]')) && !e.target.closest('[data-cact],[data-goeval]')) { var sq = t.getAttribute('data-space').split('|'); space = sq[0]; markMenu('cr-courses'); ctab = sq[1] || 'lessons'; evf = '待评价'; render(); window.scrollTo(0, 0); var pn = document.querySelector('.panel'); if (pn) pn.scrollTop = 0; return; }
    if (e.target.closest('[data-home]')) { space = null; if (VIEW !== 'courses') { location.href = UI.link('teacher-tasks.html?t=courses'); return; } render(); return; }
    if ((t = e.target.closest('[data-ctab]'))) { ctab = t.getAttribute('data-ctab'); render(); return; }
    if ((t = e.target.closest('[data-lsf]'))) { lsf = t.getAttribute('data-lsf'); render(); return; }
    if (e.target.closest('[data-past]')) { pastOpen = !pastOpen; render(); return; }
    if ((t = e.target.closest('[data-ltev]'))) { ctab = 'eval'; evf = '待评价'; render(); return; }
    if ((t = e.target.closest('[data-rst]'))) { RF.st = t.getAttribute('data-rst'); render(); return; }
    if (e.target.closest('[data-rup]')) { resForm(null); return; }
    if ((t = e.target.closest('[data-newextra]'))) { courseForm(null, t.getAttribute('data-newextra')); return; }
    if ((t = e.target.closest('[data-rpub]'))) { var pq = t.getAttribute('data-rpub').split('|'); var pc = S.courses.filter(function (x) { return x.id === pq[1]; })[0]; if (pc) publishDrawer(pc); return; }
    if ((t = e.target.closest('[data-rreuse]'))) { reuseLink(t.getAttribute('data-rreuse')); return; }
    if ((t = e.target.closest('[data-fpv]'))) { TK.toast('预览文件'); return; }
    if ((t = e.target.closest('[data-fed]'))) { TK.toast('打开在线编辑'); return; }
    if ((t = e.target.closest('[data-fdl]'))) { TK.toast('已开始下载'); return; }
    if ((t = e.target.closest('[data-lreuse]'))) { var lr = course(t.getAttribute('data-lreuse')); if (lr) reusePick(lr); return; }
    // 「⋯」菜单：同一时间只开一个，点菜单项后收起
    if ((t = e.target.closest('.rs-more>summary'))) { [].forEach.call(document.querySelectorAll('.rs-more[open]'), function (x) { if (x !== t.parentNode) x.open = false; }); }
    else if (!e.target.closest('.rs-more') || e.target.closest('.rs-mn')) [].forEach.call(document.querySelectorAll('.rs-more[open]'), function (x) { x.open = false; });
    if ((t = e.target.closest('[data-evf]'))) { evf = t.getAttribute('data-evf'); render(); return; }
    if ((t = e.target.closest('[data-batchai]'))) {
      var bl = (evRows || []).filter(function (x) { return x.s.status === '已提交' && x.s.ai; });
      if (!bl.length) { TK.toast('没有可采用 AI 初评的提交'); return; }
      TK.confirm('将 ' + bl.length + ' 份提交按 AI 初评批量确认为老师评价：等级与知识点取 AI 判定，AI 判「需改进」的按退回处理。之后可逐条打开再调整。确定批量采用吗？', function () {
        var nPass = 0;
        bl.forEach(function (x) {
          var tt = x.c.publish.task, cr = tt.criteria || [], it = [];
          cr.forEach(function (q) {
            var allow = TK.taskKps(tt, q.sid).map(function (k) { return k.id; });
            var ai = ((x.s.ai && x.s.ai.items) || []).find(function (z) { return z.sid === q.sid; });
            it.push({ sid: q.sid, grade: ai ? ai.grade : '合格', kps: Object.assign({}, ai ? TK.itemKps(ai, x.s.student, allow) : TK.aiKpMarks(q.sid, '合格', x.s.student, allow)) });
          });
          var g = cr.length ? TK.overall(it) : ((x.s.ai && TK.GRADES.indexOf(x.s.ai.result) >= 0) ? x.s.ai.result : '合格');
          applyTeacherEval(x.c, x.s, { items: it, grade: g, comment: x.s.ai.advice, result: g === '需改进' ? '退回修改' : '通过', byAi: true });
          if (g !== '需改进') nPass++;
        });
        save(); render(); TK.toast('已批量采用 AI 初评 ' + bl.length + ' 份（通过 ' + nPass + '、退回 ' + (bl.length - nPass) + '）');
      });
      return;
    }
    if ((t = e.target.closest('[data-evo]'))) { var eo = t.getAttribute('data-evo').split('|'), ec = course(eo[0]); if (ec) evalDrawer(ec, ec.submissions[+eo[1]], function () { render(); }); return; }
    if ((t = e.target.closest('[data-cview]'))) { cview = t.getAttribute('data-cview'); try { localStorage.setItem('tkCourseView', cview); } catch (x) {} render(); return; }
    if ((t = e.target.closest('[data-band]'))) { var bk = statPlan + '|' + t.getAttribute('data-band'); bandOpen[bk] = !bandOpen[bk]; render(); return; }
    if ((t = e.target.closest('[data-sec]')) && !e.target.closest('button,a')) { secOpen[t.getAttribute('data-sec')] = !secOpen[t.getAttribute('data-sec')]; render(); return; }
    if ((t = e.target.closest('[data-pick]'))) { statPlan = t.getAttribute('data-pick'); render(); return; }
    if ((t = e.target.closest('[data-goeval]'))) { var gc = course(t.getAttribute('data-goeval')); if (gc) { space = gc.planId; ctab = 'eval'; evf = '待评价'; markMenu('cr-courses'); render(); } return; }
    if (e.target.closest('[data-matrix]')) { showMatrix = !showMatrix; render(); return; }
    if ((t = e.target.closest('[data-sub]')) && t.closest('.st-d')) { var q = t.getAttribute('data-sub').split('|'), sc = course(q[0]), sb = sc && sc.submissions.find(function (x) { return x.student === q[1]; }); if (sb) evalDrawer(sc, sb, function () { render(); }); return; }
    if ((t = e.target.closest('[data-stu]'))) { var sk = statPlan + '|' + t.getAttribute('data-stu'); stuOpen[sk] = !stuOpen[sk]; render(); return; }
    if (e.target.closest('[data-early]')) { earlyOpen = !earlyOpen; render(); return; }
    if ((t = e.target.closest('[data-wk]'))) { var n = +t.getAttribute('data-wk'); if (!n) ttWeek = mondayOf(new Date()); else ttWeek.setDate(ttWeek.getDate() + 7 * n); render(); return; }
    if ((t = e.target.closest('[data-ttc]'))) { courseDetail(course(t.getAttribute('data-ttc'))); return; }
    if ((t = e.target.closest('[data-weak]'))) { weakModal(t.getAttribute('data-weak')); return; }
    if ((t = e.target.closest('[data-kpweak]'))) { var kq = t.getAttribute('data-kpweak').split('|'); kpWeakModal(kq[0], kq[1], kq[2]); return; }
    if ((t = e.target.closest('[data-improve]'))) { improveForm(t.getAttribute('data-improve')); return; }
    if ((t = e.target.closest('[data-export]'))) { var xp = t.getAttribute('data-export').split('|'); exportPlan(xp[0], xp[1]); return; }
    if ((t = e.target.closest('[data-remedy]'))) { remedyForm(t.getAttribute('data-remedy')); return; }
    if ((t = e.target.closest('[data-tut1]'))) { var tq = t.getAttribute('data-tut1').split('|'); remedyForm(tq[0], [tq[1]], true); return; }
    if ((t = e.target.closest('[data-stusub]'))) {   // 学生页签：打开该生在本课程计划最近一次提交
      var stu = t.getAttribute('data-stusub'), sp = plan(space || statPlan) || myPlans()[0], best = null;
      S.courses.forEach(function (x) { if (x.planId !== (sp && sp.id) || !x.publish || !x.publish.task) return; (x.submissions || []).forEach(function (sb) { if (sb.student === stu && sb.status !== '未提交' && (!best || (sb.at || '') > (best.s.at || ''))) best = { c: x, s: sb }; }); });
      if (best) evalDrawer(best.c, best.s, function () { render(); }); else TK.toast(stu + ' 还没有提交记录');
      return;
    }
    if (e.target.closest('[data-act="newCourse"]')) { courseForm(null); return; }
    if ((t = e.target.closest('[data-cact]'))) {
      var c = course(t.getAttribute('data-id')), a = t.getAttribute('data-cact');
      if (a === 'edit') courseForm(c);
      else if (a === 'copy') courseForm(null, null, c);
      else if (a === 'del' && c.source === '排课') TK.toast('这个课次来自管理端排课，不能删除；需要取消请联系教务删除这次排课');
      else if (a === 'del') TK.confirm('确定删除课次「' + c.name + '」吗？删除后不可恢复。', function () { S.courses.splice(S.courses.indexOf(c), 1); save(); render(); TK.toast('已删除'); });
      else if (a === 'link') linkResModal(c);
      else if (a === 'view') courseDetail(c);
      else if (a === 'publish') publishDrawer(c);
      else if (a === 'addres') addResModal(c);
      else if (a === 'prep') goPrep(c);
      return;
    }
    if ((t = e.target.closest('[data-ract]'))) {
      var r = res(t.getAttribute('data-id')), ra = t.getAttribute('data-ract');
      if (ra === 'dl') TK.toast(r.status === '已完成' ? '已开始打包下载' : r.status === '生成中' ? '资源还在生成中' : '资源生成失败，暂无可下载内容');
      else if (ra === 'view') resDetail(r);
      else if (ra === 'edit') resForm(r);
      else if (ra === 'del') resDelete(r);
      else if (ra === 'regen') resRegen(r);
      else linkCourseModal(r);
    }
  });
  body.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-cf'), k2 = e.target.getAttribute('data-rf');
    if (e.target.classList.contains('search')) { if (k) F[k] = e.target.value.trim(); if (k2) RF[k2] = e.target.value.trim(); clearTimeout(body._t); body._t = setTimeout(function () { render(); var s = body.querySelector('.search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 250); }
  });
  body.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-cf'), k2 = e.target.getAttribute('data-rf');
    if (e.target.classList.contains('search')) return;
    if (k) { F[k] = e.target.value; render(); } if (k2) { RF[k2] = e.target.value; render(); }
    if (e.target.hasAttribute('data-statplan')) { statPlan = e.target.value; render(); }
    if (e.target.hasAttribute('data-evplan')) { evPlan = e.target.value; render(); }
    if (e.target.hasAttribute('data-evcls')) { evCls = e.target.value; render(); }
  });

  UI.boot({ portal: 'teacher', active: VIEW_KEY[VIEW] });
  // 地址里的课程空间要在第一次渲染前读（渲染会按当前状态改写地址）：刷新后停在原课程原页签
  var hm = /^#course\/([^/]+)(?:\/(\w+))?/.exec(location.hash), hStat = location.hash === '#stat';
  if (hm && plan(hm[1])) { space = hm[1]; ctab = hm[2] || 'lessons'; markMenu('cr-courses'); }
  else if (hStat && myPlans().length) { space = myPlans()[0].id; ctab = 'stat'; }
  render();
  // 从成长记录「查看」进入：?open=course:ID / res:ID
  var op = new URLSearchParams(location.search).get('open');
  if (op) { var p = op.split(':'); if (p[0] === 'course' && course(p[1])) courseDetail(course(p[1])); if (p[0] === 'res' && res(p[1])) { space = null; tab = 'res'; render(); resDetail(res(p[1])); } }
})();
</script>
</body>
</html>
