<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务中心</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
.rcard .cb{display:flex;flex-direction:column;gap:8px}
.rcard .rh{display:flex;align-items:center;gap:10px}
.rcard .ri{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:0 0 34px}
.rcard .rn{flex:1;min-width:0}
.rcard .rn b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .rn span{font-size:11.5px;color:var(--muted)}
.rcard .cnt{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.lchips{display:flex;gap:6px;flex-wrap:wrap}
.lchip{font-size:11.5px;padding:3px 10px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink)}
.lchip.none{background:var(--card-2);color:var(--muted);border:1px solid var(--rule)}
.dtabs{display:flex;gap:18px;border-bottom:1px solid var(--rule);margin:-4px 0 14px}
.dtabs button{font:inherit;font-size:13px;padding:8px 0;border:0;background:none;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer}
.dtabs button[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.ftype{border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.ftype-h{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;margin-bottom:6px}
.ftype-h small{font-weight:400;color:var(--muted)}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dims>div{background:var(--card-2);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--ink-2)}
.dims b{display:block;font-size:18px;color:var(--ink);font-family:var(--mono)}
.ev-sec{font-size:12.5px;line-height:1.8}
.ev-sec .t{font-weight:600;color:var(--ink);margin-top:6px}
.gopt{display:flex;gap:8px;flex-wrap:wrap}
.gopt button{font:inherit;flex:1;min-width:120px;padding:10px;border-radius:10px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:13px}
.gopt button small{display:block;font-size:11px;color:var(--muted)}
.gopt button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.gopt button[aria-pressed="true"] small{color:#e6e0ff}
.pickrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--rule-2);font-size:13px}
.pickrow input{width:16px;height:16px;accent-color:var(--brand)}
.pickrow .pn{flex:1;min-width:0}
.pickrow .pn small{display:block;color:var(--muted);font-size:11.5px}
.skc{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:12px;background:var(--good-bg);color:var(--good);margin:2px 4px 2px 0}
.skc.off{background:var(--card-2);color:var(--muted)}
.crit{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.crit th,.crit td{border:1px solid var(--rule-2);padding:6px 8px;vertical-align:top;text-align:left}
.crit th{background:var(--card-2);font-weight:600;white-space:nowrap}
.crit textarea{width:100%;min-height:54px;font:inherit;font-size:12px;border:1px solid var(--rule);border-radius:6px;padding:4px 6px;resize:vertical;background:var(--card);color:var(--ink)}
.crit .sn{font-weight:600;color:var(--ink)}
.gbtn{display:inline-flex;gap:4px}
.gbtn button{font:inherit;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--rule);background:var(--card);cursor:pointer}
.gbtn button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.g-优秀{color:var(--good)} .g-需改进{color:var(--crit)}
.warnline{font-size:12px;color:var(--warn-ink);background:var(--warn-bg);padding:6px 10px;border-radius:7px;margin:6px 0}
/* 课次：按时间分组，列表 / 卡片 */
.grp-h{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:13.5px;font-weight:600;color:var(--ink)}
.grp-h .n{font-weight:400;color:var(--muted);font-size:12.5px}
.grp-h .lk{font-weight:400}
.ctbl{width:100%;min-width:980px}
.ctbl td{vertical-align:middle;font-size:12.5px}
.ctbl .nm{font-weight:600;color:var(--ink);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctbl .sk{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.ctbl .ops{white-space:nowrap}
.ctbl .ops .lk{margin-right:10px}
.ctbl-w{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-radius:13px}
/* 学情 */
.sbar{display:flex;border-radius:5px;overflow:hidden;background:var(--card-2);flex:1;min-width:120px}
.sbar span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;min-width:0;overflow:hidden}
.lgd{display:inline-flex;gap:12px;font-size:11.5px;font-weight:400;color:var(--muted);flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.qmark{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--rule);font-size:11px;color:var(--muted);cursor:help;font-weight:400}
.todo-r{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.todo-r:last-child{border-bottom:0}
.todo-r .sp{flex:1}
.sk-g{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 4px}
.sk-r,.st-r{display:flex;align-items:center;gap:12px;padding:6px 0}
.sk-r .nm{width:210px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-r .sm,.st-r .sm{width:130px;flex:none;font-size:12px;color:var(--ink-2)}
.sk-r .ac{width:84px;flex:none;text-align:right}
.st-r{cursor:pointer;border-bottom:1px solid var(--rule-2)}
.st-r:hover{background:var(--card-2)}
.st-r .nm{width:90px;flex:none;font-size:13px;font-weight:600}
.st-r .sbar{max-width:320px}
.st-r .sm{width:80px}
.st-r .wk{flex:1;display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.st-r .car{color:var(--muted);font-size:11px;width:14px}
.st-d{padding:6px 0 10px 102px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px;font-size:12.5px}
.st-d div{display:flex;align-items:center;gap:6px}
.st-d i{width:9px;height:9px;border-radius:2px;flex:none}
.st-d span{margin-left:auto;display:flex;gap:6px;align-items:center}
.ov tbody tr{cursor:pointer}
.ov tbody tr:hover{background:var(--card-2)}
.ov tbody tr.on{background:var(--brand-soft)}
.prog-m{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.prog-m .pb{width:90px;height:7px;border-radius:4px;background:var(--card-2);overflow:hidden}
.prog-m .pb span{display:block;height:100%;background:var(--brand)}
/* 课程整体情况 */
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 14px}
.kpi3>div{background:var(--card-2);border-radius:10px;padding:10px 14px}
.kpi3 .k{font-size:12px;color:var(--muted)}
.kpi3 .v{font-size:24px;font-weight:700;color:var(--ink);margin:2px 0}
.kpi3 .v small{font-size:12.5px;font-weight:400;color:var(--ink-2)}
.kpi3 .s{font-size:11.5px;color:var(--muted)}
.bands{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.band{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;cursor:pointer}
.band .bn{font-size:12px;color:var(--muted)}
.band .bv{font-size:22px;font-weight:700}
.band .bv small{font-size:12px;font-weight:400;color:var(--muted)}
.band .bp{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;margin:4px 0}
.band .bp span{display:block;height:100%}
.band.hi .bp span{background:var(--good)}.band.mid .bp span{background:var(--warn)}.band.lo .bp span{background:var(--crit)}
.band .bw{font-size:12px;color:var(--ink-2);margin-top:4px}
.band .bh{font-size:11.5px;color:var(--muted)}
/* 竖向柱状图 */
.vc-row{display:flex;gap:14px;flex-wrap:wrap}
.vc-box{background:var(--card-2);border-radius:10px;padding:10px 14px 8px;min-width:240px}
.vc-t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.vc-t .sp{flex:1}
.vc{display:flex;gap:14px}
.vc-g{flex:1;min-width:0}
.vc-bars{height:170px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-end;justify-content:center;gap:5px;padding-top:18px}
.vc-bar{flex:1;max-width:38px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.vc-n{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.vc-c{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.vc-l{font-size:11.5px;color:var(--ink-2);text-align:center;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 我的课表 */
.tt-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tt-bar .wk{font-size:13.5px;font-weight:600;margin:0 4px}
.tt-wrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:72px repeat(7,minmax(110px,1fr));border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);min-width:860px}
.tt>div{border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-height:44px}
.tt .th{background:var(--card-2);text-align:center;padding:8px 4px;font-size:12.5px;font-weight:600}
.tt .th small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px}
.tt .th.today{background:var(--brand-soft);color:var(--brand-ink)}
.tt .ph{background:var(--card-2);font-size:12px;color:var(--muted);display:grid;place-items:center;text-align:center;line-height:1.5}
.tt .cell{padding:6px;min-height:112px}
.tt .cell.today{background:color-mix(in srgb,var(--brand-soft) 40%,transparent)}
.lsn{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:8px;padding:7px 9px;margin-bottom:6px;font:inherit;font-size:12px;line-height:1.55;color:var(--ink-2);cursor:pointer}
.lsn:hover{filter:brightness(.97)}
.lsn b{display:block;font-size:12.5px;color:var(--ink)}
.lsn .m{color:var(--muted);font-family:var(--mono);font-size:11px}
.lsn .t{display:inline-block;margin-top:3px;font-size:10.5px;padding:0 6px;border-radius:10px}
.lsn .t.ok{background:var(--good-bg);color:var(--good)}
.lsn .t.wait{background:var(--warn-bg);color:var(--warn-ink)}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel"><div class="body" id="body"></div></div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script src="js/teacher-kit.js"></script>
<script>
(function () {
  'use strict';
  var esc = TK.esc, S = TK.load();
  var period = 'week', tab = 'course', earlyOpen = false, cview = (function () { try { return localStorage.getItem('tkCourseView') || 'list'; } catch (e) { return 'list'; } })(), ttWeek = mondayOf(new Date());
  function mondayOf(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
  var F = { q: '', st: '', plan: '', from: '', to: '' }, RF = { q: '', st: '', from: '', to: '' };
  function save() { TK.save(S); }
  // 审计：关键状态变化（发布、评价、证据、补训 / 辅导、改进建议）记入平台审计日志（管理端「系统配置 › 操作日志」查看）
  function audit(action, object, before, after) {
    try { var st = DEMO.getState(), id = UI.currentIdentity(st); DEMO.addAudit(st, id.account.id, action, object, before, after, '成功'); DEMO.saveState(st); } catch (e) {}
  }
  /* ═══ 课程改进建议：老师在学情里提出；专业负责人在管理端「教学质量 › 课程改进建议」里处理，也可自己针对薄弱能力提出 ═══ */
  S.improves = S.improves || [];
  function planMajor(p) { var c = S.classes.filter(function (x) { return x.id === p.classId; })[0], m = c && S.edu.majors.filter(function (x) { return x.id === c.majorId; })[0]; return m ? m.name : ''; }
  var IMP_ST = { '待处理': 'w', '已采纳': 'g', '暂不处理': '', '已发出': 'r' };   // 已发出：专业负责人提给任课老师的
  /* ═══ 知识点掌握：取每个学生在该技能上最近一次老师确认的评价（含退回的那次），看技能下各知识点是否体现 ═══
     只用于学情分析和补训，不进证据、不汇总到能力达成 */
  function kpModel(p, M) {
    var list = S.courses.filter(function (c) { return c.planId === p.id && c.publish && c.publish.task && c.publish.task.on; });
    var groups = [], stuMiss = {};
    M.taught.forEach(function (r) {
      var ks = ((TK.kn().skill[r.sid] || {}).kps) || []; if (!ks.length) return;
      var last = {};
      list.forEach(function (c) { (c.submissions || []).forEach(function (sb) {
        var it = sb.teacher && (sb.teacher.items || []).filter(function (x) { return x.sid === r.sid; })[0];
        if (it && (!last[sb.student] || sb.teacher.at >= last[sb.student].at)) last[sb.student] = { at: sb.teacher.at, marks: TK.itemKps(it, sb.student), tid: c.id };
      }); });
      var rows = ks.map(function (k) {
        var cnt = { ok: 0, miss: 0, none: 0 }, miss = [];
        M.stus.forEach(function (st) { var l = last[st]; if (!l) cnt.none++; else if (l.marks[k.id] === 'miss') { cnt.miss++; miss.push(st); ((stuMiss[st] = stuMiss[st] || {})[r.sid] = stuMiss[st][r.sid] || []).push(k.name); } else cnt.ok++; });
        return { k: k, cnt: cnt, miss: miss, last: last };
      });
      groups.push({ r: r, rows: rows });
    });
    return { groups: groups, stuMiss: stuMiss };
  }
  var KPC = { ok: 'var(--good)', miss: 'var(--crit)', none: 'var(--rule)' }, KPN = { ok: '掌握', miss: '未掌握', none: '未评价' };
  function kpBar(cnt) {
    var sum = cnt.ok + cnt.miss + cnt.none || 1;
    return '<span class="sbar" style="height:16px">' + ['ok', 'miss', 'none'].map(function (k) { var n = cnt[k]; return n ? '<span style="flex:' + n + ';background:' + KPC[k] + ';color:' + (k === 'none' ? 'var(--ink-2)' : '#fff') + '" title="' + KPN[k] + ' ' + n + ' 人">' + (n / sum >= 0.12 ? n : '') + '</span>' : ''; }).join('') + '</span>';
  }
  function kpCard(KP, nStu) {
    if (!KP.groups.length) return '';
    var all = []; KP.groups.forEach(function (g) { g.rows.forEach(function (x) { all.push({ g: g, x: x }); }); });
    var top = all.filter(function (o) { return o.x.cnt.miss; }).sort(function (a, b) { return b.x.cnt.miss - a.x.cnt.miss; }).slice(0, 5);
    return '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">知识点掌握<span style="font-size:12px;font-weight:400;color:var(--muted);margin-left:8px">按每个学生最近一次老师确认的评价，每条按全班 ' + nStu + ' 人分段；只用于学情分析和补训，不计入证据</span><span class="sp"></span>' +
      '<span class="lgd">' + ['ok', 'miss', 'none'].map(function (k) { return '<i style="background:' + KPC[k] + '"></i>' + KPN[k]; }).join('') + '</span></div>' +
      (top.length ? '<div style="font-size:12.5px;margin-bottom:8px">未掌握人数最多：' + top.map(function (o) { return '<button class="lk" data-kpweak="' + o.g.r.sid + '|' + o.x.k.id + '">' + esc(o.x.k.name) + '（' + o.x.cnt.miss + ' 人）</button>'; }).join('　') + '</div>' : '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">已评价的学生都掌握了考查的知识点</div>') +
      KP.groups.map(function (g) {
        return '<div class="sk-g">' + esc(g.r.name) + '</div>' + g.rows.map(function (x) {
          return '<div class="sk-r"><div class="nm" title="' + esc(x.k.core || '') + '">' + esc(x.k.name) + (x.k.type ? '<small style="color:var(--muted);margin-left:4px">' + esc(x.k.type) + '</small>' : '') + '</div>' + kpBar(x.cnt) +
            '<div class="sm">' + (x.cnt.ok + x.cnt.miss ? '掌握 <b>' + x.cnt.ok + '</b>/' + (x.cnt.ok + x.cnt.miss) : '未评价') + '</div><div class="ac">' + (x.cnt.miss ? '<button class="lk" data-kpweak="' + g.r.sid + '|' + x.k.id + '">' + x.cnt.miss + ' 人未掌握 ›</button>' : '') + '</div></div>';
        }).join('');
      }).join('') + '</div>';
  }
  function kpWeakModal(sid, kid) {
    var p = plan(statPlan), KP = kpModel(p, statModel(p)), g = KP.groups.filter(function (x) { return x.r.sid === sid; })[0], x = g && g.rows.filter(function (y) { return y.k.id === kid; })[0];
    if (!x) return;
    var m = TK.modal({ title: '未掌握「' + x.k.name + '」的学生', width: 620, body: '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">所属技能：' + esc(g.r.name) + (x.k.core ? '<br>核心内容：' + esc(x.k.core) : '') + '</div><table class="tbl2"><thead><tr><th>学生</th><th>评价时间</th><th>操作</th></tr></thead><tbody>' +
      x.miss.map(function (st) { var l = x.last[st]; return '<tr><td><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-pick-stu value="' + esc(st) + '">' + esc(st) + '</label></td><td class="mono" style="font-size:11.5px">' + esc(l.at) + '</td><td><button class="lk" data-sub="' + l.tid + '|' + esc(st) + '">查看提交</button></td></tr>'; }).join('') + '</tbody></table>',
      foot: '<span style="font-size:12px;color:var(--muted);margin-right:auto">补训 / 辅导按所属技能发起</span><button class="btn-s" data-c>关闭</button><button class="btn-s" data-tutor>个别辅导（选中的学生）</button><button class="btn" data-go style="height:32px">对这 ' + x.miss.length + ' 人发起补训</button>' });
    m.foot.querySelector('[data-c]').onclick = m.close;
    m.foot.querySelector('[data-go]').onclick = function () { m.close(); remedyForm(sid, x.miss.slice()); };
    m.foot.querySelector('[data-tutor]').onclick = function () { var pick = [].map.call(m.body.querySelectorAll('[data-pick-stu]:checked'), function (z) { return z.value; }); if (!pick.length) { TK.toast('先勾选要辅导的学生'); return; } m.close(); remedyForm(sid, pick, true); };
    m.body.addEventListener('click', function (e) { var b = e.target.closest('[data-sub]'); if (!b) return; var q = b.getAttribute('data-sub').split('|'), c = course(q[0]), sb = c && c.submissions.find(function (z) { return z.student === q[1]; }); if (sb) evalDrawer(c, sb, function () {}); });
  }
  function improveCard(p, M) {
    var list = S.improves.filter(function (x) { return x.planId === p.id || (x.course === p.course && x.role === '专业负责人'); });
    return '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">课程改进建议<span style="font-size:12px;font-weight:400;color:var(--muted);margin-left:8px">提给专业负责人，用于调整知识体系、课程安排或资源</span><span class="sp"></span><button class="btn-s" data-improve="' + p.id + '">提出改进建议</button></div>' +
      (list.length ? list.map(function (x) {
        return '<div class="todo-r" style="display:block"><span class="tag ' + (IMP_ST[x.status] || '') + '">' + esc(x.status) + '</span> <b>' + esc(x.type) + '</b>' + (x.target ? ' · ' + esc(x.target) : '') + '<span style="font-size:12px;color:var(--muted)">　' + esc(x.role + ' ' + x.from + ' · ' + x.at) + '</span>' +

    function kpEdit(sid, marks, i) {
      var ks = kpList(sid); if (!ks.length) return '';
      return '<div style="margin-top:8px;font-size:11.5px;color:var(--muted)">知识点（点一下切换掌握 / 未掌握）</div><div class="chips2" style="margin-top:4px">' + ks.map(function (k) { var ok = marks[k.id] !== 'miss'; return '<button type="button" data-ikp="' + i + ':' + k.id + '" aria-pressed="' + ok + '" title="' + esc(k.core || '') + '" style="font-size:11.5px">' + (ok ? '✓ ' : '✗ ') + esc(k.name) + '</button>'; }).join('') + '</div>';
    }
    function paint() {
      var a = s.ai;
      var h = '<div class="blk"><div class="blk-t">任务信息</div><div style="font-size:13px;font-weight:600">' + esc(t.name) + '</div><div style="font-size:12.5px;color:var(--ink-2);margin:4px 0">' + esc(t.desc) + '</div><div style="font-size:11.5px;color:var(--muted)">提交方式：' + esc(t.modes.join('、')) + '　截止时间：' + esc(t.due) + '</div></div>' +
        '<div class="blk"><div class="blk-t">学生提交' + ((s.history || []).length ? ' <span class="tag">第 ' + (s.history.length + 1) + ' 次提交</span>' : '') + (s.late ? ' <span class="tag r">超时提交</span>' : '') + '<span class="sp"></span><span style="font-size:11.5px;font-weight:400;color:var(--muted)">提交时间 ' + esc(s.at) + '</span></div>' + s.files.map(function (f, i) {
          return '<div class="fitem"><span class="fi" style="background:' + (TK.FT_COLOR[f.type] || '#7f63d8') + '">' + esc(f.type.slice(0, 2)) + '</span><span class="fn">' + esc(f.name) + '<small>' + esc(f.size) + '</small></span><button class="lk" data-pv="' + i + '">预览</button></div>';
        }).join('') + ((s.history || []).length ? '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">此前已退回 ' + s.history.length + ' 次，最近一次退回意见：' + esc((s.history[s.history.length - 1].teacher || {}).comment || '—') + '</div>' : '') + '</div>';
      if (crit.length) {
        h += '<div class="blk"><div class="blk-t">逐项评价' + (mode === 'edit' ? '<span class="sp"></span><span style="font-size:12px;font-weight:400">整体等级 ' + gtag(gradeNow()) + '</span>' : '') + '</div>' +
          '<table class="crit"><thead><tr><th style="width:17%">评价项（技能）</th><th>评价标准</th><th style="width:24%">AI 初评</th><th style="width:' + (mode === 'edit' ? 25 : 12) + '%">老师确认</th></tr></thead><tbody>' +
          crit.map(function (x, i) {
            var ai = aiOf(x.sid), te = teOf(x.sid);
            var std = TK.GRADES.map(function (g) { return '<div><b class="g-' + g + '">' + g + '</b>：' + esc(x.levels[g]) + '</div>'; }).join('');
            var mine = mode === 'edit' ? '<span class="gbtn">' + TK.GRADES.map(function (g) { return '<button type="button" data-ig="' + i + ':' + g + '" aria-pressed="' + (items[i].grade === g) + '">' + g + '</button>'; }).join('') + '</span>' + kpEdit(x.sid, items[i].kps, i) : te ? gtag(te.grade) + kpView(x.sid, TK.itemKps(te, s.student)) : '—';
            return '<tr><td class="sn">' + esc(x.name) + '</td><td style="line-height:1.6">' + std + '</td><td>' + (ai ? gtag(ai.grade) + '<div style="margin-top:4px;color:var(--ink-2)">' + esc(ai.reason) + '</div>' + kpView(x.sid, TK.itemKps(ai, s.student)) : '<span style="color:var(--muted)">未开启 AI 初评</span>') + '</td><td>' + mine + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      } else {
        h += '<div class="warnline">' + (TK.planKind(S, plan(c.planId) || {}) === 'public' ? '公共基础课，' : '本次任务未挂技能，') + '按整体等级评价，不记学习证据。</div>';
      }
      if (a) h += '<div class="blk"><div class="blk-t">AI 初评总结 ' + gtag(a.result) + '</div><div class="ev-sec"><div class="t">完成情况</div>' + esc(a.summary) + '<div class="t">主要亮点</div>' + esc(a.highlights) + '<div class="t">存在问题</div>' + esc(a.problems) + '<div class="t">AI 改进意见</div>' + esc(a.advice) + '</div></div>';
      if (s.teacher && mode === 'view') {
        var nEv = S.evidence.filter(function (x) { return x.tid === c.id && x.student === s.student; }).length;
        h += '<div class="blk"><div class="blk-t">老师评价</div><div class="kvg" style="grid-template-columns:repeat(3,1fr)"><div><div class="k">整体等级</div><div class="v">' + gtag(s.teacher.grade) + '</div></div><div><div class="k">最终结果</div><div class="v">' + esc(s.teacher.result) + '</div></div><div><div class="k">学习证据</div><div class="v">' + (s.teacher.result === '通过' && crit.length ? '已生成 ' + nEv + ' 条' : '不记证据') + '</div></div><div style="grid-column:1/-1"><div class="k">老师评语</div><div class="v">' + esc(s.teacher.comment || '—') + '</div></div></div></div>';
      }
      if (mode === 'edit') {
        h += '<div class="blk" style="border-color:var(--brand)"><div class="blk-t">✎ 老师确认</div><div class="fgrid">' +
          (crit.length ? '' : '<div class="ff full">整体等级<div class="gbtn">' + TK.GRADES.map(function (g) { return '<button type="button" data-g1="' + g + '" aria-pressed="' + (grade1 === g) + '">' + g + '</button>'; }).join('') + '</div></div>') +
          '<div class="ff full">最终结果<div class="chips2"><button type="button" data-res="通过" aria-pressed="' + (result === '通过') + '">通过</button><button type="button" data-res="退回修改" aria-pressed="' + (result === '退回修改') + '">退回修改</button></div>' +
          '<span style="font-size:11.5px;color:var(--muted)">' + (crit.length ? '通过后，每个评价项记一条学习证据；退回的那次只作为过程记录' : '') + '</span></div>' +
          '<div class="ff full">老师评语<textarea data-comment placeholder="请输入评语">' + esc(a ? a.advice : '') + '</textarea></div></div></div>';
      }
      d.body.innerHTML = h;
      var pend = s.status === '已提交';
      d.foot.innerHTML = mode === 'edit' ? '<button class="btn-s" data-cancel>取消</button><button class="btn" data-confirm style="height:32px">确认评价</button>'
        : pend ? '<button class="btn-s" data-close>取消</button><button class="btn-s" data-teacher>逐项确认</button>' + (a ? '<button class="btn" data-useai style="height:32px">✓ 采用 AI 初评</button>' : '')
        : '<button class="btn-s" data-close>关闭</button>';
    }
    function finish(te) {
      te.at = TK.fmt(new Date());
      s.teacher = te; s.status = te.result === '通过' ? '已评分' : '已退回'; s.evalSeen = false;
      var nEv = 0;
      if (te.result === '通过') {
        if (crit.length) { TK.addEvidence(S, c, s); nEv = te.items.length; }
        // 同步到学生成长：评价通过按整体等级记星，退回不记
        TK.addStuGrowth(S, s.student, { type: '老师评价', target: t.name, desc: '老师评价：' + te.grade, stars: TK.STU_STAR.grade[te.grade], tid: c.id });
      }
      var done = c.submissions.filter(function (x) { return x.teacher; }).length;
      TK.addGrowth(S, { type: '评价学生任务', target: '《' + t.name + '》学生任务评价', desc: '完成学生任务评价，当前进度：' + done + '/' + total, stars: Math.round(5 / total * 100) / 100, ref: { kind: 'course', id: c.id } });
      audit(te.result === '通过' ? '评价通过' : '评价退回', t.name + ' · ' + s.student, { 状态: '已提交' }, { 状态: s.status, 等级: te.grade, 逐项: (te.items || []).map(function (x) { return TK.skillName(x.sid) + ' ' + x.grade; }).join('；'), 证据: nEv + ' 条', AI初评: te.byAi ? '采用' : '老师逐项确认' });
      save(); d.close(); after(); render(); TK.toast('已完成评价：' + s.student + ' · ' + te.grade + (nEv ? '，生成 ' + nEv + ' 条学习证据' : ''));
    }
    function keepComment(fn) { var el = d.body.querySelector('[data-comment]'), cm = el ? el.value : null; fn(); var n = d.body.querySelector('[data-comment]'); if (n && cm != null) n.value = cm; }
    d.body.addEventListener('click', function (e) {
      var b;
      if ((b = e.target.closest('[data-ig]'))) { var p = b.getAttribute('data-ig').split(':'); items[+p[0]].grade = p[1]; result = TK.overall(items) === '需改进' ? '退回修改' : '通过'; keepComment(paint); return; }
      if ((b = e.target.closest('[data-ikp]'))) { var q = b.getAttribute('data-ikp').split(':'), mk = items[+q[0]].kps; mk[q[1]] = mk[q[1]] === 'miss' ? 'ok' : 'miss'; keepComment(paint); return; }
      if ((b = e.target.closest('[data-g1]'))) { grade1 = b.getAttribute('data-g1'); result = grade1 === '需改进' ? '退回修改' : '通过'; keepComment(paint); return; }
      if ((b = e.target.closest('[data-res]'))) { result = b.getAttribute('data-res'); d.body.querySelectorAll('[data-res]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); return; }
      if ((b = e.target.closest('[data-pv]'))) {
        var f = s.files[+b.getAttribute('data-pv')];
        if (f && f.text) { var m = TK.modal({ title: '文字预览 · ' + s.student, width: 560, body: '<div style="font-size:13px;line-height:1.85">' + esc(f.text) + '</div>', foot: '<button class="btn-s" data-c>关闭</button>' }); m.foot.querySelector('[data-c]').onclick = m.close; }
        else TK.toast('预览文件');
      }
    });
    d.foot.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) d.close();
      else if (e.target.closest('[data-cancel]')) { mode = 'view'; paint(); }
      else if (e.target.closest('[data-teacher]')) {
        mode = 'edit';
        items = crit.map(function (x) { var ai = aiOf(x.sid); return { sid: x.sid, grade: ai ? ai.grade : '', kps: Object.assign({}, ai ? TK.itemKps(ai, s.student) : TK.aiKpMarks(x.sid, '优秀', s.student)) }; });
        grade1 = s.ai && TK.GRADES.indexOf(s.ai.result) >= 0 ? s.ai.result : '';
        result = gradeNow() === '需改进' ? '退回修改' : '通过'; paint();
      }
      else if (e.target.closest('[data-useai]')) {
        var it = crit.map(function (x) { var ai = aiOf(x.sid); return { sid: x.sid, grade: ai ? ai.grade : '合格', kps: Object.assign({}, ai ? TK.itemKps(ai, s.student) : TK.aiKpMarks(x.sid, '合格', s.student)) }; });
        var g = crit.length ? TK.overall(it) : (TK.GRADES.indexOf(s.ai.result) >= 0 ? s.ai.result : '合格');
        finish({ items: it, grade: g, comment: s.ai.advice, result: g === '需改进' ? '退回修改' : '通过', byAi: true });
      }
      else if (e.target.closest('[data-confirm]')) {
        if (crit.length && items.some(function (x) { return !x.grade; })) { TK.toast('请逐项选择等级'); return; }
        if (!crit.length && !grade1) { TK.toast('请选择整体等级'); return; }
        finish({ items: items.map(function (x) { return { sid: x.sid, grade: x.grade, kps: x.kps }; }), grade: gradeNow(), comment: d.body.querySelector('[data-comment]').value.trim(), result: result });
      }
    });
    paint();
  }

  /* ═══ 备课资源详情 ═══ */
  var curR = null;
  function resDetail(r) {
    var d = TK.drawer({ title: '备课资源包详情', width: 760, tag: '<span class="tag ' + ({ '已完成': 'g', '生成中': 'w', '生成失败': 'r' }[r.status]) + '">' + r.status + '</span>', onClose: function () { curR = null; } });
    curR = { render: paint };
    function paint() {
      var lc = linkedCourses(r), g = {};
      r.files.forEach(function (f) { (g[f.type] = g[f.type] || []).push(f); });
      d.body.innerHTML = '<div class="blk"><div class="blk-t" style="font-size:15px">' + esc(r.name) + '<span class="sp"></span>' + (r.status === '已完成' ? '<button class="btn-s" data-rl>关联课次</button>' : '') + '<button class="btn-s" data-dlall>下载全部资源</button></div>' +
        '<div class="kvg" style="grid-template-columns:1fr 2fr 1fr"><div><div class="k">来源技能</div><div class="v">' + esc(r.knowledge || '—') + '</div></div><div><div class="k">关联课次</div><div class="v">' + esc(lc.map(function (c) { return c.name; }).join('、') || '未关联') + '</div></div><div><div class="k">创建时间</div><div class="v">' + esc(r.createdAt) + '</div></div></div></div>' +
        '<div class="blk"><div class="blk-t">备课资源（' + r.files.length + '）</div>' + (r.files.length ? Object.keys(g).map(function (t) {
          return '<div class="ftype"><div class="ftype-h"><span class="fi" style="width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;background:' + (TK.FT_COLOR[t] || '#7f63d8') + '">' + t.slice(0, 1) + '</span>' + t + '<small>共 ' + g[t].length + ' 个</small></div>' +
            g[t].map(function (f) { return '<div class="fitem"><span class="fn">' + esc(f.name) + '<small>' + esc(f.size) + '</small></span><button class="lk" data-dl>下载</button><button class="lk" data-pv>预览</button>' + (t === '图片' || t === '视频' ? '' : '<button class="lk" data-ed>编辑</button>') + '</div>'; }).join('') + '</div>';
        }).join('') : '<div class="empty2">' + (r.status === '生成失败' ? '资源生成失败，可回到工作台重新生成' : '资源生成中，请稍后查看') + '</div>') + '</div>';
    }
    d.body.addEventListener('click', function (e) {
      if (e.target.closest('[data-rl]')) linkCourseModal(r);
      else if (e.target.closest('[data-dlall]')) TK.toast(r.files.length ? '已开始打包下载' : '暂无可下载的资源');
      else if (e.target.closest('[data-dl]')) TK.toast('已开始下载');
      else if (e.target.closest('[data-pv]')) TK.toast('预览文件');
      else if (e.target.closest('[data-ed]')) TK.toast('打开在线编辑');
    });
    paint();
  }

  /* ═══ 事件 ═══ */
  var body = document.getElementById('body');
  body.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-period]'))) { period = t.getAttribute('data-period'); render(); return; }
    if ((t = e.target.closest('[data-tab]'))) { tab = t.getAttribute('data-tab'); render(); return; }
    if ((t = e.target.closest('[data-cview]'))) { cview = t.getAttribute('data-cview'); try { localStorage.setItem('tkCourseView', cview); } catch (x) {} render(); return; }
    if ((t = e.target.closest('[data-band]'))) { var bk = statPlan + '|' + t.getAttribute('data-band'); bandOpen[bk] = !bandOpen[bk]; render(); return; }
    if ((t = e.target.closest('[data-pick]'))) { statPlan = t.getAttribute('data-pick'); render(); return; }
    if ((t = e.target.closest('[data-goeval]'))) { var gc = course(t.getAttribute('data-goeval')); if (gc) courseDetail(gc, 'eval'); return; }
    if (e.target.closest('[data-matrix]')) { showMatrix = !showMatrix; render(); return; }
    if ((t = e.target.closest('[data-sub]')) && t.closest('.st-d')) { var q = t.getAttribute('data-sub').split('|'), sc = course(q[0]), sb = sc && sc.submissions.find(function (x) { return x.student === q[1]; }); if (sb) evalDrawer(sc, sb, function () { render(); }); return; }
    if ((t = e.target.closest('[data-stu]'))) { var sk = statPlan + '|' + t.getAttribute('data-stu'); stuOpen[sk] = !stuOpen[sk]; render(); return; }
    if (e.target.closest('[data-early]')) { earlyOpen = !earlyOpen; render(); return; }
    if ((t = e.target.closest('[data-wk]'))) { var n = +t.getAttribute('data-wk'); if (!n) ttWeek = mondayOf(new Date()); else ttWeek.setDate(ttWeek.getDate() + 7 * n); render(); return; }
    if ((t = e.target.closest('[data-ttc]'))) { courseDetail(course(t.getAttribute('data-ttc'))); return; }
    if ((t = e.target.closest('[data-weak]'))) { weakModal(t.getAttribute('data-weak')); return; }
    if ((t = e.target.closest('[data-kpweak]'))) { var kq = t.getAttribute('data-kpweak').split('|'); kpWeakModal(kq[0], kq[1]); return; }
    if ((t = e.target.closest('[data-improve]'))) { improveForm(t.getAttribute('data-improve')); return; }
    if ((t = e.target.closest('[data-export]'))) { var xp = t.getAttribute('data-export').split('|'); exportPlan(xp[0], xp[1]); return; }
    if ((t = e.target.closest('[data-remedy]'))) { remedyForm(t.getAttribute('data-remedy')); return; }
    if (e.target.closest('[data-act="newCourse"]')) { courseForm(null); return; }
    if ((t = e.target.closest('[data-cact]'))) {
      var c = course(t.getAttribute('data-id')), a = t.getAttribute('data-cact');
      if (a === 'edit') courseForm(c);
      else if (a === 'del' && c.source === '排课') TK.toast('这个课次来自管理端排课，不能删除；需要取消请联系教务删除这次排课');
      else if (a === 'del') TK.confirm('确定删除课次「' + c.name + '」吗？删除后不可恢复。', function () { S.courses.splice(S.courses.indexOf(c), 1); save(); render(); TK.toast('已删除'); });
      else if (a === 'link') linkResModal(c);
      else if (a === 'view') courseDetail(c);
      else if (a === 'publish') publishDrawer(c);
      else if (a === 'prep') goPrep(c);
      return;
    }
    if ((t = e.target.closest('[data-ract]'))) {
      var r = res(t.getAttribute('data-id')), ra = t.getAttribute('data-ract');
      if (ra === 'dl') TK.toast(r.status === '已完成' ? '已开始打包下载' : r.status === '生成中' ? '资源还在生成中' : '资源生成失败，暂无可下载内容');
      else if (ra === 'view') resDetail(r);
      else linkCourseModal(r);
    }
  });
  body.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-cf'), k2 = e.target.getAttribute('data-rf');
    if (e.target.classList.contains('search')) { if (k) F[k] = e.target.value.trim(); if (k2) RF[k2] = e.target.value.trim(); clearTimeout(body._t); body._t = setTimeout(function () { render(); var s = body.querySelector('.search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 250); }
  });
  body.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-cf'), k2 = e.target.getAttribute('data-rf');
    if (e.target.classList.contains('search')) return;
    if (k) { F[k] = e.target.value; render(); } if (k2) { RF[k2] = e.target.value; render(); }
    if (e.target.hasAttribute('data-statplan')) { statPlan = e.target.value; render(); }
  });

  UI.boot({ portal: 'teacher', active: 'tasks' });
  render();
  // 从成长记录「查看」进入：?open=course:ID / res:ID
  var op = new URLSearchParams(location.search).get('open');
  if (location.hash === '#stat') { tab = 'stat'; render(); }
  if (op) { var p = op.split(':'); if (p[0] === 'course' && course(p[1])) courseDetail(course(p[1])); if (p[0] === 'res' && res(p[1])) { tab = 'res'; render(); resDetail(res(p[1])); } }
})();
</script>
</body>
</html>
