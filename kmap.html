<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行业图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#f5f3f9; --card:#ffffff; --card-2:#faf9fd;
  --ink:#191524; --ink-2:#5c5670; --muted:#8e88a1;
  --rule:#e7e3f0; --rule-2:#f0edf7;
  --brand:#5b3fd6; --brand-soft:#ede9fb; --brand-ink:#3d29a0;
  --lv1:#b9a9ee; --lv2:#7f63d8; --lv3:#4a3aa7;
  --kgt-kp:#6366f1; --kgt-step:#64748b; --kgt-std:#d946ef; --kgt-case:#f59e0b;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --warn-ink:#7a5a08;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0f0d16; --card:#1c1a26; --card-2:#232030;
    --ink:#f4f2fa; --ink-2:#b0aac2; --muted:#847e96;
    --rule:#2b2739; --rule-2:#252132;
    --brand:#9b8bef; --brand-soft:#282343; --brand-ink:#c3b8f7;
    --lv1:#54477f; --lv2:#8371d6; --lv3:#b8aaf2;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0f0d16; --card:#1c1a26; --card-2:#232030;
  --ink:#f4f2fa; --ink-2:#b0aac2; --muted:#847e96;
  --rule:#2b2739; --rule-2:#252132;
  --brand:#9b8bef; --brand-soft:#282343; --brand-ink:#c3b8f7;
  --lv1:#54477f; --lv2:#8371d6; --lv3:#b8aaf2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.012em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ── platform shell（与 panorama.html 保持一致） ── */
.app{display:flex;min-height:100vh}
.lnav{width:206px;flex:0 0 206px;background:var(--card);border-right:1px solid var(--rule);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:0}
.lbrand{display:flex;align-items:center;gap:9px;padding:18px 18px 16px;border-bottom:1px solid var(--rule-2)}
.ldot{width:22px;height:22px;border-radius:7px;flex:0 0 22px;
  background:linear-gradient(140deg,#7b5cf0,#4a2fc4 60%,#6b3fd0)}
.lname{font-size:12.5px;font-weight:700;line-height:1.3}
.lgroup{padding:14px 10px 4px}
.lgt{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 7px}
.lmenu{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;
  border-radius:8px;color:var(--ink-2);font-size:13px;transition:background .12s,color .12s}
.lmenu:hover{background:var(--rule-2);color:var(--ink)}
.lmenu.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
a.lmenu{text-decoration:none}
.lmenu i{width:15px;height:15px;flex:0 0 15px;display:block;opacity:.75}
.lmenu.on i{opacity:1}
.lfoot{margin-top:auto;padding:14px 18px 16px;border-top:1px solid var(--rule-2);
  font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.7}

.panel{flex:1;min-width:0;display:flex;flex-direction:column}
.ptop{background:var(--card);border-bottom:1px solid var(--rule);padding:16px 28px 14px;
  position:sticky;top:0;z-index:20}
.pt-t{font-size:17px}
.pt-d{font-size:12px;color:var(--muted);margin-top:3px}
.body{padding:22px 28px 60px;max-width:1360px;width:100%}
@media (max-width:1000px){
  .app{display:block}
  .lnav{position:static;width:auto;height:auto;flex:none;border-right:none;border-bottom:1px solid var(--rule)}
  .lgroup{display:flex;flex-wrap:wrap;gap:2px;padding:8px}.lgt{display:none}.lmenu{width:auto}
  .lfoot{display:none}
  .ptop{padding:14px 16px;position:static}.body{padding:16px 16px 48px}
}
.card{background:var(--card);border:1px solid var(--rule);border-radius:13px}
.burst{position:relative;padding:14px 14px 10px;display:flex;flex-direction:column}
.burst-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 6px 8px}
.burst-t{font-size:13px;font-weight:700}
.blegend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 6px 2px;border-top:1px solid var(--rule-2);
  margin-top:6px}
.bl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.bl i{width:12px;height:12px;border-radius:3px;display:block;flex:0 0 12px}

/* 树形连线图 */
.tree{overflow:auto;flex:1;min-height:360px;max-height:min(700px,74vh);padding:6px 0 6px}
.tree svg{display:block}
.gch{font-family:var(--mono);font-size:9px;letter-spacing:.12em;fill:var(--muted);
  text-transform:uppercase;dominant-baseline:hanging}
.glink{fill:none;stroke-width:1.4;transition:opacity .18s,stroke-width .18s}
.glink.base{stroke:var(--rule);opacity:.95}
.glink.lv1{stroke:var(--lv1);opacity:.22}
.glink.lv2{stroke:var(--lv2);opacity:.22}
.glink.lv3{stroke:var(--lv3);opacity:.22}
.glink.on{opacity:.85;stroke-width:1.7}
.glink.off{opacity:.05}
.gnode{cursor:pointer;transition:opacity .18s}
.gnode rect{transition:fill .15s,stroke .15s}
.gnode:hover rect{stroke:var(--brand)}
.gnode.off{opacity:.2}
.gnode.sel rect{stroke:var(--brand);stroke-width:2;fill:var(--brand-soft)}
.gnode.ab .abbg{fill:transparent}
.gnode.ab.on .abbg{fill:var(--rule-2)}
.gnode.ab:hover .abbg{fill:var(--rule-2);stroke:var(--brand);stroke-width:1}
.gnode.ab.sel .abbg{fill:var(--brand-soft);stroke:var(--brand);stroke-width:1.5}
.gnode.sk .abbg{fill:var(--card-2);stroke:var(--rule);stroke-width:1}
.gnode.sk{cursor:pointer}
.gnode.sk:hover .abbg{stroke:var(--brand)}
.gnode.sk.sel .abbg{fill:var(--brand-soft);stroke:var(--brand);stroke-width:1.5}
.gnode.lf{cursor:default}
.gnode.lf .abbg{fill:transparent}
.gnode.lf:hover .abbg{fill:var(--rule-2)}
.gt-kind{font-size:9.5px;font-weight:500}
.gnode.lf.open{cursor:pointer}
.gnode.lf.open:hover .abbg{stroke:var(--brand);stroke-width:1}
.gnode.lf.sel .abbg{fill:var(--brand-soft);stroke:var(--brand);stroke-width:1.5}
.gnode.lf.off{opacity:.35}
.gnode.ai .abbg{stroke:var(--rule);stroke-dasharray:3 2;stroke-width:1;fill:var(--card)}
.gt-ai{font-family:var(--mono);font-size:8.5px;font-weight:600;fill:var(--brand)}
.btn-s:disabled{opacity:.45;cursor:not-allowed;border-color:var(--rule);color:var(--ink-2)}
.scbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 6px 8px;padding:7px 12px;
  border:1px solid var(--rule);border-radius:9px;background:var(--card-2);font-size:12px;color:var(--ink-2)}
.scbar[hidden]{display:none}
.scbar b{font-weight:600;color:var(--ink)}
.scbar .sc-n{display:inline-flex;align-items:center;gap:4px}
.scbar .sc-miss{flex-basis:100%;color:var(--ink-2);line-height:1.6}
.scbar .sc-act{margin-left:auto;display:flex;gap:6px}
/* 自检报告 */
.aidlg.wide{width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
.rpt{padding:18px 22px 16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 50px)}
.rpt-h{display:flex;align-items:flex-start;gap:12px}
.rpt-h h2{font-size:16px;margin:0}
.rpt-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.rpt-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rpt-tools label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer}
.rpt-sum{display:flex;gap:10px;flex-wrap:wrap}
.rpt-k{flex:1;min-width:110px;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--card-2)}
.rpt-k b{display:block;font-size:20px;font-family:var(--mono);font-weight:600}
.rpt-k span{font-size:11.5px;color:var(--muted)}
.rpt-body{overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.rpt-lv{border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.rpt-lv-h{padding:8px 12px;background:var(--card-2);border-bottom:1px solid var(--rule-2)}
.rpt-lv-h b{font-size:13px}
.rpt-chain{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.6}
.rpt-lv table{width:100%;border-collapse:collapse;font-size:12px}
.rpt-lv th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:6px 10px;border-bottom:1px solid var(--rule-2)}
.rpt-lv td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top;line-height:1.55}
.rpt-lv tr:last-child td{border-bottom:none}
.rpt-lv td.v{white-space:nowrap;font-weight:600}
.rpt-lv td.n{min-width:140px}
.rpt-lv td.n small{display:block;color:var(--muted);font-size:11px}
.rpt-miss{padding:7px 12px;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--rule);background:var(--card)}
.rpt-empty{font-size:12.5px;color:var(--muted);padding:10px 2px}
.rpt-src{font-size:10.5px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 4px;margin-left:4px}
.sc-pass{color:var(--good)} .sc-doubt{color:var(--warn-ink)} .sc-fail{color:var(--crit)}
.gt-sc{font-size:11px;font-weight:700}
.gt-sc.pass{fill:var(--good)} .gt-sc.doubt{fill:var(--warn)} .gt-sc.fail{fill:var(--crit)}
.gnode.ai.sc-fail .abbg{stroke:var(--crit);stroke-dasharray:none}
.gnode.ai.sc-doubt .abbg{stroke:var(--warn);stroke-dasharray:none}
/* AI 列末尾的「添加节点」 */
.gnode.aiadd{cursor:pointer}
.gnode.aiadd .abbg{fill:transparent;stroke:var(--rule);stroke-dasharray:3 2}
.gnode.aiadd:hover .abbg{stroke:var(--brand);fill:var(--brand-soft)}
.gnode.aiadd text{font-size:11.5px;fill:var(--muted)}
.gnode.aiadd:hover text{fill:var(--brand-ink)}
.gt-ai.man{fill:var(--ink-2)}
/* AI 节点右键菜单 */
.ctxmenu{position:fixed;z-index:85;min-width:128px;padding:4px;background:var(--card);border:1px solid var(--rule);
  border-radius:9px;box-shadow:0 12px 32px -12px rgba(25,21,36,.35)}
.ctxmenu[hidden]{display:none}
.ctxmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:6px;
  font-size:12.5px;color:var(--ink)}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--rule-2);outline:none}
.ctxmenu button.danger{color:var(--crit)}
.ctxmenu .ctx-h{padding:4px 10px 5px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--rule-2);margin-bottom:3px;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aidlg textarea{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card-2);color:var(--ink);resize:vertical;min-height:56px}
.aidlg textarea:focus{outline:none;border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--plane);border-radius:9px;padding:9px 14px;font-size:12.5px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.toast button{color:#b9a9ee;font-weight:600}
.gt-status{font-size:12px;fill:var(--muted)}
.gnode.retry .gt-status{fill:var(--brand);text-decoration:underline}
@keyframes kmPulse{0%,100%{opacity:.45}50%{opacity:1}}
.gt-loading{animation:kmPulse 1.2s ease-in-out infinite}

/* AI 设置 */
.btn-s{font-size:12px;padding:4px 11px;border-radius:7px;border:1px solid var(--rule);color:var(--ink-2);background:var(--card)}
.btn-s:hover{border-color:var(--brand);color:var(--brand-ink)}
.btn-p{font-size:12.5px;padding:6px 14px;border-radius:8px;background:var(--brand);color:#fff}
.aidlg{border:1px solid var(--rule);border-radius:13px;padding:0;background:var(--card);color:var(--ink);
  width:min(440px,calc(100vw - 32px));box-shadow:0 12px 40px -12px rgba(25,21,36,.3)}
.aidlg::backdrop{background:rgba(15,13,22,.35)}
.aidlg form{padding:18px 20px 16px;display:flex;flex-direction:column;gap:11px}
.aidlg h2{font-size:15px;margin:0}
.aidlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.aidlg input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card-2);color:var(--ink)}
.aidlg input:focus,.aidlg select:focus{outline:none;border-color:var(--brand)}
.aidlg select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card-2);color:var(--ink)}
.aidlg .presets{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.aidlg .note{font-size:11.5px;color:var(--muted);line-height:1.55}
.aidlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.gt{font-family:var(--sans);font-size:11.5px;fill:var(--ink)}
.gt-ind{font-size:13px;font-weight:700;fill:var(--brand-ink)}
.gt-ab{font-size:11px}
.gt-n{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.gt-tier{font-family:var(--mono);font-size:9px;fill:var(--brand)}
.gt-chev{font-size:14px;fill:var(--muted)}
.gnode.sel .gt-chev{fill:var(--brand)}
.gt-empty{font-size:12px;fill:var(--muted)}

#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--plane);
  border-radius:8px;padding:8px 11px;font-size:11.5px;line-height:1.55;max-width:260px;opacity:0;
  transition:opacity .12s;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
#tip.on{opacity:1}
#tip b{font-weight:700}
#tip .tk{font-family:var(--mono);font-size:10px;opacity:.72;display:block;margin-top:3px}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav">
    <div class="lbrand"><div class="ldot" aria-hidden="true"></div>
      <div class="lname">AIGC 智慧课堂<br>教学平台 · 管理端</div></div>
    <div class="lgroup">
      <div class="lgt">概览</div>
      <button class="lmenu"><i>▤</i>数据概览</button>
      <a class="lmenu" href="panorama.html"><i>◎</i>行业分析</a>
      <button class="lmenu on" aria-current="page"><i>◇</i>行业图谱</button>
    </div>
    <div class="lgroup">
      <div class="lgt">教务</div>
      <button class="lmenu"><i>▤</i>教务基础数据</button>
      <button class="lmenu"><i>▤</i>课程计划管理</button>
      <button class="lmenu"><i>▤</i>账号与角色</button>
    </div>
    <div class="lgroup">
      <div class="lgt">系统</div>
      <button class="lmenu"><i>▤</i>系统配置</button>
    </div>
    <div class="lfoot" id="lfoot"></div>
  </aside>

  <div class="panel">
    <div class="ptop">
      <h1 class="pt-t">行业图谱</h1>
      <div class="pt-d" id="kmapDesc"></div>
    </div>
    <div class="body">
      <div class="card burst">
        <div class="burst-h"><span class="burst-t">行业能力全景</span><span style="flex:1"></span>
          <button class="btn-s" id="saveBtn" type="button" disabled>保存</button>
          <button class="btn-s" id="scBtn" type="button" disabled>自检</button>
          <button class="btn-s" id="aiCfgBtn" type="button">AI 设置</button></div>
        <div class="scbar" id="scBar" hidden></div>
        <div class="tree" id="posTree"></div>
        <div class="blegend">
          <span class="bl"><i style="background:var(--lv1)"></i>L1</span>
          <span class="bl"><i style="background:var(--lv2)"></i>L2</span>
          <span class="bl"><i style="background:var(--lv3)"></i>L3</span>
          <span class="bl" style="color:var(--muted)">连线颜色 = 该岗位对该能力的要求等级</span>
          <span class="bl" style="color:var(--muted)">点岗位展开能力项　点能力项展开技能并反推要求它的岗位　点技能展开下级节点　点末级节点由 AI 继续细分　点子行业高亮所属岗位　★ 核心能力　×N 被几个岗位要求</span>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="tip" role="status"></div>
<dialog class="aidlg" id="nodeDlg">
  <form method="dialog" id="nodeForm">
    <h2 id="nodeDlgTitle">编辑节点</h2>
    <label>名称<input id="nodeName" type="text" maxlength="20" required></label>
    <label>说明<textarea id="nodeDesc" maxlength="40" rows="2"></textarea></label>
    <div class="note" id="nodeDlgNote"></div>
    <div class="acts"><button class="btn-s" value="cancel" formnovalidate>取消</button><button class="btn-p" value="save">保存</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<dialog class="aidlg wide" id="scReport" aria-labelledby="rptTitle">
  <div class="rpt">
    <div class="rpt-h">
      <div><h2 id="rptTitle">AI 延展内容自检报告</h2><div class="rpt-meta" id="rptMeta"></div></div>
      <div class="rpt-tools">
        <label><input type="checkbox" id="rptOnlyIssue"> 只看存疑和有问题</label>
        <button class="btn-s" type="button" data-rpt="copy">复制报告</button>
        <button class="btn-s" type="button" data-rpt="close">关闭</button>
      </div>
    </div>
    <div class="rpt-sum" id="rptSum"></div>
    <div class="rpt-body" id="rptBody"></div>
  </div>
</dialog>
<div class="ctxmenu" id="ctxMenu" role="menu" hidden>
  <div class="ctx-h" id="ctxTitle"></div>
  <button type="button" role="menuitem" data-ctx="edit">✎ 编辑</button>
  <button type="button" role="menuitem" class="danger" data-ctx="del">✕ 删除</button>
</div>
<dialog class="aidlg" id="aiDlg">
  <form method="dialog" id="aiForm">
    <h2>AI 设置</h2>
    <label>接口类型<select id="aiType">
      <option value="anthropic">Anthropic（Claude）</option>
      <option value="openai">OpenAI 兼容（DeepSeek 等）</option>
    </select></label>
    <div class="presets">快速填入：<button class="btn-s" type="button" data-preset="deepseek">DeepSeek</button><button class="btn-s" type="button" data-preset="claude">Claude</button></div>
    <label>接口地址<input id="aiUrl" type="url" required></label>
    <label>模型<input id="aiModel" type="text" required></label>
    <label>API Key<input id="aiKey" type="password" autocomplete="off" required></label>
    <div class="note">点击末级节点时，页面直接调用该接口生成下级节点。Key 只保存在本机浏览器中，不会写入页面或项目文件；打开本页的任何人都需要填写自己的 Key。</div>
    <div class="acts"><button class="btn-s" value="cancel" formnovalidate>取消</button><button class="btn-p" value="save">保存</button></div>
  </form>

  p.abilities.forEach(r=>{
    if(isInd.has(r.ability)) ind++;
    else if(subSharedSet[p.sub].has(r.ability)) sh++;
    else own++;
  });
  return {ind, sh, own};
}

/* ---- 布局 ----
   默认只画「行业 - 子行业 - 岗位」三层；点某个岗位，在第四列展开该岗位的能力项（同一时间只展开一个岗位）；
   再点其中一条能力项，在第五列展开归属该能力项的技能；再点技能，在第六列按类型分组展开其下级节点。 */
const GW0 = 1260, ROWH = 23, TOP = 16, PSTEP = 46, GGAP = 8;
const XI=[8,92], XS=[128,276], XP=[306,468], XA=[504,756], XK=[792,956], XL=[992,GW0];
// 第 7 列起为 AI 细分列，每列等宽，不限层数
const AIW = 240, AIGAP = 36;
const XAI = i => { const x0 = XL[1] + AIGAP + i*(AIW + AIGAP); return [x0, x0 + AIW]; };

const posLayout = [];          // {id, y}
(function(){
  let y = TOP + 26, prev = null;
  builtSubs.forEach(sid=>{
    if(prev !== null) y += PSTEP*0.7;
    sub[sid].positionIds.forEach(pid=>{ posLayout.push({id:pid, y}); y += PSTEP; });
    prev = sid;
  });
})();
const posY = Object.fromEntries(posLayout.map(p=>[p.id,p.y]));
const posBottom = Math.max(...posLayout.map(p=>p.y)) + 24;

const subY = {};
builtSubs.forEach(sid=>{
  const ys = sub[sid].positionIds.map(p=>posY[p]);
  subY[sid] = (Math.min(...ys)+Math.max(...ys))/2;
});
const indY = (TOP + 12 + posBottom)/2;

// 展开的一列：纵向以上一级节点为中心，超出上沿时贴顶
function colLayout(ids, cy){
  const y0 = Math.max(TOP + 26, cy - (ids.length-1)*ROWH/2);
  return ids.map((id,i)=>({id, y:y0 + i*ROWH}));
}
// 展开岗位的能力项：按权重排序
function ablLayout(pid){
  const rows = pos[pid].abilities;
  return colLayout(rows.map(r=>r.ability), posY[pid]).map((a,i)=>({...a, level:rows[i].level}));
}

// 技能下级节点：按类型分组（数据已排好序），组间留空
function leafLayout(kid, cy){
  const ids = skl[kid].children;
  const gaps = ids.filter((id,i)=>i>0 && snode[id].kind!==snode[ids[i-1]].kind).length;
  const y0 = Math.max(TOP + 26, cy - ((ids.length-1)*ROWH + gaps*GGAP)/2);
  let y = y0;
  return ids.map((id,i)=>{
    if(i>0 && snode[id].kind!==snode[ids[i-1]].kind) y += GGAP;
    const r = {id, y}; y += ROWH; return r;
  });
}

/* ---- 状态 ----
   exp：当前展开的岗位；sel：在此基础上的高亮（子行业 / 能力项）；skx：展开下级节点的技能；
   ai：从某个末级节点起由 AI 逐层细分的各列，ai[i] = {parent, parentName, kind, status, items, err}
   （只保存在当前页面，收起即丢弃，再展开会重新生成） */
let exp = null, sel = null, skx = null, ai = [];
let scState = {status:'idle', err:''};   // 自检状态：idle / loading / done / error
function activeSets(){
  const subs=new Set(), poss=new Set(), abls=new Set();
  if(sel && sel.type==='sub'){
    subs.add(sel.id); sub[sel.id].positionIds.forEach(p=>poss.add(p));
    if(exp && poss.has(exp)) pos[exp].abilities.forEach(r=>abls.add(r.ability));
  } else if(sel && sel.type==='abl'){
    abls.add(sel.id);
    abl[sel.id].requiredBy.forEach(r=>{ poss.add(r.position); subs.add(pos[r.position].sub); });
  } else if(exp){
    poss.add(exp); subs.add(pos[exp].sub);
    pos[exp].abilities.forEach(r=>abls.add(r.ability));
  } else return null;
  return {subs, poss, abls};
}

function link(x1,y1,x2,y2){
  const dx = (x2-x1)*0.5;
  return `M ${x1} ${y1.toFixed(1)} C ${x1+dx} ${y1.toFixed(1)}, ${x2-dx} ${y2.toFixed(1)}, ${x2} ${y2.toFixed(1)}`;
}
const cls = (on)=> on===null ? '' : (on ? ' on' : ' off');

function renderGraph(){
  const A = activeSets();
  const sOn = id => A ? A.subs.has(id) : null;
  const pOn = id => A ? A.poss.has(id) : null;
  const aOn = id => A ? A.abls.has(id) : null;
  const AL = exp ? ablLayout(exp) : [];
  const selAbl = sel && sel.type==='abl' ? AL.find(a=>a.id===sel.id) : null;
  const KL = selAbl ? colLayout(abl[selAbl.id].skills, selAbl.y) : [];
  const selSk = skx ? KL.find(k=>k.id===skx) : null;
  const LL = selSk ? leafLayout(selSk.id, selSk.y) : [];
  // AI 列：父节点为上一列中被选中的那一个
  const AIL = [];
  let py = ai.length ? (LL.find(l=>l.id===ai[0].parent)||{}).y : null;
  ai.forEach((lv,i)=>{
    if(py==null) return;
    const items = lv.status==='ok' ? lv.items : [];
    const rows = colLayout(items.map((_,j)=>j), py);
    AIL.push({lv, py, rows});
    const nx = ai[i+1];
    py = nx ? (rows.find(r=>lv.items[r.id] && lv.items[r.id].key===nx.parent)||{}).y : null;
  });
  const last = arr => arr.length ? arr[arr.length-1].y + 16 : 0;
  const addY = c => c.rows.length ? c.rows[c.rows.length-1].y + ROWH : c.py + ROWH;   // 「+ 添加节点」所在行
  const GH = Math.max(posBottom, last(AL), last(KL), last(LL),
    ...AIL.map(c=>Math.max(last(c.rows), c.py + 16, c.lv.status==='ok' ? addY(c) + 16 : 0))) + TOP;
  // 图宽只到当前已展开的最后一列，不为未展开的层级预留位置
  let GW = (AIL.length ? XAI(AIL.length-1)[1] : selSk ? XL[1] : selAbl && KL.length ? XK[1] : exp ? XA[1] : XP[1]) + 8;
  if(AIL.length && AIL[AIL.length-1].lv.status==='error') GW += 70;   // 失败提示较长
  let links = '', nodes = '';

  // 行业 → 子行业
  builtSubs.forEach(sid=>{
    links += `<path class="glink base${cls(sOn(sid))}" d="${link(XI[1], indY, XS[0], subY[sid])}"></path>`;
  });
  // 子行业 → 岗位
  posLayout.forEach(p=>{
    const sid = pos[p.id].sub;
    links += `<path class="glink base${cls(A ? (A.subs.has(sid)&&A.poss.has(p.id)) : null)}"
      d="${link(XS[1], subY[sid], XP[0], p.y)}"></path>`;
  });
  // 岗位 → 能力项（颜色 = 要求等级）。选中能力项时，从所有要求它的岗位连过来
  if(exp){
    const ay = Object.fromEntries(AL.map(a=>[a.id,a.y]));
    AL.forEach(a=>{
      const on = A ? A.poss.has(exp) && A.abls.has(a.id) : null;
      links += `<path class="glink lv${LV[a.level]}${cls(on)}" d="${link(XP[1], posY[exp], XA[0]-6, a.y)}"></path>`;
    });
    if(sel && sel.type==='abl'){
      abl[sel.id].requiredBy.filter(r=>r.position!==exp).forEach(r=>{
        links += `<path class="glink lv${LV[r.level]} on" d="${link(XP[1], posY[r.position], XA[0]-6, ay[sel.id])}"></path>`;
      });
    }
  }

  // 能力项 → 技能
  KL.forEach(k=>{
    const on = selSk ? k.id===selSk.id : true;
    links += `<path class="glink base${on?' on':' off'}" d="${link(XA[1], selAbl.y, XK[0]-6, k.y)}"></path>`;
  });
  // 技能 → 下级节点
  const aiRoot = ai.length ? ai[0].parent : null;
  LL.forEach(l=>{
    const on = aiRoot ? l.id===aiRoot : true;
    links += `<path class="glink base${on?' on':' off'}" d="${link(XK[1], selSk.y, XL[0]-6, l.y)}"></path>`;
  });
  // 末级节点 → AI 细分各列
  AIL.forEach((c,i)=>{
    const [x0] = XAI(i), px = i===0 ? XL[1] : XAI(i-1)[1];
    const nx = ai[i+1];
    c.rows.forEach(r=>{
      const on = nx ? c.lv.items[r.id].key===nx.parent : true;
      links += `<path class="glink base${on?' on':' off'}" d="${link(px, c.py, x0-6, r.y)}"></path>`;
    });
  });

  // 行业节点
  nodes += `<g class="gnode" data-n="ind|${esc(I.id)}">
    <rect x="${XI[0]}" y="${indY-17}" width="${XI[1]-XI[0]}" height="34" rx="9"
      fill="var(--brand-soft)" stroke="var(--brand)"></rect>
    <text x="${(XI[0]+XI[1])/2}" y="${indY}" text-anchor="middle" dominant-baseline="central"
      class="gt gt-ind">${esc(I.name)}</text></g>`;

  // 子行业节点
  builtSubs.forEach(sid=>{
    const s = sub[sid], on = sOn(sid), w = XS[1]-XS[0];
    nodes += `<g class="gnode${cls(on)}${sel&&sel.type==='sub'&&sel.id===sid?' sel':''}" data-n="sub|${sid}">
      <rect x="${XS[0]}" y="${subY[sid]-15}" width="${w}" height="30" rx="8"
        fill="var(--card-2)" stroke="var(--rule)"></rect>
      <text x="${XS[0]+11}" y="${subY[sid]}" dominant-baseline="central" class="gt">${esc(fit(s.name, w-38, 11.5))}</text>
      <text x="${XS[1]-10}" y="${subY[sid]}" text-anchor="end" dominant-baseline="central"
        class="gt gt-n">${s.positionIds.length}</text></g>`;
  });

  // 岗位节点：右侧数字为能力项数，箭头表示可展开 / 已展开
  posLayout.forEach(p=>{
    const P = pos[p.id], on = pOn(p.id), w = XP[1]-XP[0], open = exp===p.id;
    nodes += `<g class="gnode${cls(on)}${open?' sel':''}" data-n="pos|${p.id}">
      <rect x="${XP[0]}" y="${p.y-14}" width="${w}" height="28" rx="8"
        fill="var(--card-2)" stroke="var(--rule)"></rect>
      <text x="${XP[0]+11}" y="${p.y}" dominant-baseline="central" class="gt">${esc(fit(P.name, w-46, 11.5))}</text>
      <text x="${XP[1]-22}" y="${p.y}" text-anchor="end" dominant-baseline="central"
        class="gt gt-n">${P.abilityCount}</text>
      <text x="${XP[1]-9}" y="${p.y}" text-anchor="middle" dominant-baseline="central"
        class="gt gt-chev">${open?'‹':'›'}</text></g>`;
  });

  // 能力项节点（仅展开岗位的）
  AL.forEach(r=>{
    const a = abl[r.id], on = aOn(a.id), y = r.y;
    const tier = isInd.has(a.id) ? '通用' : '';
    nodes += `<g class="gnode ab${cls(on)}${sel&&sel.type==='abl'&&sel.id===a.id?' sel':''}" data-n="abl|${a.id}">
      <rect x="${XA[0]-4}" y="${y-10}" width="${XA[1]-XA[0]+4}" height="20" rx="6"
        class="abbg"></rect>
      <circle cx="${XA[0]+4}" cy="${y}" r="3" fill="var(--${a.core?'brand':'muted'})"></circle>
      <text x="${XA[0]+14}" y="${y}" dominant-baseline="central" class="gt gt-ab">${esc(fit(a.name, 182, 11))}${a.core?' ★':''}</text>
      ${tier?`<text x="${XA[1]-42}" y="${y}" text-anchor="end" dominant-baseline="central" class="gt gt-tier">${tier}</text>`:''}
      <text x="${XA[1]-4}" y="${y}" text-anchor="end" dominant-baseline="central" class="gt gt-n">×${a.positionCount}</text></g>`;
  });
  // 技能节点（仅选中能力项的）
  KL.forEach(k=>{
    const K = skl[k.id];
    const on = selSk ? k.id===selSk.id : null;
    nodes += `<g class="gnode sk${cls(on)}${on?' sel':''}" data-n="skl|${k.id}">
      <rect x="${XK[0]-4}" y="${k.y-10}" width="${XK[1]-XK[0]+4}" height="20" rx="6" class="abbg"></rect>
      <rect x="${XK[0]+1}" y="${k.y-3}" width="6" height="6" rx="1.5" fill="var(--brand)"></rect>
      <text x="${XK[0]+14}" y="${k.y}" dominant-baseline="central" class="gt gt-ab">${esc(fit(K.name, XK[1]-XK[0]-40, 11))}</text>
      <text x="${XK[1]-4}" y="${k.y}" text-anchor="end" dominant-baseline="central" class="gt gt-n">${K.children.length}</text></g>`;
  });

  // 下级节点（仅展开技能的）：类型标签 + 名称
  LL.forEach(l=>{
    const n = snode[l.id], k = KIND[n.kind];
    const open = aiRoot===l.id;
    nodes += `<g class="gnode lf open${aiRoot ? (open?' sel':' off') : ''}" data-n="lf|${l.id}">
      <rect x="${XL[0]-4}" y="${l.y-10}" width="${XL[1]-XL[0]+4}" height="20" rx="6" class="abbg"></rect>
      <rect x="${XL[0]}" y="${l.y-8}" width="3" height="16" rx="1.5" fill="var(--kgt-${k.c})"></rect>
      <text x="${XL[0]+9}" y="${l.y}" dominant-baseline="central" class="gt gt-kind" fill="var(--kgt-${k.c})">${k.tag}</text>
      <text x="${XL[0]+44}" y="${l.y}" dominant-baseline="central" class="gt gt-ab">${esc(fit(n.name, XL[1]-XL[0]-48, 11))}</text></g>`;
  });

  // AI 细分节点：类型只用左侧色条表示（与末级节点同色），不再逐个写类型文字；虚线框 + 「AI」标记
  AIL.forEach((c,i)=>{
    const [x0, x1] = XAI(i), k = KIND[c.lv.kind], nx = ai[i+1];
    c.rows.forEach(r=>{
      const it = c.lv.items[r.id];
      const st = nx ? (it.key===nx.parent ? ' sel' : ' off') : '';
      const sc = it.check ? SC_MARK[it.check.verdict] : null;
      nodes += `<g class="gnode lf open ai${st}${sc?' sc-'+sc.c:''}" data-n="ai|${i}|${r.id}">
        <rect x="${x0-4}" y="${r.y-10}" width="${x1-x0+4}" height="20" rx="6" class="abbg"></rect>
        <rect x="${x0}" y="${r.y-8}" width="3" height="16" rx="1.5" fill="var(--kgt-${k.c})"></rect>
        <text x="${x0+10}" y="${r.y}" dominant-baseline="central" class="gt gt-ab">${esc(fit(it.name, x1-x0-(it.manual?62:50), 11))}</text>
        ${sc?`<text x="${x1-20}" y="${r.y}" text-anchor="end" dominant-baseline="central" class="gt gt-sc ${sc.c}">${sc.icon}</text>`:''}
        <text x="${x1-4}" y="${r.y}" text-anchor="end" dominant-baseline="central" class="gt gt-ai${it.manual?' man':''}">${it.manual?'人工':'AI'}</text></g>`;
    });
    if(c.lv.status==='loading'){
      nodes += `<text x="${x0}" y="${c.py}" dominant-baseline="central" class="gt gt-status gt-loading">AI 生成中…</text>`;
    } else if(c.lv.status==='error'){
      nodes += `<g class="gnode retry" data-n="retry|${i}"><text x="${x0}" y="${c.py}" dominant-baseline="central" class="gt gt-status">${esc(fit('生成失败：'+c.lv.err, AIW+60, 12))} · 重试</text></g>`;
    } else if(!c.rows.length){
      nodes += `<text x="${x0}" y="${c.py}" dominant-baseline="central" class="gt gt-status">没有可细分的下级</text>`;
    }
    if(c.lv.status==='ok'){
      const y = addY(c);
      const half = (x1 - x0 + 4 - 6) / 2;
      nodes += `<g class="gnode aiadd" data-n="aiadd|${i}">
        <rect x="${x0-4}" y="${y-10}" width="${half}" height="20" rx="6" class="abbg"></rect>
        <text x="${x0+9}" y="${y}" dominant-baseline="central">＋ 添加节点</text></g>
      <g class="gnode aiadd" data-n="airegen|${i}">
        <rect x="${x0-4+half+6}" y="${y-10}" width="${half}" height="20" rx="6" class="abbg"></rect>
        <text x="${x0+half+15}" y="${y}" dominant-baseline="central">↻ 重新生成</text></g>`;
    }
  });

  // 操作提示：紧跟在最后一列右侧，图宽随之加上提示所需的宽度
  const hint = !exp ? [XP[1]+36, indY, '点击岗位，展开该岗位的能力项']
    : !selAbl ? [XA[1]+36, posY[exp], '点击能力项，展开归属的技能']
    : !KL.length ? [XA[1]+36, selAbl.y, '暂无相关技能']
    : !selSk ? [XK[1]+36, selAbl.y, '点击技能，展开下级节点']
    : !LL.length ? [XK[1]+36, selSk.y, '暂无下级节点'] : null;
  if(hint){
    nodes += `<text x="${hint[0]}" y="${hint[1]}" dominant-baseline="central" class="gt gt-empty">${hint[2]}</text>`;
    GW = Math.max(GW, hint[0] + hint[2].length*12 + 16);
  }

  // 列头只给已展开的列
  const heads = [[XI[0],'行业'], [XS[0],`子行业 ${builtSubs.length}`], [XP[0],`岗位 ${D.positions.length}`]];
  if(exp) heads.push([XA[0], `能力项 ${AL.length} · ${pos[exp].name}`]);
  if(selAbl && KL.length) heads.push([XK[0], `技能 ${KL.length}`]);
  if(selSk) heads.push([XL[0], `下级节点 ${LL.length} · ${skl[selSk.id].name}`]);
  const aiHeads = AIL.map((c,i)=>`<text x="${XAI(i)[0]}" y="8" class="gch">${esc(fit('AI 细分 · '+c.lv.parentName, AIW, 9))}</text>`).join('');
  $('#posTree').innerHTML = `<svg width="${GW}" height="${GH}" viewBox="0 0 ${GW} ${GH}"
    role="img" aria-label="行业能力树形图：行业、子行业、岗位三列，点击岗位展开其能力项，点击能力项展开其技能，点击技能展开其下级节点，点击末级节点由 AI 逐层细分">
    <g class="colhead">
      ${heads.map(([x,t])=>`<text x="${x}" y="8" class="gch">${esc(t)}</text>`).join('')}
      ${aiHeads}
    </g>
    ${links}${nodes}</svg>`;
  renderSelfCheckBar();
  renderSaveBtn();
}

// 点岗位：展开 / 收起该岗位的能力项（换岗位即切换）；点子行业：高亮所属岗位；
// 点能力项：展开归属的技能，并反推所有要求它的岗位；点技能：展开 / 收起其下级节点；
// 点末级节点 / AI 节点：由 AI 生成下一层（再点同一节点收起）；再次点同一节点、点空白处或点行业节点取消
// 画布向左平移，让最右侧新展开的一列完整露出来
function revealRight(){
  const t = $('#posTree');
  t.scrollTo({left: t.scrollWidth - t.clientWidth, behavior: document.hidden ? 'auto' : 'smooth'});
}
const svgWidth = () => +(($('#posTree svg')||{}).getAttribute?.('width') || 0);

$('#posTree').addEventListener('click', e=>{
  const g = e.target.closest('[data-n]');
  const [t,id,j] = g ? g.dataset.n.split('|') : ['none'];
  tip.classList.remove('on');
  if(scState.status==='error') scState = {status:'idle', err:''};
  const w0 = svgWidth();
  if(t==='aiadd'){ openNodeEdit(+id, null); return; }
  if(t==='airegen'){ regenerateLevel(+id); renderGraph(); return; }
  if(t==='lf'){
    if(ai.length && ai[0].parent===id) ai = [];
    else { const n = snode[id]; ai = []; openLevel(0, {key:id, name:n.name, kind:n.kind}); }
  } else if(t==='ai'){
    const i = +id, it = ai[i].items[+j];
    if(ai[i+1] && ai[i+1].parent===it.key) ai = ai.slice(0, i+1);
    else { ai = ai.slice(0, i+1); openLevel(i+1, {key:it.key, name:it.name, kind:ai[i].kind}); }
  } else if(t==='retry'){
    const i = +id, lv = ai[i];
    aiExpand(i, {key:lv.parent, name:lv.parentName, kind:lv.kind}, lv.keep || []);
  } else {
    ai = [];
    if(t==='skl'){ skx = skx===id ? null : id; }
    else if(t==='pos'){ exp = exp===id ? null : id; sel = null; skx = null; }
    else if(t==='sub' || t==='abl'){ sel = (sel && sel.type===t && sel.id===id) ? null : {type:t, id}; skx = null; }
    else { exp = null; sel = null; skx = null; }
  }
  renderGraph();
  // 展开了新的一列（含 AI 生成中的那一列）就立即左移，不等 AI 返回
  if(svgWidth() > w0) revealRight();
});

/* ═══ AI 列里节点的新增 / 编辑 / 删除（只改当前页面里的内容） ═══ */
let editing = null;   // {i, j, it}：正在编辑的节点；新增时 j、it 为空
function openNodeEdit(i, j){
  const lv = ai[i]; if(!lv) return;
  const it = j==null ? null : lv.items[j];
  if(j!=null && !it) return;
  editing = {i, j, it, lv};
  $('#nodeDlgTitle').textContent = it ? '编辑节点' : `新增节点 · ${lv.parentName}`;
  $('#nodeDlgNote').textContent = it
    ? '名称不超过 20 个字，说明不超过 40 个字。修改后该节点需要重新自检。'
    : `添加到「${lv.parentName}」下，类型为${lv.kind}。名称不超过 20 个字，说明不超过 40 个字；添加后也可以点它由 AI 继续细分。`;
  $('#nodeName').value = it ? it.name : ''; $('#nodeDesc').value = it ? (it.desc || '') : '';
  $('#nodeDlg').showModal(); $('#nodeName').select();
}
$('#nodeForm').addEventListener('submit', ev=>{
  const e = editing; editing = null;
  if(!e || !ev.submitter || ev.submitter.value!=='save') return;
  if(!ai.includes(e.lv)) return;                                // 期间这一列已被收起
  const name = $('#nodeName').value.trim(), desc = $('#nodeDesc').value.trim();
  if(!e.it){                                                    // 新增：放在该列末尾
    if(!name) return;
    e.lv.items.push({key:`${e.lv.parent}/${newKeyPart('m')}`, name, desc, manual:true});
    renderGraph(); return;
  }
  if(e.lv.items[e.j]!==e.it) return;                            // 期间内容已变化
  if(!name || (name===e.it.name && desc===(e.it.desc||''))) return;
  e.it.name = name; e.it.desc = desc; e.it.edited = true;
  e.it.check = null;                                          // 内容变了，自检结论作废
  const child = ai[e.i+1];
  if(child && child.parent===e.it.key) child.parentName = name;   // 已展开的下一列列头跟着改
  renderGraph();
});

/* ═══ AI 节点的暂存与保存 ═══
   aiStore：上级节点 key → 该上级下已生成的一列（含人工新增 / 编辑、自检结论）。
   本次打开页面期间生成过的都在这里，收起再展开直接复用；点「保存」写入本机浏览器，下次打开页面还在。 */
const AI_SAVE_KEY = 'kmapAiSaved';
const aiStore = {};
const newKeyPart = p => p + Math.random().toString(36).slice(2, 8);

// 从末级节点出发仍挂得上的各列（删掉的节点下面的列不再保存）
function aiReachable(){
  const out = [], seen = new Set(), queue = Object.keys(aiStore).filter(k=>snode[k]);
  while(queue.length){
    const k = queue.shift(); if(seen.has(k)) continue; seen.add(k);
    const lv = aiStore[k]; if(!lv || lv.status!=='ok') continue;
    out.push(lv);
    lv.items.forEach(it=>{ if(aiStore[it.key]) queue.push(it.key); });
  }
  return out;
}
function aiSnapshot(){
  return JSON.stringify(aiReachable().map(lv=>({
    parent: lv.parent, parentName: lv.parentName, kind: lv.kind, missing: lv.missing || '', checkedAt: lv.checkedAt || '',
    items: lv.items.map(it=>({key:it.key, name:it.name, desc:it.desc||'',
      ...(it.manual?{manual:true}:{}), ...(it.edited?{edited:true}:{}), ...(it.check?{check:it.check}:{})})),
  })));
}
let savedSnapshot = '[]';
(function loadSaved(){
  let raw = null;
  try { raw = localStorage.getItem(AI_SAVE_KEY); } catch(e){}
  if(!raw) return;
  try {
    JSON.parse(raw).forEach(l=>{
      aiStore[l.parent] = {parent:l.parent, parentName:l.parentName, kind:l.kind, status:'ok', err:'', missing:l.missing||'', checkedAt:l.checkedAt||'',
        items: l.items.map(it=>({...it}))};
    });
    savedSnapshot = aiSnapshot();
  } catch(e){}
})();
function openLevel(level, parent){
  const lv = aiStore[parent.key];
  if(lv && lv.status==='ok'){
    ai = ai.slice(0, level);
    lv.parentName = parent.name;                  // 上级可能被改过名
    ai[level] = lv;
  } else aiExpand(level, parent);
}
const isDirty = () => aiSnapshot() !== savedSnapshot;
function renderSaveBtn(){
  const b = $('#saveBtn'), dirty = isDirty();
  b.disabled = !dirty;
  b.textContent = dirty ? '保存' : (savedSnapshot!=='[]' ? '已保存' : '保存');
  b.title = dirty ? '保存后，下次打开页面展开这些节点时直接显示，不再调用 AI（只保存在本机浏览器）'
                  : (savedSnapshot!=='[]' ? '当前内容已保存在本机浏览器' : '还没有可保存的 AI 节点');
}
$('#saveBtn').addEventListener('click', ()=>{
  const snap = aiSnapshot();
  try { localStorage.setItem(AI_SAVE_KEY, snap); }
  catch(e){ showToast('保存失败：浏览器不允许本地存储'); return; }
  savedSnapshot = snap;
  const n = JSON.parse(snap).reduce((s,l)=>s+l.items.length, 0);
  showToast(`已保存 ${n} 个节点，下次展开时直接显示`);
  renderSaveBtn();
});
window.addEventListener('beforeunload', e=>{ if(isDirty()){ e.preventDefault(); e.returnValue = ''; } });

// 重新生成一列：保留人工新增 / 人工编辑过的节点，其余由 AI 重新生成；下面已展开的列收起；可撤销
function regenerateLevel(i){
  const old = ai[i]; if(!old) return;
  const below = ai.slice(i+1);
  const keep = old.items.filter(it=>it.manual || it.edited);
  aiExpand(i, {key:old.parent, name:old.parentName, kind:old.kind}, keep);
  const fresh = ai[i];
  showToast(`正在重新生成「${old.parentName}」的下级${keep.length?`（保留 ${keep.length} 个人工节点）`:''}`, '撤销', ()=>{
    if(ai[i]!==fresh) return;                     // 之后又有别的改动，不再撤销
    ai = ai.slice(0, i).concat([old], below);
    aiStore[old.parent] = old;
    renderGraph();
  });
}

// 删除：已展开在它下面的各列一并收起；提供一次撤销
let undo = null, toastTimer = 0;
function deleteAiNode(i, j){
  const lv = ai[i], it = lv && lv.items[j]; if(!it) return;
  const below = ai[i+1] && ai[i+1].parent===it.key ? ai.slice(i+1) : null;
  if(below) ai = ai.slice(0, i+1);
  lv.items.splice(j, 1);
  undo = {lv, j, it, below};
  showToast(`已删除「${it.name}」`, '撤销', ()=>{
    if(!undo || !ai.includes(undo.lv)) return;
    undo.lv.items.splice(Math.min(undo.j, undo.lv.items.length), 0, undo.it);
    if(undo.below && ai[ai.length-1]===undo.lv) ai = ai.concat(undo.below);
    undo = null; renderGraph();
  });
  renderGraph();
}
function showToast(text, actLabel, act){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>${actLabel?`<button type="button">${esc(actLabel)}</button>`:''}`;
  t.hidden = false;
  if(act) t.querySelector('button').onclick = ()=>{ act(); t.hidden = true; };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.hidden = true; undo = null; }, 6000);
}

const AI_RULE = {
  '知识点':'拆成更细的子知识点，每个是一个可以单独讲授的概念或要点',
  '操作步骤':'拆成可执行的子步骤，按实际操作的先后顺序排列',
  '标准':'拆成该标准中具体的条款或要求，写明要求本身',
  '案例':'拆成该案例的关键情节、问题或可借鉴的要点',
};
const AI_SCHEMA = {
  type:'object', additionalProperties:false, required:['children'],
  properties:{ children:{ type:'array', items:{
    type:'object', additionalProperties:false, required:['name','desc'],
    properties:{ name:{type:'string'}, desc:{type:'string'} } } } },
};

// 当前展开路径：行业 › 子行业 › 岗位 › 能力项 › 技能 › 末级节点 › AI 节点…
function aiChain(level){
  const c = [`行业：${I.name}`, `子行业：${sub[pos[exp].sub].name}`, `岗位：${pos[exp].name}`,
             `能力项：${abl[sel.id].name}`, `技能：${skl[skx].name}`];
  const root = snode[ai[0].parent];
  c.push(`${root.kind}：${root.name}`);
  for(let i=0;i<level;i++){
    const lv = ai[i], nx = ai[i+1];
    const it = lv.items.find(x=>x.key===nx.parent);
    c.push(`${lv.kind}（细分第 ${i+1} 层）：${it.name}`);
  }
  return c;
}

// Anthropic Messages API：结构化输出保证返回符合 schema 的 JSON
async function aiCallAnthropic(cfg, system, prompt, opt){
  const body = {
    model: cfg.model, max_tokens: opt.maxTokens,
    output_config: {effort:opt.effort, format:{type:'json_schema', schema:opt.schema}},
    system, messages: [{role:'user', content:prompt}],
  };
  if(AI_FALLBACK_MODELS.has(cfg.model)) body.fallbacks = 'default';
  const res = await fetch(cfg.url, {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': cfg.key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
      ...(body.fallbacks ? {'anthropic-beta':'server-side-fallback-2026-07-01'} : {}),
    },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error((data.error && data.error.message) || `HTTP ${res.status}`);
  if(data.stop_reason==='refusal') throw new Error('模型拒绝了这次生成');
  if(data.stop_reason==='max_tokens') throw new Error('输出被截断');
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}

// OpenAI 兼容接口（DeepSeek 等）：JSON 模式，需在提示里写明 JSON 格式
async function aiCallOpenAI(cfg, system, prompt, opt){
  const res = await fetch(cfg.url, {
    method:'POST',
    headers:{'content-type':'application/json', 'authorization':`Bearer ${cfg.key}`},
    body: JSON.stringify({
      model: cfg.model, max_tokens: opt.maxTokens,
      response_format: {type:'json_object'},
      messages: [
        {role:'system', content: system + '\n只输出 JSON，格式为：' + opt.formatHint},
        {role:'user', content: prompt},
      ],
    }),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error((data.error && data.error.message) || `HTTP ${res.status}`);
  const ch = (data.choices||[])[0];
  if(!ch) throw new Error('接口没有返回内容');
  if(ch.finish_reason==='length') throw new Error('输出被截断');
  return (ch.message && ch.message.content) || '';
}

// 按「AI 设置」里的接口类型调用，返回解析后的 JSON
async function aiCallJSON(cfg, system, prompt, opt){
  const text = cfg.type==='openai' ? await aiCallOpenAI(cfg, system, prompt, opt)
                                   : await aiCallAnthropic(cfg, system, prompt, opt);
  return JSON.parse(text.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, ''));
}
const AI_EXPAND_OPT = {schema:AI_SCHEMA, effort:'low', maxTokens:4000,
  formatHint:'{"children":[{"name":"下级节点名称","desc":"一句话说明"}]}'};

/* ═══ 自检：按 skill「kmap-ai-selfcheck」的规则检查当前所有 AI 节点 ═══
   规则在 .claude/skills/kmap-ai-selfcheck/SKILL.md，构建时带入 D.selfCheckRules。
   结果挂在各 AI 节点上（it.check）、各层上（lv.missing），重新生成即消失。 */
const SC_MARK = {
  pass:  {icon:'✓', label:'通过',   c:'pass'},
  doubt: {icon:'!', label:'存疑',   c:'doubt'},
  fail:  {icon:'✕', label:'有问题', c:'fail'},
};
const SC_DIMS = ['归属与粒度','重复与遗漏','事实准确','表述规范'];
const SC_SCHEMA = {
  type:'object', additionalProperties:false, required:['nodes','levels'],
  properties:{
    nodes:{ type:'array', items:{ type:'object', additionalProperties:false,
      required:['id','verdict','dimension','reason','suggestion'],
      properties:{ id:{type:'string'}, verdict:{type:'string', enum:['pass','doubt','fail']},
        dimension:{type:'string', enum:['', ...SC_DIMS]}, reason:{type:'string'}, suggestion:{type:'string'} } } },
    levels:{ type:'array', items:{ type:'object', additionalProperties:false, required:['id','missing'],
      properties:{ id:{type:'string'}, missing:{type:'string'} } } },
  },
};
const SC_OPT = {schema:SC_SCHEMA, effort:'medium', maxTokens:8000,
  formatHint:'{"nodes":[{"id":"节点 id","verdict":"pass|doubt|fail","dimension":"归属与粒度|重复与遗漏|事实准确|表述规范，通过时为空","reason":"一句话原因，通过时为空","suggestion":"一句话修改建议，通过时为空"}],"levels":[{"id":"层 id","missing":"该层明显遗漏的关键子项，没有则为空"}]}'};

// 待检查内容：当前展开路径上每一个已生成的 AI 层
function selfCheckPayload(){
  const levels = ai.filter(l=>l.status==='ok' && l.items.length);
  return levels.map(lv=>{
    const i = ai.indexOf(lv);
    const siblings = i===0 ? skl[skx].children.map(id=>snode[id].name)
                           : ai[i-1].items.map(x=>x.name);
    return {
      id: lv.parent, 归属链: aiChain(i), 上级节点: lv.parentName, 类型: lv.kind,
      上级的同层节点: siblings.filter(n=>n!==lv.parentName),
      本层AI节点: lv.items.map(it=>({id:it.key, 名称:it.name, 说明:it.desc, ...(it.manual?{来源:'人工新增'}:it.edited?{来源:'AI 生成后人工编辑'}:{})})),
    };
  });
}

async function runSelfCheck(){
  const cfg = aiCfg();
  if(!cfg.key){ openAiCfg(); return; }
  const payload = selfCheckPayload();
  if(!payload.length) return;
  const snapshot = ai.slice();
  scState = {status:'loading', err:''}; renderSelfCheckBar();
  const system = '你是职业教育课程与行业能力领域的审核专家，严格按下面的自检规则检查 AI 生成的节点，结论要有依据、不放过问题、也不吹毛求疵。\n\n' + D.selfCheckRules;
  const prompt = '待检查内容（JSON，每一项是一层）：\n' + JSON.stringify(payload, null, 1) +
    '\n\n请对「本层AI节点」里的每一个节点给出判定（nodes 中逐个列出，id 原样返回），并对每一层给出遗漏提示（levels，id 为层 id）。';
  try {
    const out = await aiCallJSON(cfg, system, prompt, SC_OPT);
    if(ai.length!==snapshot.length || ai.some((l,k)=>l!==snapshot[k])) throw new Error('自检期间内容已变化，请重新自检');
    const byId = Object.fromEntries((out.nodes||[]).map(n=>[n.id, n]));
    const lvById = Object.fromEntries((out.levels||[]).map(l=>[l.id, l]));
    ai.forEach(lv=>{
      lv.items.forEach(it=>{
        const n = byId[it.key];
        it.check = n && SC_MARK[n.verdict] ? {verdict:n.verdict, dimension:n.dimension||'', reason:n.reason||'', suggestion:n.suggestion||''} : null;
      });
      if(lvById[lv.parent]) lv.missing = (lvById[lv.parent].missing||'').trim();
    });
    const at = new Date().toLocaleString('zh-CN', {hour12:false});
    ai.forEach(lv=>{ if(lv.items.some(it=>it.check)) lv.checkedAt = at; });
    scState = {status:'done', err:''};
  } catch(err){
    scState = {status:'error', err: err.message || String(err)};
  }
  renderGraph();
}

function renderSelfCheckBar(){
  const items = ai.filter(l=>l.status==='ok').flatMap(l=>l.items);
  const btn = $('#scBtn'), bar = $('#scBar');
  btn.disabled = !items.length || scState.status==='loading';
  btn.title = items.length ? '按自检规则检查当前所有 AI 节点' : '先点末级节点，由 AI 生成下级后再自检';
  btn.textContent = scState.status==='loading' ? '自检中…' : '自检';
  if(scState.status==='loading'){ bar.hidden = false; bar.innerHTML = `<span>正在检查 ${items.length} 个 AI 节点…</span>`; return; }
  if(scState.status==='error'){ bar.hidden = false;
    bar.innerHTML = `<span class="sc-fail">自检失败：${esc(scState.err)}</span><span class="sc-act"><button class="btn-s" data-sc="run">重试</button></span>`; return; }
  const checked = items.filter(it=>it.check);
  if(!checked.length){ bar.hidden = true; return; }
  const cnt = v => checked.filter(it=>it.check.verdict===v).length;
  const unchecked = items.length - checked.length;
  const miss = ai.filter(l=>l.status==='ok' && l.missing).map(l=>`「${esc(l.parentName)}」可补充：${esc(l.missing)}`);
  bar.hidden = false;
  bar.innerHTML = `<span><b>自检</b>　已检查 ${checked.length} 个 AI 节点</span>
    <span class="sc-n sc-pass">✓ 通过 ${cnt('pass')}</span>
    <span class="sc-n sc-doubt">! 存疑 ${cnt('doubt')}</span>
    <span class="sc-n sc-fail">✕ 有问题 ${cnt('fail')}</span>
    ${unchecked?`<span>${unchecked} 个新生成的节点未检查</span>`:''}
    <span class="sc-act"><button class="btn-p" data-sc="report">查看报告</button><button class="btn-s" data-sc="copy">复制自检内容</button><button class="btn-s" data-sc="run">重新自检</button></span>
    ${miss.length?`<span class="sc-miss">遗漏提示：${miss.join('；')}</span>`:''}`;
}
$('#scBtn').addEventListener('click', runSelfCheck);

/* ═══ 自检报告：当前展开路径上各 AI 列的自检结论 ═══ */
function reportData(){
  return ai.filter(l=>l.status==='ok' && l.items.length).map(lv=>({
    lv, chain: aiChain(ai.indexOf(lv)),
    rows: lv.items.map(it=>({it, ck: it.check})),
  }));
}
function renderReport(){
  const data = reportData(), only = $('#rptOnlyIssue').checked;
  const all = data.flatMap(d=>d.rows), checked = all.filter(r=>r.ck);
  const cnt = v => checked.filter(r=>r.ck.verdict===v).length;
  const times = [...new Set(data.map(d=>d.lv.checkedAt).filter(Boolean))];
  $('#rptMeta').textContent = `${I.name} · ${pos[exp].name} › ${abl[sel.id].name} › ${skl[skx].name}` +
    (times.length ? ` · 自检时间 ${times.join(' / ')}` : '') + ` · 规则：kmap-ai-selfcheck`;
  $('#rptSum').innerHTML = [
    ['已检查', `${checked.length}<small style="font-size:12px;color:var(--muted)"> / ${all.length}</small>`, ''],
    ['✓ 通过', cnt('pass'), 'sc-pass'], ['! 存疑', cnt('doubt'), 'sc-doubt'], ['✕ 有问题', cnt('fail'), 'sc-fail'],
  ].map(([k,v,c])=>`<div class="rpt-k"><b class="${c}">${v}</b><span>${k}</span></div>`).join('');
  const body = data.map(d=>{
    const rows = d.rows.filter(r=> !only || (r.ck && r.ck.verdict!=='pass'));
    if(only && !rows.length && !d.lv.missing) return '';
    const tr = rows.map(({it, ck})=>{
      const mk = ck && SC_MARK[ck.verdict];
      const src = it.manual ? '<span class="rpt-src">人工新增</span>' : it.edited ? '<span class="rpt-src">人工编辑</span>' : '';
      return `<tr><td class="n">${esc(it.name)}${src}${it.desc?`<small>${esc(it.desc)}</small>`:''}</td>
        <td class="v ${mk?'sc-'+mk.c:''}">${mk ? mk.icon+' '+mk.label : '<span style="color:var(--muted);font-weight:400">未检查</span>'}</td>
        <td>${ck && ck.dimension ? esc(ck.dimension) : '—'}</td>
        <td>${ck && ck.reason ? esc(ck.reason) : '—'}</td>
        <td>${ck && ck.suggestion ? esc(ck.suggestion) : '—'}</td></tr>`;
    }).join('');
    return `<section class="rpt-lv">
      <div class="rpt-lv-h"><b>${esc(d.lv.parentName)}</b> 的下级 · ${d.lv.items.length} 个
        <div class="rpt-chain">${d.chain.map(esc).join(' › ')}</div></div>
      ${rows.length ? `<table><thead><tr><th>节点</th><th>判定</th><th>问题维度</th><th>原因</th><th>修改建议</th></tr></thead><tbody>${tr}</tbody></table>` : ''}
      ${d.lv.missing ? `<div class="rpt-miss">遗漏提示：${esc(d.lv.missing)}</div>` : ''}
    </section>`;
  }).join('');
  $('#rptBody').innerHTML = body || `<div class="rpt-empty">${only ? '没有存疑或有问题的节点。' : '当前没有已生成的 AI 节点。'}</div>`;
}
function openReport(){ renderReport(); $('#scReport').showModal(); }
$('#rptOnlyIssue').addEventListener('change', renderReport);
$('#scReport').addEventListener('click', async e=>{
  if(e.target===$('#scReport')){ $('#scReport').close(); return; }      // 点遮罩关闭
  const b = e.target.closest('[data-rpt]'); if(!b) return;
  if(b.dataset.rpt==='close') $('#scReport').close();
  if(b.dataset.rpt==='copy'){
    // 纯文本，便于贴到文档或发给同事
    const lines = [`AI 延展内容自检报告`, $('#rptMeta').textContent, ''];
    reportData().forEach(d=>{
      lines.push(`【${d.lv.parentName} 的下级】${d.chain.join(' › ')}`);
      d.rows.forEach(({it, ck})=>{
        const mk = ck && SC_MARK[ck.verdict];
        lines.push(`- ${it.name}：${mk ? mk.label : '未检查'}` + (ck && ck.dimension ? `（${ck.dimension}）` : '') +
          (ck && ck.reason ? ` 原因：${ck.reason}` : '') + (ck && ck.suggestion ? ` 建议：${ck.suggestion}` : ''));
      });
      if(d.lv.missing) lines.push(`  遗漏提示：${d.lv.missing}`);
      lines.push('');
    });
    try { await navigator.clipboard.writeText(lines.join('\n')); b.textContent = '已复制'; }
    catch(err){ b.textContent = '复制失败'; }
    setTimeout(()=>{ b.textContent = '复制报告'; }, 1600);
  }
});
$('#scBar').addEventListener('click', async e=>{
  const b = e.target.closest('[data-sc]'); if(!b) return;
  if(b.dataset.sc==='run') runSelfCheck();
  if(b.dataset.sc==='report') openReport();
  if(b.dataset.sc==='copy'){
    // 供在 Claude Code 里用 kmap-ai-selfcheck skill 做更深入的检查
    const data = selfCheckPayload().map(l=>({...l, 本层AI节点: l.本层AI节点.map(n=>{
      const it = ai.flatMap(x=>x.items).find(x=>x.key===n.id);
      return it && it.check ? {...n, 页面自检: {判定: SC_MARK[it.check.verdict].label, 维度: it.check.dimension, 原因: it.check.reason, 建议: it.check.suggestion}} : n;
    })}));
    try { await navigator.clipboard.writeText(JSON.stringify(data, null, 2)); b.textContent = '已复制'; }
    catch(err){ b.textContent = '复制失败'; }
    setTimeout(()=>{ b.textContent = '复制自检内容'; }, 1600);
  }
});

async function aiExpand(level, parent, keep=[]){
  ai = ai.slice(0, level);
  ai[level] = {parent:parent.key, parentName:parent.name, kind:parent.kind, status:'loading', items:[], err:'', keep};
  const lv = ai[level];
  const cfg = aiCfg();
  if(!cfg.key){ lv.status='error'; lv.err='尚未填写 API Key'; openAiCfg(); return; }
  const chain = aiChain(level);
  const siblings = (level===0 ? skl[skx].children.map(id=>snode[id].name)
                              : ai[level-1].items.map(x=>x.name)).filter(n=>n!==parent.name);
  const system = '你是职业教育课程设计与行业能力分析专家。用户给出从行业到当前节点的归属链，你把最后一个节点拆分为更细的下级节点，内容要准确、具体、可教学，不编造法规条款编号。';
  const prompt =
      `归属链：\n${chain.join('\n')}\n\n` +
      (siblings.length ? `与「${parent.name}」同层的其它节点（下级节点不要与它们的内容重复）：${siblings.join('、')}\n\n` : '') +
      (keep.length ? `「${parent.name}」下已有以下节点（会保留，新生成的不要与它们重复）：${keep.map(x=>x.name).join('、')}\n\n` : '') +
      `请把最后一个节点「${parent.name}」${AI_RULE[parent.kind]}。\n` +
      `要求：生成 3–6 个下级节点；name 不超过 20 个汉字；desc 一句话说明，不超过 40 个汉字；` +
      `如果该节点已经无法再合理细分，返回空数组。`;
  try {
    const out = await aiCallJSON(cfg, system, prompt, AI_EXPAND_OPT);
    if(ai[level]!==lv) return;      // 期间已切换到别处
    lv.items = keep.concat((out.children||[]).filter(x=>x && x.name).map(x=>({key:`${parent.key}/${newKeyPart('a')}`, name:x.name.trim(), desc:(x.desc||'').trim()})));
    lv.status = 'ok';
    aiStore[parent.key] = lv;
  } catch(err){
    if(ai[level]!==lv) return;
    lv.status = 'error'; lv.err = err.message || String(err);
  }
  if(ai[level]!==lv) return;
  renderGraph();
  revealRight();   // 生成完成后再对齐一次（失败提示会让图变宽）
}

/* ---- 悬停提示 ---- */
const tip = $('#tip');
$('#posTree').addEventListener('mouseover', e=>{
  const g = e.target.closest('[data-n]'); if(!g){ tip.classList.remove('on'); return; }
  const [t,id] = g.dataset.n.split('|');
  if(t==='sub'){ const s=sub[id];
    tip.innerHTML = `<b>${esc(s.name)}</b><span class="tk">${s.positionIds.length} 个岗位 · ${s.distinctAbilityCount} 条去重能力项</span>`;
  } else if(t==='pos'){ const p=pos[id], b=breakdown(id);
    tip.innerHTML = `<b>${esc(p.name)}</b><span class="tk">${esc(p.aliases.join(' / '))}</span>
      <span class="tk">通用 ${b.ind} · 岗位专项 ${b.sh + b.own}　${p.l3Count} 条需 L3</span>`;
  } else if(t==='abl'){ const a=abl[id];
    tip.innerHTML = `<b>${esc(a.name)}</b><span class="tk">${a.typeCn} · ${esc(a.domain)}</span>
      <span class="tk">${a.positionCount} 个岗位要求 · 最高 ${a.maxRequiredLevel}${a.core?' · 核心能力':''} · 技能 ${a.skills.length}</span>`;
  } else if(t==='skl'){ const k=skl[id];
    const cnt = {}; k.children.forEach(n=>{ const t=snode[n].kind; cnt[t]=(cnt[t]||0)+1; });
    tip.innerHTML = `<b>${esc(k.name)}</b><span class="tk">归属能力项：${k.abilityIds.map(x=>esc(abl[x].name)).join(' / ')}</span>
      <span class="tk">${Object.keys(KIND).filter(t=>cnt[t]).map(t=>`${t} ${cnt[t]}`).join(' · ') || '暂无下级节点'}</span>`;
  } else if(t==='lf'){ const n=snode[id];
    tip.innerHTML = `<b>${esc(n.name)}</b><span class="tk">${esc(n.kind)} · 点击由 AI 继续细分</span>`;
  } else if(t==='retry'){ const lv=ai[+id]; if(!lv){ tip.classList.remove('on'); return; }
    tip.innerHTML = `<b>生成失败</b><span class="tk">${esc(lv.err)}</span><span class="tk">点击重试，或在「AI 设置」中检查接口地址、模型与 Key</span>`;
  } else if(t==='airegen'){
    tip.innerHTML = `<b>重新生成</b><span class="tk">让 AI 重新生成这一列；人工新增和人工编辑过的节点保留，下面已展开的列会收起</span>`;
  } else if(t==='aiadd'){
    tip.innerHTML = `<b>添加节点</b><span class="tk">在这一列末尾手动添加一个节点</span>`;
  } else if(t==='ai'){ const it=ai[+id] && ai[+id].items[+g.dataset.n.split('|')[2]]; if(!it){ tip.classList.remove('on'); return; }
    const ck = it.check, mk = ck && SC_MARK[ck.verdict];
    tip.innerHTML = `<b>${esc(it.name)}</b><span class="tk">${esc(ai[+id].kind)}</span>${it.desc?`<span class="tk">${esc(it.desc)}</span>`:''}` +
      (ck ? `<span class="tk">自检：${mk.icon} ${mk.label}${ck.dimension?' · '+esc(ck.dimension):''}</span>` +
            (ck.reason?`<span class="tk">原因：${esc(ck.reason)}</span>`:'') +
            (ck.suggestion?`<span class="tk">建议：${esc(ck.suggestion)}</span>`:'') : '') +
      `<span class="tk">${it.manual?'人工新增':'AI 生成'}${it.edited?' · 已人工编辑':''} · 点击由 AI 继续细分 · 右键编辑或删除</span>`;
  } else { tip.classList.remove('on'); return; }
  tip.classList.add('on');
});
$('#posTree').addEventListener('mouseleave', ()=>tip.classList.remove('on'));
document.addEventListener('mousemove', e=>{
  if(!tip.classList.contains('on')) return;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+14,y=e.clientY+16;
  if(x+w>innerWidth-10) x=e.clientX-w-14;
  if(y+h>innerHeight-10) y=e.clientY-h-16;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});

// 首次渲染放在最后：用到的状态（自检、已保存的 AI 节点等）都已声明并载入
renderGraph();
</script>
