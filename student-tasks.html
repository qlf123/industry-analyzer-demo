<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的任务</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
.stats6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:1100px){.stats6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.stats6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.stat{cursor:pointer}
.ccard .bar.s-待提交{background:linear-gradient(90deg,#f59e0b,#f97316)}
.ccard .bar.s-已提交{background:linear-gradient(90deg,#3b82f6,#6366f1)}
.ccard .bar.s-已退回{background:linear-gradient(90deg,#ef4444,#f43f5e)}
.ccard .bar.s-已评价{background:linear-gradient(90deg,#10b981,#14b8a6)}
.star{font-size:11.5px;color:#d97706;background:#fef3c7;border-radius:10px;padding:1px 8px;font-family:var(--mono);white-space:nowrap}
.due-late{color:var(--crit)}
.back{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin-bottom:14px}
.back button{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);background:var(--card);cursor:pointer;color:var(--ink-2)}
.hd{display:flex;gap:14px;align-items:flex-start}
.hd .ic{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 42px}
.hd .tt{flex:1;min-width:0}
.hd .tt b{font-size:17px}
.hd .meta{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.7}
.hd .acts{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:flex;gap:10px;margin-top:12px}
.mini>div{background:var(--card-2);border-radius:9px;padding:7px 12px;min-width:90px}
.mini .k{font-size:11px;color:var(--muted)}
.mini .v{font-size:15px;font-family:var(--mono);font-weight:600}
.pack{display:flex;align-items:center;font-size:12.5px;color:var(--ink-2);padding:6px 2px 8px}
.pack .sp{flex:1}
.fx{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px}
.fx:hover{background:var(--card-2)}
.fx .fi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;flex:0 0 32px}
.fx .fn{flex:1;min-width:0;font-size:13px}
.fx .fn small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.fx .fn small .ok{color:var(--good)}
.taskbox{background:linear-gradient(135deg,var(--brand-soft),var(--card-2));border-radius:11px;padding:13px 16px}
.taskbox b{font-size:13.5px}
.taskbox p{font-size:12.5px;color:var(--ink-2);line-height:1.75;margin:6px 0}
.taskbox .m{font-size:11.5px;color:var(--muted)}
.subm{background:var(--card-2);border-radius:11px;padding:12px 14px;margin-bottom:10px}
.subm-h{display:flex;align-items:center;gap:10px;cursor:pointer}
.subm-h b{font-size:13.5px}
.subm-h span{font-size:11.5px;color:var(--muted)}
.subm-h .sp{flex:1}
.subm .fitem{margin-top:6px}
.retn{border-left:3px solid var(--crit);background:var(--crit-bg);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:12.5px}
.retn .k{font-size:11.5px;color:var(--crit);margin-bottom:3px}
.evbox{background:var(--card);border:1px solid var(--rule-2);border-radius:10px;padding:11px 14px;margin-top:10px;font-size:12.5px}
.evbox .k{font-weight:700;margin-bottom:6px}
.evbox .sc{font-size:18px;font-weight:700;font-family:var(--mono);margin-right:8px}
.mtabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin:12px 0}
.mtabs button{font:inherit;font-size:12.5px;background:none;border:0;border-bottom:2px solid transparent;padding:6px 2px 8px;cursor:pointer;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
.mtabs button[aria-pressed="true"]{color:var(--brand-ink);border-color:var(--brand)}
.mtabs button em{font-style:normal;font-size:10.5px;color:var(--good)}
.warn-bar{background:var(--crit-bg);color:var(--crit);font-size:12.5px;border-radius:9px;padding:9px 12px;margin:10px 0}
.rec2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.recbtn{width:64px;height:64px;border-radius:50%;border:0;background:#f43f5e;color:#fff;font-size:22px;cursor:pointer;display:block;margin:0 auto 8px}
.recbtn.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(244,63,94,.18)}}
.stars{display:inline-flex;gap:3px}
.stars button{background:none;border:0;padding:0;font-size:20px;line-height:1;color:var(--rule);cursor:pointer}
.stars button.on{color:#f59e0b}
.stars.sm button{font-size:16px}
.fbk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.fbk>div,.fbtop{border:1px solid var(--rule);border-radius:11px;padding:10px 14px}
.fbtop{display:flex;align-items:center;background:var(--brand-soft);border-color:transparent}
.fbtop .sp{flex:1}
.fbk b,.fbtop b{font-size:12.5px;display:block;margin-bottom:5px}
.pv{background:var(--card-2);border:1px solid var(--rule-2);border-radius:10px;min-height:220px;display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;padding:20px}
.pv .big{font-size:40px;margin-bottom:8px}
.crit{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.crit th,.crit td{border:1px solid var(--rule-2);padding:6px 8px;vertical-align:top;text-align:left;line-height:1.6}
.crit th{background:var(--card-2);font-weight:600;white-space:nowrap}
.crit .sn{font-weight:600}
.items{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel"><div class="body" id="body"></div></div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script src="js/teacher-kit.js"></script>
<script src="js/student-kit.js"></script>
<script>
(function () {
  'use strict';
  var esc = TK.esc, S = SK.view();
  var F = { q: '', status: '', major: '', from: '', to: '', stat: '' }, page = 1;
  var STATUS = ['待提交', '已提交', '已退回', '已评价'];
  var TAGC = { '待提交': 'w', '已提交': '', '已退回': 'r', '已评价': 'g', '': 'k' };
  var GRADEC = { '优秀': 'g', '合格': '', '需改进': 'w' };
  var MODE_IC = { '文字': '✎', '图片': '▧', '语音': '◉', '文档': '▤' };
  var DIMS = ['讲授内容', '教学方式', '互动体验', '学习收获'];
  var FB_TAGS = ['内容清楚易懂', '重点讲解到位', '学习资源有帮助', '案例贴近实际', '情景任务有代入感', '互动参与感强', '学习收获明显', '希望多讲真实案例', '希望增加实操演示', '任务要求再明确些', '学习资源还可优化', '讲解节奏可以慢一点', '专业术语希望能多解释', '希望增加练习巩固'];
  function byId(id) { return S.tasks.find(function (t) { return t.id === id; }); }
  function refresh() { S = SK.view(); }
  function stTxt(t) { return t.status || '学习资源'; }
  function textLen(it) { return it.text ? it.text.length : parseInt(it.size, 10) || 0; }
  function ext(n) { return (String(n).split('.').pop() || '').slice(0, 4).toUpperCase(); }
  function icon(type, name) { return '<span class="fi" style="background:' + (TK.FT_COLOR[type] || '#7f63d8') + '">' + (type === '文字' ? '✎' : esc(ext(name))) + '</span>'; }

  /* ═══ 列表 ═══ */
  function stats() {
    var unl = S.tasks.reduce(function (s, t) { return s + t.files.length - SK.learned(t); }, 0);
    return [
      ['todo', '待提交任务', S.tasks.filter(function (t) { return t.status === '待提交'; }).length, '#f97316', '▤'],
      ['soon', '即将超时', S.tasks.filter(function (t) { return SK.canSubmit(t) && SK.soon(t); }).length, '#ef4444', '◷'],
      ['late', '已超时', S.tasks.filter(function (t) { return t.status === '待提交' && SK.overdue(t); }).length, '#e11d48', '!'],
      ['eval', '待查看评价', S.tasks.filter(function (t) { return t.status === '已评价' && !t.evalSeen; }).length, '#6366f1', '★'],
      ['ret', '已退回任务', S.tasks.filter(function (t) { return t.status === '已退回'; }).length, '#f59e0b', '↺'],
      ['unl', '未学习资源', unl, '#8b5cf6', '▶']
    ];
  }
  var STAT_FN = {
    todo: function (t) { return t.status === '待提交'; }, soon: function (t) { return SK.canSubmit(t) && SK.soon(t); },
    late: function (t) { return t.status === '待提交' && SK.overdue(t); }, eval: function (t) { return t.status === '已评价' && !t.evalSeen; },
    ret: function (t) { return t.status === '已退回'; }, unl: function (t) { return SK.learned(t) < t.files.length; }
  };
  function filtered() {
    return S.tasks.filter(function (t) {
      return (!F.q || (t.course + (t.task ? t.task.name : '')).indexOf(F.q) >= 0) && (!F.status || t.status === F.status) && (!F.major || t.major === F.major) &&
        (!F.from || t.publishAt.slice(0, 10) >= F.from) && (!F.to || t.publishAt.slice(0, 10) <= F.to) && (!F.stat || STAT_FN[F.stat](t));
    }).sort(function (a, b) { return a.publishAt < b.publishAt ? 1 : -1; });
  }
  function viewList() {
    var majors = S.tasks.map(function (t) { return t.major; }).filter(function (m, i, a) { return a.indexOf(m) === i; });
    var h = '<div class="tk-h"><h2>我的任务</h2></div><div class="stats6">' + stats().map(function (s) {
      return '<div class="stat' + (F.stat === s[0] ? ' on' : '') + '" data-stat="' + s[0] + '" title="点击筛选"><div class="k">' + s[1] + '</div><div class="v" style="color:' + s[3] + '">' + s[2] + '</div><span class="ic" style="background:' + s[3] + '">' + s[4] + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="card filters"><input class="inp search" data-f="q" placeholder="搜索课程或任务名称" value="' + esc(F.q) + '">' +
      '<label>任务状态<select class="sel" data-f="status"><option value="">全部</option>' + STATUS.map(function (s) { return '<option' + (F.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></label>' +
      '<label>所属专业<select class="sel" data-f="major"><option value="">全部</option>' + majors.map(function (s) { return '<option' + (F.major === s ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></label>' +
      '<label>发布时间<input type="date" class="inp" data-f="from" value="' + F.from + '"> — <input type="date" class="inp" data-f="to" value="' + F.to + '"></label>' +
      (F.stat ? '<button class="lk" data-clearstat>清除「' + stats().find(function (s) { return s[0] === F.stat; })[1] + '」筛选</button>' : '') + '</div>';
    var list = filtered(), per = 9, pages = Math.max(1, Math.ceil(list.length / per)); page = Math.min(page, pages);
    h += list.length ? '<div class="cgrid">' + list.slice((page - 1) * per, page * per).map(card).join('') + '</div>' : '<div class="card empty2">没有符合条件的任务</div>';
    h += '<div class="pager">共 ' + list.length + ' 条 · 每页 ' + per + ' 条　' + (pages > 1 ? Array.apply(null, Array(pages)).map(function (_, i) { return '<button class="btn-s" data-page="' + (i + 1) + '"' + (page === i + 1 ? ' style="border-color:var(--brand);color:var(--brand-ink)"' : '') + '>' + (i + 1) + '</button>'; }).join('') : '') + '</div>';
    return h;
  }
  function card(t) {
    var late = SK.overdue(t), btn = '';
    if (t.status === '已退回') btn = '<button class="btn-pp" data-submit="' + t.id + '">重新提交</button>';
    else if (t.status === '待提交' && t.task) btn = '<button class="btn-pp" data-submit="' + t.id + '">' + (late ? '补交任务' : '提交任务') + '</button>';
    return '<div class="ccard"><div class="bar s-' + t.status + '"></div><div class="cb">' +
      '<div class="ct"><span class="tag ' + TAGC[t.status] + '">' + stTxt(t) + '</span>' + (t.status === '已评价' && !t.evalSeen ? '<span class="tag r">新评价</span>' : '') +
      (SK.canSubmit(t) && SK.soon(t) ? '<span class="tag r">即将超时</span>' : '') + '<span class="sp" style="flex:1"></span><span class="star">★ +' + SK.maxStars(t) + '</span></div>' +
      '<div class="ct"><b title="' + esc(t.course) + '">' + esc(t.course) + '</b></div>' +
      '<div class="ln"><span class="mk">' + esc(t.teacher) + (t.due ? ' · 截止时间：</span><span class="' + (late && SK.canSubmit(t) ? 'due-late' : '') + '">' + esc(t.due) + '</span>' : ' · 仅下发学习资源</span>') + '</div>' +
      '<div class="ln"><span class="tag k">' + esc(t.plan || t.major) + '</span></div>' +
      '<div class="ln"><span class="mk">学习资源：</span>已学 ' + SK.learned(t) + '/' + t.files.length + '</div>' +
      (t.task ? '<div class="ln"><span class="mk">情景任务：</span>' + esc(t.task.name) + '</div>' : '') +
      '<div class="ln"><span class="mk">发布时间：</span>' + esc(t.publishAt) + '</div>' +
      '</div><div class="cf"><button class="btn-s" data-open="' + t.id + '">查看</button>' + btn + '</div></div>';
  }

  /* ═══ 详情 ═══ */
  function viewDetail(t) {
    if (t.status === '已评价' && !t.evalSeen) { SK.seen(t.id); t.evalSeen = true; }
    var late = SK.overdue(t), sb = '';
    if (t.status === '已退回') sb = '<button class="btn" data-submit="' + t.id + '" style="height:32px">重新提交</button>';
    else if (t.status === '待提交' && t.task) sb = '<button class="btn" data-submit="' + t.id + '" style="height:32px">' + (late ? '补交任务' : '提交任务') + '</button>';
    var h = '<div class="back"><button data-back aria-label="返回任务列表">‹</button>任务详情</div>';
    h += '<div class="card pad" style="margin-bottom:14px"><div class="hd"><span class="ic">▶</span><div class="tt"><b>' + esc(t.course) + '</b> <span class="tag ' + TAGC[t.status] + '">' + stTxt(t) + '</span>' +
      '<div class="meta">授课老师：' + esc(t.teacher) + ' · 课程：' + esc(t.plan || t.major) + ' · 发布时间：' + esc(t.publishAt) + (t.due ? '<br>截止时间：<span class="' + (late && SK.canSubmit(t) ? 'due-late' : '') + '">' + esc(t.due) + '</span>' : '') + '</div>' +
      '<div class="mini"><div><div class="k">资源学习进度</div><div class="v">' + SK.learned(t) + '/' + t.files.length + '</div></div><div><div class="k">可获成长值</div><div class="v" style="color:#d97706">+' + SK.maxStars(t) + '</div></div>' +
      '<div><div class="k">已获成长值</div><div class="v" style="color:var(--good)">+' + S.growth.filter(function (g) { return g.tid === t.id; }).reduce(function (s, g) { return s + g.stars; }, 0) + '</div></div></div></div>' +
      '<div class="acts">' + (t.feedbackOn ? '<button class="btn-s" data-fb="' + t.id + '">' + (t.feedback ? '已反馈 · 查看' : '课程反馈') + '</button>' : '') + sb + '</div></div></div>';
    // 学习资源
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">学习资源<span class="sp"></span><button class="lk" data-dlall>⤓ 全部下载</button></div>' +
      '<div style="font-size:11.5px;color:var(--muted)">预览即记为已学习，每个资源 +' + SK.STAR.learn + ' 星</div>' +
      (t.files.length ? '' : '<div class="empty2">本次没有下发学习资源</div>') +
      t.files.map(function (f, i) {
        // 按资源包分组
        return (i === 0 || t.files[i - 1].pack !== f.pack ? '<div class="pack"><span>' + esc(f.pack) + '</span></div>' : '') + '<div class="fx">' + icon(f.type, f.name) + '<div class="fn">' + esc(f.name) + '<small>' + esc(f.size) + ' · ' + (f.learnedAt ? '<span class="ok">已学习 ' + esc(f.learnedAt) + '</span>' : '未学习') + '</small></div>' +
          '<button class="lk" data-dl="' + f.id + '" title="下载">⤓</button><button class="btn-s" data-pv="' + f.id + '">' + (f.type === '视频' ? '▶ 播放' : '◉ 预览') + '</button></div>';
      }).join('') + '</div>';
    // 情景任务
    if (t.task) h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">情景任务</div><div class="taskbox"><b>' + esc(t.task.name) + '</b><p>' + esc(t.task.desc) + '</p><div class="m">提交方式：' + t.task.modes.join('、') + '　·　截止时间：' + esc(t.due) + '</div></div>' +
      (t.task.criteria.length ? '<div class="blk-t" style="margin-top:12px">评价标准<span style="font-size:11.5px;font-weight:400;color:var(--muted);margin-left:8px">老师会按下面每一项评价，每项对应一个技能</span></div><table class="crit"><thead><tr><th style="width:18%">评价项（技能）</th><th>优秀</th><th>合格</th><th>需改进</th></tr></thead><tbody>' +
        t.task.criteria.map(function (x) { return '<tr><td class="sn">' + esc(x.name) + '</td><td>' + esc(x.levels['优秀']) + '</td><td>' + esc(x.levels['合格']) + '</td><td>' + esc(x.levels['需改进']) + '</td></tr>'; }).join('') + '</tbody></table>' : '') + '</div>';
    // 提交与评价记录
    if (t.task) {
      h += '<div class="card pad"><div class="blk-t">我的提交与评价记录</div>';
      if (!t.submissions.length) h += '<div class="empty2">还没有提交。' + (sb ? '点右上角「' + (late ? '补交任务' : '提交任务') + '」提交情景任务。' : '') + '</div>';
      t.submissions.slice().reverse().forEach(function (s, i) {
        var latest = i === 0;
        h += '<div class="subm"><div class="subm-h" data-fold><b>第' + s.n + '次提交</b>' + (s.late ? '<span class="tag r">超时提交</span>' : '') + '<span>提交时间：' + esc(s.at) + '</span><span class="sp"></span><span>' + (latest ? '收起 ▴' : '展开 ▾') + '</span></div><div' + (latest ? '' : ' hidden') + '>' +
          s.items.map(function (it, k) {
            var sz = it.type === '文字' ? '共 ' + textLen(it) + ' 字' : it.size;
            return '<div class="fitem">' + icon(it.type, it.name) + '<span class="fn">' + esc(it.type === '文字' ? '文字提交_' + textLen(it) + '字' : it.name) + '<small>' + esc(sz) + '</small></span><button class="lk" data-item="' + s.n + ':' + k + '">' + (it.type === '语音' ? '▶ 播放' : '预览') + '</button></div>';
          }).join('') +
          (s.returned ? '<div class="retn"><div class="k">退回记录 · ' + esc(s.returned.at) + '</div>' + esc(s.returned.reason) + itemsHTML(t, s.grades) + '</div>' : '') +
          (s.eval ? '<div class="evbox"><div class="k">评价记录</div><div><span style="font-size:12.5px">整体等级 </span><span class="tag ' + GRADEC[s.eval.grade] + '">' + s.eval.grade + '</span><span style="font-size:11.5px;color:var(--muted);margin-left:10px">' + esc(s.eval.at) + '</span></div>' + itemsHTML(t, s.eval.items) + (s.eval.comment ? '<div style="margin-top:8px;line-height:1.75;color:var(--ink-2)"><b style="color:var(--ink)">老师评语：</b>' + esc(s.eval.comment) + '</div>' : '') + '</div>'
            : !s.returned ? '<div class="evbox"><div class="k">当前评价记录</div><span class="tag w">待评价</span>　<span style="color:var(--muted)">暂无评价记录，等待老师评价</span></div>' : '') +
          '</div></div>';
      });
      h += '</div>';
    }
    return h;
  }

  // 逐项评价结果：评价项（技能）→ 等级
  function itemsHTML(t, items) {
    if (!items || !items.length) return '';
    var nm = {}; t.task.criteria.forEach(function (x) { nm[x.sid] = x.name; });
    return '<div class="items">' + items.map(function (x) { return '<span>' + esc(nm[x.sid] || TK.skillName(x.sid)) + ' <span class="tag ' + GRADEC[x.grade] + '">' + x.grade + '</span></span>'; }).join('') + '</div>';
  }

  /* ── 预览 ── */
  function previewFile(t, f) {
    var big = { '课件': '▤', '教案': '▤', '图片': '▧', '视频': '▶', '情景互动游戏': '◈' }[f.type] || '▤';
    var m = TK.modal({ title: f.name, width: 640, body: '<div class="pv"><div><div class="big">' + big + '</div>' + esc(f.type) + ' · ' + esc(f.size) + '<br>在线' + (f.type === '视频' ? '播放' : '预览') + '区域</div></div>', foot: '<button class="btn-s" data-c>关闭</button>' });
    m.foot.querySelector('[data-c]').onclick = m.close;
    if (SK.learn(t.id, f.id, f.name)) { refresh(); TK.toast('已学习，成长星 +' + SK.STAR.learn); render(); }
  }
  function previewItem(it) {
    var body = it.type === '文字' ? '<div style="display:flex;font-size:12px;color:var(--muted);margin-bottom:8px">文字提交_' + textLen(it) + '字<span style="flex:1"></span><button class="lk" data-copy>复制</button></div><div style="font-size:13px;line-height:1.85">' + esc(it.text || '') + '</div>'
      : it.type === '语音' ? '<div class="pv" style="min-height:120px"><div><div class="big">◉</div>' + esc(it.name) + ' · ' + esc(it.size) + '<div class="prog" style="width:280px;margin:12px auto 0"><i style="width:35%;background:var(--brand)"></i></div></div></div>'
      : '<div class="pv"><div><div class="big">' + (it.type === '图片' ? '▧' : '▤') + '</div>' + esc(it.name) + ' · ' + esc(it.size) + '<br>在线预览区域</div></div>';
    var m = TK.modal({ title: it.type === '文字' ? '文字预览' : it.type === '语音' ? '语音播放' : it.name, width: 600, body: body, foot: '<button class="btn-s" data-c>关闭</button>' });
    m.foot.querySelector('[data-c]').onclick = m.close;
    var cp = m.body.querySelector('[data-copy]');
    if (cp) cp.onclick = function () { try { navigator.clipboard.writeText(it.text); } catch (e) {} TK.toast('已复制'); };
  }

  /* ── 提交情景任务 ── */
  function submitDrawer(t) {
    var late = SK.overdue(t), modes = t.task.modes, cur = modes[0];
    var draft = { '文字': '', '图片': [], '语音': [], '文档': [] }, recOn = false;
    var d = TK.drawer({ title: '提交情景任务', sub: t.status === '已退回' ? '第 ' + (t.submissions.length + 1) + ' 次提交' : '', width: 620, foot: '<button class="btn-s" data-c>取消</button><button class="btn" data-ok style="height:32px">➤ 确认提交</button>' });
    function count() { return (draft['文字'].trim() ? 1 : 0) + draft['图片'].length + draft['语音'].length + draft['文档'].length; }
    function list(k) { return '<div class="flist">' + draft[k].map(function (x, i) { return '<div class="fitem">' + icon(k, x.name) + '<span class="fn">' + esc(x.name) + '<small>' + esc(x.size) + '</small></span><button class="lk del" data-rm="' + k + ':' + i + '">删除</button></div>'; }).join('') + '</div>'; }
    function upl(k, accept, tip, multi) { return '<label class="upl" style="display:block;padding:26px 14px">⤒ 点击或拖拽文件到此区域上传<br><span style="font-size:11px">' + tip + '</span><input type="file" hidden data-up="' + k + '" accept="' + accept + '"' + (multi ? ' multiple' : '') + '></label>'; }
    function paint() {
      var h = '<div class="blk-t" style="font-size:12.5px">情景任务</div><div class="taskbox"><b>' + esc(t.task.name) + '</b><p>' + esc(t.task.desc) + '</p></div>' +
        (late ? '<div class="warn-bar">该任务已超过截止时间，补交后将标记为超时提交，老师可查看实际提交时间。</div>' : '') +
        (t.status === '已退回' ? '<div class="retn" style="margin-top:10px"><div class="k">老师退回意见</div>' + esc(t.submissions[t.submissions.length - 1].returned.reason) + '</div>' : '') +
        '<div class="mtabs">' + modes.map(function (k) { var n = k === '文字' ? (draft[k].trim() ? 1 : 0) : draft[k].length; return '<button data-mode="' + k + '" aria-pressed="' + (cur === k) + '">' + MODE_IC[k] + '<span>' + k + '</span>' + (n ? '<em>已添加</em>' : '') + '</button>'; }).join('') + '</div>';
      if (cur === '文字') h += '<div class="ff"><span>文字内容</span><textarea data-text maxlength="3000" style="min-height:180px" placeholder="请输入">' + esc(draft['文字']) + '</textarea><span style="text-align:right;font-size:11px;color:var(--muted)" data-cnt>' + draft['文字'].length + ' / 3000</span></div>';
      if (cur === '图片') h += '<div class="ff"><span>图片上传</span>' + upl('图片', 'image/png,image/jpeg,image/gif', '支持 JPG / PNG / GIF，单张不超过 10MB，最多 20 张', true) + list('图片') + '</div>';
      if (cur === '语音') h += '<div class="ff"><span>语音录制 / 语音上传</span><div class="rec2"><div style="text-align:center"><button class="recbtn' + (recOn ? ' on' : '') + '" data-rec>' + (recOn ? '■' : '◉') + '</button><div style="font-size:12px;color:var(--muted)">' + (recOn ? '录音中，点击结束' : '点击开始实时录音') + '</div></div>' + upl('语音', 'audio/*', '支持 MP3 / WAV / WebM / OGG / M4A') + '</div>' +
        '<span style="font-size:11px;color:var(--muted)">最多可录制或上传 1 个录音，单个不超过 50MB</span>' + list('语音') + '</div>';
      if (cur === '文档') h += '<div class="ff"><span>文档上传</span>' + upl('文档', '.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx', '支持 PDF / Word / PPT / Excel，单个不超过 50MB，最多可上传 1 个文档') + list('文档') + '</div>';
      d.body.innerHTML = h;
      d.foot.querySelector('[data-ok]').disabled = !count();
    }
    d.body.addEventListener('click', function (e) {
      var x;
      if ((x = e.target.closest('[data-mode]'))) { cur = x.getAttribute('data-mode'); paint(); }
      else if ((x = e.target.closest('[data-rm]'))) { var p = x.getAttribute('data-rm').split(':'); draft[p[0]].splice(+p[1], 1); paint(); }
      else if (e.target.closest('[data-rec]')) {
        if (!recOn && draft['语音'].length) { TK.toast('最多 1 个录音，请先删除已有录音'); return; }
        recOn = !recOn;
        if (!recOn) { var n = new Date(); draft['语音'] = [{ name: '语音录制_' + TK.fmt(n).slice(11).replace(':', '') + '.wav', size: '186KB' }]; TK.toast('录音已保存'); }
        paint();
      }
    });
    d.body.addEventListener('input', function (e) { if (e.target.hasAttribute('data-text')) { draft['文字'] = e.target.value; d.body.querySelector('[data-cnt]').textContent = e.target.value.length + ' / 3000'; d.foot.querySelector('[data-ok]').disabled = !count(); } });
    d.body.addEventListener('change', function (e) {
      var k = e.target.getAttribute('data-up'); if (!k) return;
      var max = k === '图片' ? 20 : 1;
      [].forEach.call(e.target.files, function (f) { if (draft[k].length < max) draft[k].push({ name: f.name, size: f.size > 1048576 ? (f.size / 1048576).toFixed(1) + 'MB' : Math.ceil(f.size / 1024) + 'KB' }); else TK.toast(k + '最多 ' + max + ' 个'); });
      paint();
    });
    d.foot.querySelector('[data-c]').onclick = d.close;
    d.foot.querySelector('[data-ok]').onclick = function () {
      if (recOn) { TK.toast('请先结束录音'); return; }
      if (!count()) return;
      var items = [];
      if (draft['文字'].trim()) items.push({ type: '文字', name: '文字提交', size: draft['文字'].trim().length + ' 字', text: draft['文字'].trim() });
      ['图片', '语音', '文档'].forEach(function (k) { draft[k].forEach(function (x) { items.push({ type: k, name: x.name, size: x.size }); }); });
      var r = SK.submit(t.id, items);
      refresh(); d.close();
      TK.toast(r.first ? '提交成功，成长星 +' + r.stars : '已重新提交，等待老师评价');
      render();
    };
    paint();
  }

  /* ── 课程反馈 ── */
  function feedbackModal(t) {
    var ro = !!t.feedback, v = t.feedback ? JSON.parse(JSON.stringify(t.feedback)) : { overall: 0, scores: { '讲授内容': 0, '教学方式': 0, '互动体验': 0, '学习收获': 0 }, tags: [], text: '' };
    function stars(k, n, sm) { var h = '<span class="stars' + (sm ? ' sm' : '') + '">'; for (var i = 1; i <= 5; i++) h += '<button type="button" data-st="' + k + ':' + i + '" class="' + (i <= n ? 'on' : '') + '"' + (ro ? ' disabled' : '') + ' aria-label="' + i + ' 星">★</button>'; return h + '</span>'; }
    var m = TK.modal({ title: '课程反馈 · ' + t.course, width: 600, foot: ro ? '<span class="sp" style="font-size:11.5px;color:var(--muted)">提交于 ' + esc(t.feedback.at) + '</span><button class="btn-s" data-c>关闭</button>' : '<span class="sp" data-tip style="font-size:11.5px;color:var(--crit)"></span><button class="btn-s" data-c>取消</button><button class="btn" data-ok style="height:32px">提交反馈</button>' });
    function paint() {
      m.body.innerHTML = '<div class="fbtop"><div><b>整体评分</b><span style="font-size:11.5px;color:var(--muted)">你对这堂课的整体感受</span></div><span class="sp"></span>' + stars('overall', v.overall) + '</div>' +
        '<div class="fbk">' + DIMS.map(function (k) { return '<div><b>' + k + '</b>' + stars(k, v.scores[k], true) + '</div>'; }).join('') + '</div>' +
        '<div style="font-size:12.5px;color:var(--ink-2);margin:12px 0 8px">反馈（可多选）</div><div class="chips2">' + FB_TAGS.map(function (x) { return '<button type="button" data-tag aria-pressed="' + (v.tags.indexOf(x) >= 0) + '"' + (ro ? ' disabled' : '') + '>' + x + '</button>'; }).join('') + '</div>' +
        '<div class="ff" style="margin-top:12px"><textarea data-fbt maxlength="500" placeholder="说说你对这堂课的具体建议，例如课程、资源、互动体验等…"' + (ro ? ' readonly' : '') + '>' + esc(v.text) + '</textarea><span style="text-align:right;font-size:11px;color:var(--muted)" data-cnt>' + v.text.length + ' / 500</span></div>';
    }
    m.body.addEventListener('click', function (e) {
      if (ro) return;
      var x;
      if ((x = e.target.closest('[data-st]'))) { var p = x.getAttribute('data-st').split(':'); if (p[0] === 'overall') v.overall = +p[1]; else v.scores[p[0]] = +p[1]; paint(); }
      else if ((x = e.target.closest('[data-tag]'))) { var i = v.tags.indexOf(x.textContent); if (i >= 0) v.tags.splice(i, 1); else v.tags.push(x.textContent); x.setAttribute('aria-pressed', i < 0); }
    });
    m.body.addEventListener('input', function (e) { if (e.target.hasAttribute('data-fbt')) { v.text = e.target.value; m.body.querySelector('[data-cnt]').textContent = v.text.length + ' / 500'; } });
    m.foot.querySelector('[data-c]').onclick = m.close;
    if (!ro) m.foot.querySelector('[data-ok]').onclick = function () {
      if (!v.overall || DIMS.some(function (k) { return !v.scores[k]; })) { m.foot.querySelector('[data-tip]').textContent = '请完成整体评分和 4 个单项评分'; return; }
      SK.feedback(t.id, v); refresh(); m.close(); TK.toast('感谢反馈，成长星 +' + SK.STAR.feedback); render();
    };
    paint();
  }

  /* ═══ 路由与事件 ═══ */
  function cur() { var m = location.hash.match(/^#task\/(\w+)/); return m ? byId(m[1]) : null; }
  function render() {
    var t = cur();
    document.getElementById('body').innerHTML = t ? viewDetail(t) : viewList();
  }
  var body = document.getElementById('body');
  body.addEventListener('click', function (e) {
    var x, t = cur();
    if ((x = e.target.closest('[data-stat]'))) { var k = x.getAttribute('data-stat'); F.stat = F.stat === k ? '' : k; page = 1; render(); return; }
    if (e.target.closest('[data-clearstat]')) { F.stat = ''; render(); return; }
    if ((x = e.target.closest('[data-page]'))) { page = +x.getAttribute('data-page'); render(); return; }
    if ((x = e.target.closest('[data-open]'))) { location.hash = 'task/' + x.getAttribute('data-open'); return; }
    if (e.target.closest('[data-back]')) { location.hash = ''; return; }
    if ((x = e.target.closest('[data-submit]'))) { submitDrawer(byId(x.getAttribute('data-submit'))); return; }
    if ((x = e.target.closest('[data-fb]'))) { feedbackModal(byId(x.getAttribute('data-fb'))); return; }
    if ((x = e.target.closest('[data-pv]'))) { previewFile(t, t.files.find(function (f) { return f.id === x.getAttribute('data-pv'); })); return; }
    if ((x = e.target.closest('[data-dl]'))) { TK.toast('已开始下载'); return; }
    if (e.target.closest('[data-dlall]')) { TK.toast('已开始打包下载'); return; }
    if ((x = e.target.closest('[data-item]'))) { var p = x.getAttribute('data-item').split(':'); previewItem(t.submissions.find(function (s) { return s.n === +p[0]; }).items[+p[1]]); return; }
    if ((x = e.target.closest('[data-fold]'))) { var c = x.nextElementSibling; c.hidden = !c.hidden; x.lastElementChild.textContent = c.hidden ? '展开 ▾' : '收起 ▴'; }
  });
  body.addEventListener('input', function (e) { if (e.target.getAttribute('data-f') === 'q') { F.q = e.target.value.trim(); page = 1; var pos = e.target.selectionStart; render(); var i = body.querySelector('[data-f="q"]'); i.focus(); i.setSelectionRange(pos, pos); } });
  body.addEventListener('change', function (e) { var k = e.target.getAttribute('data-f'); if (k && k !== 'q') { F[k] = e.target.value; page = 1; render(); } });
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  UI.boot({ portal: 'student', active: 'tasks' });
  var open = new URLSearchParams(location.search).get('open');
  if (open && byId(open) && !location.hash) location.hash = 'task/' + open;
  render();
})();
</script>
</body>
</html>
