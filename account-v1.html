    function rolePickHtml() {
      var opts = '';
      PORTAL_ORDER.forEach(function (p) {
        var roles = ctx.roles.filter(function (r) { return r.portal === p && r.status === '启用'; });
        if (!roles.length) return;
        opts += '<optgroup label="' + esc(portalCn(p)) + '">';
        roles.forEach(function (r) { opts += '<option value="' + esc(r.id) + '">' + esc(r.name) + '</option>'; });
        opts += '</optgroup>';
      });
      var tags = draft.roleIds.map(function (rid) {
        return '<span class="rtag">' + esc(roleName(rid)) + '<button type="button" class="rtag-x" data-bmdel-role="' + esc(rid) + '" aria-label="移除">×</button></span>';
      }).join('');
      return '<div class="orgrow-pick"><span class="field-label">添加角色（选填）</span>'
        + '<div class="pick-body"><span class="role-tags">' + tags + '</span>'
        + '<select class="addsel" data-bmaddrole="1"><option value="">＋ 添加角色</option>' + opts + '</select></div></div>';
    }
    function previewLine(name, a) {
      var curRoles = Member.accountRoleIds(ctx, a);
      var addRoles = draft.roleIds.filter(function (rid) { return curRoles.indexOf(rid) < 0; });
      var html = '<div style="padding:4px 0;border-bottom:1px solid var(--rule)"><b>' + esc(name) + '</b>：';
      if (draft.orgIds.length) html += '加入后，已有角色 ' + (curRoles.length ? curRoles.map(roleName).join('、') : '无') + ' 将在新组织生效';
      if (addRoles.length) html += (draft.orgIds.length ? '；' : '') + '新增角色 ' + addRoles.map(roleName).join('、') + ' 将在其全部所属组织生效';
      if (!draft.orgIds.length && !addRoles.length) html += '（无变更）';
      return html + '</div>';
    }
    function previewHtml() {
      if (!draft.orgIds.length && !draft.roleIds.length) return '<span class="ro-note">请先选择组织或角色</span>';
      if (!draft.accountIds.length) return '<span class="ro-note">请选择要管理的成员</span>';
      return draft.accountIds.map(function (aid) {
        var a = byAccountId(aid);
        return a ? previewLine(a.name, a) : '';
      }).join('');
    }
    function renderBody() {
      bodyEl.innerHTML = '<div class="orgrow-pick"><span class="field-label">加入组织（选填，多选）</span>'
        + '<div class="org-pick-layout">'
        + '<div class="org-pick-col"><div class="org-pick-title">组织树</div><div class="part-tree">' + orgTreeHtml() + '</div></div>'
        + '<div class="org-pick-col"><div class="org-pick-title">已选组织</div><div class="org-sel" id="bmOrgSel">' + orgSelHtml() + '</div></div>'
        + '</div></div>'
        + rolePickHtml()
        + '<div class="sec-h">效果预览</div><div>' + previewHtml() + '</div>';
    }
    function searchListHtml() {
      var q = searchQ.trim().toLowerCase();
      var list = enabledAccounts().filter(function (a) {
        if (q && a.name.toLowerCase().indexOf(q) < 0 && a.id.toLowerCase().indexOf(q) < 0) return false;
        if (!memberMatchExtra(a, filterRole, filterMajor, filterOrg)) return false;
        return true;
      });
      var rows = list.map(function (a) {
        var inOrg = draft.orgIds.some(function (oid) { return Member.memberOrgIds(ctx, a).indexOf(oid) >= 0; });
        var isMe = a.id === meId;
        var dis = isMe || inOrg;
        var checked = draft.accountIds.indexOf(a.id) >= 0;
        var info = memberKeyInfo(a);
        return '<tr' + (dis ? ' class="dis"' : '') + '>'
          + '<td class="mchk"><input type="checkbox" data-bmacct="' + esc(a.id) + '"' + (checked ? ' checked' : '') + (dis ? ' disabled' : '') + '></td>'
          + '<td class="mname">' + esc(a.name) + (isMe ? ' <span class="rtag ro">本人</span>' : '') + '</td>'
          + '<td class="msub">' + esc(a.id) + '</td>'
          + '<td>' + esc(info.orgs) + '</td>'
          + '<td>' + esc(info.roles) + '</td>'
          + '<td>' + esc(info.majors) + '</td>'
          + '</tr>';
      }).join('');
      if (!rows) return '<span class="ro-note">无匹配账号</span>';
      return '<table class="mem-table"><thead><tr>'
        + '<th class="mchk"></th><th>姓名</th><th>账号</th><th>所属组织</th><th>角色</th><th>所属专业</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table>';
    }
    function renderSearch() {
      var fopts = memberFilterOpts(filterRole, filterMajor, filterOrg);
      searchEl.innerHTML = '<div class="orgrow-pick"><span class="field-label">选择成员（可搜索全校账号）</span>'
        + '<div class="ba-filter">'
        + '<input class="f-search" data-bmsearch placeholder="搜索姓名 / 账号">'
        + '<select data-bmrole aria-label="角色筛选">' + fopts.role + '</select>'
        + '<select data-bmmajor aria-label="专业筛选">' + fopts.major + '</select>'
        + '<select data-bmorgf aria-label="组织筛选">' + fopts.org + '</select>'
        + '</div>'
        + '<div class="mem-list" id="bmSearchList">' + searchListHtml() + '</div></div>';
    }

    renderSearch();
    renderBody();

    dlg.addEventListener('change', function (e) {
      var fr = e.target.closest('[data-bmrole]');
      var fm = e.target.closest('[data-bmmajor]');
      var fo = e.target.closest('[data-bmorgf]');
      if (fr || fm || fo) {
        filterRole = fr ? fr.value : filterRole;
        filterMajor = fm ? fm.value : filterMajor;
        filterOrg = fo ? fo.value : filterOrg;
        var fl = dlg.querySelector('#bmSearchList'); if (fl) fl.innerHTML = searchListHtml();
        return;
      }
      var org = e.target.closest('[data-bmorg]');
      if (org) {
        var oid = org.getAttribute('data-bmorg');
        var i = draft.orgIds.indexOf(oid);
        if (org.checked) { if (i < 0) draft.orgIds.push(oid); }
        else if (i >= 0) draft.orgIds.splice(i, 1);
        renderBody();
        var list = dlg.querySelector('#bmSearchList'); if (list) list.innerHTML = searchListHtml();
        return;
      }
      var acct = e.target.closest('[data-bmacct]');
      if (acct) {
        var aid = acct.getAttribute('data-bmacct');
        var j = draft.accountIds.indexOf(aid);
        if (acct.checked) { if (j < 0) draft.accountIds.push(aid); }
        else if (j >= 0) draft.accountIds.splice(j, 1);
        var list2 = dlg.querySelector('#bmSearchList'); if (list2) list2.innerHTML = searchListHtml();
        renderBody();
        return;
      }
      var addRole = e.target.closest('[data-bmaddrole]');
      if (addRole && addRole.value) {
        if (draft.roleIds.indexOf(addRole.value) < 0) draft.roleIds.push(addRole.value);
        addRole.value = '';
        renderBody();
      }
    });
    dlg.addEventListener('input', function (e) {
      if (e.target && e.target.getAttribute('data-bmsearch') != null) {
        searchQ = e.target.value;
        var list = dlg.querySelector('#bmSearchList');
        if (list) list.innerHTML = searchListHtml();
      }
    });
    dlg.addEventListener('click', function (e) {
      var delRole = e.target.closest('[data-bmdel-role]');
      if (delRole) {
        var rid = delRole.getAttribute('data-bmdel-role');
        var i = draft.roleIds.indexOf(rid);
        if (i >= 0) draft.roleIds.splice(i, 1);
        renderBody();
        return;
      }
      var delOrg = e.target.closest('[data-bmdel-org]');
      if (delOrg) {
        var oid = delOrg.getAttribute('data-bmdel-org');
        var j = draft.orgIds.indexOf(oid);
        if (j >= 0) draft.orgIds.splice(j, 1);
        renderBody();
        var list = dlg.querySelector('#bmSearchList'); if (list) list.innerHTML = searchListHtml();
        return;
      }
      if (e.target.closest('[data-x]')) dlg.close();
    });
    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!draft.accountIds.length) { errEl.textContent = '请选择要管理的成员'; return; }
      if (!draft.orgIds.length && !draft.roleIds.length) { errEl.textContent = '请至少选择一个组织或角色'; return; }
      var ok = [], skipped = [];
      draft.accountIds.forEach(function (aid) {
        var a = byAccountId(aid);
        if (!a) { skipped.push({ name: aid, reason: '账号不存在' }); return; }
        if (a.status !== '正常') { skipped.push({ name: a.name, reason: '账号已停用' }); return; }
        var before = { 组织: Member.memberOrgIds(ctx, a).map(orgName), 角色: Member.accountRoleIds(ctx, a).map(roleName) };
        if (draft.orgIds.length) Member.addOrgs(ctx, a, draft.orgIds);
        if (draft.roleIds.length) Member.addRoles(ctx, a, draft.roleIds);
        var after = { 组织: Member.memberOrgIds(ctx, a).map(orgName), 角色: Member.accountRoleIds(ctx, a).map(roleName) };
        audit('批量管理账号', a.name, before, after, '成功', draft.orgIds[0] || null);
        ok.push({ name: a.name });
      });
      DEMO.saveState(ctx);
      dlg.close();
      showBatchResult('批量管理账号', ok.length, skipped);
      render();
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  /* 添加 / 移除角色 */
  function openBatchRole(mode) {
    var isAdd = mode === 'add';
    var targets = selectedAccounts();
    if (!targets.length) { toast('请先勾选要操作的成员'); return; }
    var meId = identity.account.id;
    var draft = { roleIds: [] };
    var rolePool = isAdd
      ? ctx.roles.filter(function (r) { return r.status === '启用'; })
      : ctx.roles.filter(function (r) {
          return targets.some(function (a) { return Member.accountRoleIds(ctx, a).indexOf(r.id) >= 0; });
        });

    function rolePickHtml() {
      var opts = '';
      PORTAL_ORDER.forEach(function (p) {
        var roles = rolePool.filter(function (r) { return r.portal === p; });
        if (!roles.length) return;
        opts += '<optgroup label="' + esc(portalCn(p)) + '">';
        roles.forEach(function (r) { opts += '<option value="' + esc(r.id) + '">' + esc(r.name) + '</option>'; });
        opts += '</optgroup>';
      });
      var tags = draft.roleIds.map(function (rid) {
        return '<span class="rtag">' + esc(roleName(rid)) + '<button type="button" class="rtag-x" data-bdel-role="' + esc(rid) + '" aria-label="移除">×</button></span>';
      }).join('');
      return '<div class="orgrow-pick"><span class="field-label">' + (isAdd ? '添加角色' : '移除角色') + '</span>'
        + '<div class="pick-body"><span class="role-tags">' + tags + '</span>'
        + '<select class="addsel" data-baddrole="1"><option value="">＋ 添加</option>' + opts + '</select></div></div>';
    }
    function previewHtml() {
      if (!draft.roleIds.length) return '<span class="ro-note">请选择角色</span>';
      return targets.map(function (a) {
        var skip = '';
        if (a.id === meId) skip = '跳过：不能给自己操作';
        else if (memberOutOfScope(a)) skip = '跳过：该成员还属于您范围外的组织';
        else if (!isAdd) {
          var remain = Member.accountRoleIds(ctx, a).filter(function (rid) { return draft.roleIds.indexOf(rid) < 0; });
          if (!remain.length) skip = '跳过：至少保留一个角色';
        }
        if (skip) return '<div style="padding:4px 0">' + esc(a.name) + ' <span class="pill warn">' + esc(skip) + '</span></div>';
        return '<div style="padding:4px 0">' + esc(a.name) + ' <span class="pill good">' + (isAdd ? '将新增 ' : '将移除 ') + draft.roleIds.map(roleName).join('、') + '</span></div>';
      }).join('');
    }

    var dlg = openDialog('<form style="max-height:88vh;overflow-y:auto">'
      + '<div class="aidlg-h"><h2>' + (isAdd ? '添加角色' : '移除角色') + '</h2><button type="button" class="x" data-x aria-label="关闭">×</button></div>'
      + '<div class="note">角色属于整个账号，将在所选成员的全部所属组织' + (isAdd ? '生效' : '失效') + '。</div>'
      + '<div id="roleSec">' + rolePickHtml() + '</div>'
      + '<div class="sec-h">已选成员（' + targets.length + ' 人）</div>'
      + '<div id="preview">' + previewHtml() + '</div>'
      + '<div class="note" id="err" style="color:var(--crit)"></div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">确认' + (isAdd ? '添加' : '移除') + '</button></div>'
      + '</form>');
    dlg.style.width = 'min(560px, calc(100vw - 32px))';
    var roleSec = dlg.querySelector('#roleSec');
    var preview = dlg.querySelector('#preview');
    var errEl = dlg.querySelector('#err');
    function refresh() {
      roleSec.innerHTML = rolePickHtml();
      preview.innerHTML = previewHtml();
    }
    dlg.addEventListener('change', function (e) {
      var addRole = e.target.closest('[data-baddrole]');
      if (addRole && addRole.value) {
        if (draft.roleIds.indexOf(addRole.value) < 0) draft.roleIds.push(addRole.value);
        addRole.value = '';
        refresh();
      }
    });
    dlg.addEventListener('click', function (e) {
      var delRole = e.target.closest('[data-bdel-role]');
      if (delRole) {
        var rid = delRole.getAttribute('data-bdel-role');
        var i = draft.roleIds.indexOf(rid);
        if (i >= 0) draft.roleIds.splice(i, 1);
        refresh();
        return;
      }
      if (e.target.closest('[data-x]')) dlg.close();
    });
    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!draft.roleIds.length) { errEl.textContent = '请选择角色'; return; }
      var ok = [], skipped = [];
      targets.forEach(function (a) {
        if (a.id === meId) { skipped.push({ name: a.name, reason: '不能给自己操作' }); return; }
        if (memberOutOfScope(a)) { skipped.push({ name: a.name, reason: '该成员还属于您范围外的组织' }); return; }
        if (!isAdd) {
          var remain = Member.accountRoleIds(ctx, a).filter(function (rid) { return draft.roleIds.indexOf(rid) < 0; });
          if (!remain.length) { skipped.push({ name: a.name, reason: '至少保留一个角色' }); return; }
        }
        var before = Member.accountRoleIds(ctx, a).map(roleName);
        var res = isAdd ? Member.addRoles(ctx, a, draft.roleIds) : Member.removeRoles(ctx, a, draft.roleIds);
        var after = Member.accountRoleIds(ctx, a).map(roleName);
        audit(isAdd ? '添加角色' : '移除角色', a.name, { 角色: before }, { 角色: after }, '成功', a.orgId);
        ok.push({ name: a.name });
      });
      if (!ok.length) { errEl.textContent = '没有可操作的成员'; return; }
      dlg.close();
      selectedIds = {};
      showBatchResult(isAdd ? '添加角色' : '移除角色', ok.length, skipped);
      render();
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  /* ── 「为什么能看到 / 看不到」 ── */
  function ensureTip() {
    if (!window.__tipEl) {
      var t = document.createElement('div');
      t.id = 'tip';
      document.body.appendChild(t);
      window.__tipEl = t;
    }
    return window.__tipEl;
  }
  function roleSummary() {
    return Perm.activeAssignments(ctx, identity).map(function (a) {
      var r = byId('roles', a.roleId);
      var scope = (a.scopeOrgIds || []).map(function (oid) { return orgById(oid) ? orgById(oid).name : oid; }).join('、');
      return r.name + (scope ? ' @' + scope : '');
    }).join('；') || '无';
  }
  function portalNameCn(p) { return p === 'teacher' ? '教师端' : (p === 'student' ? '学生端' : '管理端'); }
  function showTip(anchor, html) {
    var t = ensureTip();
    t.innerHTML = html;
    t.classList.add('on');
    var r = anchor.getBoundingClientRect();
    var tw = t.offsetWidth || 260;
    var left = Math.max(8, Math.min(r.left, window.innerWidth - tw - 12));
    var top = r.bottom + 8;
    if (top + 140 > window.innerHeight) top = r.top - 148;
    t.style.left = left + 'px';
    t.style.top = Math.max(8, top) + 'px';
  }
  function hideTip() { if (window.__tipEl) window.__tipEl.classList.remove('on'); }

  function explainAccount(a) {
    var t = Perm.explain(ctx, identity, 'org:account:view', a, 'account', ui.orgId);
    var lines = ['<b>' + esc(a.name) + ' · 账号查看</b>',
      '<span class="tk">账号：' + esc(identity.account.name) + '（' + esc(identity.account.status) + '）</span>',
      '<span class="tk">当前端：' + portalNameCn(t.currentPortal) + '，只计入' + portalNameCn(t.currentPortal) + '角色的分配</span>',
      '<span class="tk">角色：' + esc(roleSummary()) + '</span>'];
    (t.assignments || []).forEach(function (asg) {
      lines.push('<span class="tk">' + esc(asg.roleName) + '：功能 ' + (asg.hasPerm ? '✓' : '✗')
        + (asg.hasPerm && asg.scopePass != null ? ' · 范围 ' + (asg.scopePass ? '✓' : '✗') : '')
        + (asg.inPortal === false ? ' · ' + portalNameCn(asg.portal) + '分配，本端不参与' : '') + '</span>');
    });
    if (t.orgFiltered) lines.push('<span class="tk">有权限，被当前组织过滤</span>');
    if (!t.allowed && t.hiddenReason) lines.push('<span class="tk">不可见：' + esc(t.hiddenReason) + '</span>');
    return lines.join('');
  }

  /* ── 事件（委托到 #body） ── */
  function bindEvents() {
    $('#body').addEventListener('click', function (e) {
      var aadd = e.target.closest('[data-aadd]');
      if (aadd) {
        if (can('account:account:create')) openAccountForm(null);
        else { audit('越权尝试·新增账号', '新账号', null, { reason: '无账号新建权限' }, '被拒绝', null); toast('越权尝试已记录：无账号新建权限'); }
        return;
      }
      var accall = e.target.closest('[data-accall]');
      if (accall) {
        var allSel = lastVisibleIds.length > 0 && lastVisibleIds.every(function (id) { return selectedIds[id]; });
        if (allSel) lastVisibleIds.forEach(function (id) { delete selectedIds[id]; });
        else lastVisibleIds.forEach(function (id) { selectedIds[id] = 1; });
        render();
        return;
      }
      var accchk = e.target.closest('[data-accchk]');
      if (accchk) {
        var cid = accchk.getAttribute('data-accchk');
        if (accchk.checked) selectedIds[cid] = 1; else delete selectedIds[cid];
        render();
        return;
      }
      var batch = e.target.closest('[data-batch]');
      if (batch) {
        var kind = batch.getAttribute('data-batch');
        if (kind === 'addorg') openBatchOrg('add', false);
        else if (kind === 'removeorg') openBatchOrg('remove', false);
        else if (kind === 'addrole') openBatchRole('add');
        else if (kind === 'removerole') openBatchRole('remove');
        else if (kind === 'addmember') openBatchOrg('add', true);
        else if (kind === 'manage') openBatchManage();
        return;
      }
      var adetail = e.target.closest('[data-adetail]');
      if (adetail) { var adt = byId('accounts', adetail.getAttribute('data-adetail')); if (adt) openAccountDetail(adt); return; }
      var aedit = e.target.closest('[data-aedit]');
      if (aedit) {
        var ae = byId('accounts', aedit.getAttribute('data-aedit'));
        if (ae && Perm.check(ctx, identity, 'org:account:edit', ae, 'account').allowed) openAccountForm(ae);
        else if (ae) { audit('越权尝试·编辑账号', ae.name, null, { reason: '范围未覆盖主组织' }, '被拒绝', ae.orgId); toast('越权尝试已记录：范围未覆盖主组织'); }
        return;
      }
      var aassign = e.target.closest('[data-aassign]');
      if (aassign) {
        var ag = byId('accounts', aassign.getAttribute('data-aassign'));
        if (ag && can('org:account:assign')) openAccountForm(ag, true);
        return;
      }
      var adisable = e.target.closest('[data-adisable]');
      if (adisable) { var ad = byId('accounts', adisable.getAttribute('data-adisable')); if (ad && Perm.check(ctx, identity, 'org:account:edit', ad, 'account').allowed) toggleStatus(ad); return; }
      var aenable = e.target.closest('[data-aenable]');
      if (aenable) { var an = byId('accounts', aenable.getAttribute('data-aenable')); if (an && Perm.check(ctx, identity, 'org:account:edit', an, 'account').allowed) toggleStatus(an); return; }
      var apwd = e.target.closest('[data-apwd]');
      if (apwd) { var ap = byId('accounts', apwd.getAttribute('data-apwd')); if (ap && Perm.check(ctx, identity, 'org:account:edit', ap, 'account').allowed) resetPassword(ap); return; }
    });
    $('#body').addEventListener('input', function (e) {
      if (e.target && e.target.id === 'acctSearch') {
        acctFilter.q = e.target.value;
        render();
        var el2 = document.getElementById('acctSearch');
        if (el2) { el2.focus(); try { el2.setSelectionRange(el2.value.length, el2.value.length); } catch (x) {} }
      }
    });
    $('#body').addEventListener('change', function (e) {
      if (e.target && e.target.id === 'acctRole') { acctFilter.roleId = e.target.value; render(); }
      else if (e.target && e.target.id === 'acctStatus') { acctFilter.status = e.target.value; render(); }
      else if (e.target && e.target.id === 'acctMajor') { acctFilter.major = e.target.value; render(); }
      else if (e.target && e.target.id === 'acctOrg') { acctFilter.orgId = e.target.value; viewOrgId = null; render(); }
    });
    $('#body').addEventListener('mouseover', function (e) {
      var aq = e.target.closest('[data-awhy]');
      if (aq) { var a = byId('accounts', aq.getAttribute('data-awhy')); if (a) showTip(aq, explainAccount(a)); }
    });
    $('#body').addEventListener('mouseout', function (e) {
      if (e.target.closest('[data-awhy]')) hideTip();
    });
  }

  /* ── 启动 ── */
  function initOrgParam() {
    var m = null;
    try { if (location.search) m = location.search.match(/[?&]org=([^&]+)/); } catch (e) {}
    if (!m) return;
    var orgId = decodeURIComponent(m[1]);
    var visible = Perm.visibleOrgNodes(ctx, identity, { forAssign: true });
    if (visible.some(function (o) { return o.id === orgId; })) {
      viewOrgId = orgId;
      acctFilter.orgId = orgId;
    } else {
      toast('无权查看该组织成员');
    }
  }

  UI.boot({ portal: 'admin', active: 'account' });
  reload();
  initOrgParam();
  UI.onChange(function () { render(); });
  bindEvents();
  render();
})();
