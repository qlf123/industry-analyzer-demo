<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号与角色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
/* 账号与角色页业务布局 */
.m-hid{color:var(--muted);font-family:var(--mono);font-size:11px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 18px}
.kv2 .kk{color:var(--muted);font-size:11.5px}
.kv2 .vv{font-size:13px;color:var(--ink);word-break:break-all}
.sec-h{font-size:12.5px;font-weight:700;margin:4px 0 8px}
.aidlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.aidlg-h h2{flex:1 1 auto;min-width:0}
.whyq{width:22px;height:22px;border-radius:50%;background:var(--card-2);border:1px solid var(--rule);
  color:var(--ink-2);font-size:12px;font-weight:700;display:inline-grid;place-items:center;
  cursor:help;flex:0 0 22px}
.whyq:hover{border-color:var(--brand);color:var(--brand-ink)}
.dt-row.filt{opacity:.55}
.dt-row.filt .cell-s{color:var(--warn-ink)}

/* 账号管理：筛选栏 + 宽表横向滚动 + 多值单元格 */
.act-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule)}
.act-filter .f-search{flex:1 1 190px;min-width:150px;font:inherit;font-size:12.5px;padding:7px 10px;
  border:1px solid var(--rule);border-radius:8px;background:var(--card-2);color:var(--ink)}
.act-filter .f-search:focus{outline:none;border-color:var(--brand)}
.act-filter select{font:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card-2);color:var(--ink);max-width:150px}
.act-filter .f-count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ba-filter{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.ba-filter .f-search{flex:1 1 170px;min-width:140px;font:inherit;font-size:12.5px;padding:7px 10px;
  border:1px solid var(--rule);border-radius:8px;background:var(--card-2);color:var(--ink)}
.ba-filter .f-search:focus{outline:none;border-color:var(--brand)}
.ba-filter select{font:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card-2);color:var(--ink);max-width:150px}
.mem-list{max-height:300px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;margin-top:4px;background:var(--card)}
.mem-table{width:100%;border-collapse:collapse}
.mem-table thead th{position:sticky;top:0;background:#f7f7fb;z-index:1;text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.mem-table td{padding:6px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top;line-height:1.5;font-size:12.5px;color:var(--ink)}
.mem-table tbody tr:last-child td{border-bottom:0}
.mem-table .mchk{width:26px;text-align:center}
.mem-table .mchk input{accent-color:var(--brand);width:14px;height:14px;margin:0;cursor:pointer}
.mem-table tbody tr.dis td{opacity:.55}
.mem-table .mname{font-weight:600;color:var(--ink);white-space:nowrap}
.mem-table .mname .rtag{margin-left:4px}
.mem-table .msub{color:var(--muted);white-space:nowrap}
.act-table{overflow-x:auto}
.act-table .dt-row{min-width:1190px}
.cell-list{font-size:11px;color:var(--ink-2);line-height:1.55;word-break:break-all}
/* 成员批量操作：勾选列 + 批量栏 + 提示条 */
.chkcell{display:flex;align-items:center;justify-content:center}
.chkcell input{accent-color:var(--brand);width:14px;height:14px;margin:0;cursor:pointer}
.batch-zone{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--card-2)}
.batch-zone .b-count{font-size:12.5px;font-weight:600;color:var(--ink);margin-right:2px}
.member-hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--brand-soft,#eef2ff);border-bottom:1px solid var(--rule);padding:8px 14px;font-size:12.5px;color:var(--ink-2)}
.member-hint a{color:var(--brand,#3b5bdb);text-decoration:none;font-weight:500}
.member-hint a:hover{text-decoration:underline}
.detail-sec{margin-top:14px}
.detail-sec:first-child{margin-top:0}
/* 所属组织多选：左组织树 + 右已选 */
.otp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.otp-title{font-size:11.5px;font-weight:600;color:var(--ink-2);padding:8px 10px;background:var(--card-2);border-bottom:1px solid var(--rule)}
.otp-scroll{max-height:220px;overflow-y:auto;padding:8px 10px}
.otp-org{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12.5px;color:var(--ink);cursor:pointer;border-radius:6px}
.otp-org:hover{background:var(--card-2)}
.otp-org input{flex:0 0 auto;margin:0}
.otp-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org-pick-layout{display:flex;gap:12px;align-items:flex-start}
.org-pick-col{flex:1 1 50%;min-width:0}
.org-pick-title{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.org-pick-layout .part-tree{margin-top:0;min-height:160px}
.org-pick-layout .org-sel{margin-top:0;min-height:160px}
.otp-org.dis{opacity:.55;cursor:default}
.otp-org.dis:hover{background:transparent}
.otp-type{flex:0 0 auto;font-size:10.5px;font-family:var(--mono);color:var(--muted)}
.org-sel{max-height:220px;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.org-sel-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--card)}
.org-sel-item.ro{background:var(--card-2);color:var(--muted);border-color:var(--rule)}
.org-sel-name{font-size:12.5px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.org-sel-item.ro .org-sel-name{color:var(--muted)}
.org-sel-acts{display:flex;align-items:center;gap:9px;flex:0 0 auto}

/* 所属组织：主组织标签 + 兼职灰色 */
.org-main{font-weight:500;display:block}
.org-tag{display:inline-block;font-size:10px;font-family:var(--mono);font-weight:500;padding:0 5px;border-radius:5px;background:var(--brand-soft,#eef2ff);color:var(--brand,#3b5bdb);margin-left:5px;vertical-align:1px}
.org-part{color:var(--ink-2);display:block}
.org-sep{color:var(--muted);margin:0 5px}
.part-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}
.part-tree{max-height:220px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;margin-top:4px}
/* 批量管理账号：成员两行式 + 组织树层级引导 */
.bm-acct{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;font-size:12.5px;color:var(--ink);cursor:pointer;border-radius:6px}
.bm-acct:hover{background:var(--card-2)}
.bm-acct input{flex:0 0 auto;margin:2px 0 0}
.bm-acct-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.bm-acct-name{font-weight:600;color:var(--ink);line-height:1.35}
.bm-acct-sub{font-size:11px;color:var(--muted);line-height:1.4;word-break:break-all}
.bm-acct.dis{opacity:.55;cursor:default}
.bm-acct.dis:hover{background:transparent}
.bm-acct .rtag.ro{flex:0 0 auto;margin-top:1px}
.otp-guide{color:var(--muted);margin:0 3px 0 0;font-size:10.5px}

/* 角色分配卡片 */
.asgcard{border:1px solid var(--rule);border-radius:11px;padding:13px 14px;margin-bottom:12px;background:var(--card-2)}
.asgcard .dr-k{margin-bottom:9px}
.asgcard select{width:100%}
.orgline{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.orgline .ocl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink)}
.gchk{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);margin-right:10px;white-space:nowrap}
.grps{display:inline-flex;flex-wrap:wrap;gap:2px 0;margin-left:4px;align-items:center}
.grps[hidden]{display:none}
.majline{padding:3px 0}
.kl{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 0;color:var(--ink)}
.kl .cell-s{font-size:10.5px;color:var(--muted)}
.idc{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;margin-top:4px;color:var(--ink)}
.stopped-card{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.stopped-card:first-of-type{border-top:0}

/* 组织为主录入：组织行 + 角色多选 + 主组织 */
.orgrow{border:1px solid var(--rule);border-radius:12px;padding:12px 14px 13px;margin-bottom:10px;background:var(--card-2)}
.orgrow.ro{opacity:.62}
.orgrow-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.orgrow-title{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.6;min-width:0}
.ro-note{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:6px;white-space:nowrap}
.orgrow-head-acts{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.orgrow .orgrow-primary{display:inline-flex;flex-direction:row;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.orgrow-primary input{accent-color:var(--brand);margin:0;width:15px;height:15px}
.orgrow-body{display:flex;flex-direction:column;gap:9px}
.orgrow .orgrow-org{display:flex;flex-direction:column;gap:4px}
.orgrow-org .field-label{font-size:11.5px;color:var(--muted)}
.orgrow-org select{width:100%}
.orgrow-ro{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.role-tags{display:flex;flex-wrap:wrap;gap:6px}
.role-tags:empty{display:none}
.rtag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--brand-soft, #eef2ff);color:var(--brand, #3b5bdb)}
.rtag-x{border:none;background:transparent;color:inherit;font-size:14px;line-height:1;cursor:pointer;padding:0 1px;opacity:.7}
.rtag-x:hover{opacity:1}
.orgrow-pick{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.orgrow-pick .field-label{font-size:11.5px;color:var(--muted)}
.orgrow-pick .field-label .req{color:var(--crit)}
.pick-body{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addsel{font:inherit;font-size:12px;color:var(--brand,#3b5bdb);background:transparent;border:1px dashed var(--rule);border-radius:999px;padding:3px 10px;cursor:pointer;max-width:100%}
.addsel:hover{border-color:var(--brand);background:var(--brand-soft,#eef2ff)}
.addsel:focus{outline:none;border-color:var(--brand)}
/* 账号 v1：组织/角色分别多选，组合全部生效 */
.warn-banner{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn-ink);font-size:12px;padding:8px 11px;border-radius:8px;margin:2px 0 8px;line-height:1.55}
.rtag.ro{background:var(--card-2);color:var(--muted);border:1px solid var(--rule)}
.rtag-primary{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-2);cursor:pointer;margin-left:2px}
.rtag-primary input{margin:0;accent-color:var(--brand);width:13px;height:13px}
.rtag-primary input:disabled{cursor:not-allowed}
.rtag-main{display:inline-flex;font-size:10px;padding:0 5px;border-radius:5px;background:var(--brand-soft);color:var(--brand);margin-left:4px}
.org-tags-wrap,.role-tags-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.teach-note{font-size:11.5px;color:var(--muted);margin:-2px 0 8px}
.addorg{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:12.5px;padding:8px;border:1px dashed var(--rule);border-radius:9px;background:transparent;color:var(--ink-2);cursor:pointer}
.addorg:hover{border-color:var(--brand);color:var(--brand, #3b5bdb);background:var(--brand-soft, #eef2ff)}
.primary-line{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.primary-line b{color:var(--ink-2);font-weight:500}
.role-org-cell{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--ink-2)}
.org-role-line{font-size:12.5px;color:var(--ink);padding:2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* 角色管理（左右分栏 + 详情） */
.role-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.role-layout{grid-template-columns:1fr}}
.role-list-panel{background:var(--card);border:1px solid var(--rule);border-radius:13px;overflow:hidden;
  display:flex;flex-direction:column;max-height:calc(100vh - 204px);position:sticky;top:118px}
.role-toolbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--rule);align-items:center}
.role-search{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card-2);color:var(--ink)}
.role-search:focus{outline:none;border-color:var(--brand)}
.role-list{overflow-y:auto;flex:1}
.role-item{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--rule-2);
  cursor:pointer;transition:background .12s}
.role-item:first-child{border-top:0}
.role-item:hover{background:var(--rule-2)}
.role-item.is-active{background:var(--brand-soft)}
.role-item-head{display:flex;align-items:center;gap:8px}
.role-item-title{font-size:13px;font-weight:600;color:var(--ink)}
.role-status{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid transparent}
.role-status.enabled{background:var(--good-bg);color:var(--good)}
.role-status.disabled{background:var(--crit-bg);color:var(--crit)}
.role-item-desc{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.role-item-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.role-detail-panel{background:var(--card);border:1px solid var(--rule);border-radius:13px;overflow:hidden}
.detail-topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.detail-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-badge{font-family:var(--mono);font-size:11px;font-weight:400;padding:2px 9px;border-radius:20px;
  background:var(--card-2);color:var(--ink-2);border:1px solid var(--rule)}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.role-tabs{display:flex;gap:3px;padding:10px 18px;border-bottom:1px solid var(--rule)}
.rtab{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.rtab:hover{background:var(--rule-2);color:var(--ink)}
.rtab.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.role-tab-pane{padding:18px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
@media (max-width:720px){.form-grid{grid-template-columns:1fr}}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-group.field-full{grid-column:1/-1}
.field-label{font-size:11.5px;color:var(--muted)}
.field-value{font-size:13px;color:var(--ink);min-height:20px;display:flex;align-items:center;gap:8px}
.field-value.mono{font-family:var(--mono)}
.switch{position:relative;width:40px;height:22px;border-radius:20px;background:var(--rule);border:1px solid var(--rule);
  cursor:pointer;transition:background .15s;flex:0 0 auto}
.switch.on{background:var(--brand);border-color:var(--brand)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on::after{transform:translateX(18px)}
.switch.locked{opacity:.5;cursor:not-allowed}
.rm{font-weight:600;font-size:12.5px;margin:14px 0 4px;color:var(--ink)}
.rr{font-size:11.5px;color:var(--ink-2);margin:4px 0 2px}
.op{display:inline-block;font-size:11px;padding:1px 9px;border-radius:6px;border:1px solid var(--rule);color:var(--muted);margin:2px 5px 2px 0}
.op.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:500}
/* 配置角色菜单权限树 */
.pgroup{padding:9px 0;border-bottom:1px solid var(--rule-2)}
.pgroup:last-child{border-bottom:0}
.pgroup-h{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;padding:3px 0}
.pitems{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 0 2px 24px}
.pitem{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:2px 0}
.pgroup-h input,.pitem input{accent-color:var(--brand);margin:0}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop">
      <div class="ptop-r">
        <div class="pt-l">
          <h1 class="pt-t">账号管理</h1>
        </div>
      </div>
    </div>
    <div class="body" id="body">
      <div class="pane" id="paneAccount"></div>
    </div>
  </div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/member.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  'use strict';

  var ctx = null, identity = null, ui = null;

  var TYPE_ORDER = ['内置', '预设', '部门模板', '自定义'];
  var ORG_SCOPED = { orgAdmin: 1, counselor: 1, academic: 1, studentAffairs: 1, supervisor: 1, info: 1, majorLead: 1 };
  var COL_GRID_BASE = 'minmax(150px,1.4fr) minmax(106px,1.1fr) minmax(160px,1.7fr) minmax(104px,1.1fr) minmax(82px,0.9fr) minmax(126px,1.3fr) minmax(118px,1.2fr) 62px minmax(102px,1fr) minmax(216px,auto)';
  var COL_GRID = '28px ' + COL_GRID_BASE;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function byId(col, id) { return (ctx[col] || []).find(function (o) { return o.id === id; }); }
  function orgById(id) { return byId('orgs', id); }
  function majorById(id) { return byId('majors', id); }
  function klassById(id) { return byId('klasses', id); }
  function gradeById(id) { return byId('grades', id); }
  function roleById(id) { return byId('roles', id); }

  function reload() {
    ctx = DEMO.getState();
    ui = UI.ui();
    identity = UI.currentIdentity(ctx);
  }

  function audit(action, object, before, after, result, orgId) {
    var rec = DEMO.addAudit(ctx, identity.account.id, action, object, before, after, result);
    if (orgId != null) rec.orgId = orgId;
    DEMO.saveState(ctx);
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  function genId(prefix) {
    return prefix + '-N' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
  }

  function can(code) { return Perm.check(ctx, identity, code, null, null).allowed; }
  function orgDepth(orgId) {
    var m = {}; ctx.orgs.forEach(function (o) { m[o.id] = o; });
    var d = 0, cur = orgId;
    while (cur && m[cur] && m[cur].parentId) { d++; cur = m[cur].parentId; }
    return d;
  }

  /* 当前身份能否管理某个组织（作为主组织维护时的范围覆盖判断） */
  function canManageOrg(oid) {

  /* 所属组织多选：左侧组织树 + 右侧已选（树结构对齐「组织管理」，勾选父节点级联子节点） */
  function orgPickCtx() {
    var nodes = Perm.visibleOrgNodes(ctx, identity, { forAssign: true });
    var byId = {}; nodes.forEach(function (o) { byId[o.id] = o; });
    var children = {};
    nodes.forEach(function (o) {
      if (o.parentId && byId[o.parentId]) (children[o.parentId] = children[o.parentId] || []).push(o.id);
    });
    function sortFn(a, b) { var A = byId[a], B = byId[b]; return (A.sort || 0) - (B.sort || 0) || A.name.localeCompare(B.name); }
    Object.keys(children).forEach(function (pid) { children[pid].sort(sortFn); });
    var roots = nodes.filter(function (o) { return !o.parentId || !byId[o.parentId]; }).sort(sortFn);
    function subtree(oid) {
      var set = new Set();
      Perm.descendants(ctx, oid).forEach(function (d) { if (byId[d]) set.add(d); });
      return Array.from(set);
    }
    return { nodes: nodes, byId: byId, children: children, roots: roots, subtree: subtree };
  }
  function flattenOrgTree(pickCtx) {
    var out = [];
    function walk(oid, depth) { out.push({ id: oid, depth: depth }); (pickCtx.children[oid] || []).forEach(function (c) { walk(c, depth + 1); }); }
    pickCtx.roots.forEach(function (r) { walk(r.id, 0); });
    return out;
  }

  /* ── 新建 / 编辑账号弹窗（方式1：组织、角色分别多选，组合全部生效） ── */
  function openAccountForm(account, assignOnly) {
    editAccount = account;
    var isAdd = !account;
    var canAssign = can('org:account:assign');
    var canCreate = can('account:account:create');
    var isStopped = account && account.status === '停用';
    var basicReadonly = !!assignOnly || isStopped;
    var locked = isStopped || (isAdd ? !canCreate : !canAssign);

    var origAssigns = account ? ctx.assignments.filter(function (x) { return x.accountId === account.id; }) : [];
    var existingCombos = {};

    function computeOrgIds() {
      var set = [];
      origAssigns.forEach(function (a) {
        var ids = (a.scopeOrgIds && a.scopeOrgIds.length) ? a.scopeOrgIds : [Perm.accountMainOrgId(account)];
        ids.forEach(function (oid) { if (oid && set.indexOf(oid) < 0) set.push(oid); });
      });
      if (account) { var m = Perm.accountMainOrgId(account); if (m && set.indexOf(m) < 0) set.push(m); }
      return set;
    }
    function computeRoleIds() {
      var set = [];
      origAssigns.forEach(function (a) { if (a.roleId && set.indexOf(a.roleId) < 0) set.push(a.roleId); });
      return set;
    }
    function computeTeacherScope() {
      var majorIds = [], courseIds = [], classIds = [];
      origAssigns.forEach(function (a) {
        var r = roleById(a.roleId);
        if (!r || r.portal !== 'teacher') return;
        var ts = a.teachingScope || {};
        (ts.majorIds || []).forEach(function (v) { if (majorIds.indexOf(v) < 0) majorIds.push(v); });
        (ts.courseIds || []).forEach(function (v) { if (courseIds.indexOf(v) < 0) courseIds.push(v); });
        (ts.classIds || []).forEach(function (v) { if (classIds.indexOf(v) < 0) classIds.push(v); });
      });
      return { majorIds: majorIds, courseIds: courseIds, classIds: classIds };
    }

    var origOrgIds = computeOrgIds();
    var origRoleIds = computeRoleIds();
    var origTeach = computeTeacherScope();

    origAssigns.forEach(function (a) {
      var ids = (a.scopeOrgIds && a.scopeOrgIds.length) ? a.scopeOrgIds : [Perm.accountMainOrgId(account)];
      ids.forEach(function (oid) { if (oid) existingCombos[oid + '|' + a.roleId] = 1; });
    });

    var mainId = account ? Perm.accountMainOrgId(account) : null;
    var primaryOrgId = (mainId && origOrgIds.indexOf(mainId) >= 0) ? mainId : (origOrgIds[0] || null);
    if (isAdd && viewOrgId && origOrgIds.length === 0) {
      origOrgIds = [viewOrgId];
      primaryOrgId = viewOrgId;
    }

    editDraft = {
      name: account ? account.name : '',
      phone: account ? (account.phone || '') : '',
      orgIds: origOrgIds.slice(),
      primaryOrgId: primaryOrgId,
      roleIds: origRoleIds.slice(),
      majorIds: origTeach.majorIds.slice(),
      courseIds: origTeach.courseIds.slice(),
      classIds: origTeach.classIds.slice()
    };

    function orgScopeSet() {
      var s = new Set();
      editDraft.orgIds.forEach(function (oid) { s.add(oid); Perm.descendants(ctx, oid).forEach(function (d) { s.add(d); }); });
      return s;
    }
    function teachMajorOptions() {
      var scope = orgScopeSet();
      return ctx.majors.filter(function (m) { return scope.has(m.orgId); });
    }
    function teachCourseOptions() {
      return ctx.courses.filter(function (c) { return editDraft.majorIds.indexOf(c.majorId) >= 0; });
    }
    function newComboSet() {
      if (isAdd) return new Set();
      var s = new Set();
      editDraft.orgIds.forEach(function (oid) {
        editDraft.roleIds.forEach(function (rid) { if (!existingCombos[oid + '|' + rid]) s.add(oid + '|' + rid); });
      });
      return s;
    }
    function pruneTeaching() {
      var validMajors = {};
      teachMajorOptions().forEach(function (m) { validMajors[m.id] = 1; });
      var m0 = editDraft.majorIds.length;
      editDraft.majorIds = editDraft.majorIds.filter(function (id) { return validMajors[id]; });
      var c0 = editDraft.courseIds.length;
      editDraft.courseIds = editDraft.courseIds.filter(function (cid) {
        var c = byId('courses', cid);
        return c && validMajors[c.majorId];
      });
      return { majors: m0 - editDraft.majorIds.length, courses: c0 - editDraft.courseIds.length };
    }

    function tryRemoveOrg(oid) {
      if (editDraft.primaryOrgId === oid) {
        err.textContent = editDraft.orgIds.length > 1 ? '请先把主组织设到其他组织' : '请至少选择一个组织';
        return false;
      }
      editDraft.orgIds = editDraft.orgIds.filter(function (x) { return x !== oid; });
      var pruned = pruneTeaching();
      if (pruned.majors || pruned.courses) toast('已移除 ' + (pruned.majors + pruned.courses) + ' 个不在所选组织内的专业 / 课程');
      return true;
    }
    function orgSectionHtml() {
      var tree = flattenOrgTree(orgPickCtx()).map(function (n) {
        var o = orgById(n.id);
        var checked = editDraft.orgIds.indexOf(n.id) >= 0;
        var ro = !canManageOrg(n.id);
        var disabled = locked || ro;
        return '<label class="otp-org' + (disabled ? ' dis' : '') + '"'
          + (ro ? ' title="不在您的范围内"' : '') + '>'
          + '<input type="checkbox" data-orgchk="' + esc(n.id) + '"'
          + (checked ? ' checked' : '') + (disabled ? ' disabled' : '') + '>'
          + '<span class="otp-name">' + indent(n.depth) + esc(o ? o.name : n.id) + '</span></label>';
      }).join('');
      var chips = editDraft.orgIds.map(function (oid) {
        var o = orgById(oid); var name = o ? o.name : oid;
        var ro = !canManageOrg(oid);
        var isPrimary = editDraft.primaryOrgId === oid;
        var single = editDraft.orgIds.length === 1;
        if (locked || ro) {
          return '<div class="org-sel-item' + (ro ? ' ro' : '') + '"' + (ro ? ' title="不在您的范围内"' : '') + '>'
            + '<span class="org-sel-name">' + esc(name) + '</span>'
            + '<span class="org-sel-acts">' + (isPrimary ? '<span class="rtag-main">主</span>' : '') + '</span></div>';
        }
        return '<div class="org-sel-item">'
          + '<span class="org-sel-name">' + esc(name) + '</span>'
          + '<span class="org-sel-acts">'
          + '<label class="rtag-primary" title="设为主组织"><input type="radio" name="primaryOrg" value="' + esc(oid) + '"'
          + (isPrimary ? ' checked' : '') + (single ? ' disabled' : '') + '> 主</label>'
          + '<button type="button" class="rtag-x" data-del="org" data-id="' + esc(oid) + '" aria-label="移除">×</button>'
          + '</span></div>';
      }).join('');
      return '<div class="org-pick-layout">'
        + '<div class="org-pick-col"><div class="org-pick-title">组织树</div><div class="part-tree">' + tree + '</div></div>'
        + '<div class="org-pick-col"><div class="org-pick-title">已选组织</div><div class="org-sel">'
        + (chips || '<span class="ro-note">尚未选择组织</span>') + '</div></div>'
        + '</div>';
    }
    function roleSectionHtml() {
      var tags = editDraft.roleIds.map(function (rid) {
        var r = roleById(rid);
        var inner = '<span class="rtag">' + esc(r ? r.name : rid);
        if (!locked) inner += '<button type="button" class="rtag-x" data-del="role" data-id="' + esc(rid) + '" aria-label="移除">×</button>';
        return inner + '</span>';
      }).join('');
      var add = '';
      if (!locked) {
        var opts = '';
        PORTAL_ORDER.forEach(function (p) {
          var roles = ctx.roles.filter(function (r) { return r.portal === p && r.status === '启用'; });
          if (!roles.length) return;
          opts += '<optgroup label="' + esc(portalCn(p)) + '">';
          roles.forEach(function (r) {
            var on = editDraft.roleIds.indexOf(r.id) >= 0;
            opts += '<option value="' + esc(r.id) + '"' + (on ? ' disabled' : '') + '>' + esc(r.name) + '</option>';
          });
          opts += '</optgroup>';
        });
        add = '<select class="addsel" data-kind="role"><option value="">＋ 添加角色</option>' + opts + '</select>';
      }
      return tags + add;
    }
    function teachSectionHtml() {
      if (!hasPortal('teacher')) return '';
      if (locked) {
        var mt = editDraft.majorIds.map(function (id) { var m = majorById(id); return '<span class="rtag">' + esc(m ? m.name : id) + '</span>'; }).join('');
        var ct = editDraft.courseIds.map(function (id) { var c = byId('courses', id); return '<span class="rtag">' + esc(c ? c.name : id) + '</span>'; }).join('');
        return '<div class="sec-h">任教信息</div>'
          + '<div class="orgrow-pick"><span class="field-label">专业</span><div class="pick-body"><span class="role-tags">' + mt + '</span></div></div>'
          + '<div class="orgrow-pick"><span class="field-label">课程</span><div class="pick-body"><span class="role-tags">' + ct + '</span></div></div>';
      }
      var majorOpts = teachMajorOptions().filter(function (m) { return editDraft.majorIds.indexOf(m.id) < 0; })
        .map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>'; }).join('');
      var courseOpts = teachCourseOptions().filter(function (c) { return editDraft.courseIds.indexOf(c.id) < 0; })
        .map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('');
      var majorTags = editDraft.majorIds.map(function (id) {
        var m = majorById(id);
        return '<span class="rtag">' + esc(m ? m.name : id) + '<button type="button" class="rtag-x" data-del="major" data-id="' + esc(id) + '" aria-label="移除">×</button></span>';
      }).join('');
      var courseTags = editDraft.courseIds.map(function (id) {
        var c = byId('courses', id);
        return '<span class="rtag">' + esc(c ? c.name : id) + '<button type="button" class="rtag-x" data-del="course" data-id="' + esc(id) + '" aria-label="移除">×</button></span>';
      }).join('');
      return '<div class="sec-h">任教信息（选填）</div>'
        + '<div class="orgrow-pick"><span class="field-label">专业</span><div class="pick-body"><span class="role-tags">' + majorTags + '</span><select class="addsel" data-kind="major"><option value="">＋ 添加专业</option>' + majorOpts + '</select></div></div>'
        + '<div class="orgrow-pick"><span class="field-label">课程</span><div class="pick-body"><span class="role-tags">' + courseTags + '</span><select class="addsel" data-kind="course"><option value="">＋ 添加课程</option>' + courseOpts + '</select></div></div>';
    }
    function warnBannerHtml() {
      if (isAdd || newComboSet().size === 0) return '';
      return '<div class="warn-banner">保存后，每个角色将在所有所选组织生效，可能扩大该账号的权限。</div>';
    }
    function refreshDynamics() {
      var el;
      if ((el = dlg.querySelector('#orgSec'))) el.innerHTML = orgSectionHtml();
      if ((el = dlg.querySelector('#roleSec'))) el.innerHTML = roleSectionHtml();
      if ((el = dlg.querySelector('#teachSec'))) el.innerHTML = teachSectionHtml();
      if ((el = dlg.querySelector('#warnSec'))) el.innerHTML = warnBannerHtml();
    }

    var title = isAdd ? '新增账号' : (assignOnly ? '分配角色' : '编辑账号');
    var dlg = openDialog('<form style="max-height:88vh;overflow-y:auto">'
      + '<div class="aidlg-h"><h2>' + esc(title) + (account ? ' · ' + esc(account.name) : '') + '</h2>'
      + '<button type="button" class="x" data-x aria-label="关闭">×</button></div>'
      + (isStopped ? '<div class="note" style="color:var(--crit);font-weight:600">账号已停用，分配已失效</div>' : '')
      + '<label>姓名<input name="name" value="' + esc(editDraft.name) + '"' + (basicReadonly ? ' disabled' : '') + '></label>'
      + '<label>手机号<input name="phone" value="' + esc(editDraft.phone) + '" placeholder="11 位手机号"' + (basicReadonly ? ' disabled' : '') + '></label>'
      + '<div class="sec-h">所属组织 <span style="color:var(--crit)">*</span></div><div id="orgSec">' + orgSectionHtml() + '</div>'
      + '<div class="sec-h">角色 <span style="color:var(--crit)">*</span></div><div id="roleSec">' + roleSectionHtml() + '</div>'
      + '<div id="teachSec">' + teachSectionHtml() + '</div>'
      + '<div id="warnSec">' + warnBannerHtml() + '</div>'
      + '<div class="note" id="formErr" style="color:var(--crit)"></div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button>'
      + (isStopped ? '' : '<button type="submit" class="btn">保存</button>')
      + '</div>'
      + '</form>');
    dlg.style.width = 'min(720px, calc(100vw - 32px))';

    var err = dlg.querySelector('#formErr');
    Array.prototype.forEach.call(dlg.querySelectorAll('[data-x]'), function (b) { b.addEventListener('click', function () { dlg.close(); }); });

    dlg.addEventListener('change', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute) return;
      if (el.name === 'primaryOrg') {
        if (el.value && editDraft.orgIds.indexOf(el.value) >= 0) editDraft.primaryOrgId = el.value;
        refreshDynamics();
        return;
      }
      var chk = el.getAttribute('data-orgchk');
      if (chk != null) {
        if (el.checked) {
          if (editDraft.orgIds.indexOf(chk) < 0) {
            editDraft.orgIds.push(chk);
            if (!editDraft.primaryOrgId) editDraft.primaryOrgId = chk;
          }
        } else {
          tryRemoveOrg(chk);
        }
        refreshDynamics();
        return;
      }
      var kind = el.getAttribute('data-kind');
      if (!kind) return;
      var vid = el.value;
      if (!vid) return;
      if (kind === 'role') {
        if (editDraft.roleIds.indexOf(vid) < 0) editDraft.roleIds.push(vid);
      } else if (kind === 'major') {
        if (editDraft.majorIds.indexOf(vid) < 0) editDraft.majorIds.push(vid);
      } else if (kind === 'course') {
        if (editDraft.courseIds.indexOf(vid) < 0) editDraft.courseIds.push(vid);
      }
      refreshDynamics();
    });

    dlg.addEventListener('click', function (e) {
      var del = e.target.closest('[data-del]');
      if (!del) return;
      var kind = del.getAttribute('data-del');
      var id = del.getAttribute('data-id');
      if (kind === 'role') {
        var r = roleById(id);
        var teacherIds = editDraft.roleIds.filter(function (x) { var rr = roleById(x); return rr && rr.portal === 'teacher'; });
        if (r && r.portal === 'teacher' && teacherIds.length === 1 && (editDraft.majorIds.length || editDraft.courseIds.length)) {
          if (!confirm('移除教师端角色将清空任教信息，是否继续？')) return;
          editDraft.majorIds = [];
          editDraft.courseIds = [];
        }
        editDraft.roleIds = editDraft.roleIds.filter(function (x) { return x !== id; });
      } else if (kind === 'org') {
        tryRemoveOrg(id);
      } else if (kind === 'major') {
        editDraft.majorIds = editDraft.majorIds.filter(function (x) { return x !== id; });
        editDraft.courseIds = editDraft.courseIds.filter(function (cid) { var c = byId('courses', cid); return !(c && c.majorId === id); });
      } else if (kind === 'course') {
        editDraft.courseIds = editDraft.courseIds.filter(function (x) { return x !== id; });
      }
      refreshDynamics();
    });

    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (isStopped) return;
      var name = basicReadonly ? editDraft.name : dlg.querySelector('[name=name]').value.trim();
      var phone = basicReadonly ? editDraft.phone : dlg.querySelector('[name=phone]').value.trim();
      if (!name) { err.textContent = '姓名不能为空'; return; }

      if (!locked) {
        if (!editDraft.orgIds.length) { err.textContent = '请至少选择一个组织'; return; }
        if (!editDraft.roleIds.length) { err.textContent = '请至少选择一个角色'; return; }
        if (!editDraft.primaryOrgId) { err.textContent = '必须有一个主组织'; return; }
      }

      var granteeId = editAccount ? editAccount.id : genId('ACC');
      if (granteeId === identity.account.id) { err.textContent = '不能给自己分配角色'; return; }

      var operator = identity.account ? identity.account.name : '系统';
      var now = new Date();
      var stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0')
        + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      var newAssigns = [];
      if (!locked) {
        editDraft.roleIds.forEach(function (rid) {
          var orig = origAssigns.find(function (o) { return o.roleId === rid; });
          var a = orig ? cloneAssign(orig) : emptyAssign();
          var r = roleById(rid);
          a.roleId = rid;
          a.scopeOrgIds = editDraft.orgIds.slice();
          if (r && r.portal === 'teacher') {
            a.teachingScope.majorIds = editDraft.majorIds.slice();
            a.teachingScope.courseIds = editDraft.courseIds.slice();
          }
          newAssigns.push(a);
        });
        for (var q = 0; q < newAssigns.length; q++) {
          var res = Perm.canDelegate(ctx, identity, granteeId, newAssigns[q]);
          if (!res.ok) { err.textContent = res.reason; return; }
        }
      }

      function applyAssignments() {
        ctx.assignments = ctx.assignments.filter(function (x) { return x.accountId !== editAccount.id; });
        newAssigns.forEach(function (a) { ctx.assignments.push(makeAssign(a.id || genId('A'), editAccount.id, a)); });
      }
      function snapOrgRoles(oids, rids, poid) {
        return { orgs: orgNamesList(oids), roles: roleNamesList(rids), primaryOrg: poid ? orgName(poid) : null };
      }
      function beforeSnap() {
        return snapOrgRoles(origOrgIds, origRoleIds, account ? Perm.accountMainOrgId(account) : null);
      }
      function afterSnap() {
        if (locked) return beforeSnap();
        return snapOrgRoles(editDraft.orgIds, editDraft.roleIds, editDraft.primaryOrgId);
      }

      var primaryOrgId = locked ? (account ? Perm.accountMainOrgId(account) : null) : editDraft.primaryOrgId;
      var firstRole = (!locked && editDraft.roleIds.length) ? roleById(editDraft.roleIds[0]) : null;
      var kind = firstRole ? kindForRole(firstRole) : (account ? account.kind : '管理员');

      if (assignOnly) {
        var bsnap = beforeSnap();
        if (!locked) applyAssignments();
        var asnap = afterSnap();
        audit('调整角色分配', editAccount.name, bsnap, asnap, '成功', editAccount.orgId);
        toast('已保存「' + editAccount.name + '」的角色分配');
      } else if (isAdd) {
        var newAcc = { id: granteeId, name: name, orgId: primaryOrgId,
          partOrgIds: editDraft.orgIds.filter(function (x) { return x !== primaryOrgId; }),
          kind: kind, status: '正常', studentId: null, phone: phone || null, lastLoginAt: null,
          createdAt: stamp, createdBy: operator, updatedAt: stamp, updatedBy: operator };
        ctx.accounts.push(newAcc);
        if (!locked) newAssigns.forEach(function (a) { ctx.assignments.push(makeAssign(genId('A'), granteeId, a)); });
        audit('新增账号', name, null, { id: granteeId, orgId: primaryOrgId, kind: kind, phone: phone || null, orgs: orgNamesList(editDraft.orgIds), roles: roleNamesList(editDraft.roleIds) }, '成功', primaryOrgId);
        toast('已新增账号「' + name + '」');
      } else {
        var bsnap2 = beforeSnap();
        editAccount.name = name;
        editAccount.phone = phone || null;
        if (!locked) {
          editAccount.orgId = primaryOrgId;
          editAccount.partOrgIds = editDraft.orgIds.filter(function (x) { return x !== primaryOrgId; });
          delete editAccount.orgIds;
          editAccount.kind = kind;
        }
        editAccount.updatedAt = stamp;
        editAccount.updatedBy = operator;
        if (!locked) applyAssignments();
        var asnap2 = afterSnap();
        audit('编辑账号与角色分配', name, bsnap2, asnap2, '成功', editAccount.orgId);
        toast('已保存「' + name + '」');
      }
      dlg.close();
      render();
    });

    dlg.addEventListener('close', function () { dlg.remove(); });
  }
  function toggleStatus(a) {
    var before = { status: a.status };
    a.status = a.status === '停用' ? '正常' : '停用';
    audit(a.status === '正常' ? '启用账号' : '停用账号', a.name, before, { status: a.status }, '成功', a.orgId);
    toast((a.status === '正常' ? '已启用' : '已停用') + '「' + a.name + '」');
    render();
  }
  function resetPassword(a) {
    audit('重置密码', a.name, null, { passwordReset: true }, '成功', a.orgId);
    toast('已重置「' + a.name + '」的密码');
  }

  /* 账号详情（只读抽屉） */
  function openAccountDetail(a) {
    var idn = accountIdentity(a);
    function j(arr) { return arr.length ? arr.join('、') : '—'; }
    var stu = a.studentId ? byId('students', a.studentId) : null;

      + kv('账号编号', a.id)
      + kv('姓名', a.name)
      + kv('登录账号', a.id)

      + kv('账号类型', a.kind)
      + kv('最近登录时间', a.lastLoginAt || '—')
      + '</div>'
      + '<div class="sec-h detail-sec">身份信息</div>'
      + '<div class="kv2">'
      + kv('所属组织', accountOrgNames(a))
      + orgRoleDetailHtml(a)
      + kv('所属专业', j(idn.majors))
      + kv('所属年级', j(idn.grades))
      + kv('所属班级', j(idn.klasses))
      + kv('可授课程', j(idn.courses))
      + kv('状态', a.status)
      + kv('身份绑定', stu ? ('学生 · ' + stu.name) : '—')
      + '</div>'
      + '<div class="sec-h detail-sec">系统信息</div>'
      + '<div class="kv2">'
      + kv('创建人', a.createdBy || '—')
      + kv('创建时间', a.createdAt || '—')
      + kv('最近修改人', a.updatedBy || '—')
      + kv('最近修改时间', a.updatedAt || '—')

    dlg.querySelector('[data-x]').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  /* ── 弹层 ── */
  function openDialog(html) {
    var dlg = document.createElement('dialog');
    dlg.className = 'aidlg';
    dlg.innerHTML = html;
    document.body.appendChild(dlg);
    dlg.showModal();
    return dlg;
  }

  /* ── 成员批量操作 ── */
  /* 选人弹窗：角色 / 专业 / 组织 筛选选项 */
  function memberFilterOpts(role, major, org) {
    var roleOpts = ctx.roles.map(function (r) {
      return '<option value="' + esc(r.id) + '"' + (role === r.id ? ' selected' : '') + '>' + esc(r.name) + '</option>';
    }).join('');
    var majorSet = {};
    ctx.accounts.forEach(function (a) { accountIdentity(a).majors.forEach(function (m) { majorSet[m] = 1; }); });
    var majorOpts = Object.keys(majorSet).map(function (m) {
      return '<option value="' + esc(m) + '"' + (major === m ? ' selected' : '') + '>' + esc(m) + '</option>';
    }).join('');
    var orgOpts = flattenOrgTree(orgPickCtx()).map(function (n) {
      var o = orgById(n.id);
      return '<option value="' + esc(n.id) + '"' + (org === n.id ? ' selected' : '') + '>' + indent(n.depth) + esc(o ? o.name : n.id) + '</option>';
    }).join('');
    return {
      role: '<option value="">全部角色</option>' + roleOpts,
      major: '<option value="">全部专业</option>' + majorOpts,
      org: '<option value="">全部组织</option>' + orgOpts
    };
  }
  /* 选人弹窗：按角色 / 专业 / 组织过滤（搜索 q 由各弹窗单独处理） */
  function memberMatchExtra(a, role, major, org) {
    if (role && !ctx.assignments.some(function (x) { return x.accountId === a.id && x.roleId === role; })) return false;
    if (major && accountIdentity(a).majors.indexOf(major) < 0) return false;
    if (org) {
      var tree = Perm.descendants(ctx, org);
      if (!Perm.accountOrgIds(ctx, a).some(function (oid) { return tree.has(oid); })) return false;
    }
    return true;
  }
  /* 选人弹窗：成员关键信息（所属组织 / 角色 / 所属专业） */
  function memberKeyInfo(a) {
    return {
      orgs: accountOrgNames(a),
      roles: roleNamesList(accountRoleIds(a)).join('、') || '—',
      majors: accountIdentity(a).majors.join('、') || '—'
    };
  }

  function selectedAccounts() {
    return ctx.accounts.filter(function (a) { return selectedIds[a.id]; });
  }

  function confirmDialog(title, bodyHtml, onOk) {
    var dlg = openDialog('<form><h2>' + esc(title) + '</h2><div class="note">' + bodyHtml + '</div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">确定</button></div></form>');
    dlg.querySelector('[data-x]').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('submit', function (ev) { ev.preventDefault(); dlg.close(); onOk(); });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  function showBatchResult(title, okCount, skipped) {
    var list = skipped.length
      ? '<div class="sec-h">跳过原因</div><div>' + skipped.map(function (s) { return '<div style="padding:3px 0">' + esc(s.name) + '：' + esc(s.reason) + '</div>'; }).join('') + '</div>'
      : '';
    var dlg = openDialog('<form><h2>' + esc(title) + '完成</h2>'
      + '<div class="note">成功 ' + okCount + ' 人，跳过 ' + skipped.length + ' 人' + (list ? '，跳过原因如下：' : '') + '</div>'
      + list
      + '<div class="acts"><button type="submit" class="btn">知道了</button></div></form>');
    dlg.addEventListener('submit', function (ev) { ev.preventDefault(); dlg.close(); });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  function openBatchOrg(mode, fromMember) {
    if (mode === 'remove') return openBatchRemoveOrg();
    return openBatchAddOrg(fromMember);
  }

  /* 移出组织 */
  function openBatchRemoveOrg() {
    var targets = selectedAccounts();
    if (!targets.length) { toast('请先勾选要操作的成员'); return; }
    var optNodes = flattenOrgTree(orgPickCtx());
    function optsHtml(selId) {
      return optNodes.map(function (n) {
        var o = orgById(n.id);
        return '<option value="' + esc(n.id) + '"' + (n.id === selId ? ' selected' : '') + '>' + indent(n.depth) + esc(o ? o.name : n.id) + '</option>';
      }).join('');
    }
    var dlg = openDialog('<form style="max-height:88vh;overflow-y:auto">'
      + '<div class="aidlg-h"><h2>移出组织</h2><button type="button" class="x" data-x aria-label="关闭">×</button></div>'
      + '<label style="display:block;margin-bottom:4px">移出组织<select name="org">' + optsHtml(viewOrgId) + '</select></label>'
      + '<div class="sec-h">已选成员（' + targets.length + ' 人）</div>'
      + '<div id="rmPreview"></div>'
      + '<div class="note" id="rmErr" style="color:var(--crit)"></div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">确认移出</button></div>'
      + '</form>');
    dlg.style.width = 'min(560px, calc(100vw - 32px))';
    var preview = dlg.querySelector('#rmPreview');
    var errEl = dlg.querySelector('#rmErr');
    var orgSel = dlg.querySelector('[name=org]');
    function refreshPreview() {
      var oid = orgSel.value;
      var okCount = 0;
      var html = targets.map(function (a) {
        var r = Member.canRemoveOrg(ctx, a, oid);
        if (r.ok) { okCount++; return '<div style="padding:4px 0">' + esc(a.name) + ' <span class="pill good">可移出</span></div>'; }
        return '<div style="padding:4px 0">' + esc(a.name) + ' <span class="pill warn">跳过</span> ' + esc(r.reason) + '</div>';
      }).join('');
      preview.innerHTML = html || '<span class="ro-note">无成员</span>';
      return okCount;
    }
    refreshPreview();
    orgSel.addEventListener('change', refreshPreview);
    Array.prototype.forEach.call(dlg.querySelectorAll('[data-x]'), function (b) { b.addEventListener('click', function () { dlg.close(); }); });
    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var oid = orgSel.value;
      var ok = [], skipped = [];
      targets.forEach(function (a) {
        var r = Member.canRemoveOrg(ctx, a, oid);
        if (!r.ok) { skipped.push({ name: a.name, reason: r.reason }); return; }
        ok.push(a);
      });
      if (!ok.length) { errEl.textContent = '没有可移出的成员'; return; }
      dlg.close();
      var okIds = ok.map(function (a) { return a.id; });
      confirmDialog('确认移出', '移出后，所选成员的角色在该组织不再生效，在其他组织不受影响。', function () {
        ok.forEach(function (a) {
          var before = Member.memberOrgIds(ctx, a).map(orgName);
          Member.removeOrg(ctx, a, oid);
          var after = Member.memberOrgIds(ctx, a).map(orgName);
          audit('移出组织成员', a.name, { 所属组织: before }, { 所属组织: after }, '成功', oid);
        });
        okIds.forEach(function (id) { delete selectedIds[id]; });
        showBatchResult('移出组织', ok.length, skipped);
        render();
      });
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
  }

  /* 加入组织（fromMember = 从「添加成员到 X」入口进入：搜索选人，可新建账号） */
  function openBatchAddOrg(fromMember) {
    var pickCtx = orgPickCtx();
    var canCreate = can('account:account:create');
    var meId = identity.account.id;
    var draft = {
      orgIds: (fromMember && viewOrgId) ? [viewOrgId] : [],
      roleIds: [],
      accountIds: fromMember ? [] : Object.keys(selectedIds),
      newAccounts: []
    };
    var searchQ = '';
    var filterRole = '', filterMajor = '', filterOrg = '';
    function byAccountId(id) { return ctx.accounts.find(function (a) { return a.id === id; }); }
    function enabledAccounts() { return ctx.accounts.filter(function (a) { return a.status === '正常'; }); }

    var dlg = openDialog('<form style="max-height:88vh;overflow-y:auto">'
      + '<div class="aidlg-h"><h2>加入组织</h2><button type="button" class="x" data-x aria-label="关闭">×</button></div>'
      + '<div id="baSearch"></div>'
      + '<div id="baBody"></div>'
      + '<div class="note" id="baErr" style="color:var(--crit)"></div>'
      + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">确认加入</button></div>'
      + '</form>');
    dlg.style.width = 'min(900px, calc(100vw - 32px))';
    var errEl = dlg.querySelector('#baErr');
    var searchEl = dlg.querySelector('#baSearch');
    var bodyEl = dlg.querySelector('#baBody');

    function orgTreeHtml() {
      return flattenOrgTree(pickCtx).map(function (n) {
        var o = orgById(n.id);
        var checked = draft.orgIds.indexOf(n.id) >= 0;
        return '<label class="otp-org"><input type="checkbox" data-borg="' + esc(n.id) + '"' + (checked ? ' checked' : '') + '>'
          + '<span class="otp-name">' + indent(n.depth) + esc(o ? o.name : n.id) + '</span></label>';
      }).join('');
    }
    function rolePickHtml() {
      var opts = '';
      PORTAL_ORDER.forEach(function (p) {
        var roles = ctx.roles.filter(function (r) { return r.portal === p && r.status === '启用'; });
        if (!roles.length) return;
        opts += '<optgroup label="' + esc(portalCn(p)) + '">';
        roles.forEach(function (r) { opts += '<option value="' + esc(r.id) + '">' + esc(r.name) + '</option>'; });
        opts += '</optgroup>';
      });
      var tags = draft.roleIds.map(function (rid) {
        return '<span class="rtag">' + esc(roleName(rid)) + '<button type="button" class="rtag-x" data-bdel-role="' + esc(rid) + '" aria-label="移除">×</button></span>';
      }).join('');
      return '<div class="orgrow-pick"><span class="field-label">同时新增角色（选填）</span>'
        + '<div class="pick-body"><span class="role-tags">' + tags + '</span>'
        + '<select class="addsel" data-baddrole="1"><option value="">＋ 添加角色</option>' + opts + '</select></div></div>';
    }
    function previewLine(name, a) {
      var curRoles = Member.accountRoleIds(ctx, a);
      var addRoles = draft.roleIds.filter(function (rid) { return curRoles.indexOf(rid) < 0; });
      var adminNew = draft.roleIds.filter(function (rid) { var r = roleById(rid); return r && r.portal === 'admin'; });
      var html = '<div style="padding:4px 0;border-bottom:1px solid var(--rule)"><b>' + esc(name) + '</b>：'
        + '加入后，已有角色 ' + (curRoles.length ? curRoles.map(roleName).join('、') : '无') + ' 将在新组织生效';
      if (addRoles.length) html += '；新增角色 ' + addRoles.map(roleName).join('、') + ' 将在其全部所属组织生效';
      if (adminNew.length) html += '<div class="warn-banner" style="margin-top:5px">该成员的管理端角色将对新组织生效，请确认</div>';
      return html + '</div>';
    }
    function previewHtml() {
      if (!draft.orgIds.length) return '<span class="ro-note">请先选择组织</span>';
      if (!draft.accountIds.length && !draft.newAccounts.length) return '<span class="ro-note">请选择要加入的成员</span>';
      var lines = [];
      draft.accountIds.forEach(function (aid) { var a = byAccountId(aid); if (a) lines.push(previewLine(a.name, a)); });
      draft.newAccounts.forEach(function (n) {
        lines.push('<div style="padding:4px 0"><b>' + esc(n.name) + '（新账号）</b>：新建后加入所选组织' + (draft.roleIds.length ? '，并赋予所选角色' : '') + '</div>');
      });
      return lines.join('');
    }
    function renderBody() {
      bodyEl.innerHTML = '<div class="orgrow-pick"><span class="field-label">加入组织（多选）<span class="req">*</span></span>'
        + '<div class="part-tree">' + orgTreeHtml() + '</div></div>'
        + rolePickHtml()
        + '<div class="sec-h">效果预览</div><div>' + previewHtml() + '</div>';
    }
    function searchListHtml() {
      var q = searchQ.trim().toLowerCase();
      var list = enabledAccounts().filter(function (a) {
        if (q && a.name.toLowerCase().indexOf(q) < 0 && a.id.toLowerCase().indexOf(q) < 0) return false;
        if (!memberMatchExtra(a, filterRole, filterMajor, filterOrg)) return false;
        return true;
      });
      var rows = list.map(function (a) {
        var inOrg = draft.orgIds.some(function (oid) { return Member.memberOrgIds(ctx, a).indexOf(oid) >= 0; });
        var isMe = a.id === meId;
        var dis = inOrg || isMe;
        var checked = draft.accountIds.indexOf(a.id) >= 0;
        var info = memberKeyInfo(a);
        return '<tr' + (dis ? ' class="dis"' : '') + '>'
          + '<td class="mchk"><input type="checkbox" data-bacct="' + esc(a.id) + '"' + (checked ? ' checked' : '') + (dis ? ' disabled' : '') + '></td>'
          + '<td class="mname">' + esc(a.name)
          + (inOrg ? ' <span class="rtag ro">已在本组织</span>' : '')
          + (isMe ? ' <span class="rtag ro">本人</span>' : '') + '</td>'
          + '<td class="msub">' + esc(a.id) + '</td>'
          + '<td>' + esc(info.orgs) + '</td>'
          + '<td>' + esc(info.roles) + '</td>'
          + '<td>' + esc(info.majors) + '</td>'
          + '</tr>';
      }).join('');
      if (!rows) return '<span class="ro-note">无匹配账号</span>';
      return '<table class="mem-table"><thead><tr>'
        + '<th class="mchk"></th><th>姓名</th><th>账号</th><th>所属组织</th><th>角色</th><th>所属专业</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table>';
    }
    function renderNewAccts() {
      var el = dlg.querySelector('#newAcctList');
      if (!el) return;
      el.innerHTML = draft.newAccounts.map(function (n, i) {
        return '<div style="padding:3px 0;display:flex;align-items:center;gap:6px">'
          + '<span>' + esc(n.name) + (n.phone ? ' · ' + maskPhone(n.phone) : '') + '（新账号）</span>'
          + '<button type="button" class="rtag-x" data-bdel-new="' + i + '" aria-label="移除">×</button></div>';
      }).join('');
    }
    function renderSearch() {
      if (!fromMember) {
        searchEl.innerHTML = '<div class="sec-h">已选成员（' + draft.accountIds.length + ' 人）</div>'
          + '<div class="ro-note">来自列表勾选，关闭弹窗后可重新勾选调整</div>';
        return;
      }
      var fopts = memberFilterOpts(filterRole, filterMajor, filterOrg);
      searchEl.innerHTML = '<div class="orgrow-pick"><span class="field-label">选择成员（可搜索全校账号）</span>'
        + '<div class="ba-filter">'
        + '<input class="f-search" data-bsearch placeholder="搜索姓名 / 账号">'
        + '<select data-barole aria-label="角色筛选">' + fopts.role + '</select>'
        + '<select data-bamajor aria-label="专业筛选">' + fopts.major + '</select>'
        + '<select data-baorg aria-label="组织筛选">' + fopts.org + '</select>'
        + '</div>'
        + '<div class="mem-list" id="baSearchList">' + searchListHtml() + '</div>'
        + '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'
        + (canCreate ? '<button type="button" class="btn-s" data-bnew="1">+ 新建账号</button>' : '<span class="ro-note">找不到此人？请联系账号管理员创建账号</span>')
        + '</div><div id="newAcctList"></div></div>';
      renderNewAccts();
    }

    renderSearch();
    renderBody();

    function openNewAccountForm() {
      var nd = openDialog('<form><h2>新建账号</h2>'
        + '<label style="display:block;margin-bottom:6px">姓名<input name="name" required></label>'
        + '<label style="display:block;margin-bottom:6px">手机号<input name="phone" placeholder="11 位手机号"></label>'
        + '<div class="note" id="nErr" style="color:var(--crit)"></div>'
        + '<div class="acts"><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn">确定</button></div></form>');
      var nErr = nd.querySelector('#nErr');
      nd.querySelector('[data-x]').addEventListener('click', function () { nd.close(); });
      nd.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var name = nd.querySelector('[name=name]').value.trim();
        var phone = nd.querySelector('[name=phone]').value.trim();
        if (!name) { nErr.textContent = '姓名不能为空'; return; }
        var existing = phone ? ctx.accounts.find(function (a) { return a.phone && a.phone === phone; }) : null;
        if (existing) {
          if (draft.accountIds.indexOf(existing.id) < 0) draft.accountIds.push(existing.id);
        } else {
          draft.newAccounts.push({ name: name, phone: phone || null });
        }
        nd.close();
        renderSearch();
        renderBody();
      });
      nd.addEventListener('close', function () { nd.remove(); });
    }

    dlg.addEventListener('change', function (e) {
      var fr = e.target.closest('[data-barole]');
      var fm = e.target.closest('[data-bamajor]');
      var fo = e.target.closest('[data-baorg]');
      if (fr || fm || fo) {
        filterRole = fr ? fr.value : filterRole;
        filterMajor = fm ? fm.value : filterMajor;
        filterOrg = fo ? fo.value : filterOrg;
        var fl = dlg.querySelector('#baSearchList'); if (fl) fl.innerHTML = searchListHtml();
        return;
      }
      var org = e.target.closest('[data-borg]');
      if (org) {
        var oid = org.getAttribute('data-borg');
        var i = draft.orgIds.indexOf(oid);
        if (org.checked) { if (i < 0) draft.orgIds.push(oid); }
        else if (i >= 0) draft.orgIds.splice(i, 1);
        renderBody();
        if (fromMember) { var list = dlg.querySelector('#baSearchList'); if (list) list.innerHTML = searchListHtml(); }
        return;
      }
      var acct = e.target.closest('[data-bacct]');
      if (acct) {
        var aid = acct.getAttribute('data-bacct');
        var j = draft.accountIds.indexOf(aid);
        if (acct.checked) { if (j < 0) draft.accountIds.push(aid); }
        else if (j >= 0) draft.accountIds.splice(j, 1);
        var list2 = dlg.querySelector('#baSearchList'); if (list2) list2.innerHTML = searchListHtml();
        renderBody();
        return;
      }
      var addRole = e.target.closest('[data-baddrole]');
      if (addRole && addRole.value) {
        if (draft.roleIds.indexOf(addRole.value) < 0) draft.roleIds.push(addRole.value);
        addRole.value = '';
        renderBody();
      }
    });
    dlg.addEventListener('input', function (e) {
      if (e.target && e.target.getAttribute('data-bsearch') != null) {
        searchQ = e.target.value;
        var list = dlg.querySelector('#baSearchList');
        if (list) list.innerHTML = searchListHtml();
      }
    });
    dlg.addEventListener('click', function (e) {
      var delRole = e.target.closest('[data-bdel-role]');
      if (delRole) {
        var rid = delRole.getAttribute('data-bdel-role');
        var i = draft.roleIds.indexOf(rid);
        if (i >= 0) draft.roleIds.splice(i, 1);
        renderBody();
        return;
      }
      var delNew = e.target.closest('[data-bdel-new]');
      if (delNew) {
        var idx = parseInt(delNew.getAttribute('data-bdel-new'), 10);
        draft.newAccounts.splice(idx, 1);
        renderNewAccts();
        renderBody();
        return;
      }
      var bnew = e.target.closest('[data-bnew]');
      if (bnew) { openNewAccountForm(); return; }
      if (e.target.closest('[data-x]')) dlg.close();
    });
    dlg.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!draft.orgIds.length) { errEl.textContent = '请至少选择一个组织'; return; }
      if (!draft.accountIds.length && !draft.newAccounts.length) { errEl.textContent = '请选择要加入的成员'; return; }
      if (draft.newAccounts.length && !draft.roleIds.length) { errEl.textContent = '新建账号需至少选择一个角色'; return; }
      doSave();
    });
    dlg.addEventListener('close', function () { dlg.remove(); });

    function doSave() {
      var ok = [], skipped = [];
      draft.accountIds.forEach(function (aid) {
        var a = byAccountId(aid);
        if (!a) { skipped.push({ name: aid, reason: '账号不存在' }); return; }
        if (a.status !== '正常') { skipped.push({ name: a.name, reason: '账号已停用' }); return; }
        var before = { 组织: Member.memberOrgIds(ctx, a).map(orgName), 角色: Member.accountRoleIds(ctx, a).map(roleName) };
        Member.addOrgs(ctx, a, draft.orgIds);
        Member.addRoles(ctx, a, draft.roleIds);
        var after = { 组织: Member.memberOrgIds(ctx, a).map(orgName), 角色: Member.accountRoleIds(ctx, a).map(roleName) };
        audit('添加组织成员', a.name, before, after, '成功', draft.orgIds[0] || null);
        ok.push({ name: a.name });
      });
      draft.newAccounts.forEach(function (n) {
        var existing = n.phone ? ctx.accounts.find(function (a) { return a.phone && a.phone === n.phone; }) : null;
        var accId;
        if (existing) accId = existing.id;
        else {
          accId = genId('ACC');
          var firstRole = roleById(draft.roleIds[0]);
          var stamp = new Date().toISOString().slice(0, 10);
          ctx.accounts.push({
            id: accId, name: n.name, orgId: draft.orgIds[0],
            partOrgIds: draft.orgIds.slice(1),
            kind: firstRole ? kindForRole(firstRole) : '管理员', status: '正常', studentId: null,
            phone: n.phone || null, lastLoginAt: null,
            createdAt: stamp, createdBy: identity.account.name, updatedAt: stamp, updatedBy: identity.account.name
          });
          audit('新建账号', n.name, null, { id: accId, 组织: orgName(draft.orgIds[0]) }, '成功', draft.orgIds[0]);
        }
        var ea = byAccountId(accId);
        if (ea) {
          var eb = { 组织: Member.memberOrgIds(ctx, ea).map(orgName), 角色: Member.accountRoleIds(ctx, ea).map(roleName) };
          Member.addOrgs(ctx, ea, draft.orgIds);
          Member.addRoles(ctx, ea, draft.roleIds, draft.orgIds);
          var ea2 = { 组织: Member.memberOrgIds(ctx, ea).map(orgName), 角色: Member.accountRoleIds(ctx, ea).map(roleName) };
          audit('添加组织成员', ea.name, eb, ea2, '成功', draft.orgIds[0] || null);
        }
        ok.push({ name: n.name });
      });
      DEMO.saveState(ctx);
      selectedIds = {};
      dlg.close();
      showBatchResult('加入组织', ok.length, skipped);
      render();
    }
  }
