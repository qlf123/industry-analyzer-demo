<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学闭环 · 业务全景图（交互版）</title>
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --card:#fff; --bg:#f3f4f8; --rule:#e5e7eb; --acc:#6366f1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); height:100vh; overflow:hidden; }
  header { position:fixed; top:0; left:0; right:0; z-index:10; background:var(--card); border-bottom:1px solid var(--rule); padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:700; white-space:nowrap; }
  header .lg { display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .lg-item { display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .line-demo { display:inline-block; vertical-align:middle; }
  .dot { width:10px; height:10px; border-radius:3px; display:inline-block; }
  #search { border:1px solid var(--rule); border-radius:8px; padding:5px 10px; font-size:12.5px; width:170px; outline:none; }
  #search:focus { border-color:var(--acc); }
  .btn { border:1px solid var(--rule); background:#fff; border-radius:8px; padding:5px 12px; font-size:12.5px; cursor:pointer; color:var(--ink); }
  .btn:hover { border-color:var(--acc); color:var(--acc); }
  #wrap { position:fixed; top:52px; left:0; right:0; bottom:0; }
  svg { width:100%; height:100%; display:block; cursor:grab; }
  svg:active { cursor:grabbing; }
  .node { cursor:pointer; }
  .node rect { transition:filter .15s; }
  .node:hover rect { filter:brightness(1.05); stroke-width:2.2; }
  .node.dim, .edge.dim { opacity:.12; }
  .node.hl rect { stroke-width:2.6; }
  .edge { pointer-events:stroke; }
  .edge:hover { opacity:1 !important; }
  .edge path { cursor:pointer; }
  .edge text { font-size:9.5px; fill:#7c8494; paint-order:stroke; stroke:#f3f4f8; stroke-width:3px; pointer-events:none; }
  .edge.hl path { stroke-width:3 !important; }
  .edge.hl text { fill:#111827; font-weight:600; }
  .edge.dim text { opacity:.12; }
  .loop text { font-size:9.5px; fill:#7c8494; paint-order:stroke; stroke:#f3f4f8; stroke-width:3px; }
  #panel { position:fixed; right:14px; top:66px; bottom:14px; width:300px; background:var(--card); border:1px solid var(--rule); border-radius:12px; box-shadow:0 8px 28px rgba(15,23,42,.12); display:none; flex-direction:column; overflow:hidden; z-index:20; }
  #panel.open { display:flex; }
  #panel .p-h { padding:12px 14px; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:8px; }
  #panel .p-h .nm { font-size:14.5px; font-weight:700; flex:1; }
  #panel .p-h .grp { font-size:11px; color:var(--muted); }
  #panel .x { border:none; background:none; font-size:16px; cursor:pointer; color:var(--muted); padding:2px 6px; }
  #panel .x:hover { color:var(--ink); }
  #panel .p-b { padding:12px 14px; overflow-y:auto; flex:1; font-size:12.5px; line-height:1.75; }
  #panel h4 { font-size:11px; color:var(--muted); font-weight:600; margin:12px 0 4px; }
  #panel h4:first-child { margin-top:0; }
  #panel .rel { padding:3px 8px; border-radius:6px; cursor:pointer; font-size:12px; }
  #panel .rel:hover { background:#f0f2ff; }
  #panel .rel b { color:var(--acc); font-weight:600; }
  #hint { position:fixed; left:16px; bottom:14px; font-size:11.5px; color:var(--muted); background:rgba(255,255,255,.85); border:1px solid var(--rule); border-radius:8px; padding:6px 10px; z-index:5; }
</style>
</head>
<body>
<header>
  <h1>教学闭环 · 业务全景图</h1>
  <div class="lg">
    <span class="lg-item"><svg class="line-demo" width="30" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#8b95a8" stroke-width="1.6" marker-end="url(#arrM)"/></svg>业务主线</span>
    <span class="lg-item"><svg class="line-demo" width="30" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#8b95a8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrM)"/></svg>引用 / 支撑 / 推导</span>
    <span class="lg-item"><svg class="line-demo" width="30" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrT)"/></svg>需审核确认</span>
    <span class="lg-item" id="legendGroups"></span>
  </div>
  <input id="search" type="text" placeholder="搜索对象…">
  <button class="btn" id="fitBtn">重置视图</button>
</header>
<div id="wrap"><svg id="svg"></svg></div>
<div id="panel">
  <div class="p-h"><span class="nm" id="pName"></span><span class="grp" id="pGroup"></span><button class="x" id="pClose">×</button></div>
  <div class="p-b" id="pBody"></div>
</div>
<div id="hint">滚轮缩放 · 拖拽平移 · 悬停高亮关系 · 点击对象看说明</div>

/* ═══ 布局：7 组从左到右分列，组内纵向排列 ═══ */
var NODE_W = 150, NODE_H = 34, GAP_Y = 46, COL_W = 240, PAD_X = 40, PAD_TOP = 66, PAD_BOT = 40;
var gById = {}; GROUPS.forEach(function (g) { gById[g.id] = g; });
var nodes = {}; NODES.forEach(function (n) { nodes[n.id] = n; n.gObj = gById[n.g]; });
var colX = {}; GROUPS.forEach(function (g, i) { colX[g.id] = PAD_X + i * COL_W; });
var rows = {}; NODES.forEach(function (n) { rows[n.g] = (rows[n.g] || 0) + 1; });
var yOf = {}; (function () { var cur = {}; NODES.forEach(function (n) { var y = PAD_TOP + (cur[n.g] || 0) * GAP_Y; yOf[n.id] = y; n.y = y; cur[n.g] = (cur[n.g] || 0) + 1; }); })();
NODES.forEach(function (n) { n.x = colX[n.g]; });
var W = PAD_X * 2 + COL_W * (GROUPS.length - 1) + NODE_W;
var H = Math.max.apply(null, GROUPS.map(function (g) { return PAD_TOP + rows[g.id] * GAP_Y + PAD_BOT; }));

/* ═══ 渲染 ═══ */
var NS = 'http://www.w3.org/2000/svg';
var svg = document.getElementById('svg');
svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
var defs = document.createElementNS(NS, 'defs');
function marker(id, color, w) {
  var m = document.createElementNS(NS, 'marker');
  m.setAttribute('id', id); m.setAttribute('viewBox', '0 0 10 10'); m.setAttribute('refX', '9'); m.setAttribute('refY', '5');
  m.setAttribute('markerWidth', '7'); m.setAttribute('markerHeight', '7'); m.setAttribute('orient', 'auto-start-reverse');
  var p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M0,0 L10,5 L0,10 z'); p.setAttribute('fill', color);
  m.appendChild(p); defs.appendChild(m);
}
marker('arrM', '#8b95a8'); marker('arrT', '#c0392b');
svg.appendChild(defs);

var world = document.createElementNS(NS, 'g'); world.id = 'world'; svg.appendChild(world);
var edgeLayer = document.createElementNS(NS, 'g'); edgeLayer.id = 'edgeLayer'; world.appendChild(edgeLayer);
var nodeLayer = document.createElementNS(NS, 'g'); nodeLayer.id = 'nodeLayer'; world.appendChild(nodeLayer);

function E(tag, attrs, parent, text) {
  var el = document.createElementNS(NS, tag);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  if (text != null) el.textContent = text;
  (parent || world).appendChild(el);
  return el;
}
/* 组标题 */
GROUPS.forEach(function (g) {
  E('text', { x: colX[g.id] + NODE_W / 2, y: 34, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: g.stroke }, world, g.name);
  E('text', { x: colX[g.id] + NODE_W / 2, y: 50, 'text-anchor': 'middle', 'font-size': 9.5, fill: '#9aa3b2' }, world, rows[g.id] + ' 个对象');
});
/* 边 */
var edgeEls = {}, nodeEls = {}, edgeByPair = {}, loopCount = {};
EDGES.forEach(function (ed, i) {
  var g = document.createElementNS(NS, 'g');
  g.classList.add('edge');
  g.dataset.i = i;
  var a = nodes[ed.a], b = nodes[ed.b];
  var d, color, sw;
  if (ed.t === 'thick') { color = '#c0392b'; sw = 3; d = ''; }
  else { color = '#8b95a8'; sw = 1.5; d = ed.t === 'dash' ? '4 3' : ''; }
  if (ed.loop) {
    var k = ed.a; loopCount[k] = (loopCount[k] || 0) + 1;
    var off = (loopCount[k] - 1) * 16;
    var cx = a.x + NODE_W - 8, cy = a.y - 6 - off;
    var path = E('path', { d: 'M ' + (cx) + ' ' + (a.y + 2 - off) + ' C ' + (cx + 34) + ' ' + (a.y - 26 - off) + ' ' + (cx + 34) + ' ' + (cy + 4) + ' ' + cx + ' ' + (cy + 4), fill: 'none', stroke: color, 'stroke-width': sw, 'stroke-dasharray': d, 'marker-end': 'url(#arrM)' }, g);
    E('text', { x: cx + 40, y: cy + 4, 'font-size': 9.5, fill: '#7c8494' }, g, ed.l);
  } else {
    var x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2;
    var same = a.x === b.x;
    var mx, my, bend;
    if (same) { mx = a.x - 18; my = (y1 + y2) / 2; bend = 1; x1 = a.x; x2 = b.x; }
    else { mx = (x1 + x2) / 2; my = (y1 + y2) / 2; bend = 0; }
    var k2 = ed.a + '>' + ed.b; edgeByPair[k2] = (edgeByPair[k2] || 0) + 1;
    var bo = bend ? 0 : Math.min(30, (edgeByPair[k2] - 1) * 26);
    var cx1 = bend ? mx : mx + bo, cy1 = y1, cx2 = bend ? mx : mx + bo, cy2 = y2;
    var path = E('path', { d: 'M ' + x1 + ' ' + y1 + ' C ' + cx1 + ' ' + cy1 + ' ' + cx2 + ' ' + cy2 + ' ' + x2 + ' ' + y2, fill: 'none', stroke: color, 'stroke-width': sw, 'stroke-dasharray': d, 'marker-end': 'url(#arrM)' }, g);
    if (ed.l) {
      var lx = bend ? mx - 24 : mx + bo + 6, ly = my - 5;
      E('text', { x: lx, y: ly, 'text-anchor': bend ? 'end' : 'start', 'font-size': 9.5, fill: '#7c8494', 'paint-order': 'stroke', stroke: '#f3f4f8', 'stroke-width': 3 }, g, ed.l);
    }
  }
  edgeLayer.appendChild(g);
  edgeEls[ed.a + '|' + ed.b + '|' + i] = g;
  ed.el = g;
});
/* 节点 */
NODES.forEach(function (n) {
  var g = document.createElementNS(NS, 'g');
  g.classList.add('node');
  g.dataset.id = n.id;
  g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
  E('rect', { width: NODE_W, height: NODE_H, rx: 8, fill: n.gObj.fill, stroke: n.gObj.stroke, 'stroke-width': 1.4 }, g);
  E('text', { x: NODE_W / 2, y: NODE_H / 2 + 4, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: n.gObj.ink }, g, n.n);
  var title = E('title', {}, g, n.n);
  nodeLayer.appendChild(g);
  nodeEls[n.id] = g;
  n.el = g;
});
/* 邻接表 */
var adj = {}; NODES.forEach(function (n) { adj[n.id] = { edges: [], nodes: {} }; });
EDGES.forEach(function (ed) {
  if (ed.loop) { adj[ed.a].edges.push(ed); adj[ed.a].nodes[ed.a] = 1; }
  else { adj[ed.a].edges.push(ed); adj[ed.b].edges.push(ed); adj[ed.a].nodes[ed.b] = 1; adj[ed.b].nodes[ed.a] = 1; }
});

/* ═══ 交互：缩放 / 平移 ═══ */
var tx = 0, ty = 0, scale = 1, drag = null;
function applyT() { world.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')'); }
function fit() {
  var vw = svg.clientWidth, vh = svg.clientHeight;
  scale = Math.min(vw / W, vh / H) * 0.96;
  tx = (vw - W * scale) / 2; ty = (vh - H * scale) / 2;
  applyT();
}
document.getElementById('fitBtn').onclick = fit;
svg.addEventListener('wheel', function (e) {
  e.preventDefault();
  var rect = svg.getBoundingClientRect();
  var px = e.clientX - rect.left, py = e.clientY - rect.top;
  var ns = scale * (e.deltaY < 0 ? 1.12 : 0.9);
  ns = Math.max(0.25, Math.min(3, ns));
  var k = ns / scale;
  tx = px - (px - tx) * k; ty = py - (py - ty) * k; scale = ns;
  applyT();
}, { passive: false });
svg.addEventListener('mousedown', function (e) {
  if (e.target === svg || e.target.id === 'world') { drag = { x: e.clientX, y: e.clientY, tx: tx, ty: ty }; }
});
window.addEventListener('mousemove', function (e) {
  if (!drag) return;
  tx = drag.tx + (e.clientX - drag.x); ty = drag.ty + (e.clientY - drag.y);
  applyT();
});
window.addEventListener('mouseup', function () { drag = null; });

/* ═══ 交互：hover 高亮 / 点击详情 ═══ */
function clearHl() {
  document.querySelectorAll('.node, .edge').forEach(function (el) { el.classList.remove('hl', 'dim'); });
}
function highlight(nid) {
  clearHl();
  var mine = adj[nid];
  NODES.forEach(function (n) {
    var on = n.id === nid || mine.nodes[n.id];
    n.el.classList.toggle('dim', !on);
    if (on) n.el.classList.add('hl');
  });
  EDGES.forEach(function (ed) {
    var on = mine.edges.indexOf(ed) >= 0;
    ed.el.classList.toggle('dim', !on);
    if (on) ed.el.classList.add('hl');
  });
  /* 相关节点提到前面 */
  NODES.forEach(function (n) { nodeLayer.appendChild(n.el); });
}
NODES.forEach(function (n) {
  n.el.addEventListener('mouseenter', function () { highlight(n.id); });
});
svg.addEventListener('mousemove', function (e) {
  if (e.target === svg || e.target.id === 'world' || e.target.id === 'edgeLayer' || e.target.id === 'nodeLayer') clearHl();
});

/* 详情面板 */
var panel = document.getElementById('panel'), curNode = null;
function relList(id) {
  var out = [];
  EDGES.forEach(function (ed) {
    if (ed.loop && ed.a === id) { out.push('<div class="rel">↻ ' + (ed.l || '自关系') + '（自环）</div>'); return; }
    var dir = '', other = null;
    if (ed.a === id) { other = ed.b; dir = '→'; }
    else if (ed.b === id) { other = ed.a; dir = '←'; }
    if (other) out.push('<div class="rel" data-other="' + other + '">' + esc(nodes[id].n) + ' <b>' + dir + ' ' + (ed.l || '关联') + '</b> ' + (dir === '→' ? '→' : '←') + ' ' + esc(nodes[other].n) + '</div>');
  });
  return out.join('');
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function openPanel(n) {
  curNode = n;
  panel.classList.add('open');
  document.getElementById('pName').textContent = n.n;
  document.getElementById('pGroup').textContent = n.gObj.name;
  document.getElementById('pBody').innerHTML =
    '<h4>主要属性</h4><div>' + esc(n.attr) + '</div>' +
    '<h4>维护者</h4><div>' + esc(n.who) + '</div>' +
    '<h4>用途</h4><div>' + esc(n.use) + '</div>' +
    '<h4>相关关系</h4>' + relList(n.id);
}
document.getElementById('pClose').onclick = function () { panel.classList.remove('open'); curNode = null; };
panel.addEventListener('click', function (e) {
  var r = e.target.closest('.rel'); if (!r) return;
  var other = nodes[r.dataset.other];
  if (other) { openPanel(other); highlight(other.id); }
});
NODES.forEach(function (n) {
  n.el.addEventListener('click', function (e) { e.stopPropagation(); openPanel(n); highlight(n.id); });
});
svg.addEventListener('click', function (e) {
  if (e.target === svg || e.target.id === 'world' || e.target.id === 'edgeLayer' || e.target.id === 'nodeLayer') { panel.classList.remove('open'); curNode = null; }
});

/* ═══ 搜索 ═══ */
var search = document.getElementById('search');
search.addEventListener('input', function () {
  var q = search.value.trim().toLowerCase();
  if (!q) { clearHl(); return; }
  var hit = {};
  NODES.forEach(function (n) { if (n.n.toLowerCase().indexOf(q) >= 0 || (n.attr + n.use).toLowerCase().indexOf(q) >= 0) hit[n.id] = 1; });
  NODES.forEach(function (n) {
    var on = !!hit[n.id];
    n.el.classList.toggle('dim', !on);
    if (on) n.el.classList.add('hl');
  });
  EDGES.forEach(function (ed) {
    var on = hit[ed.a] && hit[ed.b];
    ed.el.classList.toggle('dim', !on);
    if (on) ed.el.classList.add('hl');
  });
  if (Object.keys(hit).length === 1) { var only = nodes[Object.keys(hit)[0]]; openPanel(only); highlight(only.id); }
});

/* 图例组色块 */
document.getElementById('legendGroups').innerHTML = GROUPS.map(function (g) {
  return '<span class="lg-item"><span class="dot" style="background:' + g.fill + ';border:1px solid ' + g.stroke + '"></span>' + g.name.slice(0, 1) + g.name.slice(2) + '</span>';
}).join('');

fit();
window.addEventListener('resize', function () { if (!drag) fit(); });
</script>
