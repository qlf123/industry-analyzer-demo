<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · AIGC 智慧课堂教学平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
/* 登录页：居中卡片，复用 common.css 的设计变量 */
.login-body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
.login-card{width:380px;max-width:100%;background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--pop-shadow);padding:38px 32px 30px;text-align:center}
.login-logo{width:54px;height:54px;border-radius:14px;background:var(--brand);color:#fff;font-size:28px;line-height:54px;margin:0 auto 16px}
.login-card h1{font-size:18px;margin:0 0 6px;color:var(--ink)}
.login-sub{font-size:12px;color:var(--muted);margin:0 0 26px}
.login-form{text-align:left;margin-bottom:4px}
.login-form label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.login-form input{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--card);color:var(--ink)}
.login-form input:focus{outline:none;border-color:var(--brand)}
.login-form label:not(:first-child){margin-top:12px}
.login-form .btn{width:100%;height:42px;margin-top:14px;font-size:14px}
.login-note{font-size:11.5px;color:var(--muted);margin-top:20px}
.acct-wrap{position:relative;text-align:left}
.acct-wrap input{padding-right:30px;cursor:pointer}
.acct-caret{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none}
.acct-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:264px;overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--pop-shadow);z-index:30;display:none;text-align:left}
.acct-menu.open{display:block}
.acct-item{padding:8px 12px;font-size:13px;color:var(--ink);cursor:pointer}
.acct-item:hover{background:var(--brand-soft);color:var(--brand-ink)}
.acct-empty{padding:8px 12px;font-size:12px;color:var(--muted)}
</style>
</head>
<body class="login-body">
<main class="login-card">
  <div class="login-logo">◈</div>
  <h1>AIGC 智慧课堂教学平台</h1>
  <p class="login-sub">权限管理升级 · 登录流程演示</p>
  <div class="login-form">
    <label for="loginAccount">账号</label>
    <div class="acct-wrap">
      <input id="loginAccount" type="text" value="李老师" autocomplete="off" aria-label="账号">
      <span class="acct-caret" aria-hidden="true">▾</span>
      <div class="acct-menu" id="acctMenu" role="listbox"></div>
    </div>
    <label for="loginPassword">密码</label>
    <input id="loginPassword" type="password" value="123456" autocomplete="off" aria-label="密码">
    <button class="btn" id="loginBtn" type="button">登录</button>
  </div>
  <p class="login-note">本页仅演示登录流程，不做真实身份验证。</p>
</main>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  'use strict';

  var accountInput = document.getElementById('loginAccount');
  var passwordInput = document.getElementById('loginPassword');
  var btn = document.getElementById('loginBtn');
  var acctMenu = document.getElementById('acctMenu');

  // 演示登录：不做账号 / 密码校验；输入账号名可切换身份，默认「李老师」
  var DEFAULT_ACCOUNT_ID = 'ACC-LI';

  var DEMO_LIST = (DEMO.getState().demoIdentities || []);

  // 渲染账号下拉：filter 为空时显示全部，否则按输入过滤
  function renderMenu(filter) {
    var q = String(filter == null ? '' : filter).trim();
    var list = q ? DEMO_LIST.filter(function (x) { return x.label.indexOf(q) >= 0; }) : DEMO_LIST;
    acctMenu.innerHTML = '';
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'acct-empty';
      empty.textContent = '未找到账号，将按默认「李老师」登录';
      acctMenu.appendChild(empty);
      return;
    }
    list.forEach(function (x) {
      var item = document.createElement('div');
      item.className = 'acct-item';
      item.setAttribute('role', 'option');
      item.textContent = x.label;
      item.addEventListener('mousedown', function (e) {
        e.preventDefault(); // 阻止 input 失焦，保持焦点
        accountInput.value = x.label;
        acctMenu.classList.remove('open');
      });
      acctMenu.appendChild(item);
    });
  }

  function openMenu() { renderMenu(''); acctMenu.classList.add('open'); }
  function closeMenu() { acctMenu.classList.remove('open'); }

  // 按输入解析账号：演示身份 label → 账号姓名 → 账号 id → 回退默认「李老师」
  function resolveAccountId(raw) {
    var q = String(raw == null ? '' : raw).trim();
    if (!q) return DEFAULT_ACCOUNT_ID;
    var ctx = DEMO.getState();
    var hit = (ctx.demoIdentities || []).filter(function (x) { return x.label === q; });
    if (hit.length === 1) return hit[0].accountId;
    var byName = (ctx.accounts || []).filter(function (x) { return x.name === q; });
    if (byName.length === 1) return byName[0].id;
    var byId = (ctx.accounts || []).filter(function (x) { return x.id === q; });
    if (byId.length === 1) return byId[0].id;
    return DEFAULT_ACCOUNT_ID;
  }

  function login() {
    var accountId = resolveAccountId(accountInput.value);
    var ctx = DEMO.getState();
    var identity = Perm.getIdentity(ctx, accountId);
    var portals = Perm.rolePortals(ctx, identity);
    var target = 'account-v1.html';
    if (portals.length > 1) {
      UI.promptPortal(ctx, identity, portals, function () {
        // 无论选择哪个端，都进入「账号管理」页
        location.href = target + '?u=' + encodeURIComponent(accountId);
      }, function () {
        // 取消：停留在登录页，不跳转
      });
      return;
    }
    location.href = target + '?u=' + encodeURIComponent(accountId);
  }

  accountInput.addEventListener('focus', openMenu);
  accountInput.addEventListener('click', openMenu);
  accountInput.addEventListener('input', function () {
    renderMenu(accountInput.value);
    acctMenu.classList.add('open');
  });
  accountInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { closeMenu(); login(); }
    else if (e.key === 'Escape') { closeMenu(); }
  });
  passwordInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  btn.addEventListener('click', login);
  document.addEventListener('click', function (e) {
    if (e.target !== accountInput && !acctMenu.contains(e.target)) closeMenu();
  });
})();
</script>
</body>
</html>
