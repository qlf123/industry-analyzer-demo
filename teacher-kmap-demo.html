<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行业能力图谱 · 教师端 Demo</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#202236;background:#f5f6fa;--p:#6554d9;--pb:#f0edff;--line:#e8e9f0;--muted:#777b8d}*{box-sizing:border-box}body{margin:0;font-size:14px}.shell{min-height:100vh;display:grid;grid-template-columns:210px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column}.brand{font-weight:700;padding:0 8px 25px}.logo{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--p);color:white;margin-right:8px}.nav{padding:10px;border-radius:8px;color:#666;margin:2px 0}.nav.on{background:var(--pb);color:var(--p);font-weight:650}.sect{font-size:11px;color:#999;margin:16px 10px 8px}.foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 9px;font-size:12px;color:var(--muted)}.main{min-width:0}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);padding:0 26px;display:flex;align-items:center;justify-content:space-between;color:#777;font-size:12px}.content{max-width:1450px;margin:auto;padding:24px 26px 50px}h1{font-size:22px;margin:0 0 5px}h2{font-size:15px;margin:0}.sub{font-size:13px;color:var(--muted)}.title{display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}.selects{display:flex;gap:8px;flex-wrap:wrap}select,.search,.btn{font:inherit;border:1px solid #dedfe8;border-radius:8px;background:white;padding:8px 11px;color:#393b4d}select{font-size:12px}.path{font-size:12px;color:var(--muted);margin:0 0 12px}.path b{color:#393b4d}.summary,.panel{background:#fff;border:1px solid var(--line);border-radius:11px}.summary{display:flex;gap:18px;align-items:center;padding:12px 15px;margin-bottom:13px;font-size:12px;color:var(--muted)}.summary b{color:#34364a;font-size:13px}.summary .hint{margin-left:auto}.layout{display:grid;grid-template-columns:minmax(330px,.78fr) minmax(460px,1.22fr);gap:13px;align-items:start}.panel{overflow:hidden}.head{padding:15px 17px 12px;border-bottom:1px solid #f0f0f4;display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:11px;color:var(--muted)}.headtools{display:flex;gap:6px}.btn{cursor:pointer;font-size:12px;padding:7px 10px}.btn:hover{border-color:var(--p);color:var(--p)}.btn.primary{background:var(--p);color:white;border-color:var(--p)}.btn.dark{background:#29263e;color:white;border-color:#29263e}.find{padding:10px 13px;border-bottom:1px solid #f0f0f4}.search{width:100%;font-size:12px}.tree{padding:8px 12px;max-height:650px;overflow:auto}.row{display:flex;align-items:center;gap:7px;padding:7px 7px;border-radius:7px;cursor:pointer}.row:hover{background:#faf9fd}.row.sel{background:var(--pb);color:#4f40bd}.toggle{width:14px;color:#888;text-align:center;flex:none}.kind{font-size:10px;color:#85889a;white-space:nowrap}.name{font-size:12px;line-height:1.5;flex:1}.count{font-size:10px;color:#999;white-space:nowrap}.badge{font-size:10px;padding:3px 6px;border-radius:5px;background:#fff3df;color:#9c680b}.kids{margin-left:15px;padding-left:8px;border-left:1px solid #e6e4ee}.kids[hidden]{display:none}.detail{padding:18px}.eyebrow{font-size:11px;color:var(--p);font-weight:650}.detail h2{font-size:19px;margin:5px 0 8px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;padding:4px 7px;border-radius:5px;background:var(--pb);color:var(--p)}.tag.gray{background:#f1f2f5;color:#707385}.desc{font-size:12px;line-height:1.75;color:#676a7c;margin:12px 0 16px}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line)}.tab{border:0;background:none;padding:9px 10px;font:inherit;font-size:11px;color:#777;cursor:pointer;border-bottom:2px solid transparent}.tab.on{color:var(--p);border-color:var(--p);font-weight:650}.children{padding:11px 0;min-height:100px}.child{border:1px solid #eeeef3;border-radius:8px;padding:10px 11px;margin-bottom:7px;cursor:pointer}.child:hover{border-color:#ccc5fb;background:#fcfbff}.child b{font-size:12px}.child p{font-size:11px;line-height:1.6;color:#747789;margin:5px 0 0}.child small{color:#8a7bd7}.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}.refine{border:1px dashed #d8d2fa;background:#faf9ff;border-radius:8px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.refine b{font-size:12px}.refine p{font-size:11px;color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions .hint{font-size:10px;color:var(--muted);margin-left:auto;align-self:center}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 15px;border-radius:8px;background:#29263e;color:white}.toast.show{display:block}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.content{padding:20px 15px}.top{padding:0 15px}.layout{grid-template-columns:minmax(260px,.8fr) minmax(390px,1.2fr)}}@media(max-width:720px){.layout{grid-template-columns:1fr}.title{flex-direction:column}.summary{flex-wrap:wrap;gap:8px 14px}.summary .hint{margin:0}.actions .hint{width:100%;margin:0}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><span class="logo">知</span>AIGC 智慧课堂</div><div class="sect">行业与岗位</div><div class="nav">行业全景</div><div class="nav on">能力图谱</div><div class="sect">后续教学模块</div><div class="nav">课程备课</div><div class="nav">课程测评</div><div class="nav">教学资源</div><div class="foot">教师工作空间<br>能力图谱用于教学准备与课程诊断</div></aside>
<main class="main"><header class="top"><span>教师工作台　/　行业能力图谱</span><span>王老师　 ●</span></header><div class="content"><div class="title"><div><h1>行业能力图谱</h1><div class="sub">选行业和岗位，逐层查看岗位能力及教学内容；确认后再进入备课或课程测评。</div></div><div class="selects"><select id="industry"><option>旅游业</option><option>现代物流业</option><option>低空经济</option></select><select id="subindustry"><option>旅行社与组团服务</option><option>游览景区服务</option><option>研学与定制旅游</option><option>在线旅游服务</option></select><select id="position"><option>地接导游</option><option>旅行社计调</option><option>全陪领队</option></select></div></div>
<div class="path">当前路径　<b id="path">旅游业　›　旅行社与组团服务　›　地接导游</b></div><div class="summary"><b id="summary">地接导游 · 岗位能力要求</b><span>能力项 16 项</span><span>核心能力 5 项</span><span>技能及教学内容逐层展开</span><span class="hint">点击任意节点查看内容；每个节点都可以继续下钻</span></div>
<div class="layout"><section class="panel"><div class="head"><div><h2>岗位能力结构</h2><div class="muted" style="margin-top:4px">能力 → 技能 → 知识点 / 操作步骤 / 标准 / 案例</div></div><div class="headtools"><button class="btn" id="expand">展开</button><button class="btn" id="collapse">收起</button></div></div><div class="find"><input class="search" id="search" placeholder="搜索能力、技能、知识点或案例"></div><div class="tree" id="tree"></div></section>
<section class="panel"><div class="head"><div><h2>节点内容</h2><div class="muted" id="crumb" style="margin-top:4px"></div></div><span class="muted" id="source">图谱内容</span></div><div class="detail" id="detail"></div></section></div></div></main></div><div class="toast" id="toast"></div>
<script>
const make=(id,type,name,desc,children=[])=>({id,type,name,desc,children});
const graph=[
 make('a1','能力项','现场讲解与节奏控制','根据景点特点与游客反馈组织讲解内容，控制讲解节奏，并在现场变化时灵活调整。',[
  make('s1','技能','现场讲解实施与时长控制','面向游客完成结构清楚、节奏合适的现场讲解。',[
   make('k1','知识点','讲解结构与信息层次','开场、主体、收束的常见组织方式，以及信息取舍原则。'),make('p1','操作步骤','3–5 分钟现场讲解','确定对象与重点 → 组织讲解结构 → 现场表达 → 根据反馈调整节奏。'),make('r1','评价标准','现场讲解表现量规','从内容准确、结构清晰、表达自然、时间控制和互动回应五个维度评价。'),make('c1','案例','游客临时打断提问','游客连续追问时，如何回应并自然回到讲解主线。')]),
  make('s2','技能','分众化讲解适配','根据游客需求调整内容深度、语言和互动方式。',[
   make('k2','知识点','不同客群的讲解需求','亲子、银发、研学和入境游客的关注点与信息深度。'),make('p2','操作步骤','按客群调整讲解表达','识别客群 → 选择内容 → 调整语言与节奏 → 观察反馈。'),make('c2','案例','亲子团讲解古建筑','将建筑知识转化为适龄的观察任务和互动提问。')]),
  make('s3','技能','讲解词结构编排','围绕主题组织事实材料、表达线索和现场互动。',[
   make('k3','知识点','讲解词主题与线索','主题线索、事实材料和情感表达之间的组织关系。'),make('p3','操作步骤','编写景点讲解提纲','确定主题 → 选取事实 → 排列顺序 → 设计过渡与收束。'),make('c3','案例','景区入口导入段','在有限时间内建立场景、提出看点并连接后续路线。')])]),
 make('a2','能力项','客诉情绪安抚与共情表达','倾听游客诉求并确认关键事实，使用恰当表达降低对立情绪，维持服务沟通。',[
  make('s4','技能','投诉要素倾听与记录','倾听并区分事实、感受、诉求和待核实信息。',[
   make('k4','知识点','投诉事实与诉求区分','区分客观事实、主观感受、具体诉求及待核实信息。'),make('p4','操作步骤','投诉信息记录','倾听 → 复述 → 核实 → 记录时间、地点、人员与诉求。'),make('c4','案例','团队用餐等待引发投诉','游客要求立即赔偿时，如何先稳定沟通并收集信息。')]),
  make('s5','技能','情绪安抚与复述确认','用共情表达确认问题，并清楚说明后续处理安排。',[
   make('k5','知识点','共情表达与沟通边界','表达理解，但不预先承诺责任或超出权限的补偿。'),make('p5','操作步骤','三步安抚表达','先倾听 → 复述确认 → 说明下一步处理安排。'),make('r5','评价标准','客诉沟通观察表','关注倾听完整度、复述准确性、语气和后续安排。')])]),
 make('a3','能力项','团队组织与集合调度','根据行程节点和团队状态完成集合提醒、人数清点与队伍转场组织。',[
  make('s6','技能','团队人数清点','在集合、转场和抵达节点完成人数核验并处理异常。',[
   make('k6','知识点','团队清点与异常报告规则','集合前后核验、分组清点和异常上报的基本要求。'),make('p6','操作步骤','出发前人数核验','明确集合点 → 分组点名 → 双向核验 → 处理缺员情况。'),make('c6','案例','景区出口发现游客未归队','团队即将发车时，如何组织联络、清点和安全处置。')]),
  make('s7','技能','接待计划要素核对','核对行程服务信息，与相关方确认变更并向团队说明。',[
   make('k7','知识点','接待计划关键字段','交通、住宿、餐饮、景点、联系人与特殊需求的核对关系。'),make('p7','操作步骤','行前接待计划核对','逐项核对 → 标记变更 → 与相关方确认 → 向团队说明。')])]),
 make('a4','能力项','旅游安全风险识别与预警','识别团队活动中的常见安全风险，及时提醒并按流程报告异常情况。',[
  make('s8','技能','行前安全告知实施','结合线路与团队特点说明安全注意事项。',[
   make('k8','知识点','行前安全告知重点','交通、游览、集合、天气和个人健康等常见风险提示。'),make('p8','操作步骤','行前安全提醒','结合线路识别风险 → 清楚说明行为要求 → 确认游客理解。'),make('c8','案例','强降雨天气下的景区游览','根据天气与现场信息调整提醒内容和游览安排。')]),
  make('s9','技能','现场警戒与人员疏导','发现异常后设置警戒、组织疏导并及时报告。',[
   make('k9','知识点','现场风险信号识别','拥挤、湿滑、临水和设备异常等风险信号及优先处置原则。'),make('r9','评价标准','现场安全处置清单','风险识别及时、提醒明确、人员疏导有序、上报信息完整。')])])
];
let selected=graph[0], expanded=new Set(['a1','s1']), serial=0, tab='全部内容';
const tree=document.querySelector('#tree'),detail=document.querySelector('#detail');
function flat(){const out=[];const walk=(n,parent=null)=>{out.push({n,parent});n.children.forEach(c=>walk(c,n))};graph.forEach(n=>walk(n));return out}
function hasMatch(n,q){return !q||`${n.type} ${n.name} ${n.desc}`.toLowerCase().includes(q)||n.children.some(c=>hasMatch(c,q))}
function drawTree(){const q=document.querySelector('#search').value.trim().toLowerCase();const render=n=>{if(!hasMatch(n,q))return '';const open=expanded.has(n.id)||!!q;return `<div class="row ${selected.id===n.id?'sel':''}" data-id="${n.id}"><span class="toggle">${n.children.length?(open?'▾':'▸'):'·'}</span><span class="kind">${n.type}</span><span class="name">${n.name}</span>${n.core?'<span class="badge">核心</span>':''}<span class="count">${n.children.length?`${n.children.length} 项`:''}</span></div>${n.children.length?`<div class="kids" ${open?'':'hidden'}>${n.children.map(render).join('')}</div>`:''}`};tree.innerHTML=graph.map(render).join('')||'<div class="empty">没有匹配的图谱内容</div>';tree.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{const f=flat().find(x=>x.n.id===el.dataset.id);if(!f)return;selected=f.n;if(selected.children.length)expanded.add(selected.id);drawTree();drawDetail()})}
function drawDetail(){const f=flat().find(x=>x.n===selected);let path=[];for(let n=selected;n;){path.unshift(n.name);n=flat().find(x=>x.n===n)?.parent}document.querySelector('#crumb').textContent=`${document.querySelector('#position').value} / ${path.join(' / ')}`;document.querySelector('#source').textContent=selected.generated?'AI生成草案 · 待确认':'图谱内容';const types=['全部内容','知识点','操作步骤','评价标准','案例'];detail.innerHTML=`<div class="eyebrow">${selected.type}${selected.core?' · 核心能力':''}${selected.generated?' · AI草案':''}</div><h2>${selected.name}</h2><div class="tags"><span class="tag">${document.querySelector('#position').value}</span>${selected.level?`<span class="tag gray">岗位要求 ${selected.level}</span>`:''}${selected.generated?'<span class="tag gray">教师可修改</span>':''}</div><p class="desc">${selected.desc}</p><div class="tabs">${types.map(t=>`<button class="tab ${tab===t?'on':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="children" id="children"></div><div class="refine"><div><b>继续向下细化</b><p>生成内容会挂在当前节点下；老师可逐层展开，直到粒度合适。</p></div><button class="btn" id="refine">✦ AI 继续细化</button></div><div class="actions"><button class="btn primary" id="lesson">带入备课 · 生成课件</button><button class="btn dark" id="assessment">评估现有课程掌握效果</button><span class="hint">备课和测评在其他模块完成</span></div>`;detail.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;drawDetail()});document.querySelector('#refine').onclick=()=>refine(selected);document.querySelector('#lesson').onclick=()=>toast(`已将「${selected.name}」及其下级内容带入备课模块`);document.querySelector('#assessment').onclick=()=>toast(`已准备「${document.querySelector('#position').value}」岗位技能课程测评`);let items=selected.children.filter(n=>tab==='全部内容'||n.type===tab);const box=document.querySelector('#children');box.innerHTML=items.length?items.map(n=>`<div class="child" data-child="${n.id}"><b>${n.type} · ${n.name}</b><p>${n.desc}</p>${n.generated?'<small>AI生成草案 · 可继续细化</small>':''}</div>`).join(''):`<div class="empty">${selected.children.length?'当前节点下没有此类内容':'当前节点尚无下级内容；点击“AI 继续细化”生成第一层'}</div>`;box.querySelectorAll('[data-child]').forEach(el=>el.onclick=()=>{selected=flat().find(x=>x.n.id===el.dataset.child).n;expanded.add(selected.id);drawTree();drawDetail()})}
function refine(parent){const kinds=parent.type==='能力项'?['技能','技能','技能']:parent.type==='技能'?['知识点','操作步骤','案例']:parent.type==='知识点'?['知识点','知识点','知识点']:parent.type==='操作步骤'?['操作步骤','操作步骤','操作步骤']:parent.type==='评价标准'?['评价标准','评价标准','评价标准']:parent.type==='案例'?['案例','案例','案例']:[parent.type,parent.type,parent.type];const names=parent.type==='能力项'?['岗位关键技能','现场应用技能','综合处理技能']:parent.type==='技能'?['核心概念与判断要点','岗位操作流程拆解','典型工作情境案例']:['基础要点','关键环节','情境应用'];kinds.forEach((kind,i)=>{serial++;const n=make(`ai-${serial}`,kind,`${parent.name} · ${names[i]}`,`围绕「${parent.name}」在${document.querySelector('#position').value}岗位中的${kind}草案。可继续细化此节点，直到教学粒度合适。`);n.generated=true;parent.children.push(n)});expanded.add(parent.id);selected=parent.children[parent.children.length-3];expanded.add(selected.id);drawTree();drawDetail();toast(`已生成 3 个下级草案；可继续对任一新节点下钻`)}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.querySelector('#search').oninput=drawTree;document.querySelector('#expand').onclick=()=>{flat().forEach(x=>{if(x.n.children.length)expanded.add(x.n.id)});drawTree()};document.querySelector('#collapse').onclick=()=>{expanded.clear();drawTree()};document.querySelector('#industry').onchange=e=>{document.querySelector('#path').textContent=`${e.target.value}　›　${document.querySelector('#subindustry').value}　›　${document.querySelector('#position').value}`;toast('切换行业（演示数据）')};document.querySelector('#subindustry').onchange=e=>{document.querySelector('#path').textContent=`${document.querySelector('#industry').value}　›　${e.target.value}　›　${document.querySelector('#position').value}`;toast('切换子行业（演示数据）')};document.querySelector('#position').onchange=e=>{document.querySelector('#path').textContent=`${document.querySelector('#industry').value}　›　${document.querySelector('#subindustry').value}　›　${e.target.value}`;document.querySelector('#summary').textContent=`${e.target.value} · 岗位能力要求`;drawDetail()};drawTree();drawDetail();
</script></body></html>
