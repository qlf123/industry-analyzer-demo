<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授课计划（原型）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
/* 授课计划原型：图谱驱动的教学链路（一期授课计划 + 按课次备课；二期任务按节点评价） */
[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar select{height:34px;border:1px solid var(--rule);border-radius:8px;padding:0 10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.bar .sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.tab{padding:9px 14px;font-size:13px;color:var(--ink-2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font:inherit}
.tab.on{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.sum b{font-family:var(--mono);color:var(--ink)}
.warnbox{border:1px solid var(--warn-bg);background:var(--warn-bg);color:var(--warn-ink);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
.warnbox .it{display:inline-flex;align-items:center;gap:4px;margin:4px 10px 0 0}
.warnbox select{font-size:11.5px;padding:1px 4px;border:1px solid var(--rule);border-radius:5px;background:var(--card);color:var(--ink)}
/* 课次 */
.sess{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 14px;padding:14px 16px;border-bottom:1px solid var(--rule-2);align-items:start}
.sess:last-child{border-bottom:none}
.sess.skip{opacity:.5}
.sess .no{font-family:var(--mono);font-size:13px;color:var(--brand);font-weight:600;padding-top:2px}
.sess .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess .nm input{font:inherit;font-weight:600;border:1px solid var(--brand);border-radius:6px;padding:2px 6px;min-width:260px}
.sess .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sess .meta select{font-size:12px;padding:1px 4px;border:1px solid var(--rule);border-radius:5px;background:var(--card);color:var(--ink)}
.nodes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nd{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 4px 3px 9px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink)}
.nd.mine{background:var(--card);border:1px dashed var(--brand);color:var(--ink-2)}
.nd em{font-style:normal;font-size:10px;opacity:.75}
.nd .x{border:none;background:none;color:inherit;cursor:pointer;opacity:.6;padding:0 4px;font-size:13px}
.nd .x:hover{opacity:1}
.addp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px}
.addp input,.addp select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink)}
.sess .ops{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sess .ops .row{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.det{grid-column:2 / 4;margin-top:6px;font-size:12px;color:var(--ink-2);line-height:1.7;background:var(--card-2);border-radius:8px;padding:8px 12px}
.det b{color:var(--ink)}
.det .ab{color:var(--brand-ink)}
/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--card-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl-wrap{overflow-x:auto}
.tbl select{font-size:12px;padding:2px 4px;border:1px solid var(--rule);border-radius:5px;background:var(--card);color:var(--ink)}
.lv{display:inline-block;min-width:44px;text-align:center;font-family:var(--mono);font-size:11.5px;padding:2px 6px;border-radius:5px}
.lv.ok{background:var(--good-bg);color:var(--good)} .lv.low{background:var(--warn-bg);color:var(--warn-ink)}
.lv.no{background:var(--crit-bg);color:var(--crit)} .lv.na{background:var(--card-2);color:var(--muted)}
.task{border-bottom:1px solid var(--rule-2);padding:12px 16px}
.task:last-child{border-bottom:none}
.task .th{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.task .th b{font-size:13.5px}
.task .th .sp{flex:1}
.crit-box{font-size:12px;line-height:1.7;background:var(--card-2);border-radius:8px;padding:8px 12px;margin:8px 0}
.crit-box .t{font-weight:600;color:var(--ink)}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(20,16,32,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);border-radius:12px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:18px 20px;box-shadow:var(--pop-shadow)}
.dlg h3{font-size:15px;margin:0 0 12px}
.dlg label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.dlg input[type=text],.dlg select{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--card);color:var(--ink)}
.dlg .chk{display:flex;gap:6px;align-items:center;font-size:12.5px;margin:4px 0}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop"><div class="ptop-r"><div class="pt-l">
      <h1 class="pt-t">授课计划 <span class="pill k" style="vertical-align:3px">原型</span></h1>
      <div class="pt-d">基于标准课程（知识体系）调整实际教学：按课次备课、发布任务、按节点评价，达到情况沿图谱汇总</div>
    </div></div></div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.ASSESS_DATA, MID = 'MAJOR-GUIDE', K = D.knowledge[MID];
  var ABL = {}; D.graph.abilities.forEach(function (a) { ABL[a.id] = a; });
  var CONFIRMED = D.confirmedStatuses || ['已审核', '已调整'];
  var LV = { L1: 1, L2: 2, L3: 3 }, LEVELS = ['L1', 'L2', 'L3'];
  var STUDENTS = ['陈思远', '李佳怡', '王子涵', '张雨萱', '刘浩然', '赵欣妍', '孙一鸣', '周若彤'];   // 演示学生
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = $('#toast'); t.innerHTML = '<span>' + esc(m) + '</span>'; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600); }
  function uid(p) { return p + Math.random().toString(36).slice(2, 8); }

  // 技能索引：技能 → 课程 / 任务 / 技能本身；技能 → 已确认映射到的能力与服务等级
  var SK = {};
  K.courses.forEach(function (c) { c.tasks.forEach(function (t) { t.skills.forEach(function (s) { SK[s.id] = { s: s, c: c, t: t }; }); }); });
  var MAP = {};
  (D.mappings[MID] || []).forEach(function (m) {
    if (D.countedTypes.indexOf(m.type) < 0 || !m.level || CONFIRMED.indexOf(m.status) < 0) return;
    (MAP[m.skill] = MAP[m.skill] || []).push(m);
  });
  function defaultLevel(skillIds) {
    var lv = 0; skillIds.forEach(function (id) { (MAP[id] || []).forEach(function (m) { lv = Math.max(lv, LV[m.level]); }); });
    return lv ? 'L' + lv : '';
  }

  /* ── 演示数据（本机浏览器） ── */
  var KEY = 'teachPlanDemo.v1';
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var st = load() || { course: (K.courses.find(function (c) { return c.name === '模拟导游'; }) || K.courses[0]).id, plans: {}, tasks: [], evals: {} };
  var tab = 'plan', editing = null, openDet = {}, addFor = null, openTask = null;

  function course() { return K.courses.find(function (c) { return c.id === st.course; }); }
  function plan() {
    var c = course();
    if (!st.plans[c.id]) {
      st.plans[c.id] = { sessions: c.tasks.map(function (t) {
        var ids = t.skills.map(function (s) { return s.id; });
        return { id: uid('S'), name: t.name, nodes: t.skills.map(function (s) { return { id: s.id, name: s.name, type: '技能' }; }), level: defaultLevel(ids), skipped: false, prepped: false };
      }) };
      save();
    }
    return st.plans[c.id];
  }
  function stdSkillsOf(sess) { return sess.nodes.filter(function (n) { return n.type === '技能'; }); }
  function uncovered(p) {
    var used = {}; p.sessions.forEach(function (s) { if (!s.skipped) stdSkillsOf(s).forEach(function (n) { used[n.id] = 1; }); });
    var out = []; course().tasks.forEach(function (t) { t.skills.forEach(function (s) { if (!used[s.id]) out.push(s); }); });
    return out;
  }

  /* ═══ 渲染 ═══ */
  function render() {
    var h = '<div class="bar"><span class="note">标准课程</span><select id="courseSel">' +
      ['专业基础', '专业核心', '专业拓展'].map(function (cat) {
        var cs = K.courses.filter(function (c) { return c.category === cat; }); if (!cs.length) return '';
        return '<optgroup label="' + cat + '课程">' + cs.map(function (c) { return '<option value="' + c.id + '"' + (c.id === st.course ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</optgroup>';
      }).join('') + '</select><span class="note">' + esc(K.name) + ' 知识体系</span><span class="sp"></span>' +
      '<button class="btn-s" data-act="reset" type="button">重置演示数据</button></div>' +
      '<div class="tabs">' + [['plan', '授课计划'], ['task', '任务与评价'], ['reach', '班级达到情况']].map(function (t) {
        return '<button class="tab' + (tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '" type="button">' + t[1] + '</button>';
      }).join('') + '</div>';
    h += tab === 'plan' ? viewPlan() : tab === 'task' ? viewTasks() : viewReach();
    $('#body').innerHTML = h;
  }

  function viewPlan() {
    var p = plan(), un = uncovered(p), total = course().tasks.reduce(function (a, t) { return a + t.skills.length; }, 0);
    var live = p.sessions.filter(function (s) { return !s.skipped; });
    var mine = p.sessions.reduce(function (a, s) { return a + s.nodes.filter(function (n) { return n.type === '个人'; }).length; }, 0);
    var h = '<div class="sum"><span>课次 <b>' + live.length + '</b>' + (live.length < p.sessions.length ? '（跳过 ' + (p.sessions.length - live.length) + '）' : '') + '</span>' +
      '<span>覆盖标准技能 <b>' + (total - un.length) + '/' + total + '</b></span><span>个人节点 <b>' + mine + '</b></span>' +
      '<span>已备课 <b>' + live.filter(function (s) { return s.prepped; }).length + '</b></span></div>';
    if (un.length) {
      h += '<div class="warnbox">以下标准技能未在授课计划中覆盖（仅提示，可不处理）：<br>' + un.map(function (s) {
        return '<span class="it">' + esc(s.name) + ' <select data-addback="' + s.id + '"><option value="">加入课次…</option>' +
          live.map(function (x, i) { return '<option value="' + x.id + '">第 ' + (i + 1) + ' 次</option>'; }).join('') + '</select></span>';
      }).join('') + '</div>';
    }
    var n = 0;
    h += '<div class="card">' + p.sessions.map(function (s, i) {
      var no = s.skipped ? '—' : String(++n).padStart(2, '0');
      var tasks = st.tasks.filter(function (t) { return t.sessionId === s.id; }).length;
      var skills = stdSkillsOf(s);
      return '<div class="sess' + (s.skipped ? ' skip' : '') + '"><div class="no">' + no + '</div><div>' +
        '<div class="nm">' + (editing === s.id ? '<input data-rename="' + s.id + '" value="' + esc(s.name) + '">' : esc(s.name) + ' <button class="btn-s" data-act="rename" data-s="' + s.id + '" type="button" title="改名称">✎</button>') + '</div>' +
        '<div class="meta"><span>目标等级 <select data-level="' + s.id + '"><option value="">请选择</option>' + LEVELS.map(function (l) { return '<option' + (s.level === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select></span>' +
          (s.level && s.level === defaultLevel(skills.map(function (x) { return x.id; })) ? '<span>（默认：课次内技能经已确认映射的最高服务等级）</span>' : '') +
          '<span>' + (s.prepped ? '<span class="pill good">已备课</span>' : '<span class="pill k">未备课</span>') + '</span><span>任务 ' + tasks + '</span>' +
          '<button class="btn-s" data-act="det" data-s="' + s.id + '" type="button">' + (openDet[s.id] ? '收起依据 ▴' : '技能与能力 ▾') + '</button></div>' +
        '<div class="nodes">' + s.nodes.map(function (nd, k) {
          return '<span class="nd' + (nd.type === '个人' ? ' mine' : '') + '" title="' + esc(nd.type === '个人' ? '个人节点，挂在「' + ((SK[nd.parent] || {}).s || {}).name + '」下' : '标准技能') + '">' +
            '<em>' + (nd.type === '个人' ? '个人' : '技能') + '</em>' + esc(nd.name) + '<button class="x" data-rmnode="' + s.id + '|' + k + '" type="button" aria-label="移除">×</button></span>';
        }).join('') + '</div>' +
        (addFor === s.id ? '<div class="addp">个人节点 <input id="pName" placeholder="名称，如：站位讲解常见失误"> 挂在 <select id="pParent">' +
          skills.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('') + '</select>' +
          '<button class="btn-s" data-act="addp" data-s="' + s.id + '" type="button">添加</button><button class="btn-s" data-act="addcancel" type="button">取消</button></div>' : '') +
        '</div><div class="ops"><div class="row">' +
          '<button class="btn-s" data-act="up" data-i="' + i + '" type="button"' + (i ? '' : ' disabled') + '>↑</button><button class="btn-s" data-act="down" data-i="' + i + '" type="button"' + (i < p.sessions.length - 1 ? '' : ' disabled') + '>↓</button>' +
          '<button class="btn-s" data-act="skip" data-s="' + s.id + '" type="button">' + (s.skipped ? '恢复' : '跳过') + '</button></div>' +
          (s.skipped ? '' : '<div class="row"><button class="btn-s" data-act="addpopen" data-s="' + s.id + '" type="button"' + (skills.length ? '' : ' disabled') + '>＋ 个人节点</button>' +
            '<button class="btn-s" data-act="prep" data-s="' + s.id + '" type="button">备课</button><button class="btn-p" data-act="taskopen" data-s="' + s.id + '" type="button">发布任务</button></div>') +
        '</div>' + (openDet[s.id] ? '<div class="det">' + detail(s) + '</div>' : '') + '</div>';
    }).join('') + '<div style="padding:12px 16px"><button class="btn-s" data-act="addsess" type="button">＋ 新增课次</button></div></div>' +
      '<p class="note" style="margin-top:10px">个人节点只属于本人，始终挂在某个标准技能下；用到它的任务评价会汇总到该标准技能。</p>';
    return h;
  }
  function detail(s) {
    var skills = stdSkillsOf(s);
    if (!skills.length) return '本课次没有标准技能。';
    return skills.map(function (n) {
      var x = SK[n.id], maps = MAP[n.id] || [];
      return '<div style="margin-bottom:6px"><b>' + esc(n.name) + '</b>：' + esc(x.s.require || '') +
        '<br>支撑能力：' + (maps.length ? maps.map(function (m) { return '<span class="ab">' + esc(ABL[m.abl].name) + ' ' + m.level + '（' + m.type + '）</span>'; }).join('、') : '<span class="note">暂无已确认映射</span>') + '</div>';
    }).join('');
  }
  function criteria(nodes, level) {
    return nodes.map(function (n) {
      if (n.type === '个人') return '<div><span class="t">' + esc(n.name) + '</span>（个人节点）：按教师补充内容评价，汇总到「' + esc(SK[n.parent].s.name) + '」</div>';
      var x = SK[n.id], maps = MAP[n.id] || [];
      var lvDesc = maps.map(function (m) { var a = ABL[m.abl]; return level && a.levels[level] ? a.name + ' ' + level + '：' + a.levels[level] : ''; }).filter(Boolean);
      return '<div><span class="t">' + esc(n.name) + '</span><br>达成结果：' + esc(x.s.result || '—') + (lvDesc.length ? '<br>等级说明：' + esc(lvDesc.join('；')) : '') + '</div>';
    }).join('<div style="height:6px"></div>');
  }

  function viewTasks() {
    var ts = st.tasks.filter(function (t) { return t.courseId === st.course; });
    if (!ts.length) return '<div class="card empty" style="padding:28px">还没有任务。在「授课计划」中点课次的「发布任务」。</div>';
    return '<div class="card">' + ts.map(function (t) {
      var ev = st.evals[t.id] || {}, done = STUDENTS.filter(function (u) { return ev[u] && Object.keys(ev[u]).length; }).length;
      var open = openTask === t.id;
      var h = '<div class="task"><div class="th"><b>' + esc(t.title) + '</b><span class="pill core">目标 ' + (t.level || '未设') + '</span>' +
        '<span class="note">' + t.nodes.length + ' 个节点 · 已提交 ' + STUDENTS.length + '/' + STUDENTS.length + ' · 已评价 ' + done + '/' + STUDENTS.length + '</span><span class="sp"></span>' +
        '<button class="btn-s" data-act="evaltoggle" data-t="' + t.id + '" type="button">' + (open ? '收起' : '评价') + '</button></div>';
      if (open) {
        h += '<details class="crit-box"><summary style="cursor:pointer">评价依据（来自图谱）</summary>' + criteria(t.nodes, t.level) + '</details>' +
          '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>学生</th><th>提交</th>' + t.nodes.map(function (n) { return '<th>' + esc(n.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          STUDENTS.map(function (u) {
            return '<tr><td>' + u + '</td><td class="note">已提交（演示）</td>' + t.nodes.map(function (n) {
              var v = (ev[u] || {})[n.id] || '';
              return '<td><select data-eval="' + t.id + '|' + u + '|' + n.id + '"><option value="">未评价</option><option' + (v === '未达到' ? ' selected' : '') + '>未达到</option>' +
                LEVELS.map(function (l) { return '<option' + (v === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select></td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table></div><p class="note">按节点记录学生达到的等级；只有已评价的记录进入「班级达到情况」。</p>';
      }
      return h + '</div>';
    }).join('') + '</div>';
  }

  function viewReach() {
    var ts = st.tasks.filter(function (t) { return t.courseId === st.course; });
    // 节点 → { name, target, students: {u: 最高等级} }；个人节点汇总到标准上级
    var rows = {}, order = [];
    ts.forEach(function (t) {
      t.nodes.forEach(function (n) {
        var key = n.type === '个人' ? n.parent : n.id;
        if (!rows[key]) { rows[key] = { name: SK[key] ? SK[key].s.name : n.name, target: t.level, per: {}, viaMine: false }; order.push(key); }
        if (n.type === '个人') rows[key].viaMine = true;
        if (t.level && (!rows[key].target || LV[t.level] > LV[rows[key].target])) rows[key].target = t.level;
        var ev = st.evals[t.id] || {};
        STUDENTS.forEach(function (u) {
          var v = (ev[u] || {})[n.id]; if (!v) return;
          var cur = rows[key].per[u], score = v === '未达到' ? 0 : LV[v];
          if (cur == null || score > cur) rows[key].per[u] = score;
        });
      });
    });
    if (!order.length) return '<div class="card empty" style="padding:28px">还没有任务与评价记录。</div>';
    function cell(score, target) {
      if (score == null) return '<span class="lv na">未评价</span>';
      if (score === 0) return '<span class="lv no">未达到</span>';
      return '<span class="lv ' + (target && score >= LV[target] ? 'ok' : 'low') + '">L' + score + '</span>';
    }
    return '<p class="note" style="margin-bottom:10px">只来自已评价的任务；未评价的学生不计入「达到目标」的分母。个人节点的评价汇总到它的标准上级技能。</p>' +
      '<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>节点（标准技能）</th><th>目标</th><th>已评价</th><th>达到目标</th>' + STUDENTS.map(function (u) { return '<th>' + u + '</th>'; }).join('') + '</tr></thead><tbody>' +
      order.map(function (k) {
        var r = rows[k], ev = Object.keys(r.per), ok = ev.filter(function (u) { return r.target && r.per[u] >= LV[r.target]; }).length;
        return '<tr><td><b>' + esc(r.name) + '</b>' + (r.viaMine ? ' <span class="note">含个人节点</span>' : '') + '</td><td class="mono">' + (r.target || '—') + '</td>' +
          '<td class="mono">' + ev.length + '/' + STUDENTS.length + '</td><td class="mono">' + (ev.length ? ok + '/' + ev.length : '—') + '</td>' +
          STUDENTS.map(function (u) { return '<td>' + cell(r.per[u], r.target) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* ── 发布任务弹窗 ── */
  function openTaskDlg(sid) {
    var p = plan(), s = p.sessions.find(function (x) { return x.id === sid; }), idx = p.sessions.filter(function (x) { return !x.skipped; }).indexOf(s) + 1;
    var m = document.createElement('div'); m.className = 'mask'; m.id = 'taskMask';
    m.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-label="发布任务"><h3>发布任务 · 第 ' + idx + ' 次课</h3>' +
      '<label class="f">任务名称</label><input type="text" id="tTitle" value="' + esc('第 ' + idx + ' 次课任务：' + s.name.slice(0, 24)) + '">' +
      '<label class="f">评价的节点（默认为本课次节点）</label>' + s.nodes.map(function (n, k) {
        return '<label class="chk"><input type="checkbox" data-tn="' + k + '" checked>' + (n.type === '个人' ? '［个人］' : '') + esc(n.name) + '</label>';
      }).join('') +
      '<label class="f">目标等级</label><select id="tLevel"><option value="">未设</option>' + LEVELS.map(function (l) { return '<option' + (s.level === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select>' +
      '<label class="f">评价依据（自动带出，学生可见）</label><div class="crit-box" id="tCrit">' + criteria(s.nodes, s.level) + '</div>' +
      '<div class="acts"><button class="btn ghost" data-dlg="cancel" type="button">取消</button><button class="btn" data-dlg="ok" type="button">发布</button></div></div>';
    document.body.appendChild(m);
    m.addEventListener('change', function (e) {
      if (e.target.id === 'tLevel' || e.target.hasAttribute('data-tn')) $('#tCrit').innerHTML = criteria(picked(), $('#tLevel').value);
    });
    function picked() { return s.nodes.filter(function (n, k) { return m.querySelector('[data-tn="' + k + '"]').checked; }); }
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-dlg]'); if (!b && e.target !== m) return;
      if (b && b.getAttribute('data-dlg') === 'ok') {
        var nodes = picked(); if (!nodes.length) { toast('请至少选择一个节点'); return; }
        st.tasks.push({ id: uid('T'), courseId: st.course, sessionId: s.id, title: $('#tTitle').value.trim() || '未命名任务', nodes: nodes.map(function (n) { return Object.assign({}, n); }), level: $('#tLevel').value, createdAt: new Date().toISOString() });
        save(); toast('已发布，学生可在任务中提交（演示：已全部提交）');
      }
      m.remove(); render();
    });
  }

  /* ── 按课次备课：带入工作台（与能力图谱「带入备课」同一格式） ── */
  function prep(sid) {
    var p = plan(), c = course(), s = p.sessions.find(function (x) { return x.id === sid; });
    var idx = p.sessions.filter(function (x) { return !x.skipped; }).indexOf(s) + 1;
    var skills = stdSkillsOf(s);
    var tree = skills.map(function (n) {
      return { id: n.id, type: '技能', name: n.name, children: s.nodes.filter(function (x) { return x.type === '个人' && x.parent === n.id; }).map(function (x) { return { id: x.id, type: '个人节点', name: x.name, children: [] }; }) };
    });
    var counts = { '技能': skills.length }, mine = s.nodes.length - skills.length; if (mine) counts['个人节点'] = mine;
    var parents = []; skills.forEach(function (n) { var x = SK[n.id], path = [K.name, x.c.category + '课程', x.c.name, x.t.name].join(' › '); if (parents.indexOf(path) < 0) parents.push(path); });
    var name = '第 ' + idx + ' 次课 · ' + s.name;
    var payload = {
      current: { type: '课次', name: name, id: s.id }, chain: [{ type: '专业', name: K.name }, { type: '课程', name: c.name }, { type: '课次', name: name }],
      tree: tree, total: s.nodes.length, counts: counts, children: tree.map(function (n) { return { type: n.type, name: n.name }; }),
      ks: skills.length ? { tree: { id: 'M', type: '专业', name: K.name, children: [{ id: c.id, type: '课程', name: c.name, children: [] }] }, skillCount: skills.length, otherMajors: [], parents: parents } : null
    };
    try { localStorage.setItem('kmapToWorkbench', JSON.stringify(payload)); } catch (e) { toast('带入失败：浏览器不允许本地存储'); return; }
    s.prepped = true; save();
    location.href = UI.link('workbench.html');
  }

  /* ═══ 事件 ═══ */
  var body = $('#body');
  body.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-tab]'))) { tab = t.getAttribute('data-tab'); render(); return; }
    if ((t = e.target.closest('[data-rmnode]'))) {
      var a = t.getAttribute('data-rmnode').split('|'), s = plan().sessions.find(function (x) { return x.id === a[0]; }), rm = s.nodes[+a[1]];
      s.nodes.splice(+a[1], 1);
      if (rm.type === '技能') s.nodes = s.nodes.filter(function (x) { return !(x.type === '个人' && x.parent === rm.id); });   // 去掉挂在它下面的个人节点
      save(); render(); return;
    }
    if (!(t = e.target.closest('[data-act]'))) return;
    var act = t.getAttribute('data-act'), p = plan(), sid = t.getAttribute('data-s'), sess = sid && p.sessions.find(function (x) { return x.id === sid; });
    if (act === 'reset') { if (confirm('清空本机的授课计划、任务与评价演示数据？')) { localStorage.removeItem(KEY); st = { course: st.course, plans: {}, tasks: [], evals: {} }; toast('已重置'); render(); } return; }
    if (act === 'up' || act === 'down') { var i = +t.getAttribute('data-i'), j = act === 'up' ? i - 1 : i + 1, tmp = p.sessions[i]; p.sessions[i] = p.sessions[j]; p.sessions[j] = tmp; }
    else if (act === 'skip') sess.skipped = !sess.skipped;
    else if (act === 'rename') { editing = sid; render(); var inp = body.querySelector('[data-rename]'); if (inp) { inp.focus(); inp.select(); } return; }
    else if (act === 'det') openDet[sid] = !openDet[sid];
    else if (act === 'addpopen') { addFor = sid; render(); var pn = $('#pName'); if (pn) pn.focus(); return; }
    else if (act === 'addcancel') addFor = null;
    else if (act === 'addp') {
      var nm = ($('#pName').value || '').trim(); if (!nm) { toast('请填写个人节点名称'); return; }
      sess.nodes.push({ id: uid('P'), name: nm, type: '个人', parent: $('#pParent').value }); addFor = null; toast('已添加到本人全景图谱，并加入本课次');
    }
    else if (act === 'addsess') p.sessions.push({ id: uid('S'), name: '新课次', nodes: [], level: '', skipped: false, prepped: false });
    else if (act === 'prep') { prep(sid); return; }
    else if (act === 'taskopen') { openTaskDlg(sid); return; }
    else if (act === 'evaltoggle') { var tid = t.getAttribute('data-t'); openTask = openTask === tid ? null : tid; render(); return; }
    save(); render();
  });
  body.addEventListener('change', function (e) {
    var t = e.target, p = plan();
    if (t.id === 'courseSel') { st.course = t.value; save(); addFor = editing = null; render(); return; }
    if (t.hasAttribute('data-level')) { p.sessions.find(function (x) { return x.id === t.getAttribute('data-level'); }).level = t.value; save(); render(); return; }
    if (t.hasAttribute('data-addback') && t.value) {
      var sk = SK[t.getAttribute('data-addback')].s, s = p.sessions.find(function (x) { return x.id === t.value; });
      s.nodes.push({ id: sk.id, name: sk.name, type: '技能' }); save(); render(); return;
    }
    if (t.hasAttribute('data-eval')) {
      var a = t.getAttribute('data-eval').split('|'), ev = st.evals[a[0]] = st.evals[a[0]] || {}, u = ev[a[1]] = ev[a[1]] || {};
      if (t.value) u[a[2]] = t.value; else delete u[a[2]];
      save(); return;
    }
  });
  body.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-rename') && (e.key === 'Enter' || e.key === 'Escape')) {
      if (e.key === 'Enter') { var s = plan().sessions.find(function (x) { return x.id === t.getAttribute('data-rename'); }); s.name = t.value.trim() || s.name; save(); }
      editing = null; render();
    }
    if (t.id === 'pName' && e.key === 'Enter') body.querySelector('[data-act="addp"]').click();
  });
  body.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-rename')) setTimeout(function () {
      if (editing !== t.getAttribute('data-rename')) return;
      var s = plan().sessions.find(function (x) { return x.id === editing; }); if (s) { s.name = t.value.trim() || s.name; save(); }
      editing = null; render();
    }, 100);
  });

  UI.boot({ portal: 'teacher', active: '' });   // 原型页：不加入菜单，侧栏无选中项
  render();
})();
</script>
</body>
</html>
