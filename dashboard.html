<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据概览</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
/* 管理端数据概览：教学基本概况 / 教学运行统计 / 教师统计 / 专业统计 / 课程统计 */
.db-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:12px 16px;margin-bottom:14px}
.db-bar .sp{flex:1}
.db-bar .cyc{font-size:12.5px;color:var(--muted);background:var(--card-2);border-radius:8px;padding:5px 10px}
.db-bar .lk{font-size:12.5px}
.db-sec{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:16px 18px;margin-bottom:14px}
.db-st{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px}
.db-st .no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11.5px}
.db-st .sp{flex:1}
.db-sub{font-size:12.5px;font-weight:600;color:var(--ink-2);margin:4px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card-2);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;color:var(--ink);line-height:1.25}
.kpi .v small{font-size:12px;font-weight:400;color:var(--ink-2);margin-left:2px}
.kpi .d{font-size:11.5px;margin-top:2px}
.up{color:var(--good)}.down{color:var(--warn-ink)}.flat{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.panel2{background:var(--card-2);border-radius:10px;padding:12px 14px;min-width:0}
.ph2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.ph2 .sp{flex:1}
.ph2 .lk{font-size:12px;font-weight:400}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.tabs-s{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs-s button{border:1px solid var(--rule);background:var(--card);border-radius:7px;padding:3px 10px;font:inherit;font-size:12px;color:var(--ink-2);cursor:pointer}
.tabs-s button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.risk{display:flex;justify-content:space-around;align-items:center;padding:6px 0}
.risk .r{text-align:center;cursor:pointer}
.risk .r .cap{font-size:12px;color:var(--muted);margin-top:4px}
.don{display:flex;align-items:center;gap:18px}
.don .rows{flex:1;font-size:12.5px}
.don .rows div{display:flex;align-items:center;gap:8px;padding:5px 0}
.don .rows .n{margin-left:auto;color:var(--ink-2);font-family:var(--mono);font-size:12px}
.band{font-size:12.5px}
.band div{display:flex;align-items:center;gap:8px;padding:4px 0}
.band .n{margin-left:auto;font-weight:600}
.avg{background:var(--card);border-radius:8px;text-align:center;padding:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.avg b{font-size:18px;color:var(--brand-ink);margin-left:6px}
.top5 div{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px}
.top5 .rk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--brand);color:#fff;flex:none}
.top5 .rk.g{background:var(--rule);color:var(--ink-2)}
.top5 .nm{width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5 .bar{flex:1;height:10px;border-radius:5px;background:var(--card);overflow:hidden}
.top5 .bar span{display:block;height:100%;background:linear-gradient(90deg,#4f7cff,#7aa2ff);border-radius:5px}
.top5 .v{width:48px;text-align:right;font-family:var(--mono);font-size:12px}
.stk{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--card);margin:6px 0}
.stk span{display:block;height:100%}
.stk-l{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.stk-l b{font-weight:500;color:var(--ink-2)}
.hb div{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.hb .nm{width:120px;flex:none;text-align:right;color:var(--brand-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{flex:1;height:12px;border-radius:4px;overflow:hidden;display:flex;background:var(--card)}
.hb .bar span{display:flex;align-items:center;justify-content:center;height:100%;font-size:10.5px;color:#fff;font-weight:600;overflow:hidden}
.hb .v{width:96px;flex:none;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.hours{background:#ecfdf5;border-radius:10px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.hours .k{font-size:12.5px;color:var(--muted)}
.hours .v{font-size:32px;font-weight:700;margin:6px 0}
.hours .v small{font-size:13px;font-weight:400;margin-left:4px}
.empty3{font-size:12.5px;color:var(--muted);padding:18px 0;text-align:center}
svg text{font-family:inherit}
@media (max-width:1100px){.kpis,.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop"><div class="ptop-r"><div class="pt-l"><h1 class="pt-t">数据概览</h1></div></div></div>
    <div class="body" id="body"></div>
  </div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script src="js/teacher-kit.js"></script>
<script src="js/teach-reach.js"></script>
<script>
(function () {
  'use strict';
  UI.boot({ portal: 'admin', active: 'dash' });
  var esc = TK.esc, S = TK.load(), E = S.edu;
  var C = ['#4f7cff', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6'];
  var F = { p: 'term', off: 0, scope: '', trend: 0 };
  // 专业负责人（没有教务维护权限）：只看自己负责的专业（含下级），不提供「全校」
  var LEAD = (function () {
    var c = DEMO.getState(), id = UI.currentIdentity(c);
    if (UI.hasPerm(c, id, 'edu:base:manage')) return null;
    var names = {}; c.assignments.filter(function (a) { return a.accountId === id.account.id && a.roleId === 'R-MAJOR-LEAD'; }).forEach(function (a) {
      ((a.teachingScope || {}).majorIds || []).forEach(function (mid) { var m = c.majors.filter(function (x) { return x.id === mid; })[0]; if (m) names[m.name] = 1; });
    });
    return E.majors.filter(function (m) { return names[m.name]; }).map(function (m) { return m.id; });
  })();
  if (LEAD) F.scope = LEAD[0] || '__none__';

  /* ── 基础数据 ── */
  function teachers() { try { return DEMO.getState().accounts.filter(function (a) { return a.kind === '教师' && a.status === '正常'; }).map(function (a) { return a.name; }); } catch (e) { return ['李老师', '王老师', '何老师']; } }
  function cls(id) { return S.classes.filter(function (c) { return c.id === id; })[0] || {}; }
  function plan(id) { return S.plans.filter(function (p) { return p.id === id; })[0]; }
  function majorOfPlan(p) { return cls(p.classId).majorId; }
  function inScopeMajor(mid) { return !F.scope || TK.majorSubIds(E, F.scope).indexOf(mid) >= 0; }
  function scopedPlans() { return S.plans.filter(function (p) { return inScopeMajor(majorOfPlan(p)); }); }
  function scopedTeachers() {
    var all = teachers();
    if (!F.scope) return all;
    var t = {}; scopedPlans().forEach(function (p) { t[p.teacher] = 1; });
    return all.filter(function (n) { return t[n]; });
  }
  function scopedLessons() { var ids = {}; scopedPlans().forEach(function (p) { ids[p.id] = 1; }); return S.courses.filter(function (c) { return ids[c.planId]; }); }
  function teacherOf(c) { var p = plan(c.planId); return p ? p.teacher : ''; }
  function scopedResources() { var t = {}; scopedTeachers().forEach(function (n) { t[n] = 1; }); return S.resources.filter(function (r) { return t[r.owner || '李老师']; }); }

  /* ── 周期：本周 / 本月 / 本学期 / 本学年，可前后翻 ── */
  function shiftRange(r, k) {
    if (!k) return r;
    var a = new Date(r.a), b = new Date(r.b);
    if (F.p === 'week') { a.setDate(a.getDate() + 7 * k); b.setDate(b.getDate() + 7 * k); }
    else if (F.p === 'month') { a = new Date(a.getFullYear(), a.getMonth() + k, 1); b = new Date(a.getFullYear(), a.getMonth() + 1, 1); }
    else if (F.p === 'year') { a.setFullYear(a.getFullYear() + k); b.setFullYear(b.getFullYear() + k); }
    else { // 学期：按学期表
      var terms = E.terms.slice().sort(function (x, y) { return x.start < y.start ? -1 : 1; });
      var i = terms.findIndex(function (t) { return t.year + ' ' + t.term === TK.TERM; }), t = terms[i + k];
      if (t) { a = new Date(t.start + 'T00:00:00'); b = new Date(t.end + 'T00:00:00'); b.setDate(b.getDate() + 1); }
      else { a.setMonth(a.getMonth() + 6 * k); b.setMonth(b.getMonth() + 6 * k); }
    }
    return { a: a, b: b };
  }
  function cur() { return shiftRange(TK.periodRange(F.p), F.off); }
  function prev() { return shiftRange(TK.periodRange(F.p), F.off - 1); }
  function inR(s, r) { if (!s) return false; var d = new Date(String(s).replace(' ', 'T')); return d >= r.a && d < r.b; }
  function d10(d) { return TK.fmt(d, false); }
  function cycleLabel(r) {
    if (F.p === 'term') { var t = E.terms.filter(function (x) { return x.start === d10(r.a); })[0]; if (t) return t.year + ' ' + t.term; }
    if (F.p === 'year') return r.a.getFullYear() + '-' + (r.a.getFullYear() + 1) + ' 学年';
    return d10(r.a) + ' ~ ' + d10(new Date(r.b - 864e5));
  }
  var UNIT = { week: '周', month: '月', term: '学期', year: '学年' };
  // 趋势图的时间刻度：周按天、月按周、学期 / 学年按月
  function buckets(r) {
    var out = [], a = new Date(r.a);
    if (F.p === 'week') { for (var i = 0; i < 7; i++) { var x = new Date(a); x.setDate(a.getDate() + i); var y = new Date(x); y.setDate(x.getDate() + 1); out.push({ a: x, b: y, l: (x.getMonth() + 1) + '/' + x.getDate() }); } }
    else if (F.p === 'month') { var s = new Date(a), n = 1; while (s < r.b) { var e = new Date(s); e.setDate(s.getDate() + 7); if (e > r.b) e = new Date(r.b); out.push({ a: new Date(s), b: e, l: '第' + (n++) + '周' }); s = e; } }
    else { var m = new Date(a.getFullYear(), a.getMonth(), 1); while (m < r.b) { var nx = new Date(m.getFullYear(), m.getMonth() + 1, 1); out.push({ a: m < r.a ? r.a : m, b: nx > r.b ? r.b : nx, l: (m.getMonth() + 1) + '月' }); m = nx; } }
    return out;
  }

  /* ── 指标 ── */
  function resFiles(r) { var out = []; scopedResources().forEach(function (x) { if (inR(x.createdAt, r)) (x.files || []).forEach(function (f) { out.push({ f: f, r: x }); }); }); return out; }
  function lessons(r) { return scopedLessons().filter(function (c) { return inR(c.start, r); }); }
  function published(r) { return scopedLessons().filter(function (c) { return c.publish && inR(c.publish.at, r); }); }
  function pubFiles(r) { return published(r).reduce(function (a, c) { return a + (c.publish.fileIds || []).length; }, 0); }
  function pubTasks(r) { return published(r).filter(function (c) { return c.publish.task && c.publish.task.on; }).length; }
  function subs(r) { var o = []; scopedLessons().forEach(function (c) { (c.submissions || []).forEach(function (s) { if (s.status !== '未提交' && inR(s.at, r)) o.push({ c: c, s: s }); }); }); return o; }
  function evals(r) { var o = []; scopedLessons().forEach(function (c) { (c.submissions || []).forEach(function (s) { if (s.teacher && inR(s.teacher.at, r)) o.push({ c: c, s: s }); }); }); return o; }
  function fbScore(f) { if (f.scores) { var v = Object.keys(f.scores).map(function (k) { return f.scores[k]; }); return v.reduce(function (a, b) { return a + b; }, 0) / v.length; } return f.overall || 0; }
  function fbAvg(list) { return list.length ? list.reduce(function (a, f) { return a + fbScore(f); }, 0) / list.length : null; }
  function feedbacks(r, cs) { var o = []; (cs || scopedLessons()).forEach(function (c) { (c.feedbacks || []).forEach(function (f) { if (inR(f.at, r)) o.push(f); }); }); return o; }
  // 授课时长只算已经开始的课次（已结束 + 授课中），未上的课不计
  function held(r) { var now = new Date(); return lessons(r).filter(function (c) { return new Date(c.start.replace(' ', 'T')) <= now; }); }
  function hoursOf(c) { return (new Date(c.end.replace(' ', 'T')) - new Date(c.start.replace(' ', 'T'))) / 3600e3; }
  // 教师在周期内的各项动作
  function activity(r) {
    var A = {}; scopedTeachers().forEach(function (n) { A[n] = { gen: 0, pub: 0, eval: 0, lesson: 0 }; });
    scopedResources().forEach(function (x) { var n = x.owner || '李老师'; if (A[n] && inR(x.createdAt, r)) A[n].gen++; });
    published(r).forEach(function (c) { var n = teacherOf(c); if (A[n]) A[n].pub++; });
    evals(r).forEach(function (o) { var n = teacherOf(o.c); if (A[n]) A[n].eval++; });
    scopedLessons().forEach(function (c) { var n = teacherOf(c); if (A[n] && c.source !== '排课' && inR(c.createdAt, r)) A[n].lesson++; });
    Object.keys(A).forEach(function (n) { var a = A[n]; a.active = a.gen + a.pub + a.eval + a.lesson > 0; });
    return A;
  }
  // 低分课次：课程反馈均分低于 3 分（满分 5 分，阈值可由学校设置）
  var LOW = 3;
  function lowLessons(r) { return lessons(r).concat(published(r)).filter(function (c, i, a) { return a.indexOf(c) === i; }).filter(function (c) { var f = feedbacks(r, [c]); var v = fbAvg(f); return v != null && v < LOW; }); }

  /* ── 图表（SVG） ── */
  function lineChart(series, labels, h) {
    var W = 520, H = h || 200, L = 32, R = 10, T = 12, B = 24, mx = 0;
    series.forEach(function (s) { s.v.forEach(function (v) { if (v > mx) mx = v; }); });
    mx = mx <= 4 ? 4 : Math.ceil(mx / 4) * 4;
    var x = function (i) { return labels.length > 1 ? L + (W - L - R) * i / (labels.length - 1) : (L + W - R) / 2; }, y = function (v) { return T + (H - T - B) * (1 - v / mx); };
    var g = '';
    for (var k = 0; k <= 4; k++) { var vv = mx * k / 4; g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(vv) + '" y2="' + y(vv) + '" stroke="var(--rule)" stroke-dasharray="' + (k ? '3 3' : '') + '"/><text x="' + (L - 6) + '" y="' + (y(vv) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + (Math.round(vv * 10) / 10) + '</text>'; }
    labels.forEach(function (l, i) { g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + esc(l) + '</text>'; });
    series.slice().reverse().forEach(function (s, ri) {   // 第一条（总量）最后画、加粗，避免被重合的线盖住
      g += '<polyline fill="none" stroke="' + s.c + '" stroke-width="' + (ri === series.length - 1 && series.length > 1 ? 3 : 2) + '" points="' + s.v.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ') + '"/>';
      s.v.forEach(function (v, i) { g += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.8" fill="' + s.c + '"><title>' + esc(s.n + ' · ' + labels[i] + '：' + (Math.round(v * 10) / 10)) + '</title></circle>'; });
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img">' + g + '</svg>';
  }
  function legend(items) { return '<div class="lgd">' + items.map(function (s) { return '<span><i style="background:' + s.c + '"></i>' + esc(s.n) + '</span>'; }).join('') + '</div>'; }
  function donut(parts, cap, size) {
    var S0 = size || 130, r = S0 / 2 - 10, cx = S0 / 2, tot = parts.reduce(function (a, p) { return a + p.v; }, 0), a0 = -Math.PI / 2, g = '';
    if (!tot) g = '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="var(--rule)" stroke-width="16"/>';
    else parts.forEach(function (p) {
      if (!p.v) return;
      var a1 = a0 + 2 * Math.PI * p.v / tot, large = a1 - a0 > Math.PI ? 1 : 0;
      if (p.v === tot) g += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + p.c + '" stroke-width="16"/>';
      else g += '<path d="M' + (cx + r * Math.cos(a0)) + ' ' + (cx + r * Math.sin(a0)) + 'A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + (cx + r * Math.cos(a1)) + ' ' + (cx + r * Math.sin(a1)) + '" fill="none" stroke="' + p.c + '" stroke-width="16"><title>' + esc(p.n + '：' + p.v) + '</title></path>';
      a0 = a1;
    });
    return '<svg viewBox="0 0 ' + S0 + ' ' + S0 + '" width="' + S0 + '" height="' + S0 + '" role="img">' + g + '<text x="' + cx + '" y="' + (cx - 4) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + esc(cap) + '</text><text x="' + cx + '" y="' + (cx + 18) + '" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">' + tot + '</text></svg>';
  }
  function gauge(v, max, unit, cap, col) {
    var r = 56, c = 2 * Math.PI * r, p = max ? Math.min(1, v / max) : 0;
    return '<svg viewBox="0 0 140 140" width="132" height="132" role="img"><circle cx="70" cy="70" r="' + r + '" fill="none" stroke="var(--rule)" stroke-width="10"/><circle cx="70" cy="70" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * p) + ' ' + c + '" transform="rotate(-90 70 70)"/>' +
      '<text x="70" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">' + v + esc(unit) + '</text><text x="70" y="92" text-anchor="middle" font-size="11" fill="var(--muted)">' + esc(cap) + '</text></svg>';
  }
  function radar(dims) {
    var cx = 160, cy = 120, R = 82, n = dims.length, pt = function (i, v) { var a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + R * v / 100 * Math.cos(a), cy + R * v / 100 * Math.sin(a)]; }, g = '';
    [25, 50, 75, 100].forEach(function (lv) { g += '<polygon points="' + dims.map(function (d, i) { return pt(i, lv).join(','); }).join(' ') + '" fill="none" stroke="var(--rule)"/>'; });
    dims.forEach(function (d, i) { var p = pt(i, 100), q = pt(i, 122); g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="var(--rule)"/><text x="' + q[0] + '" y="' + q[1] + '" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">' + esc(d.n) + '</text><text x="' + q[0] + '" y="' + (q[1] + 13) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + d.v + '</text>'; });
    g += '<polygon points="' + dims.map(function (d, i) { return pt(i, d.v).join(','); }).join(' ') + '" fill="rgba(79,124,255,.18)" stroke="#4f7cff" stroke-width="2"/>';
    return '<svg viewBox="0 0 320 250" width="100%" role="img">' + g + '</svg>';
  }
  function groupBars(groups, names) {
    var W = 520, H = 210, L = 28, B = 30, T = 16, mx = 1;
    groups.forEach(function (g) { g.v.forEach(function (v) { if (v > mx) mx = v; }); });
    mx = Math.ceil(mx / 5) * 5;
    var gw = (W - L - 10) / Math.max(1, groups.length), bw = Math.min(14, (gw - 16) / names.length), y = function (v) { return T + (H - T - B) * (1 - v / mx); }, g = '';
    for (var k = 0; k <= 5; k++) { var vv = mx * k / 5; g += '<line x1="' + L + '" x2="' + (W - 10) + '" y1="' + y(vv) + '" y2="' + y(vv) + '" stroke="var(--rule)" stroke-dasharray="' + (k ? '3 3' : '') + '"/><text x="' + (L - 6) + '" y="' + (y(vv) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + vv + '</text>'; }
    groups.forEach(function (gr, i) {

      var CS = '#4f7cff', CK = '#f59e0b', SP = scopedPlans();
      var tq = TR.compute(S, SP, r), tqp = TR.compute(S, SP, pr), tr = TR.rate(tq.ok, tq.pairs), trp = TR.rate(tqp.ok, tqp.pairs);
      var kq = TR.kpRate(TR.kpsAgg(S, SP, r.b, r.a)), kqp = TR.kpRate(TR.kpsAgg(S, SP, pr.b, pr.a));
      var mNames = F.scope ? TK.majorSubIds(E, F.scope).map(function (id) { return (E.majors.filter(function (m) { return m.id === id; })[0] || {}).name; }) : null;
      var imps = (S.improves || []).filter(function (x) { return x.status === '待处理' && (!mNames || mNames.indexOf(x.major) >= 0); });
      var weak = tq.abilities.filter(function (a) { return a.pairs; }).map(function (a) { return { n: a.name, r: TR.rate(a.ok, a.pairs), no: a.no }; }).sort(function (a, b) { return a.r - b.r; }).slice(0, 5);
      var go = function (q, txt) { return '<a class="lk" href="' + esc(UI.link('teach-quality.html?' + q, 'admin')) + '">' + txt + ' ›</a>'; };
      // 趋势：本周期内按刻度，累计到每个刻度末的达成率 / 掌握率，和每个刻度新增的评价人次
      var tb = buckets(r), now0 = new Date();
      var sv = tb.map(function (b) { if (b.a > now0) return null; var x = TR.compute(S, SP, { a: r.a, b: b.b }); return x.pairs ? TR.rate(x.ok, x.pairs) : null; });
      var kv = tb.map(function (b) { if (b.a > now0) return null; var x = TR.kpRate(TR.kpsAgg(S, SP, b.b, r.a)); return x.t ? x.r : null; });
      var bv = tb.map(function (b) { return TR.compute(S, SP, { a: b.a, b: b.b }).pairs; });
      var tW = 520, tL = 32, tR = 70, n0 = tb.length, xi = function (i) { return tL + (n0 <= 1 ? (tW - tL - tR) / 2 : (tW - tL - tR) * i / (n0 - 1)); };
      var line = function () {
        var H = 170, T = 10, B = 22, ih = H - T - B, y = function (v) { return T + ih * (1 - v / 100); };
        var g = '<svg viewBox="0 0 ' + tW + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="达成率趋势">';
        [0, 50, 100].forEach(function (v) { g += '<line x1="' + tL + '" x2="' + (tW - tR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--rule-2)"/><text x="' + (tL - 5) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="var(--muted)">' + v + '%</text>'; });
        var st = Math.max(1, Math.ceil(n0 / 8)); tb.forEach(function (b, i) { if (i % st === 0 || i === n0 - 1) g += '<text x="' + xi(i) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="var(--muted)">' + esc(b.l) + '</text>'; });
        [[sv, CS, '技能'], [kv, CK, '知识点']].forEach(function (S2) {
          var pts = S2[0].map(function (v, i) { return v == null ? null : [xi(i), y(v), v, i]; }).filter(Boolean);
          if (pts.length > 1) g += '<polyline points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '" fill="none" stroke="' + S2[1] + '" stroke-width="2"/>';
          pts.forEach(function (p) { g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="' + S2[1] + '" stroke="#fff" stroke-width="2"><title>' + esc(tb[p[3]].l) + ' · ' + S2[2] + ' ' + p[2] + '%</title></circle>'; });
          var lp = pts[pts.length - 1]; if (lp) g += '<text x="' + (lp[0] + 7) + '" y="' + (lp[1] + 4) + '" font-size="11" fill="var(--ink-2)">' + S2[2] + ' ' + lp[2] + '%</text>';
        });
        return g + '</svg>';
      };
      var bars = function () {
        var H = 90, T = 12, B = 6, ih = H - T - B, mx = Math.max.apply(null, bv.concat([1])), bw = Math.max(4, Math.min(20, (tW - tL - tR) / n0 - 6));
        var g = '<svg viewBox="0 0 ' + tW + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="新增评价人次"><line x1="' + tL + '" x2="' + (tW - tR) + '" y1="' + (T + ih) + '" y2="' + (T + ih) + '" stroke="var(--rule)"/>';
        bv.forEach(function (v, i) { var bh = v ? Math.max(3, ih * v / mx) : 0; if (bh) g += '<rect x="' + (xi(i) - bw / 2).toFixed(1) + '" y="' + (T + ih - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + CS + '" fill-opacity=".75"><title>' + esc(tb[i].l) + ' · 新增评价 ' + v + ' 人次</title></rect><text x="' + xi(i).toFixed(1) + '" y="' + (T + ih - bh - 3).toFixed(1) + '" font-size="10" text-anchor="middle" fill="var(--ink-2)">' + v + '</text>'; });
        return g + '</svg>';
      };
      // 各课程对比（本周期）
      var crs = SP.filter(function (p) { return tq.byPlan[p.id]; }).map(function (p) { var b = tq.byPlan[p.id], k = TR.kpRate(TR.kpsAgg(S, [p], r.b, r.a)); return { n: p.course + ' · ' + cls(p.classId).name, s: TR.rate(b.pairs - b.no, b.pairs), k: k.r }; });
      var hbar = function (v, c) { return '<span style="flex:1;height:9px;background:var(--card);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:' + (v || 0) + '%;background:' + c + ';border-radius:4px"></i></span><span style="width:38px;text-align:right;font-size:11.5px;color:var(--ink-2)">' + (v == null ? '—' : v + '%') + '</span>'; };
      var lg = function (c, t) { return '<span style="font-size:11.5px;font-weight:400;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px"><i style="width:8px;height:8px;border-radius:2px;background:' + c + '"></i>' + t + '</span>'; };
      h += '<div class="db-sec"><div class="db-st"><span class="no">6</span>教学质量<span class="sp"></span>' + go('t=reach', '进入教学达成') + '</div>' +
        '<div class="db-sub">技能看老师确认通过的证据，知识点看最近一次老师确认的评价（含退回）；两个维度分开统计，学生自评不计入</div><div class="kpis">' +
        kpi('🎯', '#eef2ff', '本' + UNIT[F.p] + '技能达成率', tr == null ? '—' : tr, tr == null ? '' : '%', tr != null && trp != null ? delta(tr, trp, ' 个百分点') : '') +
        kpi('📘', '#fff7ed', '本' + UNIT[F.p] + '知识点掌握率', kq.r == null ? '—' : kq.r, kq.r == null ? '' : '%', kq.r != null && kqp.r != null ? delta(kq.r, kqp.r, ' 个百分点') : '') +
        kpi('📝', '#eef2ff', '学生 × 技能 评价', tq.pairs, '次', delta(tq.pairs, tqp.pairs)) +
        kpi('💬', '#f3e8ff', '待处理改进建议', imps.length, '条') + '</div>' +
        '<div class="grid2">' +
          '<div class="panel2"><div class="ph2">达成趋势（累计）<span class="sp"></span>' + lg(CS, '技能达成率') + lg(CK, '知识点掌握率') + '</div>' +
            (sv.some(function (v) { return v != null; }) ? line() + '<div style="font-size:11.5px;color:var(--muted);margin:4px 0 2px">每' + ({ week: '天', month: '周', term: '月', year: '月' }[F.p]) + '新增评价（学生 × 技能，人次）</div>' + bars() : '<div class="empty3">本' + UNIT[F.p] + '还没有课堂证据</div>') + '</div>' +
          '<div class="panel2"><div class="ph2">各课程达成对比<span class="sp"></span>' + lg(CS, '技能') + lg(CK, '知识点') + '</div>' +
            (crs.length ? crs.map(function (c) { return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px"><span style="width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--brand-ink)" title="' + esc(c.n) + '">' + esc(c.n) + '</span>' + hbar(c.s, CS) + hbar(c.k, CK) + '</div>'; }).join('') : '<div class="empty3">本' + UNIT[F.p] + '还没有课堂证据</div>') + '</div>' +
          '<div class="panel2"><div class="ph2">达成率最低的能力<span class="sp"></span>' + go('t=reach', '查看全部') + '</div>' +
            (weak.length ? weak.map(function (w) { return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px"><span style="width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--brand-ink)" title="' + esc(w.n) + '">' + esc(w.n) + '</span>' + hbar(w.r, w.r < 70 ? '#ef4444' : CS) + '<span style="width:58px;text-align:right;font-size:11.5px;color:var(--muted)">未达成 ' + w.no + '</span></div>'; }).join('') : '<div class="empty3">本' + UNIT[F.p] + '还没有课堂证据</div>') + '</div>' +
          '<div class="panel2"><div class="ph2">待处理的课程改进建议<span class="sp"></span>' + go('t=improve', '去处理') + '</div>' +
            (imps.length ? imps.slice(0, 4).map(function (x) { return '<div style="font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--rule-2)"><b>' + esc(x.type) + '</b> · 《' + esc(x.course) + '》<span style="color:var(--muted);margin-left:6px">' + esc(x.from + ' · ' + x.at.slice(0, 10)) + '</span><div style="color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.text) + '</div></div>'; }).join('') : '<div class="empty3">没有待处理的建议</div>') + '</div>' +
        '</div></div>';
    }
    document.getElementById('body').innerHTML = h;
  }
  // 按专业汇总（取课程计划所在班级的专业）
  function majorStats(r) {
    var by = {};
    scopedPlans().forEach(function (p) {
      var mid = majorOfPlan(p); if (!mid) return;
      var m = by[mid] || (by[mid] = { id: mid, name: (E.majors.filter(function (x) { return x.id === mid; })[0] || {}).name || mid, path: TK.majorPath(E, mid), tchSet: {}, cls: {}, plans: 0, lessons: 0, fbs: [], g: { '优秀': 0, '合格': 0, '需改进': 0 } });
      m.tchSet[p.teacher] = 1; m.cls[p.classId] = 1; m.plans++;
      S.courses.filter(function (c) { return c.planId === p.id; }).forEach(function (c) {
        if (inR(c.start, r)) m.lessons++;
        (c.feedbacks || []).forEach(function (f) { if (inR(f.at, r)) m.fbs.push(f); });
        (c.submissions || []).forEach(function (s) { if (s.teacher && inR(s.teacher.at, r) && m.g[s.teacher.grade] != null) m.g[s.teacher.grade]++; });
      });
    });
    var A = activity(r);
    return Object.keys(by).map(function (k) { var m = by[k], t = Object.keys(m.tchSet); m.tch = t.length; m.act = t.filter(function (n) { return A[n] && A[n].active; }).length; m.cls = Object.keys(m.cls).length; m.fb = fbAvg(m.fbs); return m; });
  }

  /* ── 查看详情 ── */
  function table(heads, rows) { return '<table class="tbl2"><thead><tr>' + heads.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>' + (rows.join('') || '<tr><td colspan="' + heads.length + '"><div class="empty3">暂无数据</div></td></tr>') + '</tbody></table>'; }
  function td(list) { return '<tr>' + list.map(function (x) { return '<td>' + x + '</td>'; }).join('') + '</tr>'; }
  function detail(key) {
    var r = cur(), T = scopedTeachers(), A = activity(r), title = '', body = '', sub = cycleLabel(r) + (F.scope ? ' · ' + TK.majorPath(E, F.scope) : ' · 全校');
    if (key === 'activity') { title = '教师数据详情'; body = table(['教师', '备课生成', '发布学习内容', '评价学生任务', '新建课次', '状态'], T.map(function (n) { var a = A[n]; return td([esc(n), a.gen, a.pub, a.eval, a.lesson, a.active ? '<span class="tag g">活跃</span>' : '<span class="tag w">未活跃</span>']); })); }
    else if (key === 'trend') { title = '教学过程数据明细'; body = table(['时间', '备课资源生成数', '学习资源发布数', '任务提交数', '任务评价完成数', '课程反馈均分'], buckets(r).map(function (b) { var v = fbAvg(feedbacks(b)); return td([b.l, resFiles(b).length, pubFiles(b), subs(b).length, evals(b).length, v == null ? '—' : v.toFixed(1)]); })); }
    else if (key === 'risk') { title = '教学风险预警详情'; body = '<div class="db-sub">未活跃教师（本' + UNIT[F.p] + '没有备课、发布、评价、新建课次）</div>' + table(['教师', '负责课程计划'], T.filter(function (n) { return !A[n].active; }).map(function (n) { return td([esc(n), esc(S.plans.filter(function (p) { return p.teacher === n; }).map(function (p) { return p.course + ' · ' + cls(p.classId).name; }).join('；') || '—')]); })) +
      '<div class="db-sub" style="margin-top:14px">低分课程（课程反馈均分低于 ' + LOW + ' 分）</div>' + table(['课次', '课程 · 班级', '授课教师', '反馈均分', '反馈人数'], lowLessons(r).map(function (c) { var f = feedbacks(r, [c]); var p = plan(c.planId) || {}; return td([esc(c.name), esc((p.course || '') + ' · ' + cls(p.classId).name), esc(p.teacher || ''), fbAvg(f).toFixed(1), f.length]); })); }
    else if (key === 'types') { title = '生成备课资源明细'; body = table(['资源包', '教师', '文件', '类型', '生成时间'], resFiles(r).map(function (x) { return td([esc(x.r.name), esc(x.r.owner || '李老师'), esc(x.f.name), x.f.type, esc(x.r.createdAt)]); })); }
    else if (key === 'portrait') { title = '教师画像评分'; body = table(['教师'].concat(DIMS).concat(['综合分']), T.map(function (n) { return td([esc(n)].concat(prof(n).s).concat(['<b>' + overallOf(n) + '</b>'])); })) + '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">来自教师档案的画像五维评分，综合分为五维平均</div>'; }
    else if (key === 'hours') { title = '教师授课时长'; var hs = {}; T.forEach(function (n) { hs[n] = { h: 0, n: 0 }; }); held(r).forEach(function (c) { var n = teacherOf(c); if (hs[n]) { hs[n].h += hoursOf(c); hs[n].n++; } }); body = table(['教师', '课次数', '授课时长（小时）'], Object.keys(hs).sort(function (a, b) { return hs[b].h - hs[a].h; }).map(function (n) { return td([esc(n), hs[n].n, Math.round(hs[n].h * 10) / 10]); })); }
    else if (key === 'staff') { title = '师资结构'; body = table(['教师', '职称', '年龄', '学历'], T.map(function (n) { var p = prof(n); return td([esc(n), p.title, p.age, p.edu]); })); }
    else if (key === 'major') { title = '专业统计详情'; body = table(['专业', '授课教师', '活跃教师', '班级数', '课程计划数', '课次数', '反馈均分', '评价（优秀/合格/需改进）'], majorStats(r).map(function (m) { return td([esc(m.path), m.tch, m.act, m.cls, m.plans, m.lessons, m.fb == null ? '—' : m.fb.toFixed(1), m.g['优秀'] + ' / ' + m.g['合格'] + ' / ' + m.g['需改进']]); })); }
    else if (key === 'lessons') {
      title = '课程统计详情'; var now = new Date();
      body = table(['课次', '专业', '班级', '授课教师', '开始时间', '结束时间', '时长', '状态', '来源'], lessons(r).sort(function (a, b) { return a.start < b.start ? -1 : 1; }).map(function (c) {
        var p = plan(c.planId) || {}, k = cls(p.classId), a = new Date(c.start.replace(' ', 'T')), b = new Date(c.end.replace(' ', 'T'));
        return td([esc(c.name), esc(TK.majorPath(E, k.majorId)), esc(k.name || ''), esc(p.teacher || ''), c.start, c.end.slice(11), (Math.round(hoursOf(c) * 10) / 10) + 'h', b < now ? '已结束' : a > now ? '待授课' : '授课中', c.source === '排课' ? '教务排课' : '教师自建']);
      }));
    }
    var d = TK.drawer({ title: title, sub: sub, width: 860 }); d.body.innerHTML = '<div style="overflow-x:auto">' + body + '</div>';
  }

  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-p]'))) { F.p = t.dataset.p; F.off = 0; render(); return; }
    if ((t = e.target.closest('[data-off]'))) { var o = +t.dataset.off; F.off = o ? F.off + o : 0; render(); return; }
    if ((t = e.target.closest('[data-trend]'))) { F.trend = +t.dataset.trend; render(); return; }
    if ((t = e.target.closest('[data-more]'))) { detail(t.dataset.more); return; }
  });
  document.addEventListener('change', function (e) { if (e.target.hasAttribute('data-scope')) { F.scope = e.target.value; render(); } });
  render();
})();
