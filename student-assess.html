<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>能力测评</title>
<link rel="stylesheet" href="css/common.css">
<style>
/* 学生端能力测评：概览 + 雷达图 + 自评列表 */
.sa-band{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;padding:14px 18px;
  border:1px solid var(--rule);border-radius:12px;background:var(--card);margin-bottom:14px}
.sa-who{display:flex;flex-direction:column;gap:3px}
.sa-who .nm{font-size:15px;font-weight:700}
.sa-who .sub{font-size:12px;color:var(--muted)}
.sa-stats{display:flex;flex-wrap:wrap;gap:8px 26px;margin-left:auto;align-items:center}
.sa-stat{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.sa-stat b{font-size:20px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sa-stat span{font-size:11px;color:var(--muted)}
.sa-stat b.ok{color:var(--good)} .sa-stat b.warn{color:var(--warn)} .sa-stat b.crit{color:var(--crit)}

.sec-h{font-size:12.5px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec-h .no{font-family:var(--mono);font-size:11px;color:var(--brand);font-weight:600}

/* 雷达图 */
.sa-side svg{width:100%;height:auto;max-width:470px;display:block;margin:0 auto}
.radar-leg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--muted);justify-content:center;margin-top:6px}
.radar-leg i{display:inline-block;width:16px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* 自评列表 */
.abl-group{margin-bottom:14px}
.abl-g-h{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.abl-g-h .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.abl-item{border:1px solid var(--rule);border-radius:12px;background:var(--card);padding:12px 14px;margin-bottom:10px}
.abl-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.abl-name{flex:1 1 260px;min-width:0}
.abl-name b{font-size:13.5px;font-weight:600}
.abl-name b .star{color:var(--brand);margin-right:4px}
.abl-name .dm{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.abl-req{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.abl-req .tgt{font-size:11px;font-family:var(--mono);font-weight:600;color:var(--brand-ink);background:var(--brand-soft);
  border-radius:6px;padding:2px 7px}
.abl-req .pos{font-size:11px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--rule);border-radius:6px;padding:2px 7px}
.abl-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.self{display:inline-flex;gap:4px}
.self button{min-width:40px;padding:5px 9px;font-size:11.5px;font-family:var(--mono);border-radius:7px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.self button:hover{border-color:var(--brand);color:var(--brand-ink)}
.self button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.gap-pill{font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:20px;min-width:56px;text-align:center}
.sug-b a{color:var(--brand-ink);text-decoration:none;border-bottom:1px solid currentColor}
.gap-pill.good{background:var(--good-bg);color:var(--good)}
.gap-pill.crit{background:var(--crit-bg);color:var(--crit)}
.gap-pill.wait{background:var(--card-2);color:var(--muted);border:1px solid var(--rule)}
.abl-def{margin-top:10px;border-top:1px solid var(--rule-2);padding-top:10px}
.abl-def .def-toggle{font-size:12px;color:var(--brand-ink);background:none;border:none;padding:0;cursor:pointer;font-family:inherit}
.abl-def .def-toggle:hover{text-decoration:underline}
.abl-def .def-body{display:none;margin-top:8px}
.abl-def.open .def-body{display:block}
.abl-def .lv{display:grid;grid-template-columns:34px 1fr;gap:6px 10px;padding:5px 0;font-size:12px;color:var(--ink-2)}
.abl-def .lv .lvk{font-family:var(--mono);font-size:11px;color:var(--brand-ink);font-weight:600;align-self:start;padding-top:1px}
.abl-def .lv .lvv{line-height:1.6}
.sa-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.sa-side{position:sticky;top:92px;max-height:calc(100vh - 108px);overflow:auto;border:1px solid var(--rule);border-radius:12px;background:var(--card);padding:12px 14px}
.mode-tabs{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--rule);border-radius:10px;background:var(--card-2);margin-bottom:12px}
.mode-tabs button{font:inherit;font-size:13px;padding:6px 16px;border:0;border-radius:7px;background:none;color:var(--ink-2);cursor:pointer}
.mode-tabs button[aria-selected="true"]{background:var(--card);color:var(--brand-ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mode-note{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.tch-basis{font-size:11.5px;color:var(--ink-2);text-align:left;max-width:240px;line-height:1.5}
.tch-basis .tv{font-family:var(--mono);font-weight:600;color:var(--brand-ink);font-size:13px}
.side-tabs{display:flex;gap:16px;border-bottom:1px solid var(--rule);margin:-2px 0 10px}
.side-tabs button{font:inherit;font-size:13px;padding:6px 0 8px;border:0;background:none;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer}
.side-tabs button[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.pos-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pos-step{font:inherit;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:150px}
.pos-step .pn{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.pos-step .pp{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.pos-step .bar{display:block;height:4px;border-radius:3px;background:var(--rule-2);margin-top:6px;overflow:hidden}
.pos-step .bar i{display:block;height:100%;background:var(--brand)}
.pos-step[aria-current="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;background:var(--brand-soft)}
.pos-step.done .pp{color:var(--good)}
.pos-next{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin:6px 0 20px;font-size:12.5px;color:var(--muted)}
.tch{font-size:11.5px;margin-top:6px;color:var(--ink-2)}
.tch .tv{font-family:var(--mono);font-weight:600;color:var(--good)}
.tch .tn{color:var(--muted)}
.shared{font-size:11px;color:var(--muted);margin-left:6px}
.pos-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pos-chips button{font:inherit;font-size:12px;padding:3px 10px;border-radius:14px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.pos-chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.side-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px}
.focus-tip{font-size:12px;background:var(--brand-soft);color:var(--brand-ink);border-radius:8px;padding:6px 10px;margin:6px 0 2px}
.sa-side svg text[data-axis]{cursor:pointer}
.abl-item.flash{box-shadow:0 0 0 2px var(--brand)}
.abl-item.cur{border-color:var(--brand)}
/* 窄屏：上下排列，图谱固定在顶部（限高），往下自评时仍能看到图谱变化 */
@media (max-width:900px){.sa-grid{grid-template-columns:1fr}.sa-side{top:0;max-height:52vh;z-index:5;order:-1;box-shadow:0 6px 16px -10px rgba(0,0,0,.25)}}
.adv{border:1px solid var(--rule);border-radius:12px;background:var(--card);padding:14px 16px;margin-bottom:14px}
.adv-sum{font-size:13px;line-height:1.85}
.adv-sum b{font-weight:600}
.adv-sum .note{font-size:11.5px;color:var(--muted)}
.adv-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.adv-cols>div{background:var(--card-2);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.75}
.adv-cols .k{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.sug{border:1px solid var(--rule);border-radius:12px;background:var(--card);padding:12px 14px;margin-bottom:10px}
.sug-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sug-h b{font-size:13.5px;font-weight:600}
.sug-h .lvup{font-family:var(--mono);font-size:11px;color:var(--crit);background:var(--crit-bg);border-radius:6px;padding:2px 7px}
.sug-h .pos{font-size:11px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--rule);border-radius:6px;padding:2px 7px}
.sug-b{font-size:12.5px;color:var(--ink-2);line-height:1.75;margin-top:8px}
.sug-b .k{color:var(--ink);font-weight:600}
.sug-b ul{margin:4px 0 0;padding-left:18px}
.skc{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--card-2);border:1px solid var(--rule);margin:2px 4px 2px 0}
.skc.on{background:var(--good-bg);border-color:transparent;color:var(--good)}
.sug-more{font:inherit;font-size:12.5px;color:var(--brand-ink);background:none;border:none;cursor:pointer;padding:4px 0}
@media (max-width:720px){.adv-cols{grid-template-columns:1fr}}
.empty-note{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.empty-note b{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop">
      <div class="ptop-r">
        <div class="pt-l">
          <h1 class="pt-t">能力测评</h1>
          <div class="pt-d">对照岗位能力要求查看达成度：先选岗位，再逐项自评（L0–L3）；「老师评价」由老师确认的技能换算，两者分开统计。</div>
        </div>
      </div>
    </div>
    <div class="body" id="body">
      <div class="pane" id="pane"></div>
    </div>
  </div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script src="js/teacher-kit.js"></script>
<script src="js/student-kit.js"></script>
<script>
(function () {
  'use strict';

  /* ── 专业 → 对口岗位（能力图谱 19 岗位版；酒店专业未纳入能力图谱，见页面提示）
     core 仅决定默认选中岗位（core[0]）与卡片排序，不再展示「核心」标签 ── */
  var MAJOR_POSITIONS = {
    'MAJOR-GUIDE':    { core: ['POS-09', 'POS-10'], related: ['POS-12', 'POS-06'] },
    'MAJOR-TOURISM':  { core: ['POS-06', 'POS-08', 'POS-09'], related: ['POS-07', 'POS-10', 'POS-15', 'POS-17'] },
    'MAJOR-TOUR-SVC': { core: ['POS-09', 'POS-12', 'POS-16'], related: ['POS-10', 'POS-17'] }
  };

  var ctx = null, identity = null;
  var G = window.ASSESS_DATA.graph;
  var POS = {}, ABL = {};
  G.positions.forEach(function (p) { POS[p.id] = p; });
  G.abilities.forEach(function (a) { ABL[a.id] = a; });

  var LV_NAME = { 0: '未达成', 1: '基本', 2: '熟练', 3: '精通' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function byId(col, id) { return (ctx[col] || []).find(function (o) { return o.id === id; }); }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2400);
  }

  /* ── 自评结果持久化（按学生隔离） ── */
  function storeKey(studentId) { return 'student-assess:' + studentId; }
  function loadScores(studentId) {
    try { return JSON.parse(localStorage.getItem(storeKey(studentId)) || '{}'); }
    catch (e) { return {}; }
  }
  function saveScore(studentId, ablId, lv) {
    var s = loadScores(studentId);
    s[ablId] = lv;
    try { localStorage.setItem(storeKey(studentId), JSON.stringify(s)); } catch (e) {}
  }
  function resetScores(studentId) {
    try { localStorage.removeItem(storeKey(studentId)); } catch (e) {}
  }

  /* ── 学生 → 专业 → 对口岗位 → 能力项 ── */
  function reload() {
    ctx = DEMO.getState();
    identity = UI.currentIdentity(ctx);
  }
  function buildModel() {
    reload();
    var student = byId('students', identity.account.studentId);
    if (!student) return { err: '未找到本人学生数据' };
    var klass = byId('klasses', student.klassId);
    if (!klass) return { err: '未找到本人班级数据' };
    var major = byId('majors', klass.majorId);
    var mapping = MAJOR_POSITIONS[klass.majorId];
    if (!mapping) {
      return { err: '本专业暂未纳入能力图谱', student: student, klass: klass, major: major, majorId: klass.majorId };
    }
    var posIds = mapping.core.concat(mapping.related);

    // 能力去重：abl -> { need(最高要求等级), reqs:[{pos,lv,kind}] }
    var ablMap = {};
    G.require.forEach(function (r) {
      if (posIds.indexOf(r.pos) < 0) return;
      var lv = parseInt(r.level.slice(1), 10);
      if (!ablMap[r.abl]) ablMap[r.abl] = { abl: r.abl, need: 0, reqs: [] };
      var rec = ablMap[r.abl];
      if (lv > rec.need) rec.need = lv;
      rec.reqs.push({ pos: r.pos, lv: lv, kind: mapping.core.indexOf(r.pos) >= 0 ? 'core' : 'related' });
    });

    // 按能力领域分组（领域按首次出现顺序）
    var order = [], domains = [];
    G.require.forEach(function (r) {
      if (posIds.indexOf(r.pos) < 0) return;
      var a = ABL[r.abl], dm = a ? a.domain : '';
      if (!domains.some(function (d) { return d.name === dm; })) {
        var list = Object.keys(ablMap).filter(function (id) {
          var aa = ABL[id]; return aa && aa.domain === dm;
        });
        if (list.length) { domains.push({ name: dm, abls: list }); }
        else domains.push({ name: dm, abls: [] });
      }
    });

    return {
      student: student, klass: klass, major: major, majorId: klass.majorId,
      mapping: mapping, posIds: posIds,
      abilities: Object.keys(ablMap).map(function (id) { return ablMap[id]; }),
      domains: domains
    };
  }

  /* ── 雷达图：轴 = 岗位要求的能力项，虚线 = 岗位要求，实线 = 本人自评，红点 = 未达标 ── */
  function radar(rows, posName, focus) {
    var n = rows.length;
    if (n < 3) return '';
    var W = 460, H = 400, cx = W / 2, cy = H / 2 + 4, Rr = 128;
    function pt(i, v) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * Rr * v / 3, cy + Math.sin(a) * Rr * v / 3];
    }
    function poly(vals) {
      return vals.map(function (v, i) { var p = pt(i, v); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    }
    var rule = 'var(--rule)', muted = 'var(--muted)', brand = 'var(--brand)',
        ink = 'var(--ink)', ink2 = 'var(--ink-2)', crit = 'var(--crit)';
    var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' +
      esc(posName) + '能力雷达图" style="font-family:var(--sans)">';
    [1, 2, 3].forEach(function (lv) {
      h += '<polygon points="' + poly(rows.map(function () { return lv; })) + '" fill="none" stroke="' + rule + '" stroke-width="1"/>';
      var p = pt(0, lv);
      h += '<text x="' + (p[0] + 4).toFixed(1) + '" y="' + (p[1] + 9).toFixed(1) + '" font-size="9" fill="' + muted + '">L' + lv + '</text>';
    });
    rows.forEach(function (r, i) {
      var p = pt(i, 3);
      h += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="' + rule + '" stroke-width="1"/>';
    });
    // 岗位要求（虚线）
    h += '<polygon points="' + poly(rows.map(function (r) { return r.need; })) + '" fill="none" stroke="' + ink + '" stroke-width="1.4" stroke-dasharray="4 3"/>';
    // 当前视图的等级（自评 / 老师评价，实线品牌色）
    h += '<polygon points="' + poly(rows.map(function (r) { return r.got; })) + '" fill="' + brand + '" fill-opacity=".22" stroke="' + brand + '" stroke-width="2"/>';
    rows.forEach(function (r, i) {
      var gap = r.got < r.need && (mode === 'self' || r.has), p = pt(i, r.got);
      h += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (gap ? 4 : 2.4) + '" fill="' + (gap ? crit : brand) + '"/>';
      var a = ABL[r.abl], name = (a && a.core ? '★' : '') + (a ? a.name : r.abl);
      var lines = [name.slice(0, 7)];
      if (name.length > 7) lines.push(name.length > 14 ? name.slice(7, 13) + '…' : name.slice(7));
      var ang = -Math.PI / 2 + i * 2 * Math.PI / n, cos = Math.cos(ang), sin = Math.sin(ang), lp = pt(i, 3.3);
      var anchor = cos > 0.08 ? 'start' : cos < -0.08 ? 'end' : 'middle';
      var on = r.abl === focus, col = on ? brand : gap ? crit : ink2;
      if (on) { var fp = pt(i, Math.max(r.got, 0.15)); h += '<circle cx="' + fp[0].toFixed(1) + '" cy="' + fp[1].toFixed(1) + '" r="8" fill="none" stroke="' + brand + '" stroke-width="2"/>'; }
      var y0 = sin > 0.6 ? lp[1] + 9 : sin < -0.6 ? lp[1] - (lines.length - 1) * 12 - 3 : lp[1] - (lines.length - 1) * 6 + 4;
      h += '<text data-axis="' + esc(r.abl) + '" x="' + lp[0].toFixed(1) + '" y="' + y0.toFixed(1) + '" font-size="11.5" text-anchor="' + anchor + '" fill="' + col + '"' + (gap || on ? ' font-weight="600"' : '') + '><title>' + esc(a ? a.name : r.abl) + '：点击定位到左侧</title>' +
        lines.map(function (l, k) { return '<tspan x="' + lp[0].toFixed(1) + '" dy="' + (k ? 12 : 0) + '">' + esc(l) + '</tspan>'; }).join('') + '</text>';
    });
    return h + '</svg>';
  }

  function radarLegend() {
    return '<div class="radar-leg">' +
      '<span><i style="border:1.4px dashed var(--ink)"></i>岗位要求</span>' +
      '<span><i style="background:var(--brand);opacity:.5;border:2px solid var(--brand)"></i>' + (mode === 'self' ? '我的自评' : '老师评价') + '</span>' +
      '<span><i style="width:8px;height:8px;border-radius:50%;background:var(--crit)"></i>未达标</span>' +
      (mode === 'self' ? '<span><i style="width:9px;height:9px;border-radius:50%;border:2px solid var(--brand)"></i>刚自评</span>' : '') + '</div>';
  }

  /* ── 渲染 ── */
  function render() {
    var model = buildModel();
    var M = model;
    var scores = model.student ? valsOf(model) : {};

    if (model.err) {
      $('#pane').innerHTML = '<div class="card"><div class="empty-note"><b>' + esc(model.err) + '</b>' +
        (model.major ? '<br>当前专业：' + esc(model.major.name) : '') +
        '<br>能力图谱覆盖旅行社、景区与乡村休闲旅游服务岗位群，暂未纳入酒店住宿等岗位。</div></div>';
      return;
    }

    // 统计
    var total = model.abilities.length;
    var scored = model.abilities.filter(function (a) { return scores[a.abl] != null; }).length;
    var ok = model.abilities.filter(function (a) { var g = scores[a.abl]; return g != null && g >= a.need; }).length;
    var rate = total ? Math.round(ok / total * 100) : 0;
    var rateCls = rate >= 80 ? 'ok' : rate >= 60 ? 'warn' : 'crit';

    // 学生信息 + 概览
    var html = '<div class="mode-tabs" role="tablist"><button data-mode="self" aria-selected="' + (mode === 'self') + '">我的自评</button><button data-mode="teacher" aria-selected="' + (mode === 'teacher') + '">老师评价</button></div>' +
      '<div class="mode-note">' + (mode === 'self' ? '统计、图谱、结论均按自评计算' : '由老师确认的技能换算，只读；统计、图谱、结论均按老师评价计算') + '。</div>' +
      '<div class="sa-band">' +
      '<div class="sa-who"><div class="nm">' + esc(model.student.name) + '</div>' +
      '<div class="sub">' + esc(model.student.sno) + ' · ' + esc(model.klass.name) + '</div></div>' +
      '<div class="sa-stats" title="统计为全部对口岗位去重后的总口径；下方「02」区只显示当前选中岗位的能力项">' +
      '<div class="sa-stat"><b>' + total + '</b><span>能力项</span></div>' +
      '<div class="sa-stat"><b>' + scored + '</b><span>' + wd().did + '</span></div>' +
      '<div class="sa-stat"><b>' + ok + '</b><span>已达标</span></div>' +
      '<div class="sa-stat"><b class="' + rateCls + '">' + rate + '%</b><span title="达标项 / 全部能力项">达成率</span></div>' +
      '</div>' +
      (mode === 'self' ? '<button class="btn ghost" id="sa-reset">重新测评</button>' : '') + '</div>';

    // 左：逐项自评；右：能力图谱（随自评实时变化）/ 结论与建议
    if (!curPos || model.posIds.indexOf(curPos) < 0) curPos = model.mapping.core[0];
    html += '<div class="sec-h" style="margin-top:4px"><span class="no">01</span>选择岗位</div>' +
      '<div class="pos-steps" id="sa-steps">' + stepsHTML(model, scores) + '</div>';
    html += '<div class="sa-grid"><div class="sa-main"><div class="sec-h" id="sa-self" style="margin-top:0"><span class="no">02</span><span id="sa-ptitle">' + esc(POS[curPos].name) + '</span>' + (mode === 'self' ? '的能力自评' : '的老师评价') + '</div>' +
      '<div id="sa-list">' + renderList(model, scores) + '</div></div>' +
      '<div class="sa-side" id="sa-side">' + sideHTML(model, scores) + '</div></div>';

    $('#pane').innerHTML = html;
  }

  function posNeed(pid, ablId) { var r = G.require.find(function (x) { return x.pos === pid && x.abl === ablId; }); return r ? parseInt(r.level.slice(1), 10) : 0; }
  function posStat(pid, scores) {
    var rq = G.require.filter(function (r) { return r.pos === pid; });
    return { n: rq.length, done: rq.filter(function (r) { return scores[r.abl] != null; }).length, ok: rq.filter(function (r) { var g = scores[r.abl]; return g != null && g >= parseInt(r.level.slice(1), 10); }).length };
  }
  function orderedPos(model) { return model.posIds.filter(function (p) { return POS[p]; }); }   // 核心岗位在前
  function stepsHTML(model, scores) {
    return orderedPos(model).map(function (p) {
      var st = posStat(p, scores), done = st.done === st.n;
      return '<button class="pos-step' + (done ? ' done' : '') + '" data-pos="' + p + '" aria-current="' + (p === curPos) + '"><span class="pn">' + esc(POS[p].name) + '</span>' +
        '<span class="pp">' + (mode === 'teacher' ? '有评价 ' + st.done + '/' + st.n + ' · 达标 ' + st.ok : done ? '✓ 已测完 · 达标 ' + st.ok + '/' + st.n : '已评 ' + st.done + '/' + st.n) + '</span><span class="bar"><i style="width:' + Math.round(st.done / st.n * 100) + '%"></i></span></button>';
    }).join('');
  }
  function renderList(model, scores) {
    var html = '', mine = G.require.filter(function (r) { return r.pos === curPos; }).map(function (r) { return r.abl; });
    model.domains.forEach(function (dm) {
      var list = dm.abls.filter(function (id) { return mine.indexOf(id) >= 0; });
      if (!list.length) return;
      html += '<div class="abl-group"><div class="abl-g-h">' + esc(dm.name || '其他') + '<span class="cnt">' + list.length + ' 项</span></div>';
      list.forEach(function (ablId) { html += ablRow(model, scores, ablId); });
      html += '</div>';
    });
    // 本岗位测完后进入下一个岗位
    var ps = orderedPos(model), i = ps.indexOf(curPos), st = posStat(curPos, scores), nx = ps[i + 1];
    html += '<div class="pos-next" id="sa-next">' + nextHTML(st, nx) + '</div>';
    return html || '<div class="empty-note">暂无能力项</div>';
  }
  function nextHTML(st, nx) {
    return (mode === 'teacher' ? (st.done < st.n ? '本岗位还有 ' + (st.n - st.done) + ' 项暂无老师评价' : '本岗位各项都有老师评价') : st.done < st.n ? '本岗位还有 ' + (st.n - st.done) + ' 项未自评' : '本岗位已测完') +
      (nx ? '<button class="btn" data-pos="' + nx + '" style="height:32px">下一个岗位：' + esc(POS[nx].name) + ' →</button>' : '<button class="btn" data-side="advice" style="height:32px">查看测评结论与建议 →</button>');
  }

  function ablRow(model, scores, ablId) {
    var a = ABL[ablId];
    if (!a) return '';
    var rec = model.abilities.find(function (x) { return x.abl === ablId; });
    var got = scores[ablId], need = posNeed(curPos, ablId);
    var gapHtml;
    if (got == null) gapHtml = '<span class="gap-pill wait">' + wd().wait + '</span>';
    else if (got >= need) gapHtml = '<span class="gap-pill good">已达标</span>';
    else gapHtml = '<span class="gap-pill crit">未达标</span>';

    // 目标取当前岗位的要求（岗位名见 02 标题）；其他岗位也要求此项时收敛为一枚提示，悬停看岗位名单与「评一次共用」说明
    var others = rec.reqs.filter(function (r) { return r.pos !== curPos; });
    var reqHtml = '<span class="tgt">要求 L' + need + '</span>' + (others.length ? '<span class="shared" title="' +
      esc(others.map(function (r) { return POS[r.pos].name + ' L' + r.lv; }).join('、')) + ' 也要求此项；同一项能力评一次，各岗位共用">' +
      '＋' + others.length + ' 岗位也要求</span>' : '');

    var btn = function (lv) {
      var def = (a.levels || {})['L' + lv] || '';
      return '<button data-abl="' + esc(ablId) + '" data-lv="' + lv + '" class="' + (got === lv ? 'on' : '') + '" title="L' + lv + ' ' + LV_NAME[lv] + (lv ? '：' + esc(def) : '') + '">L' + lv + '</button>';
    };

    return '<div class="abl-item" data-row="' + esc(ablId) + '">' +
      '<div class="abl-top">' +
      '<div class="abl-name"><b>' + (a.core ? '<span class="star">★</span>' : '') + esc(a.name) + '</b>' +
      '<span class="dm">' + esc(a.domain || '') + '</span>' +
      '<div class="abl-req">' + reqHtml + '</div></div>' +
      '<div class="abl-act">' + (mode === 'self' ? '<div class="self">' + [0, 1, 2, 3].map(btn).join('') + '</div>' : tchHTML(ablId)) + gapHtml + '</div></div>' +
      '<div class="abl-def" data-def="' + esc(ablId) + '">' +
      '<button class="def-toggle" data-toggle="' + esc(ablId) + '">能力定义</button>' +
      '<div class="def-body">' + defBody(a) + '</div></div></div>';
  }

  function defBody(a) {
    return ['L1', 'L2', 'L3'].map(function (lv) {
      return '<div class="lv"><div class="lvk">' + lv + '</div><div class="lvv">' + esc(a.levels && a.levels[lv] ? a.levels[lv] : '—') + '</div></div>';
    }).join('');
  }

  /* ── 老师评价（由老师确认的技能证据换算到能力，只作对照，不改变自评） ──
     规则：取已达成（优秀 / 合格）的「直接支撑」技能里映射等级最高的那个；只有「部分支撑」技能达成的记为部分覆盖 */
  var LC = null;
  function lctx() { return LC || (LC = learnCtx()); }
  function teacherLv(ablId) {
    var L = lctx(), best = 0, by = null, partial = [];
    (L.bySkill[ablId] || []).forEach(function (x) {
      var e = L.ev[x.sid]; if (!e || !e.ok) return;
      var m = (L.K.map[x.sid] || []).find(function (y) { return y.abl === ablId; }) || {}, lv = parseInt(String(m.level || 'L0').slice(1), 10) || 0;
      if (x.type === '直接支撑') { if (lv > best) { best = lv; by = e; } }
      else partial.push(e);
    });
    return best ? { lv: best, by: by } : partial.length ? { partial: true, by: partial[0] } : null;
  }
  function tchHTML(ablId) {
    var t = teacherLv(ablId);
    if (!t) return '';   // 空态由状态 pill「暂无评价」表达，不重复
    if (t.partial) return '<div class="tch-basis">「' + esc(t.by.name) + '」' + t.by.grade + '，仅部分支撑，不换算等级</div>';
    return '<div class="tch-basis"><span class="tv">L' + t.lv + '</span><br>依据「' + esc(t.by.name) + '」' + t.by.grade + '（' + esc(t.by.session) + '）</div>';
  }

  /* ── 右侧面板：能力图谱（按对口岗位切换）/ 结论与建议 ── */
  var sideTab = 'radar', curPos = '', focusAbl = '', mode = 'self';
  // 当前视图的等级：自评 = 本人自评结果；老师评价 = 由老师确认的技能换算出的等级（部分覆盖不换算等级）
  function valsOf(model) {
    if (mode === 'self') return loadScores(model.student.id);
    var v = {}; model.abilities.forEach(function (a) { var t = teacherLv(a.abl); if (t && t.lv) v[a.abl] = t.lv; }); return v;
  }
  var WD = {
    self: { did: '已自评', wait: '待自评', who: '自评', rest: '未自评' },
    teacher: { did: '有老师评价', wait: '暂无评价', who: '老师评价', rest: '暂无老师评价' }
  };
  function wd() { return WD[mode]; }
  function sideHTML(model, scores) {
    var h = '<div class="side-tabs"><button data-side="radar" aria-selected="' + (sideTab === 'radar') + '">能力图谱</button><button data-side="advice" aria-selected="' + (sideTab === 'advice') + '">结论与建议</button></div>';
    if (sideTab === 'advice') return h + adviceHTML(model, scores);
    var rows = G.require.filter(function (r) { return r.pos === curPos; }).map(function (r) {
      return { abl: r.abl, need: parseInt(r.level.slice(1), 10), got: scores[r.abl] == null ? 0 : scores[r.abl], has: scores[r.abl] != null };
    });
    var okCount = rows.filter(function (r) { return r.has && r.got >= r.need; }).length, done = rows.filter(function (r) { return scores[r.abl] != null; }).length;
    h += '<div style="font-size:13px;font-weight:600;margin-bottom:4px">' + esc(POS[curPos].name) + '</div>';
    if (mode === 'self' && focusAbl && ABL[focusAbl]) {
      var fr = rows.find(function (r) { return r.abl === focusAbl; });
      if (fr) h += '<div class="focus-tip">刚自评：' + esc(ABL[focusAbl].name) + ' L' + fr.got + '，' + (fr.got >= fr.need ? '✓ 达标' : '未达标（要求 L' + fr.need + '）') + '</div>';
    }
    h += (radar(rows, POS[curPos].name, focusAbl) || '<div class="empty-note">该岗位要求的能力少于 3 项，不绘制雷达图。</div>') + radarLegend() +
      '<div class="side-note">' + esc(POS[curPos].name) + '：要求 ' + rows.length + ' 项 · ' + wd().did + ' ' + done + ' · 达标 ' + okCount + '</div>';
    return h;
  }

  /* ── 测评结论与学习建议（只针对当前选中岗位） ──
     规则生成：对照当前岗位的要求找出差距；差距能力经已确认的能力—技能映射找到知识体系里的课程技能；
     再参考老师已确认的技能评价和本人待完成的任务给出建议。其他对口岗位的达标情况看岗位卡片（评一次共用） */
  var showAllSug = false;
  function learnCtx() {
    var K = TK.kn(), sv = SK.view(), TS = TK.load();
    var k = TS.classes.find(function (c) { return c.students.indexOf(sv.name) >= 0; }) || {};
    var opened = TS.plans.filter(function (p) { return p.classId === k.id; }).map(function (p) { return p.courseId; });
    var ev = {}; sv.skills.list.forEach(function (x) { ev[x.sid] = x; });
    var bySkill = {};   // 能力 → 支撑技能（已确认映射，直接 / 部分支撑）
    Object.keys(K.map).forEach(function (sid) { K.map[sid].forEach(function (m) { (bySkill[m.abl] = bySkill[m.abl] || []).push({ sid: sid, type: m.type }); }); });
    // 知识课程 id → 已发布给本人班级的课次 id（经课程计划中转：计划.courseId = 知识课程 id，任务.plan = 计划.course）
    var cid2task = {};
    TS.plans.forEach(function (p) {
      if (p.classId !== k.id || cid2task[p.courseId]) return;
      var t = sv.tasks.find(function (v) { return v.plan === p.course; });
      if (t) cid2task[p.courseId] = t.id;
    });
    return { K: K, sv: sv, opened: opened, ev: ev, bySkill: bySkill, cid2task: cid2task };
  }
  function skillInfo(L, sid) {
    var x = L.K.skill[sid] || {}, t = L.K.task[x.taskId] || {}, c = L.K.course[t.courseId] || {};
    return { sid: sid, cid: t.courseId || '', name: x.name || sid, task: t.name || '', course: c.name || '', open: L.opened.indexOf(t.courseId) >= 0 };
  }
  function curPosRows(scores) {
    return G.require.filter(function (r) { return r.pos === curPos; }).map(function (r) {
      var g = scores[r.abl];
      return { abl: r.abl, need: parseInt(r.level.slice(1), 10), got: g, has: g != null, reqs: [{ pos: curPos, lv: parseInt(r.level.slice(1), 10) }] };
    });
  }
  function adviceHTML(model, scores) {
    var rows = curPosRows(scores), P = POS[curPos];
    var scored = rows.filter(function (a) { return a.has; });
    if (!scored.length && mode === 'teacher') return '<div class="adv"><div class="empty-note" style="padding:14px">暂无老师确认的技能。课次任务通过评价后，这里会给出「' + esc(P.name) + '」岗位的结论与建议。</div></div>';
    if (!scored.length) return '<div class="adv"><div class="empty-note" style="padding:14px">还没有自评。在左侧逐项选择 L0–L3 后，这里会给出「' + esc(P.name) + '」岗位的结论与建议。</div></div>';
    var L = lctx();
    var gaps = scored.filter(function (a) { return a.got < a.need; }).sort(function (x, y) { return (y.need - y.got) - (x.need - x.got); });
    var oks = scored.filter(function (a) { return a.got >= a.need; });
    var core = function (a) { return ABL[a.abl] && ABL[a.abl].core; };
    var strong = oks.filter(core).concat(oks.filter(function (a) { return !core(a); })).slice(0, 5);
    var h = '<div class="adv"><div class="adv-sum">' +
      '对照「<b>' + esc(P.name) + '</b>」岗位要求的 <b>' + rows.length + '</b> 项能力，' + wd().did + ' <b>' + scored.length + '</b> 项：达标 <b style="color:var(--good)">' + oks.length + '</b>，未达标 <b style="color:var(--crit)">' + gaps.length + '</b>。' +
      (scored.length < rows.length ? '还有 ' + (rows.length - scored.length) + ' 项' + wd().rest + '。' : '') +
      (model.posIds.length > 1 ? '<span title="同一项能力评一次，各岗位共用">其他岗位达标情况见岗位卡片</span>。' : '') +
      '<br><span class="note">' + (mode === 'self' ? '结论基于自评，仅供参考' : '结论由老师确认的技能换算') + '</span></div>' +
      '<div class="adv-cols" style="grid-template-columns:1fr"><div><div class="k">相对强项（' + esc(P.name) + '）</div>' +
      (strong.length ? strong.map(function (a) { return esc(ABL[a.abl].name) + ' L' + a.got + '（要求 L' + a.need + '）'; }).join('<br>') : '暂无达标的能力') + '</div></div></div>';
    if (!gaps.length) return h + '<div class="adv" style="font-size:12.5px;color:var(--ink-2)">' + (mode === 'self' ? '自评能力均达标，可对照 L3 描述继续提升。' : '有评价的能力均达标，可对照 L3 描述继续提升。') + '</div>';
    var list = showAllSug ? gaps : gaps.slice(0, 5);
    h += list.map(function (a) { return sugHTML(L, a, a.got); }).join('');
    if (gaps.length > 5) h += '<button class="sug-more" data-sugmore>' + (showAllSug ? '收起' : '查看全部 ' + gaps.length + ' 项学习建议') + '</button>';
    return h;
  }
  // 本学期在学的技能全部列出，其余最多列 3 个
  function shownSk(sk) { return sk.filter(function (x) { return x.open; }).concat(sk.filter(function (x) { return !x.open; }).slice(0, 3)); }
  function sugHTML(L, a, got) {
    var ab = ABL[a.abl], sk = (L.bySkill[a.abl] || []).map(function (x) { var i = skillInfo(L, x.sid); i.type = x.type; return i; });
    sk.sort(function (x, y) { return (y.open - x.open) || ((y.type === '直接支撑') - (x.type === '直接支撑')); });
    var tips = [];
    if (mode === 'teacher') sk.forEach(function (x) {
      var e = L.ev[x.sid];
      if (e && e.ok) { var mm = (L.K.map[x.sid] || []).find(function (y) { return y.abl === a.abl; }) || {}; tips.push('「' + esc(x.name) + '」已达成（' + e.grade + '）' + (x.type === '直接支撑' ? '，支撑到 ' + (mm.level || 'L1') : '，仅部分支撑') + '；要到 L' + a.need + '，还需支撑等级更高的技能通过评价。'); }
      if (e && !e.ok) tips.push('「' + esc(x.name) + '」评价为需改进，按评语补练：<a href="' + UI.link('student-tasks.html') + '&open=' + e.tid + '">查看《' + esc(e.session) + '》</a>。');
    });
    var todo = L.sv.tasks.filter(function (t) { return SK.canSubmit(t) && (t.task.criteria || []).some(function (c) { return sk.some(function (x) { return x.sid === c.sid; }); }); });
    todo.forEach(function (t) { tips.push('完成任务「' + esc(t.task.name) + '」' + (t.due ? '（截止 ' + esc(t.due) + '）' : '') + '：<a href="' + UI.link('student-tasks.html') + '&open=' + t.id + '">去提交</a>。'); });
    var openSk = sk.filter(function (x) { return x.open && (mode === 'self' || !L.ev[x.sid]); });
    if (openSk.length) tips.push('本学期在学的' + openSk.map(function (x) { return '《' + esc(x.course) + '》「' + esc(x.task) + '」'; }).filter(function (v, i, arr) { return arr.indexOf(v) === i; }).join('、') + '会练到这项能力。');
    if (sk.length && !sk.some(function (x) { return x.open; })) tips.push('本学期课程未覆盖，可自学' + sk.slice(0, 2).map(function (x) { return '《' + esc(x.course) + '》「' + esc(x.task) + '」'; }).join('、') + '。');
    if (!sk.length) tips.push('暂无对应课程技能，可向老师了解相关的实训或实习机会。');
    // 学习资源直达：相关技能的知识课程若已开课并有发布给本人的课次，给「我的任务」课次详情（内含学习资源）的链接
    var resLinks = [];
    sk.forEach(function (x) {
      if (!x.cid || resLinks.some(function (r) { return r.course === x.course; })) return;
      var tid = L.cid2task[x.cid];
      if (tid) resLinks.push({ cid: tid, course: x.course });
    });
    var resHtml = resLinks.length ? '<div style="margin-top:4px"><span class="k">学习资源：</span>' +
      resLinks.map(function (r) { return '<a href="' + UI.link('student-tasks.html') + '&open=' + r.cid + '" title="打开课次查看并学习资源">《' + esc(r.course) + '》学习资源 ›</a>'; }).join('　') + '</div>' : '';
    return '<div class="sug"><div class="sug-h">' + (ab.core ? '<span style="color:var(--brand)">★</span>' : '') + '<b>' + esc(ab.name) + '</b><span class="lvup">' + wd().who + ' L' + got + ' → 目标 L' + a.need + '</span>' +
      a.reqs.map(function (r) { return '<span class="pos">' + esc(POS[r.pos].name) + ' L' + r.lv + '</span>'; }).join('') + '</div>' +
      '<div class="sug-b"><div><span class="k">目标水平（L' + a.need + '）：</span>' + esc((ab.levels || {})['L' + a.need] || '—') + '</div>' +
      (sk.length ? '<div style="margin-top:4px"><span class="k">对应的课程技能：</span>' + shownSk(sk).map(function (x) { var e = L.ev[x.sid]; return '<span class="skc' + (x.open ? ' on' : '') + '" title="' + esc(x.type) + '">' + esc(x.name) + '《' + esc(x.course) + '》' + (x.open ? ' · 本学期在学' : '') + (mode === 'teacher' && e ? ' · 老师评价 ' + e.grade : '') + '</span>'; }).join('') + (sk.length > shownSk(sk).length ? '<span style="font-size:11.5px;color:var(--muted)">等 ' + sk.length + ' 个技能</span>' : '') + '</div>' : '') +
      '<div style="margin-top:4px"><span class="k">学习建议：</span><ul>' + tips.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></div>' +
      resHtml + '</div></div>';
  }

  /* ── 局部刷新 ── */
  function refreshAll() {
    var model = buildModel();
    if (model.err) return;
    var scores = valsOf(model);
    // 刷新统计
    var total = model.abilities.length;
    var scored = model.abilities.filter(function (a) { return scores[a.abl] != null; }).length;
    var ok = model.abilities.filter(function (a) { var g = scores[a.abl]; return g != null && g >= a.need; }).length;
    var rate = total ? Math.round(ok / total * 100) : 0;
    var rateCls = rate >= 80 ? 'ok' : rate >= 60 ? 'warn' : 'crit';
    var stats = document.querySelectorAll('.sa-stat b');
    if (stats[1]) stats[1].textContent = scored;
    if (stats[2]) stats[2].textContent = ok;
    if (stats[3]) { stats[3].textContent = rate + '%'; stats[3].className = rateCls; }
    // 刷新岗位进度与「下一个岗位」
    var steps = document.getElementById('sa-steps'); if (steps) steps.innerHTML = stepsHTML(model, scores);
    var nx = document.getElementById('sa-next');
    if (nx) { var ps = orderedPos(model); nx.innerHTML = nextHTML(posStat(curPos, scores), ps[ps.indexOf(curPos) + 1]); }
    // 刷新右侧面板（保持面板滚动位置）
    var side = document.getElementById('sa-side');
    if (side) { var top = side.scrollTop; side.innerHTML = sideHTML(model, scores); side.scrollTop = sideTab === 'radar' ? 0 : top; }
  }

  function refreshRow(ablId, got, need) {
    var row = document.querySelector('[data-row="' + ablId + '"]');
    if (!row) return;
    row.querySelectorAll('.self button').forEach(function (b) {
      b.classList.toggle('on', parseInt(b.getAttribute('data-lv'), 10) === got);
    });
    var pill = row.querySelector('.gap-pill');
    if (pill) {
      if (got == null) { pill.textContent = wd().wait; pill.className = 'gap-pill wait'; }
      else if (got >= need) { pill.textContent = '已达标'; pill.className = 'gap-pill good'; }
      else { pill.textContent = '未达标'; pill.className = 'gap-pill crit'; }
    }
  }

  /* ── 事件 ── */
  function bindEvents() {
    $('#body').addEventListener('click', function (e) {
      var tgl = e.target.closest('[data-toggle]');
      if (tgl) {
        var def = tgl.closest('.abl-def');
        var open = def.classList.toggle('open');
        tgl.textContent = open ? '收起能力定义' : '查看能力定义（L1 / L2 / L3）';
        return;
      }
      var b = e.target.closest('.self button[data-lv]');
      if (b) {
        var ablId = b.getAttribute('data-abl');
        var lv = parseInt(b.getAttribute('data-lv'), 10);
        var model = buildModel();
        if (model.err) return;
        var rec = model.abilities.find(function (x) { return x.abl === ablId; });
        saveScore(model.student.id, ablId, lv);
        refreshRow(ablId, lv, posNeed(curPos, ablId));
        focusAbl = ablId;
        document.querySelectorAll('.abl-item.cur').forEach(function (x) { x.classList.remove('cur'); });
        b.closest('.abl-item').classList.add('cur');
        refreshAll();
        return;
      }
      var md = e.target.closest('[data-mode]');
      if (md) { mode = md.getAttribute('data-mode'); focusAbl = ''; showAllSug = false; render(); return; }
      var sd = e.target.closest('[data-side]'), ps = e.target.closest('[data-pos]'), ax = e.target.closest('[data-axis]');
      if (ps) {   // 切换岗位：左侧列表、右侧图谱都换成该岗位
        curPos = ps.getAttribute('data-pos'); focusAbl = ''; sideTab = 'radar';
        render();
        var top0 = document.getElementById('sa-steps'); if (top0) top0.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (sd || e.target.closest('[data-sugmore]')) {
        if (sd) sideTab = sd.getAttribute('data-side');
        else showAllSug = !showAllSug;
        refreshAll();
        if (sd && sd.closest('#sa-next')) document.getElementById('sa-side').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (ax) {
        var row = document.querySelector('[data-row="' + ax.getAttribute('data-axis') + '"]');
        if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('flash'); setTimeout(function () { row.classList.remove('flash'); }, 1400); }
        return;
      }
      var reset = e.target.closest('#sa-reset');
      if (reset) {
        var m = buildModel();
        if (m.err) return;
        resetScores(m.student.id);
        focusAbl = '';
        render();
        toast('已清空自评结果');
        return;
      }
    });
  }

  var c0 = DEMO.getState();
  var id0 = Perm.getIdentity(c0, UI.ui().accountId);
  var p0 = UI.portalOf(c0, id0);
  if (p0 !== 'student') { location.replace(UI.link(UI.firstPage(c0, id0))); return; }
  UI.boot({ portal: 'student', active: 'assess' });
  UI.onChange(function () { render(); });
  bindEvents();
  render();
})();
</script>
</body>
</html>
