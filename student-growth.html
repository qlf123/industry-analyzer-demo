<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学生成长中心</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--brand-ink);text-decoration:none}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .av{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.top b{font-size:16px}
.top .cls{font-size:11.5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:5px;padding:1px 7px;margin-left:6px}
.top .tot{font-size:12px;color:#d97706;margin-top:4px}
.top .sp{flex:1}
.rng{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);margin-top:12px;flex-wrap:wrap}
.rng .sp{flex:1}
.rng button{font:inherit;font-size:12px;border:1px solid var(--rule);background:var(--card);border-radius:7px;padding:3px 10px;cursor:pointer;color:var(--ink-2)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media(max-width:1000px){.g2,.g21{grid-template-columns:1fr}}
.gv{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
@media(max-width:800px){.gv{grid-template-columns:1fr}}
.big{background:linear-gradient(135deg,#d1fae5,var(--card-2));border-radius:12px;padding:18px}
.big .k{font-size:12.5px;color:var(--ink-2)}
.big .v{font-size:44px;font-weight:700;color:#059669;font-family:var(--mono);line-height:1.15;margin:6px 0}
.big .v small{font-size:14px;color:var(--muted);font-family:var(--sans)}
.big .d{font-size:12px;color:#059669}
.src-row{margin-bottom:12px}
.src-row .t{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px}
.src-row .t .dot{width:8px;height:8px;border-radius:50%}
.src-row .t .sp{flex:1}
.src-row .t b{font-family:var(--mono)}
.src-row .t small{color:var(--muted);font-family:var(--mono);width:36px;text-align:right}
.chart svg{width:100%;height:auto}
.leg{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--ink-2);margin-top:4px;flex-wrap:wrap}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:800px){.tiles,.tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tiles>div{border-radius:11px;padding:12px 14px}
.tiles .k{font-size:12px;color:var(--ink-2)}
.tiles .v{font-size:24px;font-weight:700;font-family:var(--mono);margin-top:4px}
.tiles .v small{font-size:12px;font-family:var(--sans)}
.donut{display:flex;gap:18px;align-items:center}
.donut svg{width:150px;height:150px;flex:0 0 150px}
.dl{flex:1;font-size:12.5px}
.dl div{display:flex;align-items:center;gap:8px;padding:4px 0}
.dl i{width:8px;height:8px;border-radius:50%}
.dl span{flex:1}
.rtype{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:12.5px;margin:8px 0}
.rtype .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.rtype .n b{color:var(--good)}
.gtype{font-size:11px;padding:2px 8px;border-radius:5px;white-space:nowrap}
.plan{background:var(--card-2);border-radius:11px;padding:12px 14px;margin-bottom:10px;font-size:12.5px}
.plan .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.plan .h b{font-size:13px}
.plan .row{display:grid;grid-template-columns:70px 1fr;gap:8px;margin:4px 0;line-height:1.7}
.plan .row span:first-child{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel"><div class="body" id="body"></div></div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script src="js/teacher-kit.js"></script>
<script src="js/student-kit.js"></script>
<script>
(function () {
  'use strict';
  var esc = TK.esc, S = SK.view();
  var period = 'term', off = 0, page = 1;
  var RF = { from: '', to: '', type: '' }, EF = { from: '', to: '', grade: '' }, LF = { from: '', to: '', type: '' };
  var T4 = SK.GTYPES, COL = SK.GCOL;
  var RES_T = ['课件', '视频', '图片', '教案', '情景互动游戏'], RES_C = ['#6366f1', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
  var GR = ['优秀', '合格', '需改进', '退回'], GR_C = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'];
  function name() { return S.name || '学生'; }
  function sum(l) { return l.reduce(function (s, g) { return s + g.stars; }, 0); }
  function R() { return SK.periodRange(period, off); }
  function inR(at, r) { return TK.inRange(at, r || R()); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function taskLink(tid) { return UI.link('student-tasks.html') + '&open=' + tid; }
  function allFiles() { var a = []; S.tasks.forEach(function (t) { t.files.forEach(function (f) { a.push({ t: t, f: f }); }); }); return a; }
  // 评价口径：每个任务取期间内最后一次评价；退回按次数计
  function evals(r) { var a = []; S.tasks.forEach(function (t) { var e = null; t.submissions.forEach(function (s) { if (s.eval && inR(s.eval.at, r)) e = { t: t, e: s.eval }; }); if (e) a.push(e); }); return a; }
  function returns(r) { var a = []; S.tasks.forEach(function (t) { t.submissions.forEach(function (s) { if (s.returned && inR(s.returned.at, r)) a.push({ t: t, s: s }); }); }); return a; }
  function firstSubs(r) { return S.tasks.map(function (t) { return t.submissions[0] && { t: t, s: t.submissions[0] }; }).filter(function (x) { return x && inR(x.s.at, r); }); }

  function head(title, back) {
    var r = R(), u = r.unit;
    return (back ? '<div class="crumb"><a href="#">返回成长中心</a> / ' + title + '</div>' : '') +
      '<div class="card pad" style="margin-bottom:14px">' + (back ? '' : '<div class="top"><span class="av">' + esc(name().slice(0, 1)) + '</span><div><b>' + esc(name()) + '</b><span class="cls">' + esc(S.klass) + '</span><div class="tot">★ 累计成长星 ' + sum(S.growth) + ' 星</div></div><span class="sp"></span>' + seg() + '</div>') +
      '<div class="rng">当前范围：' + esc(r.label) + '<button data-off="-1">‹ 上一' + u + '</button><button data-off="1"' + (off >= 0 ? ' disabled style="opacity:.45;cursor:not-allowed"' : '') + '>下一' + u + ' ›</button>' + (off ? '<button data-off="0">回到本' + u + '</button>' : '') + '<span class="sp"></span>' + (back ? seg() : '') + '</div></div>';
  }
  function seg() { return '<span class="seg">' + [['week', '本周'], ['month', '本月'], ['term', '本学期'], ['year', '本学年']].map(function (p) { return '<button data-period="' + p[0] + '" aria-pressed="' + (period === p[0]) + '">' + p[1] + '</button>'; }).join('') + '</span>'; }

  /* ═══ 首页 ═══ */
  function viewHome() {
    var r = R(), gs = S.growth.filter(function (g) { return inR(g.at, r); }), tot = sum(gs), prev = sum(S.growth.filter(function (g) { return inR(g.at, SK.periodRange(period, off - 1)); }));
    var by = {}; T4.forEach(function (t) { by[t] = sum(gs.filter(function (g) { return g.type === t; })); });
    var h = head('学生成长中心');
    h += skillCard();
    // 成长值概览
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">成长值概览<span class="sp"></span><a class="lk" href="#records">查看成长记录 ›</a></div><div class="gv">' +
      '<div class="big"><div class="k">本期成长星</div><div class="v">' + tot + '<small> 星</small></div><div class="d">' + (tot >= prev ? '↗ 较上期 +' : '↘ 较上期 ') + (tot - prev) + ' 星</div></div><div>' +
      T4.map(function (t) { var p = pct(by[t], tot); return '<div class="src-row"><div class="t"><span class="dot" style="background:' + COL[t] + '"></span>' + t + '<span class="sp"></span><b style="color:' + COL[t] + '">' + by[t] + ' 星</b><small>' + p + '%</small></div><div class="prog"><i style="width:' + p + '%;background:' + COL[t] + '"></i></div></div>'; }).join('') + '</div></div></div>';
    // 成长趋势
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">成长趋势</div><div class="chart">' + trend(T4, function (t) { return function (g) { return g.type === t; }; }, function (t) { return COL[t]; }) + '</div><div class="leg">' + T4.map(function (t) { return '<span><i style="background:' + COL[t] + '"></i>' + t + '</span>'; }).join('') + '</div></div>';
    // 任务反馈 + 学习资源
    var ev = evals(r), rt = returns(r), cnt = GR.map(function (g, i) { return i < 3 ? ev.filter(function (x) { return x.e.grade === g; }).length : rt.length; });
    var rs = resStat(r);
    h += '<div class="g2"><div class="card pad"><div class="blk-t">任务反馈与成长计划<span class="sp"></span><a class="lk" href="#feedback">查看详情 ›</a></div><div class="donut">' + donut(cnt, GR_C, ev.length, '已评价任务') +
      '<div class="dl"><div style="font-size:13px"><span>已评价任务 <b>' + ev.length + '</b> 个</span></div><div style="padding-bottom:8px"><span>老师评价成长星 <b style="color:#d97706">' + by['老师评价'] + '</b> 星</span></div>' +
      GR.map(function (g, i) { return '<div><i style="background:' + GR_C[i] + '"></i><span>' + g + '</span><b style="color:' + GR_C[i] + '">' + cnt[i] + (i < 3 ? ' 个' : ' 次') + '</b></div>'; }).join('') + '</div></div></div>' +
      '<div class="card pad"><div class="blk-t">学习资源成长统计<span class="sp"></span><a class="lk" href="#resources">查看更多 ›</a></div>' +
      '<div class="tiles t3" style="margin-bottom:12px"><div style="background:#dbeafe"><div class="k">已学习资源</div><div class="v" style="color:#2563eb">' + rs.done + '<small>个</small></div></div><div style="background:var(--card-2)"><div class="k">未学习资源</div><div class="v">' + rs.todo + '<small>个</small></div></div><div style="background:#d1fae5"><div class="k">资源成长星</div><div class="v" style="color:#059669">' + rs.stars + '<small>星</small></div></div></div>' +
      rs.types.map(function (x, i) { return '<div class="rtype"><span>' + x.t + '</span><div class="prog"><i style="width:' + pct(x.done, x.all) + '%;background:' + RES_C[i] + '"></i></div><span class="n">' + x.done + '/' + x.all + '　<b>' + x.stars + '星</b></span></div>'; }).join('') + '</div></div>';
    // 提交任务
    var fs = firstSubs(r), lateN = fs.filter(function (x) { return x.s.late; }).length;
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">提交任务</div><div class="tiles">' +
      '<div style="background:#dbeafe"><div class="k">已提交任务</div><div class="v" style="color:#2563eb">' + fs.length + '<small>个</small></div></div>' +
      '<div style="background:#d1fae5"><div class="k">正常提交</div><div class="v" style="color:#059669">' + (fs.length - lateN) + '<small>个</small></div></div>' +
      '<div style="background:#ffedd5"><div class="k">超时提交</div><div class="v" style="color:#ea580c">' + lateN + '<small>个</small></div></div>' +
      '<div style="background:#ede9fe"><div class="k">提交成长星</div><div class="v" style="color:#7c3aed">' + by['提交任务'] + '<small>星</small></div></div></div></div>';
    // 最近成长记录
    var recent = S.growth.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; }).slice(0, 5);
    h += '<div class="card pad"><div class="blk-t">最近成长记录<span class="sp"></span><a class="lk" href="#records">查看全部 ›</a></div>' + (recent.map(function (g) {
      return '<div class="rec"><span class="ra mono" style="width:120px">' + esc(g.at) + '</span><span class="gtype" style="background:' + COL[g.type] + '22;color:' + COL[g.type] + '">' + g.type + '</span><div class="rt"><b>' + esc(g.target) + '</b></div><span class="ra">' + esc(g.desc) + '</span><span class="rs">+' + g.stars + ' 星</span><a class="lk" href="' + taskLink(g.tid) + '">查看</a></div>';
    }).join('') || '<div class="empty2">暂无成长记录</div>') + '</div>';
    return h;
  }
  function resStat(r) {
    var fs = allFiles(), done = fs.filter(function (x) { return x.f.learnedAt && inR(x.f.learnedAt, r); });
    var stars = sum(S.growth.filter(function (g) { return g.type === '学习资源' && inR(g.at, r); }));
    return { done: done.length, todo: fs.filter(function (x) { return !x.f.learnedAt; }).length, stars: stars,
      types: RES_T.map(function (t) { var a = fs.filter(function (x) { return x.f.type === t; }), d = done.filter(function (x) { return x.f.type === t; }); return { t: t, all: a.length, done: d.length, stars: d.length * SK.STAR.learn }; }) };
  }
  function trend(keys, pred, color) {
    var r = R(), pts = [], cur = new Date(r.a), byDay = period === 'week' || period === 'month', today = new Date();
    while (cur < r.b) { pts.push(new Date(cur)); if (byDay) cur.setDate(cur.getDate() + 1); else cur.setMonth(cur.getMonth() + 1); }
    var key = function (d) { return byDay ? TK.fmt(d, false) : TK.fmt(d, false).slice(0, 7); };
    var series = keys.map(function (k) { var p = pred(k); return pts.map(function (d) { return sum(S.growth.filter(function (g) { return p(g) && String(g.at).slice(0, byDay ? 10 : 7) === key(d); })); }); });
    var max = Math.max(5, Math.ceil(Math.max.apply(null, series.map(function (s) { return Math.max.apply(null, s); }))));
    var W = 900, H = 220, L = 34, B = 26, n = pts.length, x = function (i) { return L + (n > 1 ? i * (W - L - 12) / (n - 1) : (W - L) / 2); }, y = function (v) { return H - B - v / max * (H - B - 12); };
    var g = '';
    for (var k = 0; k <= 4; k++) { var v = Math.round(max * k / 4 * 10) / 10; g += '<line x1="' + L + '" x2="' + (W - 8) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--rule)" stroke-dasharray="3 3"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + v + '</text>'; }
    var step = Math.ceil(n / 12);
    pts.forEach(function (p, i) { if (i % step === 0) g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + (byDay ? (p.getMonth() + 1) + '/' + p.getDate() : (p.getMonth() + 1) + '月') + '</text>'; });
    series.forEach(function (s, si) {
      // 未到的日期不画线
      g += '<polyline fill="none" stroke="' + color(keys[si], si) + '" stroke-width="2" points="' + s.filter(function (v, i) { return pts[i] <= today; }).map(function (v, i) { return x(i) + ',' + y(v); }).join(' ') + '"/>';
      s.forEach(function (v, i) { if (v) g += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3" fill="' + color(keys[si], si) + '"><title>' + keys[si] + ' ' + v + ' 星</title></circle>'; });
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="成长趋势">' + g + '</svg>';
  }
  function donut(vals, cols, center, label) {
    var tot = vals.reduce(function (a, b) { return a + b; }, 0), Rr = 60, C = 2 * Math.PI * Rr, o = 0, g = '<circle cx="75" cy="75" r="' + Rr + '" fill="none" stroke="var(--rule-2)" stroke-width="22"/>';
    vals.forEach(function (v, i) { if (!v) return; var l = v / tot * C; g += '<circle cx="75" cy="75" r="' + Rr + '" fill="none" stroke="' + cols[i] + '" stroke-width="22" stroke-dasharray="' + l + ' ' + (C - l) + '" stroke-dashoffset="' + (-o) + '" transform="rotate(-90 75 75)"/>'; o += l; });
    return '<svg viewBox="0 0 150 150" role="img">' + g + (center != null ? '<text x="75" y="76" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">' + center + '</text><text x="75" y="96" text-anchor="middle" font-size="10" fill="var(--muted)">' + label + '</text>' : '') + '</svg>';
  }

  /* ═══ 成长明细记录 ═══ */
  function pager(n, per, pages) {
    return pages > 1 ? Array.apply(null, Array(pages)).map(function (_, i) { return '<button class="btn-s" data-page="' + (i + 1) + '"' + (page === i + 1 ? ' style="border-color:var(--brand);color:var(--brand-ink)"' : '') + '>' + (i + 1) + '</button>'; }).join('') : '';
  }
  function dateF(o, tag) { return '<label>时间范围<input type="date" class="inp" data-' + tag + '="from" value="' + o.from + '"> — <input type="date" class="inp" data-' + tag + '="to" value="' + o.to + '"></label>'; }
  function inF(at, o) { return (!o.from || at.slice(0, 10) >= o.from) && (!o.to || at.slice(0, 10) <= o.to); }
  /* ═══ 技能达成（和成长星分开：成长星记录学习投入，技能达成只看老师确认的评价） ═══ */
  var GC = { '优秀': 'g', '合格': '', '需改进': 'w' };
  function skillCard() {
    var sv = S.skills, ok = sv.list.filter(function (x) { return x.ok; }).length;
    return '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">技能达成<span style="font-size:11.5px;font-weight:400;color:var(--muted);margin-left:8px">只看老师确认通过的评价，和成长星分开计算</span><span class="sp"></span><a class="lk" href="#skills">查看详情 ›</a></div>' +
      (sv.list.length ? '<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap"><div><div style="font-size:12px;color:var(--muted)">已评价技能</div><div style="font-size:28px;font-weight:700;font-family:var(--mono)">' + sv.list.length + '</div></div>' +
        '<div><div style="font-size:12px;color:var(--muted)">已达成</div><div style="font-size:28px;font-weight:700;font-family:var(--mono);color:var(--good)">' + ok + '</div></div>' +
        '<div><div style="font-size:12px;color:var(--muted)">未达成</div><div style="font-size:28px;font-weight:700;font-family:var(--mono);color:#d97706">' + (sv.list.length - ok) + '</div></div>' +
        '<div style="flex:1;min-width:260px;font-size:12.5px;line-height:1.9">' + sv.list.slice(0, 4).map(function (x) { return '<div>' + esc(x.name) + ' <span class="tag ' + GC[x.grade] + '">' + x.grade + '</span></div>'; }).join('') + '</div></div>'
        : '<div class="empty2">还没有老师确认的评价，完成情景任务并通过评价后，这里会显示技能达成情况</div>') + '</div>';
  }
  function viewSkills() {
    var sv = S.skills;
    var h = '<div class="crumb"><a href="#">返回成长中心</a> / 技能达成</div>';
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">我的技能</div><div style="font-size:12px;color:var(--muted);margin-bottom:8px">每个技能按最近一次老师确认的评价判断：优秀、合格为已达成，需改进为未达成。退回修改的那次不计入。</div>' +
      (sv.list.length ? '<table class="tbl2"><thead><tr><th>技能</th><th>课程</th><th>最近一次评价</th><th>状态</th><th>来自课次</th><th>评价次数</th><th>确认时间</th><th>操作</th></tr></thead><tbody>' +
        sv.list.map(function (x) {
          return '<tr><td><b style="font-weight:600">' + esc(x.name) + '</b></td><td>' + esc(x.course) + '</td><td><span class="tag ' + GC[x.grade] + '">' + x.grade + '</span></td><td>' + (x.ok ? '<span style="color:var(--good)">已达成</span>' : '<span style="color:#d97706">未达成</span>') + '</td>' +
            '<td>' + esc(x.session) + '</td><td class="mono">' + x.times + '</td><td class="mono" style="font-size:11.5px;white-space:nowrap">' + esc(x.at) + '</td><td><a class="lk" href="' + taskLink(x.tid) + '">查看</a></td></tr>';
        }).join('') + '</tbody></table>' : '<div class="empty2">暂无技能评价</div>') + '</div>';
    h += '<div class="card pad"><div class="blk-t">对应的岗位能力</div><div style="font-size:12px;color:var(--muted);margin-bottom:8px">技能通过已确认的「能力—技能映射」汇总到能力，能力不单独打分；支撑技能只算本人已开课程里的技能。</div>' +
      (sv.abls.length ? '<table class="tbl2"><thead><tr><th>能力</th><th>支撑技能</th><th>已达成</th><th style="width:30%">进度</th><th>已评价的技能</th></tr></thead><tbody>' +
        sv.abls.map(function (a) { var p = Math.round(a.ok / a.total * 100); return '<tr><td><b style="font-weight:600">' + esc(a.name) + '</b></td><td class="mono">' + a.total + ' 个</td><td class="mono" style="color:var(--good)">' + a.ok + ' 个</td><td><div class="prog"><i style="width:' + p + '%;background:var(--good)"></i></div></td><td style="font-size:12px;color:var(--ink-2)">' + esc(a.evd.join('、')) + '</td></tr>'; }).join('') + '</tbody></table>'
        : '<div class="empty2">已评价的技能还没有对应到岗位能力</div>') + '</div>';
    return h;
  }

  function viewRecords() {
    var list = S.growth.filter(function (g) { return (!RF.type || g.type === RF.type) && inF(g.at, RF); }).sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    var per = 10, pages = Math.max(1, Math.ceil(list.length / per)); page = Math.min(page, pages);
    return '<div class="crumb"><a href="#">返回成长中心</a> / 成长明细记录</div>' +
      '<div class="card filters">' + dateF(RF, 'rf') + '<label>成长类型<select class="sel" data-rf="type"><option value="">全部</option>' + T4.map(function (t) { return '<option' + (RF.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label></div>' +
      '<div class="card pad"><div class="blk-t">成长记录明细</div><table class="tbl2"><thead><tr><th>时间</th><th>成长类型</th><th>关联对象</th><th>说明</th><th>获得星数</th><th>操作</th></tr></thead><tbody>' +
      (list.slice((page - 1) * per, page * per).map(function (g) {
        return '<tr><td class="mono" style="font-size:11.5px;white-space:nowrap">' + esc(g.at) + '</td><td><span class="gtype" style="background:' + COL[g.type] + '22;color:' + COL[g.type] + '">' + g.type + '</span></td><td>' + esc(g.target) + '</td><td>' + esc(g.desc) + '</td><td class="mono" style="color:var(--good)">+' + g.stars + ' 星</td><td><a class="lk" href="' + taskLink(g.tid) + '">查看</a></td></tr>';
      }).join('') || '<tr><td colspan="6" class="empty2">没有符合条件的记录</td></tr>') + '</tbody></table>' +
      '<div class="pager">共 ' + list.length + ' 条成长记录 · 合计 <b style="color:var(--good)">' + sum(list) + ' 星</b>　' + pager(list.length, per, pages) + '</div></div>';
  }

  /* ═══ 任务反馈与成长计划 ═══ */
  function plans(r) {
    var out = [];
    S.tasks.forEach(function (t) {
      var last = t.submissions[t.submissions.length - 1]; if (!last) return;
      var n = t.files.length, l = SK.learned(t), res = '该任务关联 ' + n + ' 个学习资源，' + (l === n ? '已全部学习' : '已学习 ' + l + ' 个，尚有 ' + (n - l) + ' 个未学习') + '。';
      if (t.status === '已退回' && inR(last.returned.at, r)) out.push({ t: t, tag: '退回修改', c: 'r', adv: (l < n ? '先学习尚未学习的资源；' : '') + '对照老师退回意见「' + last.returned.reason + '」逐项补充，完善后重新提交。', basis: '任务已退回修改；' + res });
      else if (last.eval && inR(last.eval.at, r) && last.eval.grade !== '优秀') out.push({ t: t, tag: last.eval.grade, c: last.eval.grade === '需改进' ? 'w' : '', adv: last.eval.grade === '需改进' ? '回看该任务关联的学习资源，对照任务说明和老师评语检查内容是否完整、符合要求，下次同类任务重点改进。' : '按照老师评语中的改进意见补充完善，争取下次同类任务达到优秀。', basis: '最终评价结果为' + last.eval.grade + '；' + res });
    });
    return out;
  }
  function viewFeedback() {
    var r = R(), ev = evals(r), rt = returns(r), cnt = GR.map(function (g, i) { return i < 3 ? ev.filter(function (x) { return x.e.grade === g; }).length : rt.length; });
    var st = sum(S.growth.filter(function (g) { return g.type === '老师评价' && inR(g.at, r); }));
    var h = head('任务反馈与成长计划', true);
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">任务评价概览</div><div class="g2" style="margin:0"><div class="tiles" style="grid-template-columns:1fr 1fr">' +
      '<div style="background:var(--brand-soft)"><div class="k">已评价任务</div><div class="v" style="color:var(--brand)">' + ev.length + '<small>个</small></div></div>' +
      '<div style="background:#fef3c7"><div class="k">老师评价成长星</div><div class="v" style="color:#d97706">' + st + '<small>星</small></div></div>' +
      '<div style="background:#d1fae5"><div class="k">优秀</div><div class="v" style="color:#059669">' + cnt[0] + '<small>个</small></div></div>' +
      '<div style="background:var(--crit-bg)"><div class="k">退回次数</div><div class="v" style="color:var(--crit)">' + cnt[3] + '<small>次</small></div></div></div>' +
      '<div class="donut">' + donut(cnt.slice(0, 3), GR_C, null) + '<div class="dl">' + GR.slice(0, 3).map(function (g, i) { return '<div><i style="background:' + GR_C[i] + '"></i><span>' + g + '</span><b>' + cnt[i] + ' 个</b><small style="width:40px;text-align:right;color:var(--muted)">' + pct(cnt[i], ev.length) + '%</small></div>'; }).join('') + '</div></div></div></div>';
    var ps = plans(r);
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">成长计划</div>' + (ps.map(function (p) {
      return '<div class="plan"><div class="h"><span class="tag ' + p.c + '">' + p.tag + '</span><b>' + esc(p.t.task.name) + '</b><span style="flex:1"></span><a class="lk" href="' + taskLink(p.t.id) + '">去查看 ›</a></div><div class="row"><span>成长建议</span><span>' + esc(p.adv) + '</span></div><div class="row"><span>依据</span><span>' + esc(p.basis) + '</span></div></div>';
    }).join('') || '<div class="empty2">本期没有需要改进的任务，继续保持。</div>') + '</div>';
    var list = []; S.tasks.forEach(function (t) { t.submissions.forEach(function (s) { if (s.eval && inF(s.eval.at, EF) && (!EF.grade || s.eval.grade === EF.grade)) list.push({ t: t, e: s.eval }); }); });
    list.sort(function (a, b) { return a.e.at < b.e.at ? 1 : -1; });
    h += '<div class="card pad"><div class="blk-t">任务评价记录</div><div class="filters" style="padding:0 0 12px">' + dateF(EF, 'ef') + '<label>评价等级<select class="sel" data-ef="grade"><option value="">全部</option>' + GR.slice(0, 3).map(function (g) { return '<option' + (EF.grade === g ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></label></div>' +
      '<table class="tbl2"><thead><tr><th>课程</th><th>情景任务</th><th>评价等级</th><th style="width:34%">老师反馈摘要</th><th>获得星数</th><th>评价时间</th><th>操作</th></tr></thead><tbody>' +
      (list.map(function (x) {
        return '<tr><td>' + esc(x.t.course) + '</td><td>' + esc(x.t.task.name) + '</td><td><span class="tag ' + (x.e.grade === '优秀' ? 'g' : x.e.grade === '需改进' ? 'w' : '') + '">' + x.e.grade + '</span></td><td style="color:var(--ink-2);line-height:1.6">' + esc(x.e.comment || '—') + '</td><td class="mono" style="color:var(--good)">+' + SK.STAR.grade[x.e.grade] + ' 星</td><td class="mono" style="font-size:11.5px;white-space:nowrap">' + esc(x.e.at) + '</td><td><a class="lk" href="' + taskLink(x.t.id) + '">查看</a></td></tr>';
      }).join('') || '<tr><td colspan="8" class="empty2">没有符合条件的评价记录</td></tr>') + '</tbody></table><div class="pager">共 ' + list.length + ' 条</div></div>';
    return h;
  }

  /* ═══ 学习资源成长统计 ═══ */
  function viewResources() {
    var r = R(), rs = resStat(r), all = rs.done + rs.todo;
    var h = head('学习资源成长统计', true);
    h += '<div class="card pad" style="margin-bottom:14px"><div class="blk-t">资源学习概览</div><div class="tiles">' +
      '<div style="background:#dbeafe"><div class="k">已学习资源</div><div class="v" style="color:#2563eb">' + rs.done + '<small>个</small></div></div>' +
      '<div style="background:var(--card-2)"><div class="k">未学习资源</div><div class="v">' + rs.todo + '<small>个</small></div></div>' +
      '<div style="background:var(--brand-soft)"><div class="k">资源完成率</div><div class="v" style="color:var(--brand)">' + pct(allFiles().filter(function (x) { return x.f.learnedAt; }).length, all) + '<small>%</small></div></div>' +
      '<div style="background:#d1fae5"><div class="k">学习资源成长星</div><div class="v" style="color:#059669">' + rs.stars + '<small>星</small></div></div></div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">已学习资源、成长星按当前范围统计；未学习资源与完成率按全部已发布资源统计。</div></div>';
    var fileType = {}; allFiles().forEach(function (x) { fileType[x.f.name + x.t.id] = x.f.type; });
    h += '<div class="g21"><div class="card pad"><div class="blk-t">学习资源成长趋势</div><div class="chart">' + trend(RES_T, function (t) { return function (g) { return g.type === '学习资源' && fileType[g.target + g.tid] === t; }; }, function (t, i) { return RES_C[i]; }) + '</div><div class="leg">' + RES_T.map(function (t, i) { return '<span><i style="background:' + RES_C[i] + '"></i>' + t + '</span>'; }).join('') + '</div></div>' +
      '<div class="card pad"><div class="blk-t">资源类型贡献</div><div style="display:flex;justify-content:center;margin-bottom:8px">' + donut(rs.types.map(function (x) { return x.stars; }), RES_C, rs.stars, '资源成长星').replace('<svg', '<svg width="150" height="150"') + '</div><div class="dl">' +
      rs.types.map(function (x, i) { return '<div><i style="background:' + RES_C[i] + '"></i><span>' + x.t + '</span><span class="mono" style="flex:0 0 40px;color:var(--muted)">' + x.done + '/' + x.all + '</span><b style="color:var(--good);width:36px;text-align:right">' + x.stars + '星</b><small style="width:36px;text-align:right;color:var(--muted)">' + pct(x.stars, rs.stars) + '%</small></div>'; }).join('') + '</div></div></div>';
    var list = allFiles().filter(function (x) { return x.f.learnedAt && inF(x.f.learnedAt, LF) && (!LF.type || x.f.type === LF.type); }).sort(function (a, b) { return a.f.learnedAt < b.f.learnedAt ? 1 : -1; });
    var per = 10, pages = Math.max(1, Math.ceil(list.length / per)); page = Math.min(page, pages);
    h += '<div class="card pad"><div class="blk-t">学习资源记录列表</div><div class="filters" style="padding:0 0 12px">' + dateF(LF, 'lf') + '<label>资源类型<select class="sel" data-lf="type"><option value="">全部</option>' + RES_T.map(function (t) { return '<option' + (LF.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label></div>' +
      '<table class="tbl2"><thead><tr><th>学习时间</th><th>资源名称</th><th>类型</th><th>所属课程</th><th>星数</th><th>操作</th></tr></thead><tbody>' +
      (list.slice((page - 1) * per, page * per).map(function (x) {
        return '<tr><td class="mono" style="font-size:11.5px;white-space:nowrap">' + esc(x.f.learnedAt) + '</td><td>' + esc(x.f.name) + '</td><td><span class="tag k">' + x.f.type + '</span></td><td>' + esc(x.t.course) + '</td><td class="mono" style="color:var(--good)">+' + SK.STAR.learn + ' 星</td><td><a class="lk" href="' + taskLink(x.t.id) + '">查看资源</a></td></tr>';
      }).join('') || '<tr><td colspan="6" class="empty2">没有符合条件的学习记录</td></tr>') + '</tbody></table><div class="pager">共 ' + list.length + ' 条　' + pager(list.length, per, pages) + '</div></div>';
    return h;
  }

  function render() {
    var v = location.hash.slice(1);
    document.getElementById('body').innerHTML = v === 'records' ? viewRecords() : v === 'feedback' ? viewFeedback() : v === 'resources' ? viewResources() : v === 'skills' ? viewSkills() : viewHome();
  }
  var body = document.getElementById('body');
  body.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-period]'))) { period = t.getAttribute('data-period'); off = 0; render(); }
    if ((t = e.target.closest('[data-off]')) && !t.disabled) { var o = +t.getAttribute('data-off'); off = o === 0 ? 0 : off + o; render(); }
    if ((t = e.target.closest('[data-page]'))) { page = +t.getAttribute('data-page'); render(); }
  });
  body.addEventListener('change', function (e) {
    var m = { rf: RF, ef: EF, lf: LF };
    for (var k in m) { var f = e.target.getAttribute('data-' + k); if (f) { m[k][f] = e.target.value; page = 1; render(); return; } }
  });
  window.addEventListener('hashchange', function () { page = 1; render(); window.scrollTo(0, 0); });
  UI.boot({ portal: 'student', active: 'growth' });
  render();
})();
</script>
</body>
</html>
