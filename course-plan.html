<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程计划</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
/* 课程计划：学期级计划（学期 × 班级 × 课程 × 授课老师）+ 计划下的排课；课表按周查看 */
.eb-card{background:var(--card);border:1px solid var(--rule);border-radius:13px;overflow:hidden}
.eb-tw{overflow-x:auto}
.tbl2{min-width:960px}
.tbl2 th,.tbl2 .prog,.tbl2 .mono{white-space:nowrap}
.tbl2 td{vertical-align:middle}
.tbl2 .ops{white-space:nowrap}
.tbl2 .ops .lk{margin-right:10px}
.tbl2 .muted{color:var(--muted)}
.lk{color:var(--brand-ink);cursor:pointer;background:none;border:0;padding:0;font:inherit;font-size:12.5px}
.lk:hover{text-decoration:underline}
.lk.dis{color:var(--muted);cursor:not-allowed;text-decoration:none}
.eb-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--muted)}
.kvd{display:grid;grid-template-columns:96px 1fr;gap:9px 12px;font-size:13px}
.kvd .k{color:var(--muted)}
.warnline{font-size:12px;color:var(--warn-ink);margin-top:6px}
.sl-acts{display:flex;gap:8px;margin:0 0 10px}
.prog{font-family:var(--mono);font-size:12px}
.prog b{color:var(--good)}
/* 课表 */
.tt-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tt-bar .wk{font-size:13.5px;font-weight:600;margin:0 4px}
.tt{display:grid;grid-template-columns:72px repeat(7,minmax(110px,1fr));border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);min-width:860px}
.tt>div{border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-height:44px}
.tt .th{background:var(--card-2);text-align:center;padding:8px 4px;font-size:12.5px;font-weight:600}
.tt .th small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px}
.tt .th.today{background:var(--brand-soft);color:var(--brand-ink)}
.tt .ph{background:var(--card-2);font-size:12px;color:var(--muted);display:grid;place-items:center;text-align:center;line-height:1.5}
.tt .cell{padding:6px;min-height:52px}
.tt>.tt-ev{border:0;min-height:0;padding:5px;z-index:1;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.tt-ev .lsn{flex:1;margin:0;pointer-events:auto}
.tt .cell.today{background:color-mix(in srgb,var(--brand-soft) 40%,transparent)}
.lsn{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12px;line-height:1.55}
.lsn b{display:block;font-size:12.5px;color:var(--ink)}
.lsn .m{color:var(--muted);font-family:var(--mono);font-size:11px}
.lsn .t{display:inline-block;margin-top:3px;font-size:10.5px;padding:0 6px;border-radius:10px}
.lsn .t.ok{background:var(--good-bg);color:var(--good)}
.lsn .t.wait{background:var(--warn-bg);color:var(--warn-ink)}
.tt-wrap{overflow-x:auto}
.pd-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}.pd-h b{font-size:16px}.pd-h span{font-size:12.5px;color:var(--muted)}
.pd-card{padding:16px 20px}.pd-card .dr-s+.dr-s{margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <aside class="lnav" id="lnav"></aside>
  <div class="panel">
    <div class="ptop">
      <div class="ptop-r">
        <div class="pt-l">
          <h1 class="pt-t">课程计划</h1>
        </div>
        <div class="pt-actions" id="pgActs"></div>
      </div>
      <div class="tabs l1" id="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="plan" aria-selected="true">课程计划</button>
        <button class="tab" role="tab" data-tab="tt" aria-selected="false">课表</button>
      </div>
    </div>
    <div class="body">
      <div id="panePlan">
        <div class="card filters" id="filters"></div>
        <div class="eb-card"><div class="eb-tw" id="tbl"></div><div class="eb-foot" id="foot"></div></div>
      </div>
      <div id="paneTt" hidden></div>
      <div id="paneDetail" hidden></div>
    </div>
  </div>
</div>
<script src="js/mock-data.js"></script>
<script src="js/permission.js"></script>
<script src="js/common.js"></script>
<script src="js/assess-data.js"></script>
<script src="js/teacher-kit.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = TK.esc;
  UI.boot({ portal: 'admin', active: 'plan' });
  // 教务管理、课程计划只给有「教务管理与课程计划维护」权限的身份（专业负责人等看不到）
  (function () { var c = DEMO.getState(), id = UI.currentIdentity(c); if (!UI.hasPerm(c, id, 'edu:base:manage')) { document.querySelector('.panel').innerHTML = '<div class="body"><div class="card" style="padding:40px;text-align:center;color:var(--muted)">当前身份没有「教务管理与课程计划维护」权限</div></div>'; throw new Error('no-perm'); } })();

  var S = TK.load(), E = S.edu, F = {}, tab = 'plan';
  // 从「课程管理」点课程计划数进来：?ec=课程 ID，按这门课筛选（课程名称框显示课程名，改了就不再按 ID 精确筛）
  (function () { var m = location.search.match(/[?&]ec=([^&]+)/); if (!m) return; var ec = E.courses.filter(function (c) { return c.id === decodeURIComponent(m[1]); })[0]; if (ec) { F.ec = ec.id; F.q = ec.name; } })();
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function save() { TK.syncSessions(S); TK.save(S); }   // 排课变化同步到教师端课次
  function me() { try { return UI.currentIdentity(DEMO.getState()).account.name; } catch (e) { return '管理员'; } }
  function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }
  function cls(id) { return byId(S.classes, id) || { name: '—' }; }
  function majorName(id) { return TK.majorPath(E, id) || '—'; }   // 专业完整路径
  // 专业筛选：选项用完整路径；选了上级专业，挂在下级方向的班级也算
  function majorOpts() { return TK.majorTree(E).map(function (x) { return TK.majorPath(E, x.m.id); }); }
  function majorByOpt(o) { return E.majors.filter(function (m) { return TK.majorPath(E, m.id) === o; })[0]; }
  function inMajor(majorId, opt) { if (!opt) return true; var m = majorByOpt(opt); return !!m && TK.majorSubIds(E, m.id).indexOf(majorId) >= 0; }
  // 班级选项随专业联动：选了专业只列该专业（含下级方向）的班级
  function filterClassOpts() { return S.classes.filter(function (c) { return inMajor(c.majorId, F.mj); }); }
  function gradeName(id) { var g = byId(E.grades, id); return g ? g.name : '—'; }
  function termLabel(t) { return t.year + ' ' + t.term; }
  function pill(st) { return '<span class="pill ' + (st === '启用' ? 'good' : 'crit') + '">已' + st + '</span>'; }
  // 授课老师下拉的辅助说明：所属组织
  function teacherOpts() {
    try {
      var st = DEMO.getState(), on = function (id) { var o = (st.orgs || []).filter(function (x) { return x.id === id; })[0]; return o ? o.name : ''; };
      return st.accounts.filter(function (a) { return a.kind === '教师' && a.status === '正常'; }).map(function (a) { return { v: a.name, sub: on(a.orgId) }; });
    } catch (e) { return teachers(); }
  }
  function teachers() {
    try { return DEMO.getState().accounts.filter(function (a) { return a.kind === '教师' && a.status === '正常'; }).map(function (a) { return a.name; }); }
    catch (e) { return ['李老师', '王老师', '何老师']; }
  }
  // 课次与已排时间对应：课次记了 slotId，或开始时间相同
  function lessonOf(p, s) { return S.courses.filter(function (c) { return c.planId === p.id && (c.slotId === s.id || c.start === s.start); })[0]; }
  function built(p) { return (p.slots || []).filter(function (s) { var l = lessonOf(p, s); return l && l.status === '已发布'; }).length; }
  // 计划下老师已发布的课次、或老师另建的课次：有这些时学期、班级、课程不能再改，计划不能删
  function heldLessons(p) { return S.courses.filter(function (x) { return x.planId === p.id && (x.status === '已发布' || x.source !== '排课'); }).length; }
  function opsLink(act, id, label, disabled, why) {
    return '<button type="button" class="lk' + (disabled ? ' dis' : '') + '" data-act="' + act + '" data-id="' + esc(id) + '"' + (disabled ? ' data-why="' + esc(why || '') + '"' : '') + '>' + label + '</button>';
  }
  function d2(s) { return s.slice(0, 10); }
  function dateOf(s) { return new Date(s.slice(0, 10) + 'T00:00:00'); }

  /* ═══ 课程计划列表 ═══ */
  function renderPlans() {
    var tch = teachers(), clsList = filterClassOpts();
    // 专业换了之后，原来选的班级若不属于新专业就清掉
    if (F.cl && !clsList.some(function (c) { return c.name === F.cl; })) delete F.cl;
    $('#filters').innerHTML =
      '<label>课程名称<input class="inp search" data-flt="q" placeholder="请输入课程名称" value="' + esc(F.q || '') + '"></label>' +
      sel('term', '学年学期', '全部学年学期', E.terms.map(termLabel)) +
      sel('mj', '专业', '全部专业', majorOpts()) +
      sel('cl', '班级', '全部班级', clsList.map(function (c) { return c.name; })) +
      sel('t', '授课老师', '全部授课老师', tch) +
      '<button class="btn-s" type="button" data-reset>重置</button>' +
      '<span style="display:flex;gap:8px;margin-left:auto"><button class="btn-s" type="button" data-io="导入">导入</button><button class="btn-s" type="button" data-io="导出">导出</button><button class="btn" type="button" data-add style="height:32px">＋ 新增</button></span>';   // 新增 / 导入 / 导出放在筛选区右侧
    var list = S.plans.filter(function (p) {
      return (F.ec ? p.eduCourseId === F.ec : (!F.q || p.course.indexOf(F.q) >= 0)) && (!F.term || p.term === F.term) && inMajor(cls(p.classId).majorId, F.mj) && (!F.cl || cls(p.classId).name === F.cl) && (!F.t || p.teacher === F.t);
    });
    var heads = ['学年学期', '专业', '年级', '班级', '课程', '授课老师', '学生人数', '排课 / 已发布', '操作'];
    $('#tbl').innerHTML = '<table class="tbl2"><thead><tr>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (list.map(function (p) {
        var c = cls(p.classId), n = (p.slots || []).length, b = built(p), lessons = heldLessons(p);
        return '<tr><td>' + esc(p.term) + '</td><td>' + esc(majorName(c.majorId)) + '</td><td>' + esc(gradeName(c.gradeId)) + '</td><td>' + esc(c.name) + '</td><td>' + esc(p.course) + '</td><td>' + esc(p.teacher) + '</td><td>' + (c.students || []).length + '</td>' +
          '<td class="prog">' + (n ? n + ' 次 / <b>' + b + '</b>' : '<span class="muted">未排课</span>') + '</td>' +
          '<td class="ops">' + opsLink('view', p.id, '详情') + opsLink('sched', p.id, '排课') + opsLink('edit', p.id, '编辑') + (n > 0 || lessons > 0 ? '' : opsLink('del', p.id, '删除')) + '</td></tr>';
      }).join('') || '<tr><td colspan="' + heads.length + '"><div class="empty">没有符合条件的课程计划</div></td></tr>') + '</tbody></table>';
    $('#foot').innerHTML = '<span>共 ' + list.length + ' 条</span><span>每排一次课，教师端智慧课堂自动生成一个课次；已发布：老师已发布学习内容的课次</span>';
  }
  function sel(k, label, all, opts) {
    return '<label>' + label + '<select class="sel" data-flt="' + k + '"><option value="">' + all + '</option>' + opts.map(function (o) { return '<option' + (F[k] === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>';
  }

  /* ── 导入 / 导出 ── */
  function importPlans() {
    var m = TK.drawer({ title: '导入课程计划', width: 560, foot: '<span class="sp"></span><button class="btn-s" data-c>关闭</button>',
      body: '<div class="dr-s"><div class="dr-st">1. 下载模板</div><div style="font-size:12.5px;color:var(--ink-2);line-height:1.8">模板里有「课程计划」和「排课（可选）」两页，学年学期、班级、课程、授课老师、节次都能从下拉选择（可选值是系统当前数据）。<br>' +
        '<a class="btn-s" style="display:inline-flex;align-items:center;margin-top:8px;text-decoration:none" href="templates/课程计划导入模板.xlsx" download>下载导入模板（.xlsx）</a></div></div>' +
        '<div class="dr-s"><div class="dr-st">2. 填写后上传</div><label class="btn" style="display:inline-flex;align-items:center;height:32px;cursor:pointer">选择文件<input type="file" accept=".xlsx,.xls" hidden data-imp></label>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7">规则：学年学期须启用；班级、课程、授课老师须与系统一致；同一学期同一班同一门课只能有一个计划；排课日期在学期内、节次按节次时间管理；时间冲突的排课不导入。</div><div data-impres></div></div>' });
    m.foot.querySelector('[data-c]').onclick = m.close;
    m.body.querySelector('[data-imp]').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      m.body.querySelector('[data-impres]').innerHTML = '<div class="scbar" style="margin:10px 0 0">已上传「' + esc(f.name) + '」。系统会先逐行校验再导入，完成后按行列出成功和失败的原因，失败明细可下载修改后重新导入。</div>';
    });
  }
  // 导出：按当前筛选导出课程计划（CSV）
  function exportPlans() {
    var list = S.plans.filter(function (p) { return (F.ec ? p.eduCourseId === F.ec : (!F.q || p.course.indexOf(F.q) >= 0)) && (!F.term || p.term === F.term) && inMajor(cls(p.classId).majorId, F.mj) && (!F.cl || cls(p.classId).name === F.cl) && (!F.t || p.teacher === F.t); });
    var rows = [['学年学期', '专业', '年级', '班级', '课程', '授课老师', '学生人数', '排课次数', '已发布次数']].concat(list.map(function (p) { var c = cls(p.classId); return [p.term, majorName(c.majorId), gradeName(c.gradeId), c.name, p.course, p.teacher, (c.students || []).length, (p.slots || []).length, built(p)]; }));
    var csv = '\ufeff' + rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = '课程计划_' + TK.fmt(new Date(), false) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    TK.toast('已导出 ' + list.length + ' 条课程计划');
  }
  /* ── 新增 / 编辑课程计划 ── */
  function planForm(p) {
    var terms = E.terms.filter(function (t) { return t.status === '启用'; }).map(termLabel);
    var classes = S.classes.filter(function (c) { return c.status !== '停用'; });
    var courses = E.courses.filter(function (c) { return c.status === '启用'; });
    // 专业 → 班级两级（班级按专业过滤）；已排课（或老师已另建课次）就锁定学期、专业、班级、课程，只能换授课老师
    var nSlot = p ? (p.slots || []).length : 0, lessons = p ? heldLessons(p) : 0, locked = nSlot > 0 || lessons > 0;
    var initMajor = p ? majorName(cls(p.classId).majorId) : '';
    var majorNames = classes.map(function (c) { return majorName(c.majorId); }).filter(function (n, i, a) { return n && a.indexOf(n) === i; })
      .sort(function (a, b) { var ia = E.majors.map(function (m) { return m.name; }).indexOf(a), ib = E.majors.map(function (m) { return m.name; }).indexOf(b); return ia - ib; });
    function classOpts(mj) {
      return classes.filter(function (c) { return !mj || majorName(c.majorId) === mj; })
        .map(function (c) { return { v: c.name, sub: gradeName(c.gradeId) + ' · ' + (c.students || []).length + ' 人' }; });
    }
    var fields = [
      { k: 'term', label: '学年学期', type: 'select', req: true, options: terms },
      { k: 'mj', label: '专业', type: 'select', req: true, options: majorNames },
      { k: 'cl', label: '班级', type: 'searchselect', req: true, ph: '先选专业，再输入班级名称搜索', options: initMajor ? classOpts(initMajor) : [] },
      // 课程多：带搜索的下拉，辅助说明写所属专业和课程类型（也能按专业搜）
      { k: 'course', label: '课程', type: 'searchselect', req: true, ph: '输入课程名称或专业搜索', options: courses.map(function (c) { return { v: c.name, sub: (c.majorId ? majorName(c.majorId) : '全校') + ' · ' + (c.type || '专业课') }; }) },
      { k: 'teacher', label: '授课老师', type: 'searchselect', req: true, ph: '输入姓名搜索', options: teacherOpts() }
    ];
    var m = TK.drawer({ title: p ? '编辑课程计划' : '新增课程计划', width: 560,
      body: (locked ? '<div class="scbar" style="margin:0 0 10px">' + (nSlot ? '这个计划已经排了 ' + nSlot + ' 次课' : '老师已在这个计划下新建了课次') + '，学期、专业、班级、课程不能再改，只能更换授课老师</div>' : '') +
        TK.formHTML(fields, p ? { term: p.term, mj: initMajor, cl: cls(p.classId).name, course: p.course, teacher: p.teacher } : { term: terms[0] }) + '<div data-hint></div>',
      foot: '<button class="btn-s" data-c>取消</button><button class="btn" data-o style="height:32px">保存</button>' });
    TK.bindSearchSelect(m.body);
    // 有课次后学期、专业、班级、课程不能改（带搜索的下拉连同输入框一起锁住）
    if (locked) ['term', 'mj', 'cl', 'course'].forEach(function (k) { var el = m.body.querySelector('[data-f="' + k + '"]'); el.disabled = true; var ss = el.closest('[data-ss]'); if (ss) ss.querySelector('.ss-in').disabled = true; });
    // 切换专业：班级选项按专业重建；原来选的班级不属于新专业就清空
    m.body.querySelector('[data-f="mj"]').addEventListener('change', function () {
      var box = m.body.querySelector('[data-f="cl"]').closest('[data-ss]');
      var dd = box.querySelector('.ss-dd'), hid = box.querySelector('input[type=hidden]'), inp = box.querySelector('.ss-in');
      var list = classOpts(this.value);
      dd.innerHTML = list.map(function (o) { return '<button type="button" data-ssv="' + esc(o.v) + '" data-sst="' + esc(o.v + ' ' + o.sub) + '">' + esc(o.v) + '<small>' + esc(o.sub) + '</small></button>'; }).join('') + '<div class="ss-empty" hidden>没有匹配的选项</div>';
      if (!list.some(function (o) { return o.v === hid.value; })) { hid.value = ''; inp.value = ''; hid.dispatchEvent(new Event('change', { bubbles: true })); }
      hint();
    });
    function hint() {
      var cn = m.body.querySelector('[data-f="course"]').value, cln = m.body.querySelector('[data-f="cl"]').value;
      var ec = courses.filter(function (c) { return c.name === cn; })[0], c = classes.filter(function (x) { return x.name === cln; })[0], out = '';
      if (c) out += '<div style="font-size:12px;color:var(--muted)">年级：' + esc(gradeName(c.gradeId)) + ' · 学生 ' + (c.students || []).length + ' 人</div>';
      if (ec && !ec.ks && (ec.type === '公共基础课程' || ec.type === '公共基础课')) out += '<div style="font-size:12px;color:var(--muted);margin-top:6px">公共基础课程，默认不计入技能达成：老师照常建课次、布置和评价，不记技能证据。</div>';

  }

  /* ── 事件 ── */
  function render() {
    if (detailP) { var dp = detailP; detailP = null; if (location.hash === '#sched/' + dp.id) { planDetail(dp, 'sched'); return; } }
    $('#paneDetail').hidden = true; $('#tabs').style.display = ''; document.querySelector('.pt-t').textContent = '课程计划';
    $('#pgActs').innerHTML = '';
    [].forEach.call(document.querySelectorAll('#tabs .tab'), function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    $('#panePlan').hidden = tab !== 'plan'; $('#paneTt').hidden = tab !== 'tt';
    if (tab === 'plan') renderPlans(); else renderTt();
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    var tb = t.closest('#tabs [data-tab]'); if (tb) { tab = tb.dataset.tab; render(); return; }
    if (t.closest('[data-add]')) { planForm(null); return; }
    var io = t.closest('[data-io]'); if (io) { if (io.dataset.io === '导入') importPlans(); else exportPlans(); return; }
    if (t.closest('[data-reset]')) { F = {}; render(); return; }
    var tm = t.closest('[data-tm]'); if (tm) { T.mode = tm.dataset.tm; T.who = ''; renderTt(); return; }
    var wk = t.closest('[data-wk]'); if (wk) { var n = +wk.dataset.wk; if (!n) T.week = mondayOf(new Date()); else T.week.setDate(T.week.getDate() + 7 * n); renderTt(); return; }
    var a = t.closest('#tbl [data-act]'); if (!a) return;
    if (a.classList.contains('dis')) { TK.toast(a.dataset.why); return; }
    var p = byId(S.plans, a.dataset.id), act = a.dataset.act;
    if (act === 'view') planInfo(p);
    else if (act === 'sched') planDetail(p, 'sched');
    else if (act === 'edit') planForm(p);
    else if (act === 'del') TK.confirm('确定删除这个课程计划？删除后不可恢复。', function () { S.plans.splice(S.plans.indexOf(p), 1); S.courses = S.courses.filter(function (c) { return c.planId !== p.id; }); save(); render(); TK.toast('已删除'); });
  });
  document.addEventListener('input', function (e) { var f = e.target.closest('#filters [data-flt]'); if (f && f.tagName === 'INPUT') { F.q = f.value.trim(); delete F.ec; renderPlans(); var el = document.querySelector('[data-flt="q"]'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
  document.addEventListener('change', function (e) {
    var f = e.target.closest('#filters [data-flt]'); if (f && f.tagName === 'SELECT') { F[f.dataset.flt] = f.value; renderPlans(); return; }
    var tt = e.target.closest('[data-tt]'); if (tt) { T[tt.dataset.tt] = tt.value; if (tt.dataset.tt === 'term') T.who = T.who; renderTt(); }
  });
  // #plan/<id> 打开详情页；返回按钮 / 浏览器后退回到列表
  function route() { var m = location.hash.match(/^#sched\/(.+)$/), p = m && byId(S.plans, m[1]); if (p) planDetail(p, 'sched'); else { detailP = null; render(); } }
  window.addEventListener('popstate', route);
  route();
})();
</script>
</body>
</html>
